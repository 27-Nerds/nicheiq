# Competitor Query Generation Prompt
# Used by: CompetitorQueryGenerator.generate_competitor_queries()
# Variables: context_section (pre-built), num_queries, project_type

template: |
  You are an expert competitive intelligence researcher specializing in discovering and validating market competitors. Your goal is to generate semantically valid, highly specific search queries that discover actual named competitors for a specific solution.

  {context_section}

  ---

  **TASK: Generate {num_queries} strategic competitor search queries**

  Follow this process in order:

  ## STEP 1: ANALYZE SOLUTION & NICHE CHARACTERISTICS

  Before generating queries, analyze the solution context to understand:

  **Solution Type Analysis:**
  - Project Type: {project_type}
  - What category of product is this?
    - SaaS -> software/tools/platforms competitors
    - Directory -> curated lists/catalogs/directories competitors
    - Aggregator -> data platforms/comparison sites/aggregators competitors
    - Comparison-tool -> comparison engines/review platforms competitors
    - Marketplace -> platforms/exchanges/marketplaces competitors

  **Market Type:**
  - Is this B2C (consumer-facing), B2B (business-facing), or hybrid?
  - Evidence: Look for "business", "teams", "enterprise" vs "personal", "home", "individual"

  **Product Nature:**
  - Physical products, digital services, software, platform, or information service?
  - Does the niche have established digital competitors?
  - Evidence: Industry boundaries, niche description

  **Competitor Landscape:**
  - Established players likely? (mature market) vs Fragmented/emerging? (new market)
  - Evidence: Pain points mention existing tools/platforms?

  ### ANTI-PATTERNS TO AVOID

  Before generating, review these patterns that FAIL to discover actual competitors:

  **Generic Category (finds articles, not products):**
  - "[niche] [type] platforms" - e.g., "micro-SaaS aggregator platforms"
  - "[niche] tools" - e.g., "SaaS comparison tools"
  - Why fails: Returns category overviews, not named competitors

  **Pattern Repetition (low diversity):**
  - Multiple queries with only audience swap
  - >2 queries using "[X] for [segment]" template
  - Why fails: Duplicate search results, missed competitive angles

  **Missing Discovery Intent (no comparison context):**
  - Queries without "vs", "alternatives", "compared to", "top N"
  - Why fails: Misses contexts where users NAME specific products

  **Feature-Focused (finds tutorials, not competitors):**
  - "tools to validate ideas" - finds how-to content
  - "how to compare [category]" - finds methodology articles
  - Why fails: Not competitive intelligence

  **Correct Transformations (adapt to your niche):**
  - "[niche] aggregator platforms" → "[inferred incumbent] alternatives for [segment]"
  - "[niche] comparison tools" → "top 10 [niche] directories vs [incumbent] {current_year}"
  - "tools for [segment]" → "[incumbent A] vs [incumbent B] for [niche] discovery"

  ### INFER LIKELY INCUMBENTS (Dynamic - Based on Niche Analysis)

  Analyze the niche context to identify probable market leaders. This is a PROCESS:

  **Step A: Identify the vertical/industry from niche description:**
  - Extract the core domain (e.g., "home appliances", "pet care", "travel", "legal services")
  - Note if B2B or B2C

  **Step B: Determine incumbent types based on project_type:**
  | Project Type | Likely Incumbent Categories |
  |--------------|----------------------------|
  | Directory | Well-known review sites, curated lists, buyer's guides |
  | Aggregator | Comparison engines, data platforms, price trackers |
  | Marketplace | Leading exchanges, platforms connecting buyers/sellers |
  | Comparison-tool | Review aggregators, rating platforms |
  | SaaS | Established software in that vertical |

  **Step C: Infer specific incumbents using these patterns:**
  - For PHYSICAL PRODUCTS: Amazon, major retail sites, specialty review sites (e.g., Wirecutter, Consumer Reports)
  - For SERVICES: Yelp, vertical-specific platforms (Angi for home, Avvo for legal, Rover for pet care)
  - For B2B: Industry-specific directories, trade publications, G2, Capterra
  - For TRAVEL: Booking aggregators (Kayak, Skyscanner), review platforms (TripAdvisor)
  - For FINANCE: Comparison sites (NerdWallet, Bankrate), rate aggregators
  - For DEVELOPER RESOURCES (code snippets, tutorials, documentation):
    - Code Sharing: GitHub, GitLab, CodePen, CodeSandbox, JSFiddle
    - Q&A: StackOverflow, Dev.to, Reddit programming subs
    - Documentation: DevDocs.io, MDN, ReadTheDocs
    - API Examples: Postman, RapidAPI, Swagger
  - For FINTECH/PAYMENT (billing, checkout, payment processing):
    - Payment APIs: Stripe Docs, PayPal Developer, Square Docs
    - Banking/Data: Plaid, Yodlee, MX
    - Billing: Chargebee, Recurly, Paddle
  - For SAAS DISCOVERY (product listings, app directories):
    - ProductHunt, Indie Hackers, BetaList, AlternativeTo, G2, Capterra, StackShare
  - For any vertical: The top Google results for "[niche] reviews", "[niche] comparison", "[niche] best"

  **Step C.5: Analyze Solution Name for Vertical Signals (CRITICAL)**

  Before defaulting to generic incumbents, scan the solution name and pain points for vertical-specific keywords:

  | Keyword Pattern | Vertical | Correct Incumbents |
  |-----------------|----------|-------------------|
  | "snippet", "code", "example" | Developer Resources | GitHub, StackOverflow, CodePen, Dev.to |
  | "sdk", "api", "integration" | API/SDK Resources | Stripe Docs, Postman, RapidAPI, Twilio Docs |
  | "payment", "checkout", "billing" | FinTech/Payments | Stripe, Plaid, Square, PayPal Developer |
  | "data", "analytics", "dashboard" | Data/Analytics | Tableau, Looker, Metabase, Grafana |
  | "template", "boilerplate", "starter" | Project Templates | Vercel Templates, Create React App, Cookiecutter |
  | "library", "package", "module" | Package Registries | npm, PyPI, RubyGems, Maven Central |

  **Example applications:**
  - "DevToolPaymentSnippets" → contains "payment" + "snippets" → FinTech + Developer Resources → Stripe Docs, GitHub payment repos, StackOverflow payment tags
  - "APIDocAggregator" → contains "api" + "aggregator" → API Resources → Postman, RapidAPI, DevDocs.io
  - "TemplateMarketplace" → contains "template" + "marketplace" → Project Templates → ThemeForest, Vercel Templates, GitHub Templates

  **Step D: Extract incumbents from context clues:**
  - Pain points may mention existing tools/platforms by name
  - Market segments may reference where users currently shop/compare
  - Industry boundaries may name adjacent competitors

  **Use inferred incumbents in queries:**
  - Named Discovery: "[category] like [inferred incumbent] for [segment]"
  - Established Player: "[inferred incumbent] alternatives"
  - Comparison: "[incumbent A] vs [incumbent B] for [niche]"

  ## STEP 2: APPLY SEMANTIC VALIDATION RULES

  **RULE 1: Match competitor category to solution type**
  - SaaS -> Search: "software", "tools", "platforms", "apps"
  - Directory -> Search: "directories", "catalogs", "curated lists", "guides"
  - Aggregator -> Search: "comparison sites", "data aggregators", "vs platforms"
  - Comparison-tool -> Search: "comparison engines", "review sites", "ranking platforms"
  - Marketplace -> Search: "marketplaces", "platforms", "exchanges"

  **RULE 2: Adapt search terms to product nature**
  - Physical products -> "sites", "directories", "guides", "reviews", "comparison sites"
  - Digital/SaaS -> "software", "tools", "platforms", "apps", "solutions"
  - Services -> "platforms", "marketplaces", "networks", "directories"
  - Information -> "guides", "databases", "resources", "directories"

  **RULE 3: Use market segments for targeted competitor searches**
  - Extract key characteristics from market segments (if provided)
  - Examples:
    - "First-time homebuyers" -> search "[category] for first-time buyers"
    - "Budget-conscious families" -> search "affordable [category]", "cheap [category] alternatives"
    - "Remote teams" -> search "[category] for remote teams", "distributed team [category]"

  **RULE 4: Focus on competitor discovery, not solution promotion**
  - Search for what EXISTS in the market (competitors), not marketing terms
  - Use established category names, not branded terms
  - Examples:
    - Good: "project management software", "expense tracking apps"
    - Bad: "[SolutionName] competitors" (unless SolutionName is already established)

  **RULE 5: Use pain points to find problem-specific competitors**
  - If pain points mention existing tools/brands, search for those
  - Search for solutions addressing the same pain points
  - Examples:
    - Pain point: "Hard to find reliable contractors" -> "contractor directories", "verified contractor platforms"
    - Pain point: "Comparing appliances is confusing" -> "appliance comparison sites", "appliance review platforms"

  **RULE 6: Respect industry boundaries**
  - Only search within the defined scope from industry_boundaries
  - Avoid adjacent markets explicitly excluded

  ### SPECIFICITY REQUIREMENTS (CRITICAL)

  **NEVER include the solution's own name in any query.** The solution name in the context
  is an INVENTED product name with zero web presence — a query containing it returns nothing
  useful and makes real competitors look absent. Use the name only to infer the category and
  vertical (Step C.5); every query must be built from category, incumbent, mechanism, or
  pain vocabulary.

  Every query MUST include 1+ specificity markers:

  **A. Named Competitors (inferred from Step 1):**
  - Explicit product names from your incumbent inference
  - Example: "alternatives to Wirecutter for appliance reviews"

  **B. Comparison Operators:**
  - "vs", "versus", "compared to", "better than"
  - Example: "Kayak vs Skyscanner for budget flights"

  **C. Ranking Signals:**
  - "top 5", "top 10", "best", "leading", "{current_year}"
  - Example: "top 10 pet care marketplaces {current_year}"
  - IMPORTANT: The current year is {current_year}. Always use {current_year} when including a year in queries. Never use outdated years.

  **D. Concrete Constraints:**
  - Price: "free", "under $50", "enterprise pricing", "budget"
  - Size: "for small teams", "for solo founders", "for enterprises"
  - Feature: "with API", "self-hosted", "open source", "verified reviews"

  **E. Discovery Intent:**
  - "alternatives to", "switching from", "instead of", "reviews of"
  - Example: "switching from Angi to cheaper contractor platforms"

  ## STEP 3: GENERATE QUERIES WITH DISCOVERY INTENT

  Generate queries using these 5 archetypes. Adapt examples to YOUR niche:

  ### 1. Named Competitor Discovery (30%) - HIGHEST PRIORITY
  **Goal**: Find discussions where specific competitors are named

  **Pattern**: [comparison operator] + [inferred incumbent] + [segment/constraint]
  **Required**: At least one named competitor (inferred from Step 1) + comparison intent

  **Examples by niche**:
  - Home appliances: "Consumer Reports alternatives for budget appliances"
  - Pet care: "directories like Rover for pet sitting services"
  - Legal services: "top 10 lawyer directories vs Avvo {current_year}"
  - Travel: "Kayak alternatives for budget flight comparison"
  - SaaS: "G2 alternatives for small business software reviews"
  - Developer tools: "GitHub code snippet repositories vs StackOverflow for payment integration"
  - API documentation: "Stripe Docs alternatives for payment API examples"

  ### 2. User Evaluation Behavior (25%)
  **Goal**: Find users comparing or evaluating competitors

  **Pattern**: [evaluation verb] + [category] + [decision context]
  **Required**: Evaluation language ("comparing", "deciding", "reviewing", "switching")

  **Examples by niche**:
  - Home appliances: "comparing appliance review sites for first home buyers"
  - Pet care: "reviews of Rover vs Wag for dog walking"
  - Legal services: "deciding between Avvo and FindLaw for lawyer search"
  - Travel: "switching from Expedia to cheaper alternatives"
  - B2B: "comparing software review platforms for enterprise purchasing"
  - Developer resources: "comparing Postman vs RapidAPI for testing payment APIs"
  - Code snippets: "switching from StackOverflow to GitHub Gists for code examples"

  ### 3. Established Player Alternatives (20%)
  **Goal**: Find alternatives to inferred market leaders

  **Pattern**: [incumbent name] + "alternatives" OR "vs" + [constraint]
  **Required**: Named incumbent from your Step 1 inference

  **Examples by niche**:
  - Home appliances: "Wirecutter alternatives for unbiased reviews"
  - Pet care: "Chewy alternatives with better subscription options"
  - Legal services: "Avvo alternatives with verified reviews"
  - Travel: "TripAdvisor alternatives with less fake reviews"
  - Services: "Angi alternatives for contractor hiring"
  - Developer docs: "Stripe API documentation alternatives with more code examples"
  - Code sharing: "GitHub alternatives for private payment integration snippets"

  ### 4. Segment-Specific Discovery (15%)
  **Goal**: Find competitors serving specific segments

  **Pattern**: [category] + "for" + [specific segment from context] + [discovery intent]
  **Required**: Specific segment (from market_segments) + comparison/ranking element

  **Examples by niche**:
  - Home appliances: "best appliance comparison sites for apartment renters"
  - Pet care: "top pet marketplaces for exotic animal owners"
  - Legal services: "lawyer directories for small business disputes"
  - Travel: "comparison sites for budget family vacations"
  - B2B: "software directories for nonprofit organizations"
  - Developer tools: "best payment SDK code libraries for solo developers {current_year}"
  - API resources: "top API documentation sites for startup developers"

  ### 5. Problem-Specific Alternatives (10%)
  **Goal**: Find competitors solving specific pain points

  **Pattern**: [pain point solution] + "instead of" OR "without" + [limitation]
  **Required**: Specific pain (from pain_points_addressed) + alternative framing

  **Examples by niche**:
  - Home appliances: "appliance reviews without sponsored content bias"
  - Pet care: "pet sitter platforms with actual background checks"
  - Legal services: "lawyer directories with transparent pricing"
  - Travel: "flight comparison without hidden fees"
  - Services: "contractor platforms that verify licenses"
  - Developer tools: "payment integration examples without complex authentication setup"
  - Code snippets: "API code samples with copy-paste ready examples"

  ## STEP 3.5: SELF-VERIFICATION (MANDATORY)

  Before outputting, validate ALL queries:

  ### Verification Checklist:
  1. **Named competitors**: ≥50% of queries mention specific product names (from your Step 1 inference)
  2. **Discovery intent**: Every query has comparison/evaluation/alternative language
  3. **Specificity**: Every query has ≥1 specificity marker from Step 2
  4. **Diversity**: No more than 2 queries share same template structure
  5. **Type distribution**: Approximately 30/25/20/15/10 split (±5%)
  6. **Grounding**: Queries match solution context (project_type, niche, pain points)

  ### If Check Fails - Transform Before Including:

  - Generic: "[niche] aggregator platforms" (fails: no discovery intent)
    FIX: "[inferred incumbent] alternatives for [segment] [niche]"

  - No named competitor: "[niche] comparison sites for [segment]"
    FIX: "[incumbent A] vs [incumbent B] for [segment] [niche]"

  - Pattern repetition: Multiple "[X] for [segment]" queries
    FIX: Vary structure - use "vs", "alternatives to", "top 10", "reviews of"

  ## STEP 4: OUTPUT FORMAT

  Return ONLY a valid JSON array. No preamble, no explanation, just the array:

  [
    {{
      "query": "the exact search query text (must pass verification checklist)",
      "type": "named_competitor|evaluation|established_alternative|segment_discovery|problem_alternative",
      "rationale": "1-sentence explanation citing: inferred incumbent used, specificity markers, discovery intent"
    }},
    ...
  ]

  **Final Quality Checklist:**
  - [ ] ≥50% of queries contain named competitors from your Step 1 inference?
  - [ ] Every query has discovery intent (vs, alternatives, comparing, top N)?
  - [ ] Every query has ≥1 specificity marker?
  - [ ] No more than 2 queries share same template structure?
  - [ ] Rationale cites the inferred incumbent and specificity markers used?

  <brief_explanation>
  First, state the solution category and 2-3 likely incumbents you'll reference in queries.
  </brief_explanation>

  Generate {num_queries} queries now, following Steps 1-4 in order. Remember: named competitors + discovery intent > generic categories.

  <verification>
  Before returning, verify:
  - Array has exactly {num_queries} queries
  - ≥50% of queries name specific competitors
  - Every query has discovery intent (vs, alternatives, top N)
  - No more than 2 queries share same template structure
  - You completed ALL {num_queries} queries before returning
  </verification>
