# Executive Narrative Generation Prompt
# Used by: ReportGenerator._generate_executive_narrative()
# Variables: solution_name, solution_description, target_personas, niche_description,
#            pain_point_title, pain_point_severity, pain_point_wtp,
#            market_fit_score, competitive_advantage_score, technical_feasibility_score,
#            seo_growth_score, total_keyword_count, tier1_keyword_count,
#            competitor_count, high_severity_pain_points,
#            zero_keywords_note, zero_competitors_note

template: |
  Generate executive narrative for market research report.

  **Solution Context:**
  Name: {solution_name}
  Description: {solution_description}
  Target Personas: {target_personas}
  Niche: {niche_description}

  **Top Pain Point:**
  Title: {pain_point_title}
  Severity: {pain_point_severity}
  Willingness to pay: {pain_point_wtp}

  **Selection Criteria (given as plain qualitative bands — use these words, never invent a number):**
  - Market Fit: {market_fit_score}
  - Competitive Advantage / differentiation: {competitive_advantage_score}
  - Technical Feasibility: {technical_feasibility_score}
  - SEO Scalability: {seo_growth_score}

  **Market Metrics:**
  - Total Keywords: {total_keyword_count}{zero_keywords_note}
  - Tier 1 Keywords: {tier1_keyword_count}
  - Primary Competitors: {competitor_count}{zero_competitors_note}
  - High Severity Pain Points (severity >= 0.7): {high_severity_pain_points}

  **MINIMUM DATA REQUIREMENTS:**
  - All scores and metrics are provided above
  - Generate narrative based ONLY on this data
  - If keyword_count == 0: Mention "limited keyword data" in verdict
  - If competitor_count == 0: Note "emerging market" status

  **Generate 3 fields:**

  1. **tagline**: One-sentence value proposition (10-15 words)
     - Format: "[Solution] [action verb] [outcome] for [audience]"
     - Use active verbs: solves, simplifies, automates, connects
     - Avoid generic terms: platform, solution, tool
     - Include outcome benefit from pain point

  2. **core_value_prop**: What problem it solves and for whom (2-3 sentences)
     - First sentence: State the pain point and its impact
     - Second sentence: Explain the solution approach
     - Third sentence (optional): Differentiation or benefit

  3. **verdict_rationale**: rationale based on the criteria bands (MAXIMUM 3 sentences, prefer 2)
     - First sentence: name 2-3 key criteria by their BAND and their implication
     - Second sentence: address any concerns or strengths
     - Optional third sentence: clear recommendation signal (only if needed)
     - Reference the criteria with the BAND WORDS above (e.g. "good market fit", "weak SEO").
       NEVER write a numeric score, decimal, or percentage of any kind.
     - If market fit and technical feasibility are good/strong: lean positive
     - If any criterion is weak/limited: acknowledge the concern and require validation

  **OUTPUT STRUCTURE EXAMPLE:**
  {{
    "tagline": "{solution_name} simplifies [pain] for {target_personas}",
    "core_value_prop": "Pain point impact... Solution approach... Benefit.",
    "verdict_rationale": "With strong market fit and good technical feasibility, this solution shows clear potential for the target market. Its good differentiation points to opportunities that warrant further validation."
  }}

  **CRITICAL ANTI-HALLUCINATION RULES:**
  - DO NOT invent statistics, percentages, or market size estimates
  - DO NOT reference timeframes ("recent", "growing", "trending") without data
  - DO NOT mention competitors unless in provided metrics
  - DO NOT claim user counts, revenue, or adoption rates
  - ONLY reference scores and metrics explicitly listed above
  - DO NOT create features or capabilities not in solution description

  <brief_explanation>
  First, state the top pain point and the dominant score pattern (strengths vs concerns).
  </brief_explanation>

  <verification>
  Before returning, verify:
  - JSON contains exactly 3 fields: tagline, core_value_prop, verdict_rationale
  - Tagline is 10-15 words with solution name and active verb
  - core_value_prop is 2-3 sentences
  - verdict_rationale is 2-3 sentences max and names criteria by their band
  - All pain point references match EXACTLY the title above
  - Score references use the BAND WORDS only — NO numbers, decimals, or percentages anywhere
  - No invented market claims or statistics
  </verification>
