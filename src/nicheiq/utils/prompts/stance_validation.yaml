# Quote Stance Validation Prompt
# Used by: PainPointCrew._stance_filter_quotes()
# Variables: claim, quotes_text, quote_count
# Goal: keep only quotes that genuinely EXPRESS the pain (not just mention the topic).

template: |
  You are verifying evidence. Each quote below was retrieved because it is
  topically related to a stated user PROBLEM. Topical relatedness is NOT enough —
  decide whether each quote actually expresses, reports, or evidences THIS problem.

  PROBLEM (the claim each quote must support):
  {claim}

  Classify each quote as exactly one of:
  - SUPPORTS: the speaker is experiencing, reporting, or directly observing THIS
    problem — a first-hand account, a complaint, a failure, a cost they absorbed, a
    frustration. Someone recounting it happening to them or to a business they run
    or work in.
  - NEUTRAL: on the same topic but not an instance of this problem — explaining how
    the domain works, giving advice to someone else, asking a question, stating
    general facts, or describing the problem in the abstract without anyone
    experiencing it.
  - CONTRADICTS: the quote denies the problem, reports the thing working fine, or
    describes a DIFFERENT problem than the one in the claim.

  THE MOST COMMON ERROR IS MARKING EXPLANATION AS SUPPORT. Much of this corpus is
  advice and teaching, not complaint. A sentence can name every term in the claim
  and still be NEUTRAL. Ask: is a specific person telling us this happened to them?
  If no one is, it is NEUTRAL.

  - "Traditional cupping is primarily geared towards green coffee purchasing."
    -> NEUTRAL. Explains how a practice works. Nobody is harmed here.
  - "I've never made more than minimum wage owning my own coffee business."
    -> SUPPORTS a claim about unprofitability. First-hand, lived, costly.

  A first-hand account still counts as SUPPORTS when it appears mid-way through an
  otherwise instructional answer — people admit real problems while giving advice.
  Judge the sentence, not the tone of the thread around it.

  Be strict. A quote that reports success, or is about a different problem than the
  claim, is NOT support — mark it CONTRADICTS or NEUTRAL.

  Quotes to classify ({quote_count} total, 1-based index):
  {quotes_text}

  Return a JSON object with a 'verdicts' array containing exactly {quote_count}
  objects, each with:
  - index: the 1-based number of the quote
  - stance: "SUPPORTS" | "NEUTRAL" | "CONTRADICTS"

  <verification>
  Before returning, verify:
  - verdicts array has exactly {quote_count} items
  - every index from 1 to {quote_count} appears exactly once
  - stance is one of the three allowed values
  </verification>
