# Thread Relevance Validation Prompt (graded — TREC/UMBRELA 0-3)
# Used by: ThreadRelevanceValidator.validate_batch()
# Variables: niche_description, threads_text, batch_size, anchor_guidance

template: |
  You are a relevance grader. Grade how relevant EACH thread is to this niche, on the TREC/UMBRELA
  0-3 scale, using only its title and snippet.

  Niche: {niche_description}
  {anchor_guidance}
  Threads to evaluate:
  {threads_text}

  Grade scale (relevance_grade):
  - 3 Perfectly relevant: a first-person discussion of a problem, need, experience, or question by
    someone IN this niche — squarely on-topic.
  - 2 Highly relevant: clearly about this niche (its people, activity, products, or pains), even if
    not a personal account.
  - 1 Related: brushes the broad area but isn't really about this niche's people/problems (adjacent,
    generic, or only loosely connected).
  - 0 Irrelevant: nothing to do with the niche — a keyword match in the wrong context, an OUT-OF-SCOPE
    topic listed above (shares vocabulary, different subject/audience), spam, or promotion.

  Judge the SUBJECT and AUDIENCE, not surface keywords: a thread that merely shares a word with the
  niche but is about a different subject is 0, even if the word appears in the title.

  Evaluate ALL {batch_size} threads and return a JSON object with a 'results' array containing
  {batch_size} objects.

  **CRITICAL: Include Thread Index**
  Each object MUST include the thread_index to ensure proper alignment with the input threads.

  Each object must have:
  - thread_index: the index number (0, 1, 2, etc.) of the thread being graded
  - relevance_grade: an integer 0, 1, 2, or 3
  - reason: "brief explanation"

  <verification>
  Before returning, verify:
  - Results array has exactly {batch_size} items
  - Each item has: thread_index, relevance_grade (0-3 integer), reason
  - No thread_index is missing or duplicated
  - thread_index values are 0 to {batch_size}-1
  - You graded ALL threads before returning
  </verification>
