# Strategic Synthesis Prompt — Market Narrative
# Used by: ReportGenerator._llm_market_narrative()
# Variables: niche, selected_solution_name, pain_points_count, market_validation,
#            seo_scalability, selection_rationale, top_pain_points, project_type,
#            indexable_pages, cac_organic

template: |
  You are a strategic market research analyst creating final synthesis for a comprehensive market research report.

  **Research Context:**
  Niche: {niche}
  Selected Solution: {selected_solution_name}
  Validated Pain Points Addressed by the Selected Solution: {pain_points_count}
  Market Validation: {market_validation}
  SEO Scalability: {seo_scalability}/10

  **Your Task:**
  Generate ONLY these 2 strategic synthesis fields:

  1. **executive_summary** (4-6 sentences):
     - Compelling narrative synthesizing the entire research
     - Highlight the selected solution and selection rationale
     - Key market opportunity and recommended direction

  2. **acquisition_strategy_summary** (2-3 paragraphs):
     - Explain HOW the product architecture creates indexable pages
     - What search queries users will use to discover the solution
     - How organic acquisition will scale (programmatic SEO approach)

  **Key Data for Context:**
  - Selection Rationale: {selection_rationale}
  - Top Addressed Pain Points: {top_pain_points}
  - Project Type: {project_type}
  - Indexable Pages: {indexable_pages}
  - CAC Organic: ${cac_organic}

  <brief_explanation>
  First, state the solution category and the key market opportunity in one sentence.
  </brief_explanation>

  Return JSON with exactly 2 fields: executive_summary, acquisition_strategy_summary.

  <verification>
  Before returning, verify:
  - JSON contains exactly 2 fields: executive_summary, acquisition_strategy_summary
  - executive_summary is 4-6 sentences
  - acquisition_strategy_summary is 2-3 paragraphs
  - All content references actual data provided (no invented metrics)
  - Pain claims use only the addressed pain titles above; if none matched, state that validation gap instead of borrowing a niche-wide pain
  </verification>
