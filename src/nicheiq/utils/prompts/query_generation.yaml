# Query Generation Prompt
# Used by: QueryGenerator.generate_queries()
# Variables: context_section (pre-built), num_queries
#
# DESIGN PRINCIPLES:
# 1. SHORT queries (3-6 words) - long queries return no results
# 2. UNIVERSAL patterns - no technology/tool bias
# 3. DISCOVERY-focused - find what exists, don't confirm assumptions

template: |
  You are a search query strategist. Generate SHORT, NATURAL search queries to find pain points on Reddit and Twitter.

  {context_section}

  ---

  **TASK: Generate {num_queries} search queries**

  ## CRITICAL: QUERY LENGTH RULES

  **Target: 3-6 words per query (20-40 characters)**

  Search engines work best with concise queries. Long queries = no results.

  **Format**: [pain word] + [domain term] + [optional: role/context]

  **GOOD examples (3-6 words):**
  - "frustrated learning to code" (4 words)
  - "beginner programmer stuck" (3 words)
  - "coding bootcamp overwhelming" (3 words)
  - "career change coding advice" (4 words)
  - "anyone else struggle coding" (4 words)
  - "is learning to code worth it" (6 words)

  **BAD examples (too long - will fail):**
  - ❌ "working professionals struggling to balance coding practice with full-time jobs" (11 words)
  - ❌ "career changers confused choosing the best path to learn coding" (10 words)
  - ❌ "solo founder customer onboarding taking 5+ hours per signup" (9 words)

  ---

  ## STEP 1: EXTRACT NICHE VOCABULARY

  Before generating, identify from the context:
  - **Segment roles**: Words describing users (beginner, career changer, working professional)
  - **Domain activities**: Key actions (learning, building, planning, choosing)
  - **Pain expressions**: How people express frustration (stuck, overwhelmed, frustrated)

  ---

  ## STEP 2: GENERATE QUERIES (4 PATTERNS)

  ### 1. Pain Expression (35%)
  **Pattern**: [emotion] + [domain activity]
  **3-5 words**

  Examples:
  - "frustrated learning programming"
  - "overwhelmed coding bootcamp"
  - "stuck on coding basics"
  - "struggling with meal prep"
  - "exhausted from budgeting"

  ### 2. Help-Seeking (25%)
  **Pattern**: "anyone else" / "how do you" + [pain]
  **4-6 words**

  Examples:
  - "anyone else struggle with coding"
  - "how do you stay motivated coding"
  - "is coding bootcamp worth it"
  - "anyone else hate meal planning"
  - "how do you budget effectively"

  ### 3. Role + Pain (20%)
  **Pattern**: [segment role] + [pain/question]
  **3-5 words**

  Examples:
  - "beginner programmer frustrated"
  - "career changer coding advice"
  - "adult learning to code help"
  - "busy parent meal prep"
  - "freelancer budgeting struggles"

  ### 4. Progress Barrier (20%)
  **Pattern**: [milestone/time] + stuck/help
  **4-6 words**

  Examples:
  - "stuck after coding tutorials"
  - "can't build real projects"
  - "3 months coding no progress"
  - "plateau after initial weight loss"
  - "stuck after basic budgeting"

  ---

  ## STEP 3: BIAS PREVENTION (CRITICAL)

  **DO NOT inject specific technologies, tools, brands, or products.**

  The goal is DISCOVERY - let the data reveal what people actually use.

  **Transformations:**
  - ❌ "debugging JavaScript errors" → ✅ "frustrated debugging code"
  - ❌ "should I learn Python or JavaScript" → ✅ "overwhelmed choosing programming language"
  - ❌ "VSCode vs Atom slow" → ✅ "code editor frustrations beginner"
  - ❌ "React too complex" → ✅ "frontend development overwhelming"
  - ❌ "Stripe vs Paddle pricing" → ✅ "payment processing frustrating"

  **EXCEPTION**: Only include specific names if the niche itself IS that technology/brand.

  ---

  ## STEP 4: USE SEGMENT VOCABULARY

  Pull exact words from the Market Segments provided:
  - If segment says "Career changers aged 25-40" → use "career changer" in queries
  - If segment says "Working professionals" → use "working professional"
  - If segment says "Beginners" → use "beginner"
  - If segment says "Adult learners 40+" → use "adult learner"

  ---

  ## STEP 5: PLATFORM SELECTION

  **Reddit (60%)**: Discussion, advice-seeking
  - "anyone else", "how do you", "advice needed"

  **Twitter (30%)**: Venting, real-time frustration
  - "just spent", "every time", "why is"

  **Both (10%)**: Universal topics only

  ---

  ## STEP 6: OUTPUT FORMAT

  Return ONLY a valid JSON array:

  [
    {{
      "query": "3-6 word query here",
      "type": "pain|help|role|progress",
      "platform": "reddit|twitter|both"
    }}
  ]

  ---

  ## FINAL CHECKLIST

  Before outputting, verify EACH query:
  - [ ] 3-6 words? (Count them!)
  - [ ] No specific tech/tool/brand names?
  - [ ] Uses segment vocabulary from context?
  - [ ] Discovery-focused (not leading)?

  <brief_explanation>
  First, state the core niche topic and primary pain expression pattern you'll use.
  </brief_explanation>

  Generate {num_queries} SHORT queries now. Count words before including each one.

  <verification>
  Before returning, verify:
  - Array has exactly {num_queries} queries
  - Each query is 3-6 words (count them!)
  - No technology/tool/brand names (unless niche IS that tech)
  - Platform distribution: ~60% reddit, ~30% twitter, ~10% both
  - You completed ALL {num_queries} queries before returning
  </verification>
