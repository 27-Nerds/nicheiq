# Landing Page Generator Crew Tasks
# Sequential 7-task pipeline with context chaining

create_landing_strategy:
  description: >
    Create strategic landing page brief for {product_name} ({solution_type}).

    ## Input Data
    Target Personas: {target_personas}
    Value Proposition: {value_proposition}
    Pain Points: {pain_points}
    Pain Points Summary: {pain_points_summary}
    Competitive Positioning: {competitive_summary}
    Features: {features}

    ## Uniqueness Context (use these to differentiate)
    Niche Category: {niche}
    Pre-computed Tagline: {core_tagline}
    Core Marketing Message: {core_marketing_message}
    Strategic Focus: {recommended_focus}

    ## Required Decisions (be SPECIFIC)
    1. **Primary Persona**: ONE persona with highest pain intensity + budget
    2. **Key Messaging Angle**: Emotional trigger (fear/desire/frustration/aspiration)
    3. **Pain Points**: 2-3 with specific quotes/numbers from research
    4. **Differentiation**: What competitors can't claim
    5. **Memorable Element**: ONE specific visual (e.g., "Oversized statistic: 5 advertisers = 50% revenue")
    6. **Sections**: [hero, problem, solution, how_it_works, social_proof, pricing, comparison, cta]
    7. **CTAs**: 3 action-specific options (not "Get Started")

    ## GPT-5.2 Verification
    Before returning: Verify all fields populated, no vague descriptions, specific data from inputs.

  expected_output: >
    LandingStrategy with length constraints:
    - primary_persona: ONE persona (≤10 words)
    - primary_persona_reasoning: Why this persona (2-3 sentences max)
    - key_messaging_angle: Emotional trigger (1 sentence)
    - pain_points_to_emphasize: 2-3 bullets with quotes/numbers
    - differentiation_hook: Unique angle (1-2 sentences)
    - recommended_sections: Ordered list [hero, ...]
    - section_reasoning: Why these sections (2-3 sentences)
    - memorable_element: SPECIFIC visual description (1-2 sentences)
    - memorable_element_implementation: Implementation guidance (2-3 sentences)
    - headline_direction: problem-first | benefit-first | question | statistic-led
    - tone_of_voice: professional-authoritative | friendly-approachable | urgent-direct | technical-precise
    - conversion_goal: email_signup | waitlist | demo_request | free_trial
    - cta_recommendations: 3 specific CTAs (≤5 words each)

create_creative_direction:
  description: >
    Analyze research data to create autonomous creative direction for {product_name}.
    Make strategic visual decisions that differentiate from category defaults.

    ## Input Data
    Product Name: {product_name}
    Project Type: {project_type} (directory, saas, aggregator, comparison-tool, marketplace)
    Niche Context: {niche}
    Target Personas: {target_personas}
    Differentiation Factors: {differentiation_factors}
    Competitive Summary: {competitive_summary}
    Core Marketing Message: {core_marketing_message}
    Message Framework: {message_framework}

    ## Required Creative Decisions

    1. **Design Archetype** - Choose ONE based on positioning analysis:
       - 'bold-disruptor': Challenger brands, new categories, breaking conventions
       - 'premium-authority': Market leaders, enterprise, trust-focused
       - 'friendly-accessible': Mass market, beginners, approachable
       - 'technical-precision': Developer tools, data products, accuracy-focused
       - 'minimal-elegant': Luxury, design-forward, restraint as statement
       - 'vibrant-energetic': Consumer apps, creative tools, youthful
       - 'earth-organic': Sustainability, wellness, natural products
       - 'neon-futuristic': AI/ML, crypto, cutting-edge tech

    2. **Visual Intensity** - How bold should the design be:
       - 'whisper': Maximum restraint, content-first
       - 'conversational': Professional, balanced
       - 'statement': Bold, attention-grabbing
       - 'shout': Maximum impact, impossible to ignore

    3. **Color Personality** - Derive from niche keywords and positioning:
       - 'trust-blues': Reliability, security, professionalism
       - 'growth-greens': Health, sustainability, progress
       - 'energy-oranges': Action, enthusiasm, warmth
       - 'luxury-purples': Premium, creativity, sophistication
       - 'tech-cyans': Innovation, digital, futuristic
       - 'earth-neutrals': Organic, grounded, timeless
       - 'neon-accents': Cutting-edge, bold, modern
       - 'monochrome-sophisticated': Elegant, editorial, refined

    4. **Hero Archetype** - Match to project type and content needs:
       - 'split-showcase': Two-column, text + visual preview
       - 'centered-statement': Focused headline, minimal distraction
       - 'immersive-full': Full-bleed atmosphere, overlay content
       - 'asymmetric-dynamic': Off-center, energetic composition
       - 'product-demo': Hero with embedded interface preview

    5. **Typography Personality** - Match brand character:
       - 'geometric-modern': Clean, tech, contemporary
       - 'humanist-friendly': Warm, approachable, readable
       - 'technical-precise': Monospace accents, systematic
       - 'editorial-elegant': Serif headlines, refined
       - 'playful-rounded': Soft, friendly, casual
       - 'bold-impact': Heavy weights, statement headlines

    ## Anti-Pattern Guidance
    AVOID these defaults:
    - Developer tool ≠ automatically "dark mode + cyan"
    - SaaS ≠ automatically "gradient hero + blue CTA"
    - Directory ≠ automatically "card grid + minimal"

    INSTEAD: Read the specific niche, persona, and differentiation to make unique choices.

    ## GPT-5.2 Verification
    Before returning verify:
    1. Archetype choice justified by niche analysis, not category default
    2. Color personality derived from specific niche keywords
    3. Hero archetype matches project_type and content needs
    4. Visual intensity calibrated to competitive positioning
    5. archetype_rationale explains the strategic thinking

  expected_output: >
    CreativeDirection with all fields populated:
    - design_archetype: One of 8 archetypes
    - visual_intensity: whisper | conversational | statement | shout
    - color_personality: One of 8 color moods
    - color_temperature: cool | warm | neutral | mixed
    - hero_archetype: One of 5 hero patterns
    - section_density: sparse | balanced | rich
    - layout_rhythm: uniform | alternating | progressive | dramatic
    - typography_personality: One of 6 typography styles
    - heading_scale: modest | standard | bold | massive
    - archetype_rationale: 2-3 sentences strategic reasoning
    - differentiation_visual: 1-2 sentences on competitive differentiation

design_brand_identity:
  description: >
    Execute the Creative Direction into specific brand assets for {product_name}.
    FOLLOW the creative_direction from previous task - do not override archetype decisions.

    ## Input Data
    Product Name: {product_name}
    Project Type: {project_type}
    Target Audience: {target_personas}
    Value Proposition: {value_proposition}
    Competitive Positioning: {competitive_summary}

    ## Creative Direction (FROM PREVIOUS TASK - MUST FOLLOW)
    Design Archetype: [from context]
    Visual Intensity: [from context]
    Color Personality: [from context]
    Color Temperature: [from context]
    Typography Personality: [from context]
    Heading Scale: [from context]

    ## Your Job: Translate Direction → Specific Assets
    1. **Colors**: Generate HEX codes that match the color_personality + temperature
    2. **Typography**: Select Google Fonts that match typography_personality
    3. **Design Mood**: Derive from archetype (bold-disruptor → bold-vibrant, etc.)
    4. **Gradient**: Create Tailwind gradient that fits intensity level
    5. **Layout Notes**: Specific CSS guidance for the creative direction

    ## Intensity → Color Execution
    - whisper: Muted tones, low saturation, subtle contrast
    - conversational: Standard saturation, professional contrast
    - statement: Vibrant colors, strong contrast, bold accents
    - shout: Maximum saturation, high contrast, multiple accent colors

    ## Typography Personality → Font Selection
    - geometric-modern: Space Grotesk, Outfit, DM Sans
    - humanist-friendly: Nunito, Source Sans 3, Lato
    - technical-precise: JetBrains Mono, IBM Plex Sans, Roboto Mono
    - editorial-elegant: Playfair Display, Cormorant Garamond, Libre Baskerville
    - playful-rounded: Quicksand, Comfortaa, Varela Round
    - bold-impact: Bebas Neue, Oswald, Anton

    ## GPT-5.2 Verification
    Before returning verify:
    1. Color choices align with color_personality from creative direction
    2. Font choices match typography_personality exactly
    3. Gradient intensity matches visual_intensity level
    4. design_mood derived from archetype (not independently chosen)
    5. design_reasoning references creative direction decisions

  expected_output: >
    BrandIdentity with:
    - color_primary: Hex code (e.g., #3B82F6)
    - color_secondary: Hex code for CTAs
    - color_background: Hex code or gradient CSS
    - color_text: Hex code
    - color_text_muted: Hex code
    - font_heading: EXACT Google Font name for headlines (e.g., "Space Grotesk")
    - font_body: EXACT Google Font name for body text (e.g., "Inter")
    - font_code: Google Font name for code blocks (e.g., "JetBrains Mono"), or null if not needed
    - design_mood: One of four options
    - gradient_style: Tailwind gradient classes
    - layout_notes: 4 items max - hero style, decorative elements, card styles, spacing rhythm
    - design_reasoning: 2-3 sentences explaining color/mood/font choices

generate_landing_copy:
  description: >
    Write conversion-optimized copy for {product_name}.
    FOLLOW section_density from creative direction for section count.
    FOLLOW Landing Strategy (pain_points_to_emphasize, cta_recommendations, tone_of_voice).

    ## Creative Direction Context (MUST FOLLOW)
    Section Density: [from context] → determines number of sections

    ## Section Density → Section Count
    - 'sparse': 3-4 sections max (hero + 1-2 middle + cta)
    - 'balanced': 5-7 sections (standard landing page)
    - 'rich': 7-10 sections (detailed, comprehensive)

    ## Input Data
    Solution Type: {solution_type}
    Target Audience: {target_personas}
    Value Proposition: {value_proposition}
    Pain Points: {pain_points}
    Features: {features}
    User Journey: {user_journey}
    Pricing: {pricing_summary}
    Competitive Advantages: {competitive_summary}
    Social Proof Quotes: {quotes}

    ## Uniqueness Context (use for differentiated copy)
    Message Framework (Before/After/Bridge): {message_framework}
    Selection Rationale: {selection_rationale}
    Content Angles: {content_angles}
    Differentiation Factors: {differentiation_factors}
    Alternatives Beaten: {runner_ups}

    ## Quality Requirements
    - Headlines: Product-specific (test: would this work for competitors?)
    - Numbers: Use EXACT data from research
    - CTAs: Match the action ("See sponsor data" not "Get Started")
    - STRIP INTERNAL METRICS: Remove severity scores, WTP scores, rankings

    ## Section Pool (select based on density)
    Required: hero, cta
    Optional: problem, solution, how_it_works, social_proof, pricing, comparison, use_cases, faq

    ## Density-Based Selection
    - sparse: hero → problem OR solution → cta (skip everything else)
    - balanced: hero → problem → solution → how_it_works → social_proof → cta
    - rich: Include most/all sections with detailed content

    ## Format for items field
    items: [{"title": "string", "description": "string"}, ...]

    ## CTA Section Items Format
    Items should list WHAT the user receives, not meta-labels:
    - GOOD: {"title": "Curated Templates", "description": "Production-ready files..."}
    - GOOD: {"title": "Weekly Updates", "description": "New playbooks weekly..."}
    - BAD: {"title": "Primary CTA", "description": "..."}

    ## Fallback Rules
    - Empty value_proposition → use product_name as headline
    - <2 pain_points → skip problem section
    - Empty quotes → skip social_proof section

    ## GPT-5.2 Verification
    Before returning verify:
    1. Section count matches section_density from creative direction
    2. section_selection_reasoning present
    3. items are objects not strings

  expected_output: >
    LandingPageCopy with:
    - product_name: Product name
    - tagline: Value proposition (1 sentence, ≤15 words)
    - sections: List of LandingPageSection (count based on section_density)
      - section_type: string
      - headline: string (≤10 words)
      - body: string (2-4 sentences)
      - cta_text: string (optional, ≤5 words)
      - items: list of {"title": string, "description": string} (optional)
    - section_selection_reasoning: Explain how section count matches section_density
    - meta_title: SEO title (50-60 chars)
    - meta_description: SEO description (150-160 chars)

generate_html_page:
  description: >
    Generate production-ready HTML implementing the creative direction.
    CRITICAL: Follow hero_archetype, layout_rhythm, and heading_scale from creative direction context.
    Use EXACT colors from brand_identity, ALL sections from copy context.

    ## Creative Direction Execution (FROM CONTEXT - MUST FOLLOW)

    ### Hero Archetype Execution
    - 'split-showcase': grid lg:grid-cols-2, text left, visual/preview right
    - 'centered-statement': text-center, max-w-4xl mx-auto, minimal visual
    - 'immersive-full': background-image/gradient, overlay text, min-h-screen
    - 'asymmetric-dynamic': grid with unequal columns, off-center headline
    - 'product-demo': hero with embedded mockup/screenshot panel

    ### Layout Rhythm Execution
    - 'uniform': Consistent py-24, same grid patterns throughout
    - 'alternating': Left-right text/visual pattern, vary backgrounds
    - 'progressive': Start simple, increase complexity toward CTA
    - 'dramatic': Vary py-16 to py-40, mix full-width and contained sections

    ### Section Density Execution
    - 'sparse': Max 4-5 sections, generous whitespace (py-32+)
    - 'balanced': 5-7 sections, standard spacing (py-20-28)
    - 'rich': 7-10 sections, tighter spacing (py-16-20), more detail

    ### Heading Scale Execution
    - 'modest': Hero h1 text-4xl md:text-5xl
    - 'standard': Hero h1 text-5xl md:text-6xl
    - 'bold': Hero h1 text-6xl md:text-7xl
    - 'massive': Hero h1 text-7xl md:text-8xl lg:text-9xl

    ## Requirements (positive guidance)
    1. **Hero**: Follow hero_archetype pattern, use heading_scale for sizing
    2. **Navigation**: Sticky with glass morphism (backdrop-blur-md), CTA links to #signup
    3. **Layouts**: Follow layout_rhythm pattern for section variation
    4. **Spacing**: Follow section_density guidance for padding/whitespace
    5. **Typography**: Use EXACT fonts from brand_identity:
       - font_heading for h1, h2, h3 elements
       - font_body for paragraphs, buttons, nav links
       - font_code for code blocks, technical text (if provided)
       - Generate Google Fonts <link> with these exact font names
    6. **Memorable element**: Implement the ONE thing from strategy

    ## Mood-to-Layout (SUPPLEMENTARY - archetype takes precedence)
    - minimal-professional: Clean sans, generous whitespace, subtle shadows
    - bold-vibrant: text-7xl+, gradient hero, shadow-2xl, hover animations
    - dark-technical: #0F172A base, monospace accents, neon borders
    - friendly-approachable: Rounded-2xl, warm gradients, soft shadows

    ## Technical (always include)
    - <!DOCTYPE html>
    - <script src="https://cdn.tailwindcss.com"></script>
    - Google Fonts <link> using brand_identity.font_heading, font_body, font_code
      Example: <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
    - Mobile-first responsive (sm:, md:, lg:)
    - Email form: action="#" method="POST"
    - CTA section: id="signup"
    - Meta tags: title, description, viewport, og:title, og:description
    - scroll-smooth on html element

    ## GPT-5.2 Verification
    Before returning verify:
    1. Hero is full-width (not a card on gray background)
    2. Google Fonts link includes EXACT font names from brand_identity
    3. CSS uses font-family with the specified fonts
    4. Section layouts vary (not all identical grids)
    5. Spacing varies between sections
    6. All copy sections implemented
    7. Colors match brand_identity exactly
    8. NO META-LABELS rendered as text:
       - Never render "Primary CTA", "Memorable promise", "Key messaging angle"
       - Never render field names from strategy context as visible labels
       - All visible text must be user-facing copy

  expected_output: >
    HTMLPageResult with:
    - html_content: Complete HTML (<!DOCTYPE html> to </html>)
    - sections_included: List of section types implemented
    - design_notes: 2-3 sentences on hero choice, layout variation, decorative elements

enhance_animations:
  description: >
    Enhance HTML with animations MATCHED TO CREATIVE DIRECTION from context.
    Adapt animation energy to visual_intensity level.

    ## Creative Direction Context (MUST FOLLOW)
    Visual Intensity: [from context] → determines animation energy
    Design Archetype: [from context] → determines motion character

    ## Visual Intensity → Animation Calibration

    ### 'whisper': Minimal motion
    - Page load: single fade-in (duration-700), no stagger
    - Scroll: subtle opacity change only
    - Hover: slight color shift, no scale
    - Skip micro-interactions

    ### 'conversational': Subtle motion
    - Page load: gentle fade-in (duration-500), 150ms stagger
    - Scroll: translateY(10px) reveals
    - Hover: scale(1.02), light shadow

    ### 'statement': Dynamic motion
    - Page load: fade + slide (duration-300), 100ms stagger
    - Scroll: translateY(20px) reveals with opacity
    - Hover: scale(1.05), shadow expansion

    ### 'shout': Bold motion
    - Page load: fast cascade (duration-200), 50ms stagger
    - Scroll: translateY(30px) + scale reveals
    - Hover: scale(1.08), strong shadow, color shifts
    - Add micro-interactions everywhere

    ## Technical Requirements
    - Add CSS @keyframes in <style> block
    - Use Tailwind animation utilities
    - Add IntersectionObserver script before </body>
    - Preserve ALL existing HTML structure and content

    ## GPT-5.2 Verification
    Before returning verify:
    1. Animation intensity matches visual_intensity from creative direction
    2. whisper = almost static, shout = motion-rich
    3. Original HTML content fully preserved (no removed sections)
    4. IntersectionObserver script added for scroll triggers

  expected_output: >
    AnimatedHTMLResult with:
    - html_content: Enhanced HTML with animations (<!DOCTYPE html> to </html>)
    - animations_added: List of animation types (page_load, scroll, hover, micro)
    - animation_notes: 2-3 sentences explaining how animation energy matches visual_intensity

qa_review_html:
  description: >
    QA review against CREATIVE DIRECTION context, not hardcoded rules.
    Validate that implementation matches the creative decisions.

    ## Creative Direction Context (validate against these)
    Heading Scale: [from context] → expected headline sizes
    Section Density: [from context] → expected spacing
    Hero Archetype: [from context] → expected hero structure
    Visual Intensity: [from context] → expected animation energy

    ## Context-Aware Checks

    1. **Hero Section**: Matches hero_archetype pattern
       - split-showcase → has two columns (grid lg:grid-cols-2)
       - centered-statement → text-center, contained width
       - immersive-full → full-bleed, min-h-screen
       - asymmetric-dynamic → unequal columns
       - product-demo → has embedded preview area

    2. **Headline Sizes**: Match heading_scale
       - modest → h1 should be text-4xl/5xl (smaller is CORRECT)
       - standard → h1 should be text-5xl/6xl
       - bold → h1 should be text-6xl/7xl
       - massive → h1 should be text-8xl/9xl
       - Flag if sizes DON'T match creative direction

    3. **Section Spacing**: Match section_density
       - sparse → should have py-32+ spacing, max 4-5 sections
       - balanced → should have py-20-28 spacing, 5-7 sections
       - rich → should have py-16-20 spacing, 7-10 sections

    4. **Animation Energy**: Match visual_intensity
       - whisper → minimal/no animations is CORRECT
       - shout → lots of motion is CORRECT
       - Don't add animations if intensity is whisper

    ## Universal Rules (always check)
    - Responsive: sm:/md:/lg: breakpoints present, no overflow
    - Accessibility: touch targets min-h-[44px], readable contrast
    - Consistency: uniform border-radius, shadow scale, gap scale
    - HTML validity: proper nesting, closed tags, DOCTYPE

    ## Issue Categories
    - LAYOUT_SPACING: padding/gap doesn't match section_density
    - TYPOGRAPHY: sizes don't match heading_scale
    - RESPONSIVE: missing breakpoints, overflow issues

    ## Quality Scoring
    Start at 100, deduct for issues that DON'T match creative direction
    passes_qa = True if final score >= 80

    ## GPT-5.2 Verification
    Before returning verify:
    1. Validated AGAINST creative direction, not hardcoded rules
    2. ALL original content preserved (no missing sections)
    3. ALL animations preserved (CSS @keyframes, transitions)
    4. Issues only flagged when implementation doesn't match direction
    5. HTML is valid (proper nesting, closed tags)

  expected_output: >
    QAReviewResult with:
    - html_content: Refined HTML with fixes applied (<!DOCTYPE html> to </html>)
    - issues_found: List of QAIssue objects (only issues that contradict creative direction)
    - issues_fixed_count: Total fixes applied
    - quality_score: 0-100 based on creative direction compliance
    - passes_qa: True if score >= 80
    - review_notes: 2-3 sentences on how implementation aligns with creative direction
