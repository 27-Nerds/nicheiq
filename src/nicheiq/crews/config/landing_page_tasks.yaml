# Landing Page Generator Crew Tasks
# Sequential 7-task pipeline with context chaining

create_landing_strategy:
  description: >
    Create a strategic landing page brief for {product_name} ({solution_type}).

    ## Page Mode: {page_mode}
    If "coming_soon": minimal sections (hero + 1 supporting + cta), email capture in hero.

    ## Input Data
    - Personas: {target_personas} | Primary segment: {primary_segment}
    - Value Proposition: {value_proposition}
    - Pain Points: {pain_points} | Summary: {pain_points_summary}
    - Competitive: {competitive_summary}
    - Features: {features}
    - Niche: {niche} | Vocabulary: {niche_vocabulary}
    - Tagline: {core_tagline} | Message: {core_marketing_message}
    - Focus: {recommended_focus}
    - Messaging frameworks: {messaging_frameworks}

    ## Deliverables
    1. Primary Persona: ONE persona (highest pain + budget)
    2. Key Messaging Angle: emotional trigger
    3. Pain Points: 2-3 with quotes/numbers from research
    4. Differentiation: what competitors cannot claim
    5. Memorable Element: ONE specific visual (e.g., "Oversized statistic: 5 advertisers = 50% revenue")
    6. Sections: from [hero, problem, solution, how_it_works, social_proof, pricing, comparison, cta]
    7. CTAs: 3 action-specific options (NOT "Get Started")

    <output_verbosity_spec>
    - primary_persona: ONE persona, ≤10 words
    - reasoning fields: 2-3 sentences max
    - memorable_element: SPECIFIC visual, not vague
    - cta_recommendations: ≤5 words each
    </output_verbosity_spec>

    <scope_constraints>
    - Use niche vocabulary, not generic SaaS language
    - Do not fabricate statistics not in input data
    - Primary persona must be ONE person, not multiple
    </scope_constraints>

    <uncertainty_and_ambiguity>
    - Sparse persona data: Choose highest-pain persona, note assumption
    - Unclear differentiation: Reference competitive positioning
    </uncertainty_and_ambiguity>

  expected_output: >
    LandingStrategy with: primary_persona, primary_persona_reasoning, key_messaging_angle,
    pain_points_to_emphasize, differentiation_hook, recommended_sections, section_reasoning,
    memorable_element, memorable_element_implementation, headline_direction, tone_of_voice,
    conversion_goal, cta_recommendations

create_creative_direction:
  description: >
    Create a distinctive visual direction for {product_name} ({project_type}).

    ## Product Context
    - Niche: {niche}
    - Personas: {target_personas}
    - Differentiation: {differentiation_factors}
    - Competition: {competitive_summary}
    - Marketing Message: {core_marketing_message}

    ## Creative Requirement
    {variation_hint}

    ## Page Mode: {page_mode}
    For "coming_soon": Design for anticipation and exclusivity.

    ## Inspiration (Optional)
    Consider searching for "{niche} landing page design" or similar queries to see
    what's working in this space. Note any inspiring patterns or approaches you find,
    then create something original that serves THIS product's unique story.

    ## Competitor Reference (Optional)
    Real competitor landing pages you can search for design inspiration:
    {competitor_links}
    Analyze their layouts and visual approaches, then differentiate.

    ## Your Decisions
    Make autonomous choices for: design archetype, color mood, hero layout,
    visual intensity, typography, section density, and layout rhythm.

    STRUCTURAL CREATIVITY: Question the default two-column hero (copy left, artifact right).
    Is it truly the best structure for THIS product? Consider alternatives:
    - Centered, message-focused heroes that let the words breathe
    - Full-viewport immersive designs with dramatic visual impact
    - Vertical narrative flows that guide the eye down the story
    - Asymmetric layouts that break expectations

    Ground each choice in the product context above. Unusual choices are welcome
    when they serve the product's story.

    ## Output Fields
    Populate all CreativeDirection fields. The archetype_rationale should explain
    HOW the product context influenced your choices.

  expected_output: >
    CreativeDirection with all fields populated. Each choice grounded in product context.
    If you searched for inspiration, mention what influenced your thinking.

create_visual_design:
  description: >
    Create visual design specifications for {product_name} landing page.
    Page Mode: {page_mode} (if "coming_soon": design for anticipation)

    ## Context (from previous tasks)
    - Creative Direction: archetype, visual intensity, hero archetype, section density
    - Landing Strategy: memorable element, primary persona, conversion goal

    ## Deliverables
    1. Page Blueprint: sections needed, order, layout type
    2. Hero Composition: what's IN (headline, form, artifact) vs OUT
    3. Content Redundancy Notes: what NOT to include (critical for downstream)
    4. Section Composition: content per section, primary vs secondary
    5. Card Treatments: visual specs per card type (feature, pain, step)
    6. Memorable Element Visual: HOW the strategy's element looks
    7. Visual Surprises: 2-3 convention breaks
    8. Animation Personality: playful | professional | dramatic | technical

    <output_verbosity_spec>
    - page_blueprint: 2-3 sentences
    - hero_composition: 1-2 sentences
    - section_composition: 1 sentence per section
    - content_redundancy_notes: What NOT to include
    - card_treatments: 1-2 sentences per type
    - visual_surprises: 2-3 specific items
    </output_verbosity_spec>

    <scope_constraints>
    - Structure decisions MUST be explicit for HTML Developer
    - content_redundancy_notes MUST specify what NOT to include
    - Card treatments MUST vary between card types
    </scope_constraints>

  expected_output: >
    VisualDesignSpec with: page_blueprint, hero_composition, section_composition,
    content_redundancy_notes, card_treatments, card_variation_approach,
    memorable_element_visual, visual_surprises, section_visual_weights,
    animation_personality, visual_design_rationale

design_brand_identity:
  description: >
    # Role and Objective
    Translate the Creative Direction into specific brand assets for {product_name}.

    # Instructions

    ## Context
    - Product: {product_name} ({project_type})
    - Target Audience: {target_personas}
    - Value Proposition: {value_proposition}

    ## Creative Direction (from context)
    The creative direction provides: archetype, color personality, visual intensity,
    typography personality. Translate these into specific hex codes, font names,
    and implementation guidance.

    ## Visual Design Spec (from context)
    The Visual Designer has specified card treatments, memorable element visual,
    and animation personality. Reference these when choosing colors that support
    the visual design.

    ## Required Outputs
    1. **Colors**: Generate HEX codes that match color_personality + temperature
    2. **Typography**: Select Google Fonts that match typography_personality
       (Use EXACT Google Font names - these go directly in the HTML)
    3. **Design Mood**: Derive from the archetype
    4. **Gradient**: Create Tailwind gradient that fits the intensity level
    5. **Layout Notes**: Specific guidance for the HTML developer

    ## Quality Checklist
    - Colors must be exact HEX codes (e.g., #3B82F6), not color names
    - Fonts must be EXACT Google Font names available via fonts.google.com
    - Do not always pick the first font in any list; choose fresh options
    - Do not override creative direction; translate it faithfully

    <output_verbosity_spec>
    - Colors: Hex codes only (e.g., #3B82F6)
    - Fonts: EXACT Google Font names
    - design_reasoning: 2-3 sentences max
    </output_verbosity_spec>

    <scope_constraints>
    - Translate creative direction, do not override
    - Use ONLY Google Fonts
    - Match archetype mood precisely
    </scope_constraints>

  expected_output: >
    BrandIdentity with:
    - color_primary: Hex code (e.g., #3B82F6)
    - color_secondary: Hex code for CTAs
    - color_background: Hex code or gradient CSS
    - color_text: Hex code
    - color_text_muted: Hex code
    - font_heading: EXACT Google Font name (e.g., "Space Grotesk")
    - font_body: EXACT Google Font name (e.g., "Inter")
    - font_code: Google Font name or null if not needed
    - design_mood: One of four options
    - gradient_style: Tailwind gradient classes
    - layout_notes: Implementation guidance for HTML developer
    - design_reasoning: 2-3 sentences explaining your choices

generate_landing_copy:
  description: >
    Write conversion-optimized copy for {product_name} ({solution_type}).
    Page Mode: {page_mode}

    ## Input Data
    - Personas: {target_personas} | Value Prop: {value_proposition}
    - Pain Points: {pain_points} | Features: {features}
    - Pricing: {pricing_summary} | Differentiation: {differentiation_factors}
    - Content Angles: {content_angles}
    - Market: {trend_signal} | {market_verdict}

    ## Context from Previous Tasks
    - visual_design_spec.content_redundancy_notes: What NOT to include
    - visual_design_spec.hero_composition: What belongs IN vs OUT of hero
    - landing_strategy.tone_of_voice: Writing style guide

    ## Page Mode Rules
    If "coming_soon": email capture in hero, ≤3 sections, <400 words,
    "coming soon" mentioned ONCE, urgency-focused CTA.

    <output_verbosity_spec>
    - Headlines: ≤8 words, product-specific
    - Body: 2-4 sentences per section
    - CTAs: ≤5 words, action-specific (NOT "Get Started")
    </output_verbosity_spec>

    <scope_constraints>
    - RESPECT content_redundancy_notes - do NOT duplicate what's excluded
    - Headlines must be product-specific (test: would this work for competitors?)
    - Do not fabricate testimonials or statistics
    - Items format: [{"title": "string", "description": "string"}, ...]
    </scope_constraints>

    <uncertainty_and_ambiguity>
    - Pricing missing: Omit pricing section, note in reasoning
    - Features unclear: Use value proposition as guide
    </uncertainty_and_ambiguity>

  expected_output: >
    LandingPageCopy with: product_name, tagline, sections (List of LandingPageSection),
    section_selection_reasoning, meta_title (50-60 chars), meta_description (150-160 chars)

generate_html_page:
  description: >
    Generate production-ready HTML implementing the creative direction,
    brand identity, and visual design specification.
    Page Mode: {page_mode}

    ## Context from Previous Tasks
    - creative_direction: hero_archetype, layout_rhythm, section_density, heading_scale
    - visual_design_spec: card_treatments, memorable_element_visual, visual_surprises
    - brand_identity: colors (HEX codes), fonts (Google Font names)

    ## Technical Requirements
    - Valid HTML5 with Tailwind CDN and Google Fonts
    - Mobile-first (sm:, md:, lg: breakpoints)
    - Email form action="#", CTA section id="signup"

    ## Critical Rules (consolidated)
    1. Use ONLY brand_identity colors and fonts - no fabrication
    2. Hero stretches full width - no gray card wrapper
    3. Card treatments MUST vary between card types (follow visual_design_spec)
    4. NEVER expose internal data as visible text (archetypes, moods, v0.x versions)
    5. Absolute positioning: NEVER use top-[X%] inside cards - causes collision
       (Safe: bottom-4 with pb-X, or outside container, or normal flow)

    If "coming_soon": Include visible "launching soon" indicator.

    {html_build_guidance}

    <scope_constraints>
    - Implement EXACTLY what creative direction specifies
    - Do not add extra sections, features, or decorative elements
    - All visible text must make sense to end users, not designers
    </scope_constraints>

    <uncertainty_and_ambiguity>
    Missing context: Note in design_notes, use sensible defaults, don't fabricate.
    </uncertainty_and_ambiguity>

  expected_output: >
    HTMLPageResult with: html_content (complete HTML), sections_included, design_notes

enhance_animations:
  description: >
    Enhance HTML with animations matched to creative direction.

    ## Context from Previous Tasks
    - visual_intensity: whisper | conversational | statement | shout
    - animation_personality: playful | professional | dramatic | technical

    ## Technical Tools
    CSS @keyframes, Tailwind animation utilities, IntersectionObserver for scroll reveals.

    {animation_enhance_guidance}

    <scope_constraints>
    - Match animation energy to visual_intensity EXACTLY
    - NEVER remove existing content or structure - only ADD animations
    - Content must be visible even if JavaScript fails (CSS fallback required)
    - Limit will-change to max 5 elements (browser memory limit)
    - NEVER start content at opacity: 0 without CSS fallback
    </scope_constraints>

  expected_output: >
    AnimatedHTMLResult with: html_content, animations_added, animation_notes

qa_review_html:
  description: >
    Validate HTML against creative direction and apply fixes.

    ## Validation Rules
    1. Responsive: sm:/md:/lg: breakpoints, no horizontal overflow
    2. Accessibility: touch targets min-h-[44px], readable contrast
    3. HTML validity: proper nesting, closed tags
    4. Layout collision: top-[X%] inside cards = FAIL (causes overlap)
    5. Creative direction compliance: heading_scale, section_density, hero_archetype

    Score 0-100 based on compliance. passes_qa = True if score >= 80.

    {qa_review_guidance}

    <scope_constraints>
    - Validate against CREATIVE DIRECTION, not personal preferences
    - NEVER remove sections, text, or animations
    - Only modify Tailwind utility classes for fixes
    - Preserve all creative direction choices
    </scope_constraints>

  expected_output: >
    QAReviewResult with: html_content, issues_found, issues_fixed_count,
    quality_score (0-100), passes_qa (True if ≥80), review_notes
