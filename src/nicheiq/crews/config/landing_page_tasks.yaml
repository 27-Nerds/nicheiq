# Landing Page Generator Crew Tasks
# Sequential 7-task pipeline with context chaining

create_landing_strategy:
  description: >
    Create strategic landing page brief for {product_name} ({solution_type}).

    ## Input Data
    Target Personas: {target_personas}
    Value Proposition: {value_proposition}
    Pain Points: {pain_points}
    Pain Points Summary: {pain_points_summary}
    Competitive Positioning: {competitive_summary}
    Features: {features}

    ## Uniqueness Context (use these to differentiate)
    Niche Category: {niche}
    Pre-computed Tagline: {core_tagline}
    Core Marketing Message: {core_marketing_message}
    Strategic Focus: {recommended_focus}

    ## Required Decisions (be SPECIFIC)
    1. **Primary Persona**: ONE persona with highest pain intensity + budget
    2. **Key Messaging Angle**: Emotional trigger (fear/desire/frustration/aspiration)
    3. **Pain Points**: 2-3 with specific quotes/numbers from research
    4. **Differentiation**: What competitors can't claim
    5. **Memorable Element**: ONE specific visual (e.g., "Oversized statistic: 5 advertisers = 50% revenue")
    6. **Sections**: [hero, problem, solution, how_it_works, social_proof, pricing, comparison, cta]
    7. **CTAs**: 3 action-specific options (not "Get Started")

    ## GPT-5.2 Verification
    Before returning: Verify all fields populated, no vague descriptions, specific data from inputs.

  expected_output: >
    LandingStrategy with length constraints:
    - primary_persona: ONE persona (≤10 words)
    - primary_persona_reasoning: Why this persona (2-3 sentences max)
    - key_messaging_angle: Emotional trigger (1 sentence)
    - pain_points_to_emphasize: 2-3 bullets with quotes/numbers
    - differentiation_hook: Unique angle (1-2 sentences)
    - recommended_sections: Ordered list [hero, ...]
    - section_reasoning: Why these sections (2-3 sentences)
    - memorable_element: SPECIFIC visual description (1-2 sentences)
    - memorable_element_implementation: Implementation guidance (2-3 sentences)
    - headline_direction: problem-first | benefit-first | question | statistic-led
    - tone_of_voice: professional-authoritative | friendly-approachable | urgent-direct | technical-precise
    - conversion_goal: email_signup | waitlist | demo_request | free_trial
    - cta_recommendations: 3 specific CTAs (≤5 words each)

create_creative_direction:
  description: >
    Create a UNIQUE visual direction for {product_name} landing page.
    Make autonomous creative decisions that differentiate from category templates.

    ## Context
    Product: {product_name} ({project_type})
    Niche: {niche}
    Target Personas: {target_personas}
    Differentiation: {differentiation_factors}
    Competition: {competitive_summary}
    Marketing Message: {core_marketing_message}

    ## Variation Hint
    {variation_hint}

    ## Your Creative Mission
    Design a landing page that looks like it was made specifically for THIS product,
    not pulled from a template. Analyze the specific niche, persona, and positioning
    to make creative choices that FIT but DIFFERENTIATE.

    Make decisions on: archetype, color mood, hero layout, visual intensity,
    typography, section density, layout rhythm. Each choice should be deliberate.

    AVOID category stereotypes unless you have a specific reason to use them.
    Document your creative reasoning in archetype_rationale.

  expected_output: >
    CreativeDirection with all fields populated:
    - design_archetype: Your chosen archetype with reasoning
    - visual_intensity: whisper | conversational | statement | shout
    - color_personality: Color mood that fits the brand
    - color_temperature: cool | warm | neutral | mixed
    - hero_archetype: Hero layout that serves this product
    - section_density: sparse | balanced | rich
    - layout_rhythm: uniform | alternating | progressive | dramatic
    - typography_personality: Typography style that matches the brand
    - heading_scale: modest | standard | bold | massive
    - archetype_rationale: 2-3 sentences explaining your creative choices
    - differentiation_visual: How this differs from competitors

create_visual_design:
  description: >
    Create visual design specifications for {product_name} landing page.
    INTERPRET the creative direction creatively - add your own visual personality.

    ## Context (FROM PREVIOUS TASKS)
    Creative Direction: design archetype, visual intensity, hero archetype, section density
    Landing Strategy: memorable element description, primary persona, conversion goal

    ## Your Creative Decisions

    1. **Card Treatment Strategy**: How should different card types look?
       - Feature cards vs pain point cards vs step cards
       - What visual elements? (emoji icons, accent bars, gradients, shadows)
       - How do they vary across the page?

    2. **Memorable Element Visual**: The landing strategy defines WHAT the memorable
       element is. You decide HOW it should look visually:
       - Implementation type (hero stat, callout box, artifact screenshot)
       - Color treatment (accent dominant, subtle, high contrast)
       - Animation entry (fade up, scale in, pulse)

    3. **Visual Surprises**: Pick 2-3 deliberate convention breaks:
       - What typical patterns will we break?
       - What creative alternatives will we use?
       - Make the page feel hand-crafted, not template-generated

    4. **Section Visual Weights**: Which sections dominate visually?
       - Hero is usually dominant, but maybe CTA should be too?
       - What sections should fade into background?

    5. **Animation Personality**: Match the brand's character
       - Playful = bouncy, staggered, energetic
       - Professional = smooth, minimal, refined
       - Dramatic = slow reveals, scale effects
       - Technical = precise, fast, functional

    ## Quality Bar
    Your visual design should feel like specific creative choices were made,
    not like a template was applied. The Brand Designer and HTML Developer
    should be able to implement YOUR vision precisely.

  expected_output: >
    VisualDesignSpec with:
    - card_treatments: List of CardTreatment specs per card type
    - card_variation_approach: How cards vary across the page
    - memorable_element_visual: MemorableElementVisual with implementation details
    - visual_surprises: 2-3 VisualSurprise objects
    - section_visual_weights: Dict of section → weight
    - animation_personality: One of the personality types
    - visual_design_rationale: 2-3 sentences explaining choices

design_brand_identity:
  description: >
    Execute the Creative Direction into specific brand assets for {product_name}.
    FOLLOW the creative_direction from previous task - translate it into concrete assets.

    ## Context
    Product: {product_name} ({project_type})
    Target Audience: {target_personas}
    Value Proposition: {value_proposition}

    ## Creative Direction (FROM CONTEXT - MUST FOLLOW)
    The creative direction provides: archetype, color personality, visual intensity,
    typography personality. Your job is to translate these into specific hex codes,
    font names, and implementation guidance.

    ## Visual Design Spec (FROM CONTEXT)
    The Visual Designer has specified card treatments, memorable element visual,
    and animation personality. Reference these when choosing colors that support
    the visual design.

    ## Your Job
    1. **Colors**: Generate HEX codes that match the color_personality + temperature
    2. **Typography**: Select Google Fonts that match typography_personality
       (Use EXACT Google Font names - these go directly in the HTML)
    3. **Design Mood**: Derive from the archetype
    4. **Gradient**: Create Tailwind gradient that fits the intensity level
    5. **Layout Notes**: Specific guidance for the HTML developer

    DIVERSITY: Avoid always picking the first font in any list. Choose fresh options
    that still match the typography personality from creative direction.

  expected_output: >
    BrandIdentity with:
    - color_primary: Hex code (e.g., #3B82F6)
    - color_secondary: Hex code for CTAs
    - color_background: Hex code or gradient CSS
    - color_text: Hex code
    - color_text_muted: Hex code
    - font_heading: EXACT Google Font name (e.g., "Space Grotesk")
    - font_body: EXACT Google Font name (e.g., "Inter")
    - font_code: Google Font name or null if not needed
    - design_mood: One of four options
    - gradient_style: Tailwind gradient classes
    - layout_notes: Implementation guidance for HTML developer
    - design_reasoning: 2-3 sentences explaining your choices

generate_landing_copy:
  description: >
    Write conversion-optimized copy for {product_name}.
    FOLLOW the creative direction (section_density, tone) and landing strategy.

    ## Context
    Solution Type: {solution_type}
    Target Audience: {target_personas}
    Value Proposition: {value_proposition}
    Pain Points: {pain_points}
    Features: {features}
    Pricing: {pricing_summary}
    Differentiation: {differentiation_factors}
    Content Angles: {content_angles}

    ## Creative Direction (FROM CONTEXT)
    Section density determines how many sections to include (sparse/balanced/rich).
    Tone of voice from landing strategy should guide your writing style.

    ## Section Pool
    Required: hero, cta
    Optional: problem, solution, how_it_works, social_proof, pricing, comparison, use_cases, faq

    Choose sections that make sense for THIS product's conversion goal.

    ## Quality Requirements
    - Headlines: Product-specific (test: would this work for competitors?)
    - Numbers: Use EXACT data from research when available
    - CTAs: Match the action ("See sponsor data" not generic "Get Started")
    - items format: [{"title": "string", "description": "string"}, ...]

    Explain your section choices in section_selection_reasoning.

  expected_output: >
    LandingPageCopy with:
    - product_name: Product name
    - tagline: Value proposition (1 sentence)
    - sections: List of LandingPageSection with section_type, headline, body, optional cta_text and items
    - section_selection_reasoning: Why these sections for this product
    - meta_title: SEO title (50-60 chars)
    - meta_description: SEO description (150-160 chars)

generate_html_page:
  description: >
    Generate production-ready HTML implementing the creative direction.
    FOLLOW hero_archetype, layout_rhythm, heading_scale from context.
    Use EXACT colors and fonts from brand_identity.

    ## Creative Direction (FROM CONTEXT)
    The creative direction specifies: hero_archetype, layout_rhythm, section_density,
    heading_scale. Use your expertise to implement these appropriately with Tailwind CSS.

    ## Visual Design Spec (FROM CONTEXT)
    The Visual Designer has specified:
    - card_treatments: Follow these for each card type (feature, pain_point, step, etc.)
    - memorable_element_visual: Implement exactly as specified (placement, color treatment, animation)
    - visual_surprises: Apply these convention breaks in the specified sections
    - section_visual_weights: Size/spacing per section (dominant, standard, subtle)

    Implement the visual design precisely - these are creative decisions made for this specific page.

    ## Implementation Requirements
    1. **Hero**: Follow hero_archetype pattern from creative direction
    2. **Typography**: Use EXACT fonts from brand_identity in Google Fonts <link>
    3. **Colors**: Use EXACT hex codes from brand_identity
    4. **Spacing**: Follow section_density guidance
    5. **Layouts**: Follow layout_rhythm for section variation
    6. **Memorable element**: Implement the ONE thing from landing strategy

    ## Technical (always include)
    - <!DOCTYPE html> with Tailwind CDN
    - Google Fonts <link> with brand_identity fonts
    - Mobile-first responsive (sm:, md:, lg:)
    - Email form: action="#", CTA section: id="signup"
    - Meta tags: title, description, viewport
    - scroll-smooth on html element

    ## Quality Check
    - Hero is full-width, not a card on gray background
    - All copy sections implemented
    - No meta-labels rendered as visible text (never render "Primary CTA" etc.)

    ## Card Quality Bar
    Cards must have visual richness beyond basic title + paragraph:
    - Each card should have at least ONE visual element (icon, accent bar, badge, gradient, decorative border)
    - VARY card treatments - don't apply the same pattern to every card
    - Let card purpose guide styling (feature vs pain point vs step vs benefit)
    - Use accent color for visual anchors without overwhelming

  expected_output: >
    HTMLPageResult with:
    - html_content: Complete HTML (<!DOCTYPE html> to </html>)
    - sections_included: List of section types implemented
    - design_notes: 2-3 sentences on implementation choices

enhance_animations:
  description: >
    Enhance HTML with animations MATCHED TO CREATIVE DIRECTION from context.
    Adapt animation energy to the visual_intensity level.

    ## Creative Direction (FROM CONTEXT)
    Visual intensity determines animation energy:
    - whisper = minimal/almost static
    - conversational = subtle
    - statement = dynamic
    - shout = bold, motion-rich

    ## Animation Personality (FROM VISUAL DESIGN SPEC)
    The Visual Designer has specified animation_personality:
    - playful = bouncy easing, stagger effects, energetic
    - professional = smooth, minimal, refined
    - dramatic = slow reveals, scale effects
    - technical = precise, fast, functional

    Match your timing, easing, and effects to this personality.

    ## Technical
    - CSS @keyframes in <style> block
    - Tailwind animation utilities
    - IntersectionObserver for scroll reveals
    - Preserve ALL existing HTML structure and content

    CRITICAL: Match animation energy to visual_intensity.
    Never remove existing content or structure.

  expected_output: >
    AnimatedHTMLResult with:
    - html_content: Enhanced HTML with animations (<!DOCTYPE html> to </html>)
    - animations_added: List of animation types (page_load, scroll, hover, micro)
    - animation_notes: How animation energy matches visual_intensity

qa_review_html:
  description: >
    QA review against CREATIVE DIRECTION context, not hardcoded rules.
    Validate that implementation matches the creative decisions.

    ## Validation Approach
    The creative direction IS the specification. Check that the HTML implements:
    - heading_scale → appropriate headline sizes
    - section_density → appropriate spacing
    - hero_archetype → appropriate hero structure
    - visual_intensity → appropriate animation energy

    Don't enforce your own preferences over the creative direction.

    ## Universal Rules (always check)
    - Responsive: sm:/md:/lg: breakpoints, no overflow
    - Accessibility: touch targets min-h-[44px], readable contrast
    - HTML validity: proper nesting, closed tags

    ## Preservation (CRITICAL)
    - Never remove sections, text, or HTML elements
    - Never remove animations or transition classes
    - Preserve the creative direction's choices

    Score 0-100 based on creative direction compliance.
    passes_qa = True if score >= 80

  expected_output: >
    QAReviewResult with:
    - html_content: Refined HTML with fixes applied (<!DOCTYPE html> to </html>)
    - issues_found: List of QAIssue objects (only issues that contradict creative direction)
    - issues_fixed_count: Total fixes applied
    - quality_score: 0-100 based on creative direction compliance
    - passes_qa: True if score >= 80
    - review_notes: How implementation aligns with creative direction
