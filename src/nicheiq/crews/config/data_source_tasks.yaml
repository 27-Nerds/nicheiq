# DataSourceResearchCrew Task Configurations

discover_data_sources:
  description: >
    Search for and discover REAL data sources (APIs, databases, providers) needed for the solution.

    **Solution Context:**
    - Solution: {solution_name}
    - Description: {solution_description}
    - Core Features: {solution_features}
    - Requires Data Aggregation: {requires_data_aggregation}
    - Currently Identified Sources: {existing_data_sources}
    - Niche: {niche_description}

    **SEO Context:**
    {seo_priorities}

    **Competitive Context:**
    {competitive_data_notes}

    **RESEARCH WORKFLOW**: Apply your 3-Tier Verification Protocol:

    1. **Data Need Identification** → List specific data types solution requires from features
    2. **Search & Discovery** → Use SerperDevTool with domain/industry/platform query patterns
    3. **Verification** → API docs, pricing pages, public access confirmation
    4. **Documentation** → Provider, URL, access model, limits, coverage per discovery protocol
    5. **Alternatives** → Find 3-5 fallbacks per data need (APIs change/shut down)

    **DELIVERABLES**: 10-15 verified sources minimum with URLs. If no public API exists for
    a data type: "No public API found - alternatives: [web scraping, partnerships, manual curation]"

    **SEO PRIORITY FOCUS**: {seo_priorities}
    **COMPETITIVE INSIGHTS**: {competitive_data_notes}

  expected_output: >
    Comprehensive list of discovered data sources including:

    **Primary Sources** (3-7 sources):
    - Provider name
    - URL
    - Access model
    - Coverage/scope notes
    - Any pricing/limits mentioned

    **Alternative Sources** (3-5 sources):
    - Backup options if primary sources fail

    **Gaps Identified**:
    - Data needs with NO public APIs found
    - Suggested alternatives (scraping, partnerships, manual)

    Format as structured markdown with clear sections for each data type needed.

evaluate_data_sources:
  description: >
    Evaluate the discovered data sources for quality, feasibility, cost, and prioritization.

    **Solution Context:**
    - Solution: {solution_name}
    - SEO Priorities: {seo_priorities}
    - Competitive Notes: {competitive_data_notes}

    **Discovered Sources:**
    You have access to the data sources discovered in the previous task. Review the complete list of
    discovered APIs, providers, and data sources from the discovery phase.

    **Your Task:**

    For EACH discovered data source, apply your 5D Data Quality Matrix:

    | Dimension | Evaluation Criteria |
    |-----------|---------------------|
    | **Coverage** | Market % covered, geographic limitations, completeness ("80% have pricing"), included vs excluded |
    | **Freshness** | Update frequency (real-time/hourly/daily/weekly/monthly), staleness acceptability for use case |
    | **Integration Complexity** | LOW (documented REST API, libraries, examples), MEDIUM (limited docs, strict limits), HIGH (scraping, JS rendering, CAPTCHAs) |
    | **Cost** | Free tier limits, paid pricing, MVP cost (1k-10k users), growth cost (100k+), unit economics viability |
    | **Quality** | Accuracy/reliability, known issues, schema consistency, error handling needs |

    **Prioritization Framework:**

    | Priority | Criteria |
    |----------|----------|
    | **HIGH** | High-traffic SEO keywords + high-severity pain points + competitive advantage + good coverage + reasonable cost + low complexity |
    | **MEDIUM** | Nice-to-have for secondary features + medium SEO value + higher cost but feasible + medium complexity |
    | **LOW** | Low SEO value + low-priority pain points + high cost/complexity + can defer to post-MVP |

    **Risk Assessment** (identify for each source):
    • Provider shutdown/ToS changes • Incomplete/stale data • Cost spikes at scale
    • Rate limit constraints • Legal/compliance issues (ToS violations, data privacy)

  expected_output: >
    SourceEvaluationReport Pydantic model with:

    **high_priority_sources**: List[EvaluatedDataSource] (1-3 sources)
    Each EvaluatedDataSource contains:
    - provider: Provider name
    - url: API documentation URL (Optional)
    - priority: "HIGH"
    - priority_rationale: Why HIGH priority (links to SEO keywords, pain points, competitive advantage)
    - quality_metrics:
        - coverage_score: "80% market coverage" or similar description
        - freshness: "daily" or "weekly" or "real-time"
        - integration_complexity: "LOW", "MEDIUM", or "HIGH"
        - cost_viability: "FREE", "LOW", "MEDIUM", or "HIGH"
        - quality_assessment: Reliability notes and known issues
    - mvp_cost_estimate: "$0-100/mo" or similar (Optional)
    - scale_cost_estimate: "$500-1000/mo" or similar (Optional)
    - identified_risks: List of 2-4 specific risks
    - mitigation_strategies: List of mitigation approaches (Optional)

    **medium_priority_sources**: List[EvaluatedDataSource] (2-4 sources)
    [Same structure as high_priority_sources, but priority: "MEDIUM"]

    **low_priority_sources**: List[EvaluatedDataSource]
    [Same structure as high_priority_sources, but priority: "LOW"]

    **overall_data_quality_risk**: String narrative assessing overall data landscape risks

    **critical_blockers**: List[str] of risks that could block launch (e.g., "Insufficient coverage for MVP", "All sources require expensive partnerships")

    **evaluation_summary**: 2-3 sentence summary of evaluation findings

    CRITICAL: Return valid SourceEvaluationReport Pydantic object with ALL fields populated.
    DO NOT return markdown text or a description of what the report should contain.
    Every priority_rationale MUST link to specific SEO keywords or pain points from the solution context.

create_data_roadmap:
  description: >
    ═══ TASK 3: IMPLEMENTATION PLANNING ═══
    ✓ Generate ONLY implementation planning fields (Python will merge with Task 2)
    ✓ Focus on phased roadmap, costs, partnerships, and strategic alignment
    ✓ DO NOT copy evaluation data—reference Task 2 context for source details

    **Solution:** {solution_name}

    **HOW TO ACCESS CONTEXT:**

    Task 2 output (SourceEvaluationReport) is available in your context. Extract:
    - From Task 2: high_priority_sources, medium_priority_sources (for roadmap phase planning)
    - From Task 2: quality_metrics (integration_complexity, cost_viability) for phase sequencing
    - DO NOT copy source_evaluation field—Python will preserve it automatically

    **YOUR TASK: Generate Implementation Plan**

    Create a phased implementation plan for data integration:

    **Phase 1: MVP Data Sources (Months 1-3)**
    - Which 1-3 data sources are ESSENTIAL for launch?
    - Focus on: high priority, low complexity, low/free cost
    - Goal: Minimum viable data coverage to validate product

    **Phase 2: Growth Data Sources (Months 4-6)**
    - Which 2-3 sources expand coverage or quality?
    - May include paid sources if revenue supports it
    - Goal: Improve data completeness and freshness

    **Phase 3: Premium Data Sources (Months 6-12)**
    - Which sources enable premium features?
    - Higher cost or complexity sources
    - Goal: Differentiation and premium tiers

    **Fallback Strategies:**

    For each critical data source, document:
    - What happens if this source becomes unavailable?
    - Fallback option #1 (alternative API)
    - Fallback option #2 (web scraping)
    - Fallback option #3 (manual curation or user-generated)

    **Cost Projection:**

    Estimate total monthly data costs:
    - MVP (1k users): $X-Y/month
    - Growth (10k users): $X-Y/month
    - Scale (100k users): $X-Y/month

    Check unit economics: cost per user should be < 10-20% of revenue per user.

    **SEO Alignment:**

    Connect data capabilities to SEO priorities:
    - "Real-time job listings enable 'remote jobs' content (15k searches/mo)"
    - "Salary data supports 'developer salary' keywords (8k searches/mo)"

    **Competitive Insights:**

    Compare to competitors:
    - What data do competitors access that we can't?
    - What data can we access that gives us an advantage?
    - Where are we at parity vs differentiated?

    **Data Partnerships:**

    If critical data requires partnerships:
    - Who to partner with?
    - Effort estimate: LOW, MEDIUM, HIGH
    - Timeline: 1-2 months, 3-6 months, 6-12 months
    - Alternative if partnership fails

    **Output as DataImplementationPlan Pydantic model.**

  expected_output: >
    DataImplementationPlan Pydantic model with implementation fields ONLY:

    **implementation_phases**: List[RoadmapPhase] (3 phases)
    Phase 1 (MVP - Months 1-3):
    - phase_number: 1
    - phase_name: "MVP"
    - timeline: "Months 1-3"
    - goal: "Minimum viable data coverage to validate product"
    - data_sources: [List provider names from high_priority_sources]
    - estimated_monthly_cost: "$X-Y"
    - key_milestones: ["Integrate API X", "Validate data quality", "Set up caching"]
    - fallback_strategies: ["If X fails, use Y", "Manual curation fallback"]

    Phase 2 (Growth - Months 4-6):
    - phase_number: 2
    - phase_name: "Growth"
    - timeline: "Months 4-6"
    - goal: "Improve data completeness and freshness"
    - data_sources: [List provider names from medium_priority_sources]
    - estimated_monthly_cost: "$X-Y"
    - key_milestones: [List 2-3 milestones]
    - fallback_strategies: [List 2-3 fallback options]

    Phase 3 (Scale - Months 6-12):
    - phase_number: 3
    - phase_name: "Scale"
    - timeline: "Months 6-12"
    - goal: "Differentiation and premium features"
    - data_sources: [List premium sources]
    - estimated_monthly_cost: "$X-Y"
    - key_milestones: [List 2-3 milestones]
    - fallback_strategies: [List 2-3 fallback options]

    **data_partnerships_needed**: Optional[List[DataPartnership]] (if applicable)
    - partner_type, description, effort_estimate, timeline, notes

    **estimated_monthly_cost**: String (e.g., "$250-500/month for 10k users")

    **implementation_roadmap**: String (2-3 paragraphs describing phased approach to data integration)

    **competitive_data_insights**: Optional[String] (how our data access compares to competitors)

    **seo_aligned_priorities**: Optional[String] (how data sources support high-traffic keywords)

    NOTE: Python will merge this with Task 2 evaluation data. Focus on creating comprehensive implementation plan.
