# Traffic Monetization Crew - Task Configuration
# Stage 8: For directories, aggregators, and comparison tools

traffic_monetization_analysis:
  description: >
    Analyze traffic monetization strategy for: **{solution_name}**

    **Solution Type:** {project_type} (traffic-focused, not subscription SaaS)
    **Access Model:** {access_model}
    **Value Capture Mode:** {value_capture_mode}
    **Payer:** {payer}
    **Solution Description:** {solution_description}
    **Niche:** {niche_description}

    ## Available Data for Traffic Estimation

    **Keyword Validation Results:**
    {keyword_data}

    **Competitor Landscape:**
    {competitor_analysis}

    ## Pre-Computed Estimates (from Python -- treat as facts)

    **Traffic Projection:**
    {traffic_projection}

    **Suggested CPM:** {suggested_cpm}
    **Pre-Computed Ad Revenue Estimate:** {ad_revenue_estimate}

    Use these pre-computed values as fixed inputs. Your numeric route fields are hypotheses for the
    structured response only: deterministic post-computation will replace or clear them. Never treat
    a price, program, conversion rate, or revenue figure that you authored as evidence.

    ## SEO-Enriched Traffic Intelligence
    {seo_enrichment}

    IMPORTANT: If SEO enrichment data is provided above, your traffic projections are CONSTRAINED:
    - Year 1 monthly organic traffic MUST NOT exceed the Traffic Ceiling Y1 value
    - For each projection, CITE the ceiling value and explain why your estimate is at or below it
    - If no SEO data is available, clearly state this and label projections as [UNCONSTRAINED ESTIMATE]

    MONETIZATION DECISION RULES FOR NARROW B2B (evaluate top-to-bottom):
    1. Lead generation, paid placements, or an acquisition-to-paid-upgrade funnel comes first when a real
       downstream payer and qualified action exist. Name the payer and funnel target. A value per
       action qualifies only when the supplied competitor landscape attributes it to this exact
       candidate with a source URL and compatible billing basis.
    2. Affiliate is eligible only when you identify a real program for this exact niche. An empty
       program list means affiliate is not viable; never infer it from commercial intent alone.
    3. Display ads are eligible only when the pre-computed revenue is meaningful at projected
       candidate-relevant traffic. A positive but tiny CPM result is not a viable business.
    4. If none of those routes clears its evidence requirement, return viability_verdict=nonviable.
    The deterministic post-computation may downgrade your verdict and cannot be overridden by prose.

    PHASED RAMP-UP:
    - IF pre-computed projections include a phased breakdown above → USE THEM DIRECTLY
    - Describe the milestone timeline for each phase (cite tier data from enrichment)
    - Do NOT invent your own monthly curves or recalculate per-phase traffic
    - Do NOT use a single flat annual estimate — anchor to the tier-based phases

    ## Your Analysis Framework

    ### Step 1: Estimate Traffic Potential

    ASSERT: Pre-computed traffic projection is provided above as {traffic_projection}.
    Your Year 1 monthly organic traffic MUST NOT exceed the Traffic Ceiling Y1 value.
    Do NOT recalculate traffic using CTR formulas — the pre-computed values already account for
    keyword difficulty, position-based CTR, and ranking probability.

    Focus your analysis on:
    - What these traffic levels mean for this specific niche
    - Competitive risks to achieving the ceiling
    - Realistic timeline to reach steady state
    - Factors that might cause under-performance vs. ceiling

    ### Step 2: Determine Viable Monetization Channels

    **Traffic Thresholds by Ad Network:**
    | Network | Min Traffic | Typical RPM |
    |---------|-------------|-------------|
    | Google AdSense | Any | $1-5 |
    | Ezoic | 10,000/month | $5-15 |
    | Mediavine | 50,000/month | $15-30 |
    | AdThrive | 100,000/month | $20-40 |
    | Affiliate | Any (intent matters) | Varies |
    | Sponsored Listings | B2B relevant | $50-500/mo |
    | Lead Gen | B2B service niches | $10-100/lead |

    **Niche CPM Benchmarks:**
    | Vertical | Typical CPM |
    |----------|-------------|
    | Finance/Insurance | $15-40 |
    | Legal | $10-25 |
    | Health | $8-20 |
    | Technology/SaaS | $5-15 |
    | Lifestyle/Beauty | $3-10 |
    | Entertainment | $2-5 |
    | General | $2-8 |

    Match the niche to appropriate CPM range.

    ### Step 3: Affiliate Program Analysis

    For aggregators/comparison sites, affiliate revenue often exceeds ad revenue.

    Consider:
    - What products/services does this niche involve?
    - What's the typical order value?
    - Available affiliate programs and commission rates
    - Purchase intent of the traffic (informational vs transactional)

    **Common Affiliate Commission Rates:**
    - Amazon Associates: 1-10% (category dependent)
    - Software/SaaS referrals: 20-50% recurring
    - Financial products: $50-200 per signup
    - Travel: 3-8% of booking
    - Insurance leads: $20-100 per quote
    - Hosting/domains: $50-200 per signup

    ### Step 4: B2B Monetization (if applicable)

    If the directory lists businesses/services, price each of these from what comparable directories
    in THIS niche actually charge (the Step 2 table gives the outer bands to stay inside):
    - Sponsored listings
    - Featured placements
    - Lead generation (per qualified lead)
    - Premium verified badges

    ### Step 5: Revenue Projection

    Calculate monthly revenue range and, where applicable, funnel value:
    ```
    Ad Revenue = (Monthly Pageviews × CPM) / 1000
    Affiliate Revenue = Pageviews × Click Rate × Conversion Rate × Avg Order × Commission
    B2B Revenue = # Listings × Monthly Fee
    Funnel Value = Qualified Actions × Value Per Qualified Action
    ```

    Apply these formulas to THIS niche's actual projected pageviews and its real CPM (both provided
    below) — never to the round numbers in an illustration. The shape is: Ads = pageviews × niche CPM /
    1000; Affiliate = pageviews × CTR × conversion × avg order × commission.

    Pre-Computed Revenue Estimates:
    - Ad Revenue: {ad_revenue_estimate}
    - Affiliate Revenue: {affiliate_revenue_estimate}
    - Total Estimated Revenue: {total_revenue_estimate}
    Use these only to explain the channel context. Do not upgrade route viability or invent unit
    economics from them; code will own the final totals and verdict.

    Provide conservative (Year 1) and optimistic (Year 2+) projections.

    ### Step 6: Scaling Strategy

    How revenue scales with traffic growth — quantify each step from THIS niche's CPM band and its
    projected pageviews, never from a round illustration:
    - Crossing an ad-network traffic threshold (Step 2 table) moves RPM into that network's band
    - Higher traffic unlocks premium/direct ad deals
    - Affiliate placement optimization and A/B testing
    - A B2B sponsored tier adds predictable recurring revenue

    ### Step 7: SaaS Alternative Assessment

    Briefly assess whether a SaaS/subscription model could also work:
    - Does the niche have recurring usage patterns?
    - Would users pay for premium features?
    - Is traffic monetization the better path for this specific solution?

  expected_output: >
    A comprehensive TrafficMonetizationResult with ALL required fields:

    All figures below are FORMAT placeholders — derive every number from THIS niche's real traffic
    projection, CPM, and the pre-computed estimates above; never copy an illustration's magnitude.

    1. **Traffic Projections**: Realistic monthly pageview estimates (Year 1) based on keyword data
       - estimated_monthly_pageviews: Range, format "<low> - <high>"
       - traffic_source_breakdown: Dict showing organic/direct/referral percentages

    2. **Ad Revenue Analysis**:
       - estimated_cpm_rate: Niche-appropriate CPM with explanation, format "$<low>-<high> CPM (<niche> vertical)"
       - estimated_monthly_ad_revenue: Range, format "$<low> - $<high>"
       - recommended_ad_networks: List based on traffic tier (e.g., ["Google AdSense"])

    3. **Affiliate Revenue Analysis**:
       - affiliate_commission_rate: Typical rates for niche, format "<low>-<high>%"
       - estimated_affiliate_ctr: Click-through rate estimate, format "<low>-<high>% of pageviews"
       - estimated_monthly_affiliate_revenue: Range, format "$<low> - $<high>"
       - recommended_affiliate_programs: List of up to 5 REAL, relevant programs.
         An empty list is valid and preferred over invented programs — do NOT
         fabricate affiliate programs for niches where none realistically exist.

    4. **B2B Options** (if applicable):
       - sponsored_listing_price: Suggested price, format "$<price>/month"
       - premium_placement_price: Featured placement price, format "$<price>/month"
       - lead_gen_price_per_lead: If B2B service niche, format "$<low>-<high>"

    5. **Total Revenue Projection**:
       - estimated_monthly_revenue_range: Combined total, format "$<low> - $<high>"
       - estimated_annual_revenue_range: Annualized, format "$<low> - $<high>"
       - break_even_traffic_threshold: Min traffic to cover costs, format "<N> monthly pageviews"

    6. **Strategy**:
       - monetization_model: Select the schema's funnel enum for an acquisition-to-paid-upgrade
         route; otherwise use the matching ad, affiliate, hybrid, or lead-generation enum
       - monetization_rationale: 2-3 sentences explaining the recommended mix
       - scaling_strategy: How to grow revenue as traffic increases
       - monetization_confidence: "High", "Medium", or "Low"
       - viability_verdict: "viable", "conditional", or "nonviable"
       - funnel_target: Optional paid downstream offer/action
       - qualified_actions: Optional monthly qualified-action range
       - conversion_assumptions: Optional list of explicit conversion assumptions
       - estimated_funnel_value: Optional monthly value range

    7. **SaaS Comparison**:
       - saas_alternative_viable: Boolean (true/false)
       - saas_vs_traffic_recommendation: Brief recommendation with rationale

    Be realistic about early-stage traffic projections. Most new sites take 6-12 months
    to reach meaningful traffic levels. Base estimates on achievable Year 1 targets.
  agent: traffic_monetization_analyst
