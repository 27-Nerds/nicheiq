trend_longevity_analysis:
  description: >
    Analyze market positioning for the {niche_description} market.

    **PRE-COMPUTED QUANTITATIVE SIGNALS (from Python — treat as facts):**
    - Keyword Volume Trend: {keyword_volume_trend}
    - Momentum Score: {momentum_score} (0-1 scale; banded piecewise-linear
      interpolation over the rising-volume percentage, winsorized to
      [0.10, 0.95]. >0.7 = strong growth, 0.4-0.6 = stable, <0.3 = declining)
    - Trend Direction: {trend_direction} (Confidence: {trend_confidence})
    - Seasonal Pattern: {seasonal_pattern}
    - Discussion Recency: {discussion_recency}
    - Discussion Activity: {discussion_frequency_trend} (based on post
      recency, not posting frequency)
    - Suggested Longevity Verdict: {suggested_longevity_verdict}

    NOTE: Discussion Data includes quality metrics (comment counts, rich
    discussion counts). Weight high-comment discussions more heavily when
    assessing community engagement and trend sustainability.

    Market size: {total_keyword_volume:,} monthly searches across
    {validated_keyword_count} keywords. {discussion_count} discussions.
    {competitor_count} competitors.

    **YOUR TASK — provide expert judgment for these fields:**

    1. **market_maturity** ("Emerging" / "Growth" / "Mature")
       - Emerging: few competitors (<5), limited discussion history, new tech
       - Growth: increasing competitors, active discussions, rising volume
       - Mature: established competitors, stable discussions, saturated volume

    2. **longevity_verdict** ("Sustainable" / "Risky" / "Fad")
       Suggested: {suggested_longevity_verdict}. Confirm or override.

       Assessment framework:
       - **Sustainable**: Solves a real, recurring problem. Steady or growing
         search demand over 2+ years. High evergreen keyword ratio. Multiple
         competitors validating market viability.
       - **Risky**: Rapid adoption but uncertain staying power. Search volume
         concentrated in few keywords. Limited problem validation. May be
         driven by hype rather than genuine need.
       - **Fad**: Novelty-driven demand without underlying utility (like a
         viral product with no repeat use case). Characterized by: spike
         then rapid decline in discussions, zero or very low pain point
         count, consumer interest driven by scarcity/novelty not need.

       Rules: 2+ years steady growth → Sustainable. <12 months of data with
       spike pattern → Risky. Clear novelty-driven spike + declining → Fad.
       5+ years stable → Sustainable.

    3. **longevity_rationale**: 2-3 sentences with SPECIFIC data citations.
       Reference the pre-computed signals AND raw data. Example: "Sustainable
       because momentum score of 0.72 indicates 72% of search volume is in
       growing keywords, with Increasing keyword volume, and
       Recent discussion activity. Competitive data shows N
       active competitors validating market demand..."

    NOTE: new_entrants_trend, competitive_activity_level, and
    volume_growth_rate are now computed deterministically in Python from the
    competitor counts and monthly keyword series — do NOT estimate them.

    4. **trend_duration**: "2+ years growth", "6 months spike", etc.
       Infer from discussion dates and keyword trend patterns.

    5. **peak_periods**: ["Q4", "November-December"] or null if not seasonal.
       Only if seasonal_pattern is "Strong Seasonal" or "Mild Seasonal".

    6. **community_growth_indicators**: 3-5 signals with stage citations.
       Format: "[Signal] - Source: [data section] showing [metric]"
       ONLY cite data visible in the RAW DATA sections above: keyword data
       (volumes, trends, evergreen/seasonal keywords), discussion data
       (post counts, timestamps, pain point count/mentions), and competitive
       data (competitor count, market gaps).
       High-comment discussions (20+ comments) are stronger community
       engagement signals than post count alone. Reference discussion
       quality metrics when citing community growth evidence.
       FORBIDDEN: Discord, Slack, subreddit creation dates, funding, conferences.

    7. **trend_reversal_risks**: 3-5 risks with severity + evidence.
        Format: "[HIGH/MEDIUM/LOW] - [Risk] - Evidence: [metric from raw data]"
        Consider: technology shifts, regulatory changes, market saturation,
        dependence on single platform, declining search interest.

    **RAW DATA:**

    **Keyword Data:**
    {keyword_trend_data}

    **Discussion Data:**
    {discussion_trend_data}

    **Competitive Data:**
    {competitive_momentum_data}

    **ANTI-HALLUCINATION:**
    - Every claim must reference specific data from the RAW DATA sections above
    - Never fabricate data not in inputs
    - Use "Insufficient data" when data missing
    - Never reference Discord, Slack, subreddit creation dates, funding rounds

  expected_output: >
    A TrendNarrativeOutput with all fields populated based on the raw data
    and pre-computed signals provided. Every narrative claim must reference
    specific data from the keyword, discussion, or competitive data sections.
