# CompetitiveCrew Tasks

research_competitors:
  description: >
    Research competitors for each of the {solution_count} solution concepts provided below.

    # Solution Concepts for Competitive Research

    **Number of Solutions:** {solution_count}

    **Market Insights:**
    {market_insights}

    **Recommended Focus:**
    {recommended_solution}

    ## Solution Details:
    {solutions_list}

    ═══════════════════════════════════════════════════════════════════════════

    **Objective:**
    For each solution above, identify 2-3 primary competitors and 1-2 alternative solutions.
    Use search tools to research products, pricing, features, and customer feedback.

    **Research Strategy:**

    1. **Primary Research (SerperDevTool):**
       - Search for direct competitors using web search
       - Find official product pages, pricing, and feature lists
       - Look for reviews, comparisons, and market analyses

    2. **User Intelligence (Optional Knowledge Sources):**
       - If available, you have access to user discussions mentioning existing tools
       - Query knowledge sources for: "What tools do users currently use?"
       - Search for user mentions of competitors, alternatives, and switching behavior
       - Find pricing complaints, feature gaps, and user sentiment
       - Use queries like: "alternative to", "switched from", "using", "compared to"

    3. **Synthesis:**
       - Combine official product data with real user intelligence
       - Identify gaps between marketing claims and user experiences
       - Note what users actually say about existing solutions

    **Key Deliverables per Competitor:**
    - Product name, website, and description
    - 3-5 core features and capabilities
    - Pricing model and price points
    - 2-3 strengths (what users like - cite sources if from user discussions)
    - 2-3 weaknesses (what users complain about - cite user quotes if available)
    - Market positioning (target audience, key messaging)


    **CRITICAL DATA ACCURACY RULES:**

    - ONLY report competitors you discover via SerperDevTool web searches OR knowledge source queries
    - If SerperDevTool search returns no relevant results for a solution, you MUST state "No direct competitors found via search"
    - DO NOT invent competitor names, products, or features based on assumptions about what might exist in the market
    - Every competitor name MUST be verified with a real website or source - if you cannot find a website, mark as [UNVERIFIED]
    - Pricing information MUST come from actual search results or official sources - if not found, state "Pricing not publicly available"
    - User feedback (strengths/weaknesses) MUST be cited with sources - either URLs from search or platform mentions from knowledge sources
    - If knowledge sources are empty or return no results about existing tools, state "No user discussions about existing tools available"
    - Acceptable output: "Competitive research inconclusive - insufficient search results" for solutions where you cannot find verified competitors
    - DO NOT fill gaps with generic competitors you think might compete in this space - ONLY verified findings


  expected_output: >
    Markdown report with competitor profiles for each solution:

    **For each solution:**

    1. **Solution Name**

    2. **Competitive Landscape Summary** (2-3 sentences)

    3. **Direct Competitors** (2-3 companies):
       - Name, website
       - Core features (3-5 bullets)
       - Pricing model
       - Strengths (2-3 points)
       - Weaknesses (2-3 points)
       - Target audience

    4. **Alternative Solutions** (1-2 options)

    5. **Customer Sentiment** (2-3 sentences on what users say about existing tools)

    6. **Market Gaps** (2-3 observations about unmet needs)

    Format: Well-organized markdown. Length: 1000-1500 words per solution.

analyze_competitive_landscape:
  description: >
    Analyze the competitive research from the previous task to identify market gaps,
    differentiation opportunities, and strategic positioning for each solution.

    **CRITICAL - Solution Name Preservation:**
    When creating CompetitiveLandscape objects, you MUST use the EXACT solution names
    from the research task above. DO NOT rename, rephrase, or modify solution names.
    For example, if the research task analyzed "HomeRelay", your output MUST use
    solution_name="HomeRelay", NOT "CareBridge Enterprise Mobility Management" or any other variation.

    **Objective:**
    For each solution researched, identify market gaps, differentiation strategies,
    competitive intensity, and positioning recommendations based on the competitor
    data from the previous task.

    **Analysis Approach:**

    1. **Synthesize Research Findings:**
       - Review competitor profiles from previous task
       - If knowledge sources were used, note user sentiment insights
       - Identify patterns in competitor strengths and weaknesses

    2. **Identify Market Gaps:**
       - Where do existing solutions fall short?
       - What do users complain about? (from user discussions if available)
       - What features/approaches are missing from the market?

    3. **Assess Competitive Intensity:**
       - How crowded is this market?
       - Are competitors well-funded and established?
       - How difficult is it to differentiate?

    **Key Analysis Areas:**
    - Market gaps (unmet needs, underserved segments, user complaints)
    - Differentiation opportunities (features, pricing, positioning, user experience)
    - Competitive intensity assessment (Low/Medium/High with justification)
    - Strategic positioning recommendations (based on gaps and user needs)

  expected_output: >
    CompetitiveAnalysisResult Pydantic model:

    **solution_landscapes** (List[CompetitiveLandscape]): For each solution:
    - **solution_name** - CRITICAL: MUST be EXACTLY the same name as provided in the research task input (e.g., if input was "HomeRelay", output MUST be "HomeRelay", NOT "CareBridge Enterprise Mobility Management" or any variation). DO NOT rename, rephrase, or modify the solution name.
    - competitors (List[Competitor])
    - market_gaps (3-5 unmet needs)
    - differentiation_opportunities (3-5 ways to differentiate)
    - competitive_intensity ("Low"/"Medium"/"High" with 1-2 sentence justification)
    - recommended_positioning (2-3 sentence strategy)
    - pricing_insights (market pricing analysis)

    **top_opportunities** (List[str]): 3-5 top differentiation opportunities across all solutions

    **strategic_recommendations**: 4-5 sentence executive summary covering competitive
    landscape assessment, which solutions have clearest advantage, and key strategic insights
