pricing_strategy_analysis:
  description: >
    **CRITICAL RULES:**
    1. MANDATORY: All pricing fields (starter_price, pro_price, arpu, ltv) must be specific dollar amounts, NOT ranges
    2. MANDATORY: LTV/CAC ratio must be >=2:1 for subscription models (viable business model requirement)
    3. MANDATORY: Pricing must NOT contradict pain point WTP signals
    4. MANDATORY: Include ALL fields in PricingStrategyResult - no null values except enterprise_price and free_tier_features


    Analyze competitor pricing, pain point willingness-to-pay scores, and solution positioning
    to determine the optimal monetization strategy for **{solution_name}** in the {niche_description} market.


    **SOLUTION CONTEXT:**

    **Solution:** {solution_name}

    **Description:** {solution_description}

    **Project Type:** {project_type}

    **Value Proposition:** {value_proposition}

    **Features:**
    {solution_features}

    **Target Personas:**
    {target_personas}

    **Market Fit Score:** {market_fit_score}/1.0

    **Project Type Constraints:** {allowed_project_types}


    **COMPETITIVE LANDSCAPE:**
    {competitor_pricing}

    **Competitive Intensity:** {competitive_intensity}


    **MARKET REALITY (Phase-1 web-verified; deepen, do not re-discover):**
    {market_brief}
    {market_incumbent_table}
    {market_wallet_line}


    **MARKET SIZING & GROWTH:**
    {market_sizing_summary}


    **AUDIENCE BUDGET SENSITIVITY:**
    {audience_budget_sensitivity}


    **SOLUTION RANKING:**
    {solution_rank_context}


    **PAIN POINT WILLINGNESS-TO-PAY (WTP) SCORES:**
    {wtp_scores}


    **PRE-COMPUTED WTP ANALYSIS (from Python -- treat as facts):**
    - {wtp_summary}
    - Average WTP Score: {avg_wtp}
    - Suggested CAC Range: {suggested_cac_range}


    **YOUR TASK:**

    Conduct comprehensive monetization analysis following these steps:

    ### 1. Competitive Pricing Analysis
    - Analyze competitor pricing tiers and monetization models
    - Identify median pricing for similar solutions
    - Determine pricing distribution (low/mid/high segments)
    - Identify pricing gaps and opportunities
    - Note which competitors use ad/affiliate vs subscription models

    ### 2. Value-Based Pricing Calculation
    - Map solution features to pain points addressed
    - Correlate pain point severity and WTP scores to pricing
    - Calculate value-weighted pricing recommendation
    - Justify pricing based on differentiation score
    - Factor in competitive intensity (blue ocean = premium potential; red ocean = aggressive pricing)

    ### 3. Monetization Model Recommendation

    **MONETIZATION MODEL DIVERSITY — Consider ALL viable models:**

    | Model | Consider when | Context Factors |
    |-------|---------------|-----------------|
    | **Freemium (3-tier)** | WTP 0.6+, clear feature differentiation | B2B audiences, low budget sensitivity, strong competitive advantages |
    | **Freemium-Lite (2-tier)** | Moderate WTP, simple feature set | Solo devs/freelancers, moderate budget sensitivity |
    | **Pure Subscription** | B2B focus, no free tier viable | Enterprise personas, low budget sensitivity, high switching costs |
    | **Usage-Based** | API/tool with variable consumption | Developer audiences, consumption varies widely by user |
    | **One-Time Purchase** | Tools, templates, digital products | Price-sensitive audiences, clear deliverable boundaries |
    | **Ad-Supported-Free** | High traffic potential, directory/aggregator project type | Consumer audiences, high budget sensitivity, SEO-driven discovery |
    | **Affiliate-Only** | Purchase-intent traffic, product comparisons | Comparison-tools, high commercial intent keywords |
    | **Hybrid (Freemium + Ads)** | Mixed WTP signals, tool with broad + niche audiences | Free tier monetized by ads, paid tier for power users |

    **WTP → PRICE-RANGE ANCHOR (paid tiers; align with the WTP scores above, not a guess):**
    | Avg WTP | Indicative paid entry (B2C / prosumer) | B2B / professional |
    |---|---|---|
    | 0.7-1.0 | $15-40/mo | $50-200+/mo |
    | 0.45-0.7 | $7-15/mo | $20-60/mo |
    | 0.25-0.45 | $3-9/mo or free+ads | freemium, paid $15-40/mo |
    | < 0.25 | free (ads/affiliate), no paid tier expected | lead-gen / free |
    Adjust within a band for competitor pricing + project type. A paid tier far above the WTP band fails validation.

    **DO NOT default to 3-tier Freemium.** Match model to:
    1. WTP signals from pain point analysis (low WTP favors ad/affiliate/free models)
    2. Project type: {project_type} (SaaS vs directory vs tool vs aggregator vs comparison-tool)
    3. Target audience budget sensitivity and purchasing behavior
    4. Competitive landscape pricing models and intensity
    5. Market size (larger TAM supports lower per-user revenue models)

    **For directories/aggregators/comparison-tools:**
    - PREFER Ad-Supported-Free, Affiliate-Only, or Hybrid models
    - These can be 100% FREE to users with SEO-driven traffic monetization
    - Example: "Free tool monetized by display ads (target: $5-15 CPM) and affiliate links"

    - Evaluate best monetization model based on the table above
    - Consider market standards and customer acquisition strategy
    - Only recommend tier structure (Free/Starter/Pro/Enterprise) if subscription model is appropriate
    - Define features per tier to drive upgrades (if subscription model)

    ### 4. Business Model Viability Validation

    **For Subscription Models (Freemium, Freemium-Lite, Subscription, Hybrid paid tier):**
    - Estimate ARPU (Average Revenue Per User) based on tier mix
    - Calculate LTV estimate (12-30 month retention scenarios)
    - Estimate organic CAC from market_fit_score (higher fit = lower CAC)
    - Validate LTV/CAC ratio is healthy (target 3:1; mandatory minimum 2:1)

    **For Traffic-Based Models (Ad-Supported-Free, Affiliate-Only):**
    - Estimate monthly pageviews needed for target revenue
    - Calculate RPM (Revenue Per Mille) based on niche CPM rates
    - For affiliate: Estimate CTR, conversion rate, and average commission
    - Validate traffic estimates against keyword demand and market size
    - Calculate breakeven pageview threshold

    **For One-Time Purchase / Usage-Based:**
    - Estimate average purchase value or monthly usage
    - Calculate breakeven customer count
    - Validate against market size (SOM) for achievability

    ### 5. Competitive Positioning
    - Position pricing relative to competitors (premium/value/discount)
    - Quantify value proposition delta (e.g., "15% more features at 20% lower price")
    - Determine confidence level (High/Medium/Low) based on data quality

    ### 6. WTP Validation (CRITICAL)
    - Validate recommended monetization model against pain point WTP scores
    - Use the WTP-to-Model Translation Guide below
    - Flag any discrepancies between market pricing and WTP data

    **WTP-to-Model Translation Guide:**

    | Average WTP Score | Price Tolerance | Consider when choosing model |
    |-------------------|-----------------|-------------------------------|
    | 0.70 - 1.00 | Premium (+20-40% vs median) | Strong subscription fit; users actively seek solutions and are less price sensitive. But verify audience budget sensitivity — enterprise vs consumer matters. |
    | 0.50 - 0.69 | Market Rate (+-10% of median) | Subscription viable at competitive rates; feature differentiation drives upgrades. Consider freemium to capture broader market. |
    | 0.30 - 0.49 | Discount (-20-40% vs median) | Freemium-lite or aggressive free tier; subscription possible but pricing must be compelling. Hybrid (free + ads) may capture more value. |
    | 0.00 - 0.29 | Free/Near-Free | Ad-supported, affiliate, or data play most natural. Subscription unlikely unless strong niche lock-in exists. Low WTP is a signal FOR traffic monetization, not against viability. |

    **VALIDATION RULE:** If recommended_starter_price exceeds the WTP-implied ceiling, REDUCE price or JUSTIFY premium positioning.

    **Reasoning shape: Subscription Model (High WTP)** — derive every number from the ACTUAL inputs:
    - Start from the real competitor median price.
    - Read the WTP band (e.g. Market Rate tolerance) → pick the price posture from the WTP→price table above.
    - Implied range ≈ competitor median ±10%.
    - Set Starter at/below the range (acquisition-friendly); Pro above the range (must justify differentiation).

    **Reasoning shape: Ad-Supported Free Tool (Low WTP)** — derive every number from the ACTUAL inputs:
    - Low WTP band (Free/Near-Free) → ad/affiliate model.
    - Revenue ≈ estimated monthly pageviews × the niche's real CPM (see the CPM-by-industry table below) / 1000.
    - Affiliate ≈ pageviews × CTR × average commission. Use the niche's real figures, not placeholders.


    **SaaS PRICING GUIDELINES (use only when subscription model is chosen):**

    **Starter Tier:**
    - Price 15-25% below market median for customer acquisition
    - Include core features that solve primary pain points
    - Designed for individual users or small teams

    **Pro Tier:**
    - Price at or slightly below market median
    - Include advanced features and integrations
    - Target professional users and growing teams
    - Should represent 40-60% of revenue mix

    **Enterprise Tier (if applicable):**
    - Premium pricing (2-4x Pro tier)
    - Includes white-label, custom integrations, SLA
    - For large organizations with specific requirements


    **AD/AFFILIATE MONETIZATION GUIDELINES (use when traffic-based model is chosen):**

    **CPM Ranges by Niche:**
    - Finance/Insurance: $10-25 CPM
    - Technology/SaaS: $5-15 CPM
    - Health/Wellness: $5-12 CPM
    - Home Services: $6-12 CPM
    - Education: $4-10 CPM
    - General/Other: $3-8 CPM

    **Affiliate Commission Structures:**
    - SaaS referrals: 20-40% recurring or $50-200 one-time
    - E-commerce products: 3-10% per sale
    - Services/leads: $5-50 per qualified lead
    - Financial products: $25-150 per conversion

    **CTR Benchmarks:**
    - Display ads (banner): 0.3-0.8% CTR
    - In-content affiliate links: 2-5% CTR
    - Comparison table affiliate links: 5-12% CTR
    - Sponsored content: 1-3% CTR

    **Ad Network Progression:**
    - < 10K pageviews/mo: Google AdSense
    - 10K-50K pageviews/mo: Ezoic, Monumetric
    - 50K+ pageviews/mo: Mediavine, AdThrive
    - Niche-specific: Carbon Ads (developers), BuySellAds (tech)

    **Revenue Estimation Formula:**
    - Monthly ad revenue = (monthly_pageviews / 1000) x CPM_rate
    - Monthly affiliate revenue = monthly_visitors x CTR x conversion_rate x avg_commission
    - Total traffic revenue = ad_revenue + affiliate_revenue


    **ARPU ESTIMATION (adapt to chosen model):**
    - **3-tier Freemium**: Estimate tier distribution based on competitive analysis (typical: 60% Starter, 35% Pro, 5% Enterprise)
    - **2-tier Freemium-Lite**: Typically 80% free, 20% paid
    - **Pure Subscription**: 100% at subscription price
    - **Usage-Based**: Estimate average monthly usage from comparable tools
    - **Ad-Supported-Free**: RPM x estimated monthly pageviews / 1000 (use ARPU format like "$0.01-0.02 per pageview")
    - **Affiliate-Only**: CTR x conversion rate x average commission (use ARPU format like "$0.005-0.015 per visit")

    **LTV Calculation (subscription models):**
    - Conservative: 12 months retention x ARPU
    - Optimistic: 30 months retention x ARPU
    - Express as range: "$XXX - $XXX"

    **CAC Estimation:**
    - Organic/SEO-focused: $15-30 (market_fit_score > 0.75)
    - Mixed: $30-60 (market_fit_score 0.60-0.75)
    - Paid-heavy: $60-120 (market_fit_score < 0.60)

    **LTV/CAC Ratio (subscription models):**
    - Excellent: 10:1 or higher
    - Good: 3:1 to 10:1
    - Acceptable: 2:1 to 3:1 (the 2:1 floor is MANDATORY — below it, change pricing or acquisition strategy)
    - Target 3:1 or better

    SELF-VERIFICATION (required, internal): compute LTV (retention months × ARPU) and
    CAC, then ensure the `ltv_to_cac_ratio` you output equals LTV ÷ CAC and is >= 2:1.
    Do this silently — output ONLY the structured result (no reasoning text before the
    JSON); the ratio field must be consistent with the ltv and cac fields you emit.


    **WARNING — EXAMPLE NUMBERS ARE FABRICATED:** Every dollar amount, ratio,
    and percentage in the format list and EXAMPLE blocks below is invented for
    fictional products (PlumbingCostCalc, DevFlowTracker) in unrelated markets.
    They demonstrate FORMAT only. If any of these numbers — or trivially
    adjusted versions of them — appear in your output, validation rejects your
    answer. Every number you output must trace to THIS task's inputs: the
    competitive landscape data, the WTP scores, and the suggested CAC range.

    **EXPECTED OUTPUT FORMAT:**

    You MUST provide fields based on the chosen pricing model.

    **FOR SUBSCRIPTION MODELS (Freemium, Freemium-Lite, Subscription, Hybrid, One-time, Usage-Based):**

    - **solution_name:** {solution_name}
    - **recommended_starter_price:** format "$<starter>/month" — derive from the WTP band + competitor median; null for ad/affiliate models
    - **recommended_pro_price:** format "$<pro>/month" (null for ad/affiliate models)
    - **recommended_enterprise_price:** format "$<enterprise>/month" or null if not applicable
    - **pricing_model:** One of: "Freemium", "Freemium-Lite", "Subscription", "Hybrid", "One-time", "Usage-Based", "Ad-Supported-Free", "Affiliate-Only"
    - **pricing_rationale:** 2-3 sentences explaining why this monetization strategy
    - **free_tier_features:** Array of features (if freemium) or null
    - **starter_tier_features:** Array of 3-5 core features (null for ad/affiliate models)
    - **pro_tier_features:** Array of 5-8 advanced features (null for ad/affiliate models)
    - **estimated_arpu:** format "$<arpu>/month"
    - **estimated_ltv:** format "$<low> - $<high> (<N>-<M>mo retention)"
    - **ltv_to_cac_ratio:** format "<ratio>:1 (LTV $<ltv> ÷ CAC $<cac>)"
    - **price_vs_competitors:** e.g., "10% below median"
    - **value_proposition_delta:** e.g., "15% more features at 20% lower price"
    - **pricing_confidence:** "High", "Medium", or "Low"
    - **wtp_validation:** 1-2 sentences on how WTP scores support this pricing
    - **market_segment_pricing:** Dict of segment-specific pricing or null

    **FOR AD/AFFILIATE MODELS (Ad-Supported-Free, Affiliate-Only):**

    - **solution_name:** {solution_name}
    - **recommended_starter_price:** null (Free tool)
    - **recommended_pro_price:** null (Free tool)
    - **recommended_enterprise_price:** null
    - **pricing_model:** "Ad-Supported-Free" or "Affiliate-Only"
    - **pricing_rationale:** 2-3 sentences explaining traffic monetization strategy
    - **free_tier_features:** null (all features are free)
    - **starter_tier_features:** null (no tiers)
    - **pro_tier_features:** null (no tiers)
    - **estimated_monthly_ad_revenue:** format "$<low>-<high>/month at <N> pageviews" (computed from the niche's real CPM)
    - **estimated_monthly_affiliate_revenue:** format "$<low>-<high>/month at <CTR>% CTR"
    - **estimated_cpm_rate:** format "$<low>-<high> CPM" (from the CPM-by-industry table)
    - **recommended_ad_networks:** e.g., ["Google AdSense", "Ezoic", "Mediavine"]
    - **estimated_arpu:** format "$<arpu> per pageview" (revenue per user visit)
    - **estimated_ltv:** e.g., "N/A - traffic-based model"
    - **ltv_to_cac_ratio:** e.g., "N/A - SEO-driven traffic acquisition"
    - **price_vs_competitors:** e.g., "Free vs competitor freemium models"
    - **value_proposition_delta:** e.g., "100% free tool with no feature limitations"
    - **pricing_confidence:** "High", "Medium", or "Low"
    - **wtp_validation:** Explain why ad/affiliate is appropriate given WTP scores
    - **market_segment_pricing:** null

    **EXAMPLE — SHAPE only (fictional; derive every number from the real inputs, never copy these slots):**

    solution_name: "<ProductName>"
    pricing_model: "Ad-Supported-Free"
    pricing_rationale: "100% free tool. Low WTP score indicates users won't pay for this utility.
      Monetized via display ads on high-purchase-intent traffic. Revenue ≈ <monthly pageviews> × the
      niche's real CPM ÷ 1000; affiliate links add ≈ <pageviews> × <CTR> × <avg commission>."
    recommended_starter_price: null
    recommended_pro_price: null
    estimated_monthly_ad_revenue: "$<low>-<high>/month"
    estimated_monthly_affiliate_revenue: "$<low>-<high>/month"
    estimated_cpm_rate: "$<low>-<high> CPM (<niche>)"
    recommended_ad_networks: ["Google AdSense", "Ezoic"]
    estimated_arpu: "$<arpu> per pageview (ads + affiliate)"
    pricing_confidence: "Medium"
    wtp_validation: "Low WTP confirms users seek free tools; ad monetization aligns with user expectations"

    **EXAMPLE — SHAPE only (fictional; derive every number from the real inputs, never copy these slots):**

    solution_name: "<ProductName>"
    pricing_model: "Freemium"
    pricing_rationale: "High WTP score confirms willingness to pay. 3-tier model captures individuals
      (Starter), teams (Pro), and orgs (Enterprise), each priced off the real competitor median per the
      WTP→price table. Note any competitive gap at the entry point."
    recommended_starter_price: "$<starter>/month"
    recommended_pro_price: "$<pro>/month"
    recommended_enterprise_price: "$<enterprise>/month"
    starter_tier_features: ["<core feature>", "<core feature>", "<core feature>"]
    pro_tier_features: ["<advanced feature>", "<advanced feature>", "<advanced feature>"]
    estimated_arpu: "$<arpu>/month"
    estimated_ltv: "$<low> - $<high> (<N>-<M>mo retention)"
    ltv_to_cac_ratio: "<ratio>:1 (LTV $<ltv> ÷ CAC $<cac>)"
    pricing_confidence: "High"
    wtp_validation: "High WTP supports premium positioning; price below competitor median to accelerate acquisition"


    **STOP CONDITIONS (ABORT ANALYSIS IF ANY ARE TRUE):**

    - Competitor pricing data shows <3 competitors AND all prices marked "unknown"
    - Solution has market_fit_score <0.40 (insufficient product-market fit for any model)

    If a stop condition is met, return pricing_confidence="Low" and flag the issue in pricing_rationale.


    **CRITICAL REQUIREMENTS:**

    1. **Be specific with numbers:** Use exact dollar amounts, not ranges in price fields
    2. **Justify with data:** Reference competitor pricing, WTP scores, market size, and audience sensitivity in rationale
    3. **Ensure viability:** LTV/CAC ratio must be at least 2:1 for subscription; traffic projections must be realistic for ad models
    4. **Consider market standards:** Don't deviate drastically from competitor norms without strong justification
    5. **Validate against WTP:** Ensure monetization model aligns with customer willingness to pay
    6. **Feature tier logic:** Higher tiers should include ALL lower tier features plus additional ones
    7. **Match project type:** Let {project_type} strongly inform model selection


    Provide your comprehensive monetization strategy analysis in the exact PricingStrategyResult format.


    **CRITICAL RULES (REMINDER - RECENCY BIAS):**
    - For subscription models: All prices must be exact dollar amounts (a single "$<price>/month", NOT a "$<low>-<high>/month" range)
    - For subscription models: LTV/CAC ratio >=2:1 is MANDATORY
    - For ad/affiliate models: Set tier prices to null, provide ad/affiliate revenue estimates instead
    - Monetization model must align with WTP signals AND project type (low WTP + directory = ad/affiliate)
    - DO NOT default to 3-tier Freemium - evaluate all models based on full context
    - Include ALL required fields for the chosen pricing model in PricingStrategyResult
    - The numbers in the EXAMPLE blocks are fictional format illustrations — outputting them (or near-variants) fails validation

  expected_output: >
    A complete PricingStrategyResult object with fields populated based on chosen model:

    **For subscription models (Freemium, Freemium-Lite, Subscription, Hybrid, One-time, Usage-Based):**
    - Recommended pricing tiers (Starter, Pro, Enterprise as applicable)
    - Feature allocation across tiers
    - Unit economics (ARPU, LTV, LTV/CAC ratio)
    - Competitive positioning analysis
    - WTP validation

    **For ad/affiliate models (Ad-Supported-Free, Affiliate-Only):**
    - Pricing fields set to null (free tool)
    - Ad revenue estimates (monthly ad revenue, CPM rate, recommended networks)
    - Affiliate revenue estimates (monthly affiliate revenue, CTR)
    - ARPU expressed as revenue per pageview/visit
    - WTP validation explaining why ad/affiliate is appropriate

    High confidence monetization strategy backed by competitor benchmarks, pain point WTP data,
    project type, market sizing, audience budget sensitivity, and competitive intensity analysis
