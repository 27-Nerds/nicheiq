market_sizing_analysis:
  description: >
    **CRITICAL RULES:**
    1. MANDATORY: Calculate TAM/SAM/SOM estimates (not TBD or placeholder values)
    2. MANDATORY: TAM > SAM > SOM (Year 1) - validate hierarchy (3-2-1 Rule: TAM >3x SAM, SAM >2x SOM Y1)
    3. MANDATORY: Explain methodology (keyword-based, top-down, bottom-up, or hybrid)
    4. MANDATORY: Assess market viability as "Strong", "Moderate", or "Weak" with specific justification


    Calculate TAM/SAM/SOM market size estimates and validate market attractiveness for the
    {solution_name} solution in the {niche_description} market.


    **SOLUTION CONTEXT:**

    **Solution Name:** {solution_name}

    **Solution Description:**
    {solution_description}

    **Solution Details:**
    {solution_context}


    **DATA SOURCES FOR MARKET SIZING:**

    **Keyword Demand Signals (Search Volume = Market Demand):**
    {keyword_demand_signals}

    **INPUT DATA STRUCTURE for keyword_demand_signals:**
    - validated_count: int (number of keywords with measurable search volume, e.g., 45)
    - total_volume: int (combined monthly search volume, e.g., 125000)
    - avg_competition: float 0-100 (DataForSEO competition index, e.g., 42.3)
    - demand_signal: "strong" (>5k/mo) | "moderate" (2k-5k/mo) | "weak" (<2k/mo)
    - top_keywords: list of keyword strings sorted by volume

    **Beachhead demand (anchor SAM/SOM here):** {beachhead_demand_volume:,} monthly searches — the solution's OWN validated keyword demand, i.e. the slice of the niche it actually serves.
    **Follow-on reach ceiling (TAM only):** {niche_reach_ceiling:,} monthly searches — the broad niche/category keyword universe the idea could eventually expand into. The eventual ceiling, NEVER the SAM headline.
    **Analyzed Keywords:** {validated_keyword_count}

    **IMPORTANT:** Anchor SAM and SOM on the BEACHHEAD demand, never the follow-on ceiling. Sizing the serviceable market off the broad niche volume is the classic "1% fallacy" — it inflates the number for an idea that only serves a slice. The ceiling drives TAM only.

    **Pain Point Signals (Discussion Frequency = Problem Validation):**
    {pain_point_signals}

    **Total Pain Points Identified:** {pain_point_count}

    **Competitive Landscape (Market Validation & Saturation):**
    {competitive_signals}

    **Total Competitors Identified:** {competitor_count}


    **PRE-COMPUTED MARKET SIGNALS (from Python -- treat as facts):**
    - Suggested Saturation Level: {suggested_saturation_level}
    - {strive_pre_check}
    - {tam_seed}
    - High-Severity Pain Points (>=0.7): {high_severity_count}
    - High-WTP Pain Points (>=0.5): {high_wtp_count}
    - Average WTP Score: {avg_wtp}

    **SEO-ENRICHED MARKET SIGNALS:**
    {seo_market_enrichment}

    IMPORTANT: If SEO data provides a difficulty-weighted traffic ceiling:
    - Traffic ceiling = organic content monetization ceiling only (ads + affiliate)
    - SOM = total market opportunity (product, services, partnerships, content)
    VALIDATION RULES:
    1. IF SOM Y1 > (traffic ceiling implied revenue x 10):
       → REQUIRED: List specific non-content revenue channels with estimated contribution
       → REQUIRED: Explain the revenue model split (% content vs % product/service)
    2. IF SOM Y1 <= (traffic ceiling implied revenue x 3):
       → Confirm SOM is primarily content-monetization driven
    3. ALWAYS: CITE the traffic ceiling value and explain alignment or divergence

    If topic cluster data is available, use cluster volumes to validate SAM segmentation.
    Each cluster represents a distinct market segment. SAM should approximate the sum
    of clusters you can realistically serve.

    If geographic/category expansion data is available, use it for TAM expansion scenarios:
    - Geographic expansion represents international opportunity
    - Category expansion represents adjacent-market opportunity
    - State percent uplift over core for each scenario

    Use the commercial intent ratio as a market quality signal:
    - >40% = strong commercial viability (revenue-ready traffic)
    - 20-40% = moderate (mix of content + commercial monetization)
    - <20% = weak direct revenue potential (flag as risk factor)


    **YOUR TASK:**

    **SCOPE DIRECTIVE (applies ONLY if the Pain Point Signals above start with a "Scope:" line):**
    When a Scope line is present, the selected idea addresses a SLICE of the niche, not all of it.
    - Size SAM and SOM for that serviceable slice — the in-scope pains and the audience segments that
      feel them — NOT the whole niche. Anchor them on the BEACHHEAD demand, not a percentage of TAM.
    - TAM stays the follow-on reach ceiling (the whole category the idea could grow into) — a directional
      ceiling kept separate from the slice, never the slice's size.
    - Do NOT fabricate a bottom-up SAM from pain-point or competitor COUNTS (there is no headcount or
      ACV data — inventing one is a fabrication). Use the counts only to sanity-check direction.
    - In methodology_explanation, add one qualitative sentence naming how much of the niche this slice
      represents (e.g. "serviceable to the N addressed pains, a subset of the niche"), and flag SAM/SOM
      confidence as MODERATE-to-LOW because the slice is bounded by qualitative scope, not measured demand.
    (If no "Scope:" line is present, ignore this directive and size the full niche as described below.)


    Conduct comprehensive market sizing and validation analysis following these steps:

    ### 1. Market Sizing Calculation (TAM/SAM/SOM)

    A focused idea wins a BEACHHEAD first, then expands — so anchor each layer on the RIGHT demand
    signal. The headline is the beachhead (SAM/SOM); the whole-category ceiling is a separate follow-on
    layer (TAM), NOT the number you derive everything else from.

    **A. SAM — the beachhead (THE HEADLINE; size the slice the idea actually serves):**
    - Anchor on the BEACHHEAD demand ({beachhead_demand_volume:,} monthly searches) — the solution's own
      validated keyword demand. SAM ≈ beachhead monthly volume × avg annual customer value × 12 months.
    - ANCHOR the avg annual customer value on the PRICING ANCHOR (the real Stage-7 pricing analysis):
      {pricing_anchor}
      Use its ARPU / LTV as the per-customer value basis and do NOT invent a number. Annualize a monthly
      ARPU (×12). Only if no pricing anchor is provided, fall back to the audience's willingness-to-pay
      signals and competitor pricing. State which basis you used.
    - The headline metric is the number of paying customers, not searchers: not every monthly searcher
      buys. Apply an explicit, conservative search→customer conversion rate and state it.
    - Do NOT derive SAM as a flat percentage of TAM. Anchor it on the beachhead demand directly. Deriving
      SAM as "30-60% of the niche TAM" is the 1% fallacy and overstates a narrow idea by an order of magnitude.

    **B. TAM — the follow-on reach ceiling (the eventual whole-category opportunity, NOT the headline):**
    - TAM ≈ follow-on reach ceiling ({niche_reach_ceiling:,} monthly searches) × avg annual customer value × 12.
    - This is the niche-wide ceiling the idea could grow into over time, not what it serves today. When the
      idea is a narrow slice, TAM will be MUCH larger than SAM — that gap is correct and expected, never an
      error to "fix" by inflating SAM toward TAM.

    **C. SOM — realistic capture of the BEACHHEAD SAM:**
    - SOM Year 1 = 0.5-2% of the beachhead SAM (conservative, proving PMF).
    - SOM Year 3 = 5-10% of the beachhead SAM (scaling with proven model).

    **D. Cross-check (sanity only, never the anchor):**
    - Validate direction against pain-point frequency ({pain_point_count} pains) and competitor count
      ({competitor_count}). If the beachhead SAM and these signals disagree sharply, LOWER the estimate.
    - Do NOT fabricate a bottom-up SAM from pain-point or competitor COUNTS — there is no headcount or ACV
      data, so inventing one is fabrication. Counts are for direction only.

    **E. Give RANGES, not false precision:** present TAM/SAM/SOM as a low–high band, never a single
    point. Keep them defensible and conservative — model estimates, not measured figures.

    **Show the calculation for each as a formula filled with the ACTUAL inputs above:**
    SAM = (beachhead search demand) × (a stated, conservative search→customer conversion) × (annual value
    per customer, from the pricing anchor); TAM = (reach-ceiling search demand) × (the same conversion) ×
    (annual value). Plug in the real figures — do NOT carry over a magnitude from any illustration.

    **A NOTE ON THE NUMBERS:** the demand volumes, the pricing anchor, and the counts provided above are
    REAL DATA — anchor on them. Any figure shown inside a quoted "e.g." anywhere in this task illustrates
    FORMAT ONLY; never reuse its magnitude as your answer.

    **CRITICAL**: Ensure TAM > SAM > SOM (Y1). Anchoring SAM on the beachhead (a fraction of the ceiling)
    makes the 3-2-1 Rule (TAM >3x SAM, SAM >2x SOM Y1) hold naturally — do not force it by shrinking TAM
    or growing SAM.

    ### 2. Methodology Documentation

    - **primary_methodology:** Choose one: "Top-Down", "Bottom-Up", "Keyword-Based", "Hybrid"
    - **methodology_explanation:** 2-3 sentences explaining calculation approach and why it's appropriate
    - **data_sources_used:** List all sources: keyword volumes, industry reports, pain point frequency, competitor counts

    ### 3. Market Validation Signals

    Extract validation signals from provided data:

    - **keyword_demand_signal:** Total monthly search volume from {total_keyword_volume}
      - Format: "2.5M searches/month" or "250K searches/month"
      - Interpretation: >100K = strong demand, 20K-100K = moderate, <20K = weak

    - **pain_point_frequency:** Discussion volume from {pain_point_count} pain points
      - Format: "5,000+ mentions across 200 threads" or "500 mentions in 50 discussions"
      - Interpretation: >1000 mentions = strong validation, 200-1000 = moderate, <200 = weak

    - **competitor_market_presence:** Competitor count from {competitor_count}
      - Format: "15+ active SaaS competitors" or "5 established players"
      - Interpretation: Market validation indicator

    ### 4. Growth Potential Assessment

    - **market_growth_rate:** Estimate annual growth (Optional - use null if no data)
      - Format: "15-20% CAGR" or "8-12% annually"
      - Base on: Keyword trend data, competitive analysis insights, industry context
      - **IMPORTANT CAVEAT:** Historical trend data is NOT available at this stage (snapshot data only).
        Use conservative estimates and wide ranges. Mark confidence level as LOW for growth rate
        estimates based solely on current competitive and keyword signals. Stage 11 trend analysis
        will provide data-driven trend validation later.

    - **growth_drivers:** List 3-5 factors driving market expansion
      - Examples: "Remote work adoption", "AI/ML technology maturity", "Privacy regulations (GDPR)"
      - Use ACTUAL signals from keyword trends or pain point themes

    ### 5. Market Risk Assessment

    - **market_saturation_level:** Use the pre-computed Suggested Saturation Level ({suggested_saturation_level}) from PRE-COMPUTED MARKET SIGNALS above.
      Reference: "Low" (<5 competitors), "Medium" (5-15), "High" (15+)

    - **market_timing_assessment:** Assess market maturity:
      - "Early" (emerging): <3 years old, high risk/reward
      - "Growth" (expanding): 3-7 years, optimal entry
      - "Mature" (saturated): 7+ years, innovation required

    - **risk_factors:** List 3-5 key market risks
      - Examples: "High saturation (20+ competitors)", "Regulatory uncertainty", "Technology shift to AI-native"
      - Use ACTUAL risks from competitive analysis or pain point patterns

    ### 6. Viability Conclusion & Entry Strategy

    Apply the "STRIVE Viability Rule" - 3 of 6 criteria are pre-computed above in STRIVE Pre-Check.
    Evaluate the remaining 3 criteria below, then count total met (4+ = Strong, 2-3 = Moderate, 0-1 = Weak):

    Pre-computed (see PRE-COMPUTED MARKET SIGNALS above):
    ✅ **Searchable** (100K+ monthly keyword volume) -- see STRIVE Pre-Check
    ✅ **Talked About** (50+ pain point mentions) -- see STRIVE Pre-Check
    ✅ **Rivalry** (5-15 competitors, not 0 or 20+) -- see STRIVE Pre-Check

    LLM to evaluate:
    ✅ **Income Potential** (SAM >$50M)
    ✅ **Velocity** (10%+ annual growth rate)
    ✅ **Enterable** (Clear acquisition channels)

    - **market_viability_verdict:** "Strong", "Moderate", or "Weak"
      - Strong: 4+ STRIVE criteria met, TAM >$500M, SAM >$100M, low-medium saturation
      - Moderate: 2-3 STRIVE criteria met, SAM $20-100M, medium saturation
      - Weak: 0-1 STRIVE criteria met, SAM <$20M, or high saturation (15+ competitors)

    - **viability_rationale:** 2-3 sentences justifying verdict with SPECIFIC metrics
      - Example shape (fill with the REAL values, do not copy these slots): "Strong viability: <demand> (Searchable), <SAM range> (Income Potential), <N> competitors (Rivalry), <growth> (Velocity). Growth phase with clear demand and room to differentiate."

    - **recommended_entry_strategy:** Choose one based on viability:

      **VIABILITY → ENTRY STRATEGY MAPPING:**
      | Viability Verdict | Entry Strategy     | Rationale |
      |-------------------|--------------------|-----------|
      | Strong            | Aggressive Growth  | Rapid scaling, first-mover advantage |
      | Moderate          | Measured Expansion | Validated milestones, controlled growth |
      | Weak              | Niche Focus        | Differentiate in micro-niche if viable |
      | Insufficient Data | Reconsider         | Defer until more data gathered |

      Strategy Definitions:
      - "Aggressive Growth" (Strong market, low saturation, clear demand)
      - "Measured Expansion" (Moderate market, medium saturation, validate PMF first)
      - "Niche Focus" (Saturated market, differentiate with micro-niche)
      - "Reconsider" (Weak signals, high saturation, low TAM/SAM)


    **STOP CONDITIONS (ABORT ANALYSIS IF ANY ARE TRUE):**

    - Keyword demand <5K monthly searches (insufficient demand signal)
    - Pain point count <10 (insufficient problem validation)
    - No competitor data AND no keyword data (cannot triangulate estimates)

    If any stop condition is met:
    - Set market_viability_verdict: "Weak"
    - Set viability_rationale: "Insufficient data - [specify which condition triggered]"
    - Provide conservative estimates based on available data
    - Set recommended_entry_strategy: "Reconsider"
    - Flag all estimates as "Low" confidence in data_sources_used


    **MARKET SIZING GUIDELINES:**

    **TAM/SAM/SOM Hierarchy Validation:**
    - Good: SAM is a modest fraction of TAM; SOM Y1 ≈ 1-2% of SAM ✅ Meets 3-2-1 Rule
    - Bad: SAM ≈ 90% of TAM; SOM Y1 ≈ 55% of SAM ❌ Unrealistic addressability

    **Methodology Selection:**
    - Keyword-Based: Best for digital products with strong search intent (SaaS, tools, info products)
    - Top-Down: Best when industry reports available (enterprise, regulated markets)
    - Bottom-Up: Best for niche markets with limited data (new categories)
    - Hybrid: Combine multiple methods for validation (recommended when possible)

    **Conservative Bias:**
    - When uncertain, choose LOWER estimate (builds investor trust)
    - Provide a low–high range when confidence is medium, rather than a single point
    - Explain assumptions explicitly in methodology_explanation

    **SOM Growth Rates:**
    - Year 1: 0.5-2% of SAM (conservative, proving PMF)
    - Year 3: 5-10% of SAM (scaling with proven model)
    - Aggressive: Only if low saturation + strong demand signals


    **EXPECTED OUTPUT FORMAT:**

    You MUST provide ALL required fields in the MarketSizingResult model:

    - **total_addressable_market:** TAM as a low–high RANGE, formatted "$<low>-<high>M" or "$<low>-<high>B" (or "<low>-<high>M users") - NOT "TBD", not a single point
    - **serviceable_available_market:** SAM as a low–high RANGE, same format - NOT "TBD", not a single point
    - **serviceable_obtainable_market_y1:** SOM Year 1 as a low–high RANGE - NOT "TBD"
    - **serviceable_obtainable_market_y3:** SOM Year 3 as a low–high RANGE - NOT "TBD"

    - **primary_methodology:** "Top-Down", "Bottom-Up", "Keyword-Based", or "Hybrid"
    - **methodology_explanation:** 2-3 sentences with calculation approach
    - **data_sources_used:** List of sources (keyword volumes, industry reports, pain point frequency, competitor analysis)

    - **keyword_demand_signal:** "2.5M searches/month" format
    - **pain_point_frequency:** "5,000+ mentions across 200 threads" format
    - **competitor_market_presence:** "15+ active SaaS competitors" format

    - **market_growth_rate:** "15-20% CAGR" or null if no data (Optional)
    - **growth_drivers:** List of 3-5 factors (ACTUAL signals from data)

    - **market_saturation_level:** "Low", "Medium", or "High" ONLY
    - **market_timing_assessment:** "Early", "Growth", or "Mature" ONLY
    - **risk_factors:** List of 3-5 specific risks from data

    - **market_viability_verdict:** "Strong", "Moderate", or "Weak" ONLY
    - **viability_rationale:** 2-3 sentences with SPECIFIC metrics from STRIVE criteria
    - **recommended_entry_strategy:** "Aggressive Growth", "Measured Expansion", "Niche Focus", or "Reconsider"


    **CRITICAL REQUIREMENTS:**

    1. **Use ACTUAL data:** All estimates must be based on provided keyword volumes, pain point counts, competitor analysis
    2. **Show calculations:** Explain how TAM/SAM/SOM were derived (not just final numbers)
    3. **Validate hierarchy:** Ensure TAM > SAM > SOM (Y3) > SOM (Y1) - SOM Y3 must be HIGHER than SOM Y1 (growth over time)
    4. **Conservative bias:** When uncertain, choose lower estimate (investor trust)
    5. **Actionable verdict:** Viability verdict must match data (don't say "Strong" if SAM <$20M or 20+ competitors)


    Provide your comprehensive market sizing analysis in the exact MarketSizingResult format.


    **CRITICAL RULES (REMINDER - RECENCY BIAS):**
    - TAM/SAM/SOM estimates with NO "TBD" or placeholders (format: "$<low>-<high>M" / "$<low>-<high>B" ranges)
    - TAM > SAM > SOM (Y3) > SOM (Y1) hierarchy validation (3-2-1 Rule: TAM >3x SAM, SAM >2x SOM Y1)
    - Methodology explanation with calculation details showing formula used
    - market_viability_verdict: "Strong"/"Moderate"/"Weak" ONLY (matching STRIVE criteria count: 4+ = Strong, 2-3 = Moderate, 0-1 = Weak)
    - market_saturation_level: "Low"/"Medium"/"High" ONLY (no custom values)
    - market_timing_assessment: "Early"/"Growth"/"Mature" ONLY (no custom values)
    - primary_methodology: "Top-Down"/"Bottom-Up"/"Keyword-Based"/"Hybrid" ONLY
    - Entry strategy matching viability (Strong → Aggressive Growth, Moderate → Measured Expansion, Weak → Reconsider)

  expected_output: >
    A complete MarketSizingResult object with all required fields populated:
    - TAM/SAM/SOM estimates as low–high ranges in dollar or user format
    - Methodology explanation with calculation approach and data sources
    - Market validation signals (keyword demand, pain frequency, competitor presence)
    - Growth potential assessment with drivers and growth rate estimate
    - Risk assessment with saturation level, timing, and specific risk factors
    - Market viability verdict ("Strong"/"Moderate"/"Weak") with 2-3 sentence rationale
    - Recommended entry strategy ("Aggressive Growth"/"Measured Expansion"/"Niche Focus"/"Reconsider")
    - All estimates based on ACTUAL data from keyword volumes, pain points, and competitive analysis
    - Conservative bias applied when uncertainty exists
    - Transparent calculations that satisfy technical due diligence
