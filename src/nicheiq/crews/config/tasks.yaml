    **seed_keywords_generated**: List[str] (for backward compatibility, can be empty or subset)

    All keyword data in output MUST match the enriched keyword data provided - no hallucination.

# ========================================
# MULTI-TASK SEO STRATEGY (4-TASK BREAKDOWN)
# ========================================

analyze_keywords_and_tier:
  description: >
    ═══ CRITICAL RULES (Read First) ═══
    ✓ Use ONLY enriched keyword data provided - NO fabricated volumes
    ✓ STEP 0 (Relevance Filtering) is MANDATORY - filter irrelevant keywords first
    ✓ Calculate opportunity_score = search_volume / competition_index
    ✓ Every tier assignment MUST reference actual data from keywords
    ✓ Target 60-80% retention after filtering - distribute RELEVANT keywords across tiers
    ✓ Track filtered keyword count in key_findings field

    **Task 1: Keyword Analysis & Tiering**

    Apply your Intent-First Tiering Methodology to {enriched_keywords_count} pre-enriched keywords.

    **ENRICHED KEYWORDS DATA (CSV Format - Direct Input):**

    You have access to {enriched_keywords_count} keywords provided as CSV data below.

    **CSV STRUCTURE:**

    ```csv
    {enriched_keywords_csv}
    ```

    **CSV COLUMNS:**
    - **keyword**: The keyword phrase (string)
    - **search_volume**: Monthly search volume (integer)
    - **competition_index**: Competition score 0-100 (integer, lower is better)
    - **competition_level**: Human-readable competition (VERY_LOW/LOW/MEDIUM/HIGH/VERY_HIGH)
    - **cpc**: Cost per click in USD (float)
    - **opportunity_score**: Calculated as search_volume / competition_index (float, higher is better)
    - **tier**: Pre-calculated tier assignment (TIER_1_QUICK_WIN/TIER_2_STRATEGIC/TIER_3_MEDIUM/TIER_4_LONG_TAIL)

    **TIER DEFINITIONS (from CSV data):**
    - **TIER_1_QUICK_WIN**: opportunity_score > 100 (High volume, low competition)
    - **TIER_2_STRATEGIC**: opportunity_score 50-100 (Medium volume, moderate competition)
    - **TIER_3_MEDIUM**: opportunity_score 20-50 (Moderate volume)
    - **TIER_4_LONG_TAIL**: opportunity_score < 20 (Lower volume but viable)

    **INSTRUCTIONS FOR PARSING CSV:**
    - Parse the CSV data above (header + data rows)
    - Each row represents one keyword with all metrics calculated
    - Filter keywords by tier column to identify tier assignments
    - DO NOT use SerperDevTool or web search - ALL data is in the CSV above
    - The tier column provides initial guidance, but you should apply strategic refinement based on solution context

    **CONTEXT:**
    - Niche: {niche}
    - Solution: {selected_solution_name}
    - Topic Clusters: {topic_clusters_summary}
    - Total Keywords Available: {enriched_keywords_count}

    **WORKFLOW (FOLLOW IN ORDER):**

    **STEP 0: RELEVANCE FILTERING (MANDATORY - Execute First):**

    Before tiering keywords, FILTER OUT keywords that are NOT relevant to the niche and solution.

    **Context from Inputs:**
    - Niche: {niche}
    - Solution: {selected_solution_name}
    - Solution Description: {selected_solution_description}

    **Relevance Criteria (STRICTER - Apply in Order):**

    1. **Context Match Test (MANDATORY):**
       - Read the full solution description above
       - Ask: "Does this keyword relate to the SPECIFIC problem domain described?"
       - If keyword is about a DIFFERENT product/service domain → EXCLUDE

    2. **Ambiguity Filter (for generic terms):**
       - Generic terms like "comparison", "review", "filter", "tool", "platform", "access", "user"
       - These are ONLY relevant if combined with niche-specific context
       - Examples:
         * "skincare comparison" → KEEP (skincare + comparison)
         * "comparison tool" → EXCLUDE (generic, no niche context)
         * "user reviews skincare" → KEEP (niche context present)
         * "user reviews" → EXCLUDE (generic, could be ANY product)
         * "ingredient filter" → KEEP (if solution involves ingredients)
         * "typescript filter" → EXCLUDE (programming, unrelated domain)

    3. **Cross-Domain Exclusion (MANDATORY):**
       - If keyword clearly belongs to another domain → EXCLUDE immediately
       - Common false positives to EXCLUDE:
         * Software/Programming: "microsoft", "excel", "access", "typescript", "vue", "react", "css"
         * Electronics: "cpu", "ssd", "monitor", "tv", "benchmark", "tbw"
         * Finance: "mortgage", "credit card", "loan", "insurance" (unless niche is finance)
         * Vehicles: "car", "tire", "chariot", "bike" (unless niche is automotive)
         * Telecom: "verizon", "t-mobile", "phone plan" (unless niche is telecom)

    **Filtering Process:**
    1. For EACH keyword, apply Context Match Test - does it relate to {niche} and {selected_solution_name}?
    2. If keyword contains only generic terms (comparison, review, filter, etc.) WITHOUT niche context → EXCLUDE
    3. If keyword contains terms from unrelated domains (software, electronics, finance, etc.) → EXCLUDE
    4. Only KEEP keywords that have clear connection to the niche domain described in solution description

    **NO FIXED RETENTION TARGET** - Filter based on relevance, not percentages. Quality over quantity.

    **Examples of CORRECT Filtering:**

    Niche: "premium skincare" | Solution: "ingredient comparison tool"
    ✓ KEEP: "luxury face serum", "retinol vs vitamin c", "sensitive skin products"
    ✓ KEEP: "skincare ingredient comparison", "moisturizer reviews" (niche context present)
    ✗ EXCLUDE: "comparison tool", "user reviews", "filter settings" (generic, no skincare context)
    ✗ EXCLUDE: "microsoft access", "cpu comparison", "mortgage rates" (different domains)

    Niche: "expat relocation" | Solution: "visa requirement aggregator"
    ✓ KEEP: "spain visa requirements", "expat moving checklist", "relocation services"
    ✓ KEEP: "visa comparison", "immigration reviews" (niche context present)
    ✗ EXCLUDE: "product comparison", "service reviews", "database access" (generic or different domain)

    Niche: "SaaS project management" | Solution: "tool comparison platform"
    ✓ KEEP: "asana vs trello", "project management software reviews", "agile tools"
    ✓ KEEP: "saas comparison", "collaboration platform features" (niche context present)
    ✗ EXCLUDE: "platform", "tool", "comparison" (too generic without SaaS/project context)
    ✗ EXCLUDE: "skincare comparison", "visa requirements" (different domains)

    1. **Calculate Scores** → opportunity_score for each keyword
    2. **Rank & Select** → Top keywords per tier criteria (select 3-5 from pool for Tier 1, 3-5 from remaining pool for Tier 2)
    3. **GROUP ALL REMAINING KEYWORDS** (CRITICAL - Maximize Coverage):

       **IMPORTANT**: After selecting 3-5 keywords for Tier 1 and 3-5 for Tier 2, you should have
       HUNDREDS of remaining relevant keywords. These MUST be organized into Tier 3/4 groups.

       **Goal**: Tier 80-90% of RELEVANT keywords. Only skip keywords that are truly ambiguous or marginal.

       🚨 **LOCATION CONSTRAINT FOR TIER 3:**
       ONLY group keywords in Tier 3 that EXPLICITLY mention a location, city, or country name in the keyword text itself.
       If a keyword does NOT contain an explicit location → assign to Tier 4 instead.

       **Examples:**
       ✓ Tier 3: "moving to spain costs", "relocation services berlin", "uk visa requirements" (explicit locations)
       ✗ Tier 4: "international moving costs", "expat relocation guide", "moving abroad checklist" (no specific location)

       a. **Geographic Tier (Tier 3) - Location-Specific Keywords Only:**
          - Scan keywords for EXPLICIT location mentions: country names, city names, regional terms
          - Group by geographic market (e.g., "European Markets", "Asian Markets", "North America")
          - For each region, create GeographicKeywordGroup:
            * region_name: Descriptive name for the geographic cluster
            * total_volume: Sum of search volumes for all keywords in group
            * competition_level: Average competition assessment (LOW/MEDIUM/HIGH)
            * keywords: List of GeographicKeywordEntry with city/keyword/search_volume/competition
            * strategy_notes: 1-3 sentences on geographic expansion approach
          - ⚠️ CRITICAL: Do NOT hallucinate city names for keywords without explicit locations

       b. **Category Tier (Tier 4) - ALL Non-Geographic Keywords:**
          - Include: (1) Keywords with no explicit location, (2) Generic thematic keywords
          - Scan ALL remaining keywords for category patterns

          **Category Discovery Strategies:**
          - By ingredient/component: Group keywords containing similar ingredients (e.g., "retinol", "vitamin c")
          - By product type: Group by product categories (e.g., "serum", "moisturizer", "cleanser")
          - By user concern: Group by problems/needs (e.g., "acne", "anti-aging", "sensitivity")
          - By modifier: Group by price tier, brand type, quality level (e.g., "luxury", "affordable", "natural")
          - By comparison type: Group comparison keywords (e.g., "X vs Y", "best X", "X alternatives")
          - By review/rating focus: Group review-oriented keywords
          - Miscellaneous: Catch-all for keywords that don't fit above categories

          **Aim for comprehensive coverage**: Create 8-15 category groups to cover most relevant keywords.
          Each category should have 20-100+ keywords for programmatic SEO potential.

          - For each category, create CategoryKeywordGroup:
            * category_name: Descriptive name for the thematic cluster
            * total_volume: Sum of search volumes for all keywords in group
            * keywords: List of CategoryKeywordEntry with keyword_name/search_volume/competition
            * strategy_recommendation: 2-4 sentences on how to target this category

       c. **Pre-Submission Validation (SELF-CHECK):**
          - Count total keywords tiered: Tier 1 + Tier 2 + (sum Tier 3) + (sum Tier 4)
          - Count filtered keywords: {enriched_keywords_count} - total_tiered
          - Report filtering stats in key_findings

          **Self-Assessment Questions:**
          - Did I tier 80-90% of the RELEVANT keywords after filtering?
          - Do I have at least 8-12 Tier 4 category groups covering diverse themes?
          - Are there obvious keyword patterns I missed that should be grouped?
          - If <50% of keywords are tiered, did I filter too aggressively?

          **Example of GOOD Distribution:**
          Input: 1,603 keywords → Filtered 620 (39%, strict filtering) → Tiered 890 relevant keywords (90%)
          - 5 Tier 1 + 5 Tier 2 + 320 Tier 3 + 560 Tier 4 = 890 total ✓
          - 12 diverse Tier 4 category groups with 20-80 keywords each ✓
          - Filtering rate: 39% (adaptive, quality-focused) ✓

    4. **Position Analysis** → Competitor gaps and differentiation angles
    5. **Key Findings** → 3-5 data-driven insights (volume patterns, competition gaps, tier distribution stats)

    **TIER ASSIGNMENT CRITERIA:**

    | Tier | Selection Criteria | Count | Timeline | Purpose |
    |------|-------------------|-------|----------|---------|
    | **Tier 1** | Vol >2000 + Comp <30<br>OR Vol 500-2000 + Comp <15 | 3-5 (from pool) | 0-3 mo | Quick wins |
    | **Tier 2** | Vol >2000 + Comp 30-60<br>OR strategic fit | 3-5 (from pool) | 3-6 mo | Strategic growth |
    | **Tier 3** | Keywords with EXPLICIT locations | ALL remaining (grouped) | 6-12 mo | Geographic expansion |
    | **Tier 4** | Category clusters + non-location keywords | ALL remaining (grouped) | 6-12 mo | Programmatic SEO |

    ═══ CRITICAL RULES (Read Last) ═══
    ✓ RELEVANT keywords MUST be distributed across tiers - filtered keywords should NOT be tiered
    ✓ Report filtering stats in key_findings (e.g., "Filtered 620/1603 (39%) - strict domain filtering")
    ✓ AIM for 80-90% coverage of RELEVANT keywords after filtering - create enough Tier 4 categories
    ✓ Tier 3/4 grouping is WHERE MOST KEYWORDS GO - these tiers should contain hundreds of keywords, not dozens
    ✓ Create 8-15 diverse Tier 4 categories to maximize programmatic SEO coverage
    ✓ "Miscellaneous" category is acceptable for keywords that don't fit clear patterns
    ✗ NO estimates or hallucinations - use exact data only
    ✗ Do NOT assign city names to keywords without explicit locations
    ✗ Do NOT tier filtered keywords - they should be excluded from all tier assignments
    ✗ If you're only tiering <50% of keywords, either filtering was too strict OR grouping was incomplete

  expected_output: >
    KeywordAnalysisResult Pydantic model with ALL fields:

    **Tier Structure** (with real volumes/competition):
    - tier_1_keywords (3-5 keywords), tier_1_quick_win_strategy
    - tier_2_keywords (3-5 keywords, optional), tier_2_strategy (optional)
    - tier_3_geographic_groups (REQUIRED if geographic patterns exist - group remaining location-based keywords)
    - tier_4_category_groups (REQUIRED if category patterns exist - group remaining thematic keywords)

    **CRITICAL:** After STEP 0 filtering, distribute RELEVANT keywords across tiers.
    Target: 80-90% of relevant keywords tiered (NO fixed filtering percentage - adapt to domain match quality).

    **Metadata**:
    - total_keywords_analyzed, total_monthly_volume
    - key_findings (3-5 bullets MUST include:
      * Filtering stats: "Filtered X/Y (Z%) - [reason: strict domain filtering / lenient for niche match]"
      * Tier distribution: "Tiered A keywords (B% of relevant): Tier 1=C, Tier 2=D, Tier 3=E, Tier 4=F"
      * Coverage assessment: "Overall coverage: (filtered + tiered) / total = G%"
      * Category insights: "Created H Tier 4 categories covering [themes]")
    - competitive_positioning (markdown, 2-4 sections)

    MUST use exact enriched keyword data - no fabrication.

