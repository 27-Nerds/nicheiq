    - **solution_name** - CRITICAL: MUST be EXACTLY the same name as provided in the research task input (e.g., if input was "HomeRelay", output MUST be "HomeRelay", NOT "CareBridge Enterprise Mobility Management" or any variation). DO NOT rename, rephrase, or modify the solution name.
    - competitors (List[Competitor])
    - market_gaps (3-5 unmet needs)
    - differentiation_opportunities (3-5 ways to differentiate)
    - competitive_intensity ("Low"/"Medium"/"High" with 1-2 sentence justification)
    - recommended_positioning (2-3 sentence strategy)
    - pricing_insights (market pricing analysis)

    **top_opportunities** (List[str]): 3-5 top differentiation opportunities across all solutions

    **strategic_recommendations**: 4-5 sentence executive summary covering competitive
    landscape assessment, which solutions have clearest advantage, and key strategic insights

# SEOStrategyCrew Tasks

expand_keywords_conceptually:
  description: >
    Phase 9.5a: Hybrid Seed Keyword Generation - Generate a strategic mix of BROAD SEEDS
    (1-2 words) for DataForSEO expansion + TARGETED KEYWORDS (3-5 words) for direct validation.

    **CRITICAL UNDERSTANDING:**
    - DataForSEO's expansion API works by detecting categories and finding variations
    - BROAD seeds (1-2 words) expand into thousands of long-tail keywords automatically
    - SPECIFIC seeds (4+ words) have nowhere to expand and limit discovery
    - Your job: Generate the RIGHT seeds, let DataForSEO create the variations

    **Context:**
    - Niche: {niche}
    - Selected Solution: {selected_solution_name}
    - Value Proposition: {selected_solution_value_prop}
    - Pain Points: {selected_solution_pain_points}
    - Target Personas: {selected_solution_personas}
    - Core Features: {selected_solution_features}
    - Competitive Context: {competitive_context}

    **RELEVANCE REMINDER:**
    All keywords generated here will be expanded by DataForSEO (Phase 9.5b) which may produce
    thousands of variations. Ensure your seed keywords are TIGHTLY ALIGNED with the niche and
    solution context above. Avoid generic terms from unrelated domains. Keywords should be
    extractable from the provided context fields, not invented from outside knowledge.

    **Task: Generate 40-50 Total Keywords Using 70-30 Hybrid Strategy**

    ## PART 1: Broad Seeds (70% = 28-35 keywords, 1-2 words each)

    Extract category terms from research data using the 5-Type System:

    **Type 1: Core Product/Service Terms (5-8 keywords)**
    - Extract NOUNS from: {niche}, {selected_solution_name}, {selected_solution_value_prop}
    - Pattern: main product/service category (1-2 words)
    - Examples: "visa application", "relocation", "immigration" (NOT "visa application service for expats")

    **Type 2: Problem/Need Terms (8-12 keywords)**
    - Extract core PROBLEMS from: {selected_solution_pain_points}
    - Pattern: pain point nouns without modifiers (1-2 words)
    - Examples: "documentation", "bureaucracy", "timeline" (NOT "overwhelming documentation process")

    **Type 3: Feature/Attribute Terms (5-8 keywords)**
    - Extract KEY FEATURES from: {selected_solution_features}
    - Pattern: feature nouns (1-2 words)
    - Examples: "tracking", "checklist", "reminders" (NOT "progress tracking for applicants")

    **Type 4: Solution/Method Terms (3-5 keywords)**
    - Extract solution TYPES from: {selected_solution_value_prop}
    - Pattern: solution category (1-2 words)
    - Examples: "service", "platform", "tool", "guide"

    **Type 5: Modifier Terms (2-5 keywords)**
    - Extract BROAD modifiers from: {selected_solution_personas}, {niche}
    - Pattern: industry/demographic (1-2 words)
    - Examples: "expat", "international", "business" (NOT "first-time expat families")

    **Broad Seed Quality Rules:**
    ✓ MUST be 1-2 words (3 words MAX in rare cases)
    ✓ NO personas, scenarios, or combined concepts
    ✓ NO questions ("how to..." is output, not input)
    ✓ Extract NOUNS from context, don't create long phrases
    ✓ Think "category bucket" not "specific search query"
    ✗ NEVER 4+ words - these are outputs, not seeds!

    ## PART 2: Targeted Keywords (30% = 12-15 keywords, 3-5 words each)

    Strategic high-value keywords based on validated pain points:

    **Selection Criteria:**
    - Extract from HIGH-SEVERITY pain points (severity >= 7)
    - Match high-priority features that solve top pain points
    - Include 2-3 competitor comparison terms from {competitive_context}
    - Cover awareness → consideration → decision funnel

    **Targeted Keyword Rules:**
    ✓ 3-5 words (combines 2-3 broad seeds strategically)
    ✓ Based on actual pain point data, not speculation
    ✓ High commercial intent (solution-seeking, comparison)
    ✓ Competitor names ONLY from {competitive_context} (real brands)
    ✗ NO overly specific scenarios (e.g., "solution for problem1 and problem2 and problem3")
    ✗ NO persona combinations (e.g., "for busy working professionals with families")

    ## PART 3: Topic Clusters (5-8 clusters)

    Group keywords by major themes representing distinct user needs:
    - **name**: Cluster name (2-4 words, descriptive)
    - **description**: What this cluster covers (1 sentence)
    - **strategic_importance**: 1-5 (1=critical, 5=nice-to-have)

    Ensure all keywords map to a cluster. Broad seeds should distribute across clusters.

    ## Extraction Method (Data-Driven, Niche-Agnostic):

    1. **Parse {niche}**: Extract 3-5 core nouns → Type 1 seeds
    2. **Parse {selected_solution_pain_points}**: Extract problem nouns → Type 2 seeds
    3. **Parse {selected_solution_features}**: Extract feature nouns → Type 3 seeds
    4. **Parse {selected_solution_value_prop}**: Extract solution types → Type 4 seeds
    5. **Parse {selected_solution_personas}**: Extract broad demographics → Type 5 seeds
    6. **Combine strategically**: Create 12-15 targeted keywords from high-priority combinations
    7. **Extract competitors**: From {competitive_context}, use actual brand names only

    ## Examples (Generic Pattern, NOT Skincare-Specific):

    **Niche: "AI-powered project management for remote teams"**

    **✅ GOOD Broad Seeds (70%):**
    - Type 1: "project management", "workflow", "collaboration"
    - Type 2: "productivity", "communication", "delays"
    - Type 3: "automation", "tracking", "reporting"
    - Type 4: "software", "platform", "tool"
    - Type 5: "remote", "distributed", "async"

    **✅ GOOD Targeted Keywords (30%):**
    - "project management for remote teams" (3 broad seeds combined)
    - "workflow automation software" (2 broad seeds + type)
    - "Asana vs Monday comparison" (competitor names from competitive_context)

    **❌ BAD Seeds (DON'T DO THIS):**
    - "project management solution for remote software development teams with agile workflows" (9 words, overly specific)
    - "best project management for startups with limited budget" (8 words, multiple modifiers)
    - "how to improve remote team collaboration when working across timezones" (11 words, question)

  expected_output: >
    ExpandedKeywordList model with:

    **keywords**: List[ConceptualKeyword] (40-50 total keywords)
    - **70% broad seeds (1-2 words)**: For DataForSEO expansion into thousands of variations
    - **30% targeted keywords (3-5 words)**: Strategic high-value queries for direct validation
    - keyword: str (the search phrase - ENFORCE LENGTH RULES)
    - cluster: str (which topic cluster it belongs to)
    - priority: int (1-5, strategic importance)
    - rationale: str (why this keyword/seed matters - 1 sentence)

    **topic_clusters**: List[TopicCluster] (5-8 clusters)
    - name: str (cluster name)
    - description: str (what this cluster covers)
    - strategic_importance: int (1-5, SEO priority)

    **expansion_rationale**: str (2-3 sentences explaining the hybrid strategy and expected expansion potential)

    **Output Structure Example:**
    - 28-35 broad seeds (1-2 words) will expand to 10,000-30,000 keywords via DataForSEO
    - 12-15 targeted keywords (3-5 words) validated directly for high-intent commercial terms
    - Total discovery: ~15,000-40,000 keyword opportunities from 40-50 strategic inputs

