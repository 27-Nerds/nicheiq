    **Fields to EXTRACT and potentially ADJUST UP:**
    - Market Fit Score (0.0-1.0) - If competitive gaps reveal BETTER market fit than initially assessed, you may increase this score by up to 0.1 points. Otherwise preserve the original value. NEVER decrease it. NEVER leave it null.

    **Fields to EXTRACT and potentially ENHANCE:**
    - Technical Approach - Extract original value. You may ADD 1-2 sentences about competitive differentiation in technical implementation, but preserve the core approach description.
    - Estimated Development Time - Extract original value. If you add significant new features (3+), you may adjust timeline (e.g., "3-4 months" → "4-5 months"). Otherwise preserve original.

