# PainPointCrew Tasks
# Following best practices: 80% effort on task design, specific expected outputs, clear success criteria

categorize_content:
  description: >
    ═══ CRITICAL RULES (Read First) ═══
    ✓ ONLY analyze content provided below - NO invented quotes/segments
    ✓ Need ≥5 substantive discussions → else report "Insufficient discussion data"
    ✓ Every quote MUST be direct copy from content - NO paraphrasing
    ✓ Categories emerge from data patterns, not assumptions
    ✓ Fewer categories with evidence > many without

    **NICHE CONTEXT:** {niche_description}

    You are provided with ALL social media discussions below. Review this complete content to create
    a systematic categorization of themes, problems, and user segments RELEVANT TO THE NICHE ABOVE.

    **Content Summary:**
    - Reddit posts: {reddit_posts_count} posts with {total_reddit_comments} comments
    - Twitter threads: {twitter_threads_count} threads with {total_twitter_replies} replies
    - Total content pieces: {total_content}

    ═══════════════════════════════════════════════════════════════════════════

    ## COMPLETE REDDIT DISCUSSIONS:

    {full_reddit_content}

    ═══════════════════════════════════════════════════════════════════════════

    ## COMPLETE TWITTER DISCUSSIONS:

    {full_twitter_content}

    ═══════════════════════════════════════════════════════════════════════════


    **What to do:**

    1. Review ALL the content provided above (both Reddit and Twitter sections)
    2. Identify recurring problems, frustrations, and topics being discussed
    3. Group discussions into 5-10 distinct theme categories based on the actual patterns
       you discover in the discussions (categories will vary by niche - let the data guide you)
    4. For each category, identify the user segments expressing these concerns based on
       what you find in the discussions (segment names should match user self-descriptions)
    5. Note the frequency and intensity of discussions in each category


    **How to approach:**

    - Read through the discussions systematically to find repeated keywords, phrases, and concepts
    - Pay attention to the language users employ—their exact words matter
    - Look for patterns in:
      * Problems: "frustration", "difficult", "can't", "impossible", "broken", "struggle"
      * User identities: "I am", "as a", "we are", role-specific terms
      * Impact statements: "time", "money", "expensive", "hours", "cost", "afford"
      * Emotional language: "hate", "love", "annoying", "painful", "frustrated", "stressed"
      * Workarounds: "using", "tried", "workaround", "alternative", "instead"
    - Consider both explicit statements ("I hate that...") and implicit problems
    - Segment by user type when you see clear distinctions in needs or contexts
    - Use the metadata (PLATFORM, SUBREDDIT, SCORE, ENGAGEMENT) to understand context and importance


    **Acceptance Criteria:**

    - Minimum 5 distinct theme categories identified
    - Each category has clear definition and at least 3 representative quote examples from the content above
    - User segments are specific enough to inform product targeting
    - Frequency indicators (high/medium/low) assigned to each theme based on mention count

    ═══ CRITICAL RULES (Read Last - Recency Reminder) ═══
    ✗ If <5 substantive discussions found → Return "Insufficient discussion data"
    ✗ DO NOT use training data or niche assumptions
    ✗ User segments MUST match self-descriptions from discussions above
    ✗ Every quote MUST be directly copied from content above - NO paraphrasing

  expected_output: >
    YOU MUST RETURN THE ACTUAL COMPLETE CATEGORIZATION REPORT in the EXACT format below.
    FILL IN ALL PLACEHOLDERS WITH REAL CONTENT from the discussions provided above.
    DO NOT return a description of what the report should contain - return the ACTUAL REPORT.


    # Content Categorization Report


    ## Executive Summary

    [2-3 sentences summarizing the overall discussion landscape, primary themes discovered,
    and key user segments identified in the actual content above]


    ## Theme Categories


    ### Category 1: [Category Name from actual discussions]

    **Definition**: [What this category represents based on actual discussion patterns]

    **Frequency**: [High/Medium/Low] - mentioned in [X] distinct discussions

    **Primary User Segments**: [Specific user types from the discussions - e.g., "Solo founders", "Enterprise teams"]

    **Representative Quotes**:
    - "[Actual quote 1 from Reddit/Twitter content above]"
    - "[Actual quote 2 from Reddit/Twitter content above]"
    - "[Actual quote 3 from Reddit/Twitter content above]"


    ### Category 2: [Category Name from actual discussions]

    **Definition**: [What this category represents]

    **Frequency**: [High/Medium/Low] - mentioned in [X] distinct discussions

    **Primary User Segments**: [Specific user types]

    **Representative Quotes**:
    - "[Actual quote 1]"
    - "[Actual quote 2]"
    - "[Actual quote 3]"


    ### Category 3: [Category Name]

    [Same structure as above]


    ### Category 4: [Category Name]

    [Same structure as above]


    ### Category 5: [Category Name]

    [Same structure as above]


    [Continue with Categories 6-10 if you identify additional distinct patterns in the discussions]


    ## User Segment Analysis

    **Segment 1: [Segment name from discussions]**
    - Primary concerns: [List actual concerns from discussions]
    - Mention frequency: [High/Medium/Low]

    **Segment 2: [Segment name from discussions]**
    - Primary concerns: [List actual concerns]
    - Mention frequency: [High/Medium/Low]

    [Continue for all distinct user segments identified]


    ## Discussion Quality Assessment

    - **Engagement levels**: [Assessment of upvotes/likes/replies across discussions]
    - **Discussion depth**: [How detailed and substantive are the conversations]
    - **Authenticity**: [Do pain points seem genuine vs hypothetical]
    - **Overall quality**: [High/Medium/Low with brief justification]

extract_pain_points:
  description: >
    **NICHE CONTEXT:** {niche_description}

    Transform the categorized content into specific, actionable pain points relevant
    to the niche being analyzed.

    ═══════════════════════════════════════════════════════════════════════════
    **WORKFLOW: Use Previous Task's Categorization as Foundation**

    The previous task (content researcher) has provided a comprehensive categorization
    report. Use this as your PRIMARY structure for organizing pain points.

    - Start with the categories identified in the previous task's report
    - Focus on high and medium-frequency categories from that report
    - When you need MORE CONTEXT about a category, query knowledge sources to find
      additional examples, quotes, and evidence within that category
    - Knowledge sources should ENHANCE your understanding of the existing categories,
      not replace them with new categorization

    Think of it this way: The previous task told you "these are the main themes in
    the discussions." Your job is to dive deeper into each theme using knowledge
    sources to extract specific, actionable pain points with evidence.
    ═══════════════════════════════════════════════════════════════════════════


    **WORKFLOW** (Apply your 3-Quote Minimum Protocol):

    1. Review categorization report → identify high/medium-frequency categories
    2. For each category → extract 2-5 specific pain points with supporting evidence
    3. Query knowledge sources → find ≥3 direct quotes per pain point
    4. Identify severity indicators → "frustrating", "critical", "showstopper"
    5. Note current solutions/workarounds users mention

    **SEARCH STRATEGY** (Knowledge Source Queries):

    | Query Type | Purpose | Keywords |
    |------------|---------|----------|
    | Problem keywords | Find quote evidence | Specific problem terms from categories |
    | Emotional language | Severity assessment | "frustrating", "critical", "annoying", "showstopper" |
    | Impact mentions | Business impact | "time", "expensive", "productivity", "revenue" |
    | Workarounds | Current solutions | "using", "tried", "alternative to" |

    **QUALITY STANDARDS:**
    ✓ Actionable (clear what solving means)
    ✓ ≥3 supporting quotes from knowledge sources
    ✓ Frequency data (mention count)
    ✓ Specific, not vague ("manual data entry" NOT "tool is bad")
    ✓ Exact user language (no corporate speak paraphrasing)
    ✗ Duplicates (merge similar pain points)


    **CRITICAL DATA ACCURACY RULES:**

    - ONLY extract pain points that have explicit evidence in the knowledge sources you can query
    - Each pain point MUST have at least 3 real user quotes - if you cannot find 3 quotes from knowledge sources, DO NOT create that pain point
    - DO NOT invent or paraphrase pain points based on general niche knowledge or assumptions
    - If knowledge source queries return no results for a potential pain point, that pain point does NOT exist in the collected data
    - Every quote MUST be a direct quote from knowledge sources - do not create fictional or "example" quotes
    - If you can only identify fewer than 10 pain points with proper evidence, that is acceptable - return what you can verify
    - Acceptable output: Empty pain points list with explanation "Insufficient evidence in knowledge sources" if no validated pain points can be extracted
    - DO NOT fill gaps with generic problems you think might exist in this niche


    **Acceptance Criteria:**

    - Minimum 10 distinct pain points extracted
    - Each pain point has clear problem articulation
    - Supporting evidence includes direct user quotes from knowledge sources
    - Mention frequency quantified for each
    - Source platforms identified (Reddit/Twitter)

  expected_output: >
    A PainPointExtraction object with the following structure:


    **niche**: The niche being analyzed


    **extracted_pain_points**: List of UnvalidatedPainPoint objects (10-20 pain points), each containing:
       - **title**: Short, descriptive name (e.g., "Manual Data Entry Consuming Hours Daily")
       - **description**: 2-3 sentence clear articulation of the specific problem in user language,
         including user context and current solutions mentioned
       - **mention_count**: Number of times this problem appeared across discussions
       - **representative_quotes**: 3-5 direct user quotes supporting this pain point
       - **source_platforms**: List of platforms where mentioned (["Reddit"], ["Twitter"], or ["Reddit", "Twitter"])
       - **categories**: List of categories this pain point belongs to


    **extraction_summary**: 3-4 sentences overview of pain point landscape, key patterns,
       priority problem areas, and pain point categories


    CRITICAL: Return structured Pydantic data, not markdown. This output will be passed directly
    to the validator for scoring. Do NOT include severity/WTP scores - those are added by the validator.

validate_pain_points:
  description: >
    **NICHE CONTEXT:** {niche_description}

    Score and validate the extracted pain points using evidence-based criteria to
    identify the highest-potential opportunities for the niche above.

    **CRITICAL CONSTRAINT: 1:1 Mapping Required**

    You will receive a PainPointExtraction object from the previous task containing
    extracted_pain_points. You MUST score EXACTLY these pain points - no more, no fewer.

    - DO NOT add new pain points
    - DO NOT merge pain points together
    - DO NOT split pain points apart
    - DO NOT remove pain points unless absolutely insufficient evidence (mark with 0.0 scores instead)
    - Your output must contain the SAME pain point titles and descriptions as the input

    Think of your job as: Take the list you received → Add scores → Return the same list with scores.


    **SCORING RUBRIC** (Apply your Evidence-Based Scoring Framework):

    | Score Range | Severity Indicators | Willingness-to-Pay Indicators |
    |-------------|---------------------|-------------------------------|
    | **0.8-1.0** (High) | Critical business impact, workflow blocker, strong emotional language ("nightmare", "critical", "can't work without") | Explicit payment mentions, budget availability, current spend on inadequate solutions |
    | **0.5-0.7** (Medium) | Significant inconvenience, wastes time/money, clear frustration | Frustration with existing paid tools, value/ROI mentions |
    | **0.3-0.4** (Low) | Notable annoyance, mentioned but not critical | Some consideration for solutions, no money mentions |
    | **0.0-0.2** (Minimal) | Minor inconvenience, weak signals | No financial indicators, expect free solutions |

    **WORKFLOW:**
    1. Review extracted pain points with supporting evidence
    2. Query knowledge sources for severity/WTP indicators (use keywords: "critical", "pay", "cost", "budget", "time", "revenue")
    3. Apply scoring rubric with quote-based justification
    4. Prioritize by opportunity level (High: both scores ≥0.6, Medium: one score ≥0.6, Low: both <0.6)

    **QUALITY STANDARDS:**
    - Scores must be defensible with quotes
    - Discriminate—not everything is 0.9
    - Score conservatively when uncertain
    - Cross-reference Reddit + Twitter evidence


    **CRITICAL DATA ACCURACY RULES:**

    - Scores MUST be based ONLY on evidence you can find in knowledge sources through queries
    - If knowledge source queries return insufficient evidence for a score, assign 0.0 and note "Insufficient evidence"
    - DO NOT assign scores based on assumptions about what severity "should" be for this type of problem
    - Every severity score ≥0.5 MUST have at least one direct quote showing strong emotional language or business impact
    - Every WTP score ≥0.5 MUST have at least one quote mentioning money, budget, cost, or pricing
    - If you cannot find evidence for BOTH severity and WTP, consider removing that pain point entirely
    - Acceptable output: Fewer validated pain points with solid evidence beats more pain points with weak/invented justifications
    - DO NOT use your general knowledge about markets to inflate scores - ONLY use discoverable evidence


    **Acceptance Criteria:**

    - All extracted pain points scored on both dimensions
    - Score justifications reference specific evidence
    - At least 40% of pain points score ≥0.6 on both dimensions
    - Pain points ranked by opportunity level (High/Medium/Low)
    - Top 5 pain points clearly identified with supporting rationale

  expected_output: >
    A complete PainPointAnalysisResult Pydantic model with the following structure:


    **pain_points** (List[PainPoint]): MUST contain EXACTLY the same pain points as the input
    PainPointExtraction.extracted_pain_points, with scores added. Each pain point contains:
    - title: SAME title as input UnvalidatedPainPoint
    - description: SAME description as input UnvalidatedPainPoint
    - mention_count: SAME mention_count as input UnvalidatedPainPoint
    - severity_score: NEW - Float 0.0-1.0 based on evidence analysis
    - willingness_to_pay: NEW - Float 0.0-1.0 based on financial signals
    - opportunity_level: NEW - OpportunityLevel enum (high/medium/low) based on scores
    - representative_quotes: SAME quotes as input UnvalidatedPainPoint
    - source_platforms: SAME platforms as input UnvalidatedPainPoint
    - categories: SAME categories as input UnvalidatedPainPoint


    **niche**: The niche being analyzed


    **total_mentions**: Sum of all mention counts across pain points


    **top_categories**: List of 3-5 most frequently mentioned problem categories


    **analysis_summary**: 4-6 sentence executive summary covering:
    - Total pain points validated (MUST match input count)
    - Distribution across opportunity levels (High/Medium/Low)
    - Key patterns and insights
    - Top 3 recommended pain points for solution development
    - Overall market signal strength


    CRITICAL VALIDATION:
    - len(output.pain_points) MUST equal len(input.extracted_pain_points)
    - All titles from input must appear in output
    - Only add scores and opportunity_level - preserve all other fields exactly

# IdeaGenerationCrew Tasks

brainstorm_solutions:
  description: >
    Generate innovative SaaS solution concepts that directly address the validated
    pain points from the previous analysis stage.

    # Validated Pain Points for Solution Ideation

    ## Analysis Summary
    {analysis_summary}

    ## High-Opportunity Pain Points ({high_priority_count} identified)
    {high_priority_list}

    ## Medium-Opportunity Pain Points ({medium_priority_count} identified)
    {medium_priority_list}

    ## Top Categories
    {top_categories}

    Total validated pain points: {total_pain_points}
    Total mentions across all discussions: {total_mentions}

    ═══════════════════════════════════════════════════════════════════════════


    **What to do:**

    1. Review the validated pain points, focusing on High and Medium opportunity ones
    2. For each major pain point or cluster, brainstorm 1-2 SaaS solution concepts
    3. Focus on solutions that can be built as MVP within 3-6 months
    4. Consider DIVERSE solution approaches - don't limit yourself to one type. Examples include
       (but are NOT limited to):
       - Workflow & automation tools
       - Catalogs, directories, aggregators, marketplaces
       - Integration & connectivity platforms
       - Analytics & reporting dashboards
       - Collaboration & communication tools
       - Comparison engines & discovery platforms
       - Productivity & management systems
       **IMPORTANT**: These are just examples - be creative! Generate ANY type of solution
       that effectively addresses the validated pain points, even if it doesn't fit these categories.
    5. Ensure each solution has clear value proposition tied to pain point relief
    6. CRITICAL: For each solution, provide a DETAILED description explaining exactly HOW the
       service works from the user's perspective - what steps they take, what they see, what
       outcomes they get. Make it concrete enough that someone could visualize using it.
    7. IMPORTANT: Explain WHY each solution was selected based on the specific pain points
       and user frustrations discovered in the research


    **How to approach:**

    - Think in terms of user workflows and jobs-to-be-done
    - Prioritize solutions that address multiple pain points simultaneously
    - Focus on WHAT the solution does and WHY it matters to users, not HOW to build it technically
    - **Describe HOW users interact with the solution**: What's the step-by-step user journey?
      What do they click/search/input? What results do they get? Be specific and concrete.
    - Consider feasibility at a high level—avoid requiring breakthrough technology
    - Think about network effects, data advantages, and defensibility
    - **For catalog/aggregator solutions**: Identify what data needs to be aggregated, where it
      comes from, and how users discover/filter/compare it. Set requires_data_aggregation=True
      and specify data_sources for these solutions.
    - Consider business model from day one (SaaS pricing, freemium, usage-based, marketplace fees)
    - Reference specific pain point data (severity scores, user quotes, mention counts) to
      justify why this solution is needed


    **Project Type Constraints:**

    {allowed_project_types}

    If specific project types are listed above, you MUST generate solutions ONLY of those types.
    If "No constraints" is shown, you are free to suggest any solution type that best addresses the pain points.

    **Valid Solution Types** (Apply your "Indexable Pages First" framework):

    | Type | SEO Advantage | Programmatic SEO Potential | Organic CAC | Paid CAC | Content Model |
    |------|---------------|---------------------------|-------------|----------|---------------|
    | **directory** | User submissions = unique pages | Each listing = landing page | $15-30 | $200-350 | Submissions generate fresh content continuously |
    | **aggregator** | Comprehensive authoritative content | Category × location × filter permutations | $20-40 | $180-300 | Data combinations create comparison pages |
    | **comparison-tool** | High buyer-intent "[A] vs [B]" queries | N tools = N² comparison pages | $50-100 | $200-350 | User reviews + spec comparisons |
    | **marketplace** | Profiles + listings + reviews layers | Service × location × category variations | $80-150 (→$30-60) | $200-400 | User-generated content from transactions |
    | **saas** | Limited programmatic opportunities | Minimal (marketing + integrations) | $200-400 | $300-600 | Manual blog/tutorial creation |

    **For each solution:**
    - Set the `project_type` field to match one of the allowed types
    - Ensure the solution concept aligns with the characteristics of that project type
    - Example: If project_type='directory', the solution should involve curating/listing resources, not workflow automation


    **Search Strategy for Knowledge Sources:**

    You have access to knowledge sources containing ALL user quotes and pain point evidence
    (not just the truncated summaries above). Query them to enrich your solution concepts:

    - Search for specific pain point details: Query by pain point title to find ALL quotes
    - Search for user language: "struggling", "frustrated", "can't", "difficult", "need"
    - Search for existing workarounds: "using", "tried", "currently", "manual", "spreadsheet"
    - Search for impact indicators: "hours", "time", "money", "cost", "expensive", "waste"
    - Search for severity signals: "critical", "blocker", "impossible", "breaks", "fails"
    - Search for willingness to pay: "would pay", "need", "solution", "tool", "product"

    Use these queries to find additional user quotes that support your solution rationale.
    The knowledge sources contain 3-5 quotes per pain point (vs. 1 in the summary above).


    **SEO-FIRST SOLUTION DESIGN** (Prioritize organic content generation for lowest CAC):

    | Tier | Approach | SEO Score | Examples | Key Questions |
    |------|----------|-----------|----------|---------------|
    | **BEST** | Self-Generating Content | 0.8-1.0 | User submissions (directories), data aggregation (aggregators), UGC (marketplaces) | What unique pages from core actions? 100+ pages year 1? |
    | **GOOD** | Programmatic Content | 0.5-0.7 | Category × filter combos, geographic variations, template guides | What page patterns from data? What's multiplication factor? |
    | **LIMITED** | Manual Content Marketing | 0.2-0.4 | Blog posts, tutorials, use cases | How many pages realistically? Can we add directory features? |

    **Required SEO Fields for EVERY Solution:**
    - programmatic_seo_opportunity: Content generation mechanism + page count potential
    - content_generation_model: What content gets created (user/data/manual)
    - organic_discovery_queries: 5-10 actual search queries users would type
    - estimated_cac_organic: Use project type CAC benchmarks from table above
    - estimated_cac_paid: Estimate based on niche keyword competitiveness
    - seo_scalability_score: 0.8-1.0 (directory/aggregator), 0.5-0.7 (comparison/marketplace), 0.2-0.4 (SaaS)


    **CRITICAL DATA ACCURACY RULES:**

    - ONLY generate solutions if high_priority_count > 0 OR medium_priority_count > 0
    - If you see "[None identified]" in EITHER the high-priority or medium-priority pain point lists, you MUST STOP immediately
    - DO NOT generate solutions based on general knowledge of what problems might exist in this niche
    - Every solution MUST explicitly reference specific pain point titles, severity scores, or mention counts from the validated data above
    - If total_pain_points < 3, you MUST return an error stating "Insufficient validated pain points for solution generation"
    - DO NOT invent pain points that weren't in the validation results in order to create solutions
    - Each solution's "Pain Points Addressed" section must list actual pain point titles from the data above
    - Acceptable output: Empty solution list with explanation "Insufficient validated pain point data" if data is missing or low quality
    - DO NOT proceed if the analysis_summary indicates weak data signals or insufficient evidence


    **Acceptance Criteria:**

    - Generate 3-5 distinct solution concepts
    - Each concept addresses at least one High-opportunity pain point
    - Solutions are technically feasible with current technology
    - Clear value proposition articulated for each
    - MVP scope realistic for 3-6 month development
    - Strong rationale connecting solution to discovered pain points

  expected_output: >
    Solution concept brainstorm document with 3-5 solution ideas, each containing:


    1. **Solution Name**: Catchy, descriptive name
    2. **One-Line Value Proposition**: Clear statement of the core benefit
    3. **Pain Points Addressed**: List which validated pain points this solves (reference
       by title and severity level)
    4. **Why This Solution**: 2-3 sentences explaining WHY this idea was selected based
       on the pain point research—reference specific user frustrations, severity scores,
       or quotes that justify the need
    5. **Detailed Description - How It Works**: 4-6 sentences explaining the complete user
       journey from start to finish. Be specific: What does the user see when they first arrive?
       What actions do they take? What inputs do they provide? What results/outputs do they get?
       How does the solution deliver value? Make it concrete enough that someone could visualize
       using the service without seeing a mockup.
    6. **Core Concept**: 2-3 sentence high-level summary of WHAT the solution does
    7. **MVP Feature Set**: 5-7 essential features for the initial version (user-facing
       capabilities, not technical components)
    8. **Solution Approach**: 1-2 sentences on the general approach (e.g., "marketplace
       model," "curated directory," "workflow automation," "analytics dashboard") - NO detailed tech stack
    9. **Business Model Sketch**: Initial thoughts on pricing/monetization (subscriptions,
       marketplace fees, freemium, usage-based, etc.)
    10. **Key Differentiators**: What makes this unique or better than existing alternatives
    11. **Project Type**: Categorize as one of: saas, directory, aggregator, comparison-tool, marketplace

    **12. SEO & Organic Acquisition (REQUIRED):**
    - **programmatic_seo_opportunity**: Assessment of programmatic SEO potential with page count estimates (e.g., "High - directory listings generate 100+ unique pages in Year 1")
    - **content_generation_model**: How content gets created - user-generated, data-driven aggregation, or manual content marketing (e.g., "User submissions create unique tool pages")
    - **organic_discovery_queries**: 5-10 specific search queries users would type to find this solution (e.g., "best project management tool for remote teams", "project tracking software comparison")
    - **estimated_cac_organic**: Customer acquisition cost via organic SEO/content channels with rationale (e.g., "$15-30" for directories, "$20-40" for aggregators, "$50-100" for comparison tools, "$200-400" for SaaS)
    - **estimated_cac_paid**: Customer acquisition cost via paid advertising for comparison (e.g., "$200-350" based on keyword competitiveness)
    - **seo_scalability_score**: 0.0-1.0 scale based on architecture (0.8-1.0 for directories/aggregators, 0.5-0.7 for comparison/marketplace, 0.2-0.4 for SaaS)


    Format: Structured markdown with clear sections for each solution.
    Length: 1200-1800 words total.
    NOTE: Focus on user value and pain point relief, NOT technical implementation details.

evaluate_solutions:
  description: >
    Critically assess the brainstormed solution concepts across multiple dimensions
    to identify strengths, weaknesses, and risks.


    **What to do:**

    1. Analyze each solution concept on four key dimensions:

       **Technical Feasibility (0.0-1.0 scale):**
       - Can this be built with current technology?
       - What are the technical risks or challenges?
       - Are there third-party dependencies or integration challenges?
       - 0.8-1.0: Highly feasible with current tech, minimal risks
       - 0.5-0.7: Feasible but with moderate challenges or dependencies
       - 0.3-0.4: Significant technical challenges or uncertainties
       - 0.0-0.2: Major technical barriers or breakthrough tech required

       **Market Fit (0.0-1.0 scale):**
       - How directly does this address the validated pain points?
       - Is the target market clearly defined?
       - Are there adoption barriers?
       - 0.8-1.0: Perfect alignment with high-opportunity pain points
       - 0.5-0.7: Good fit with clear target market, minor barriers
       - 0.3-0.4: Partial fit or unclear market definition
       - 0.0-0.2: Weak connection to validated pain points

       **Development Complexity (Low/Medium/High):**
       - Time to MVP estimate
       - Team size requirements
       - Technical expertise needed

       **Differentiation Potential (0.0-1.0 scale):**
       - How crowded is this solution space?
       - What makes this solution defensible?
       - Is there a unique insight or approach?
       - 0.8-1.0: Unique approach with strong defensibility
       - 0.5-0.7: Clear differentiation in crowded market
       - 0.3-0.4: Limited differentiation, competitive market
       - 0.0-0.2: Commoditized space with weak differentiation

       **Organic Acquisition Potential (0.0-1.0 scale):**
       - How effectively can this solution acquire customers through SEO/content?
       - Does the product architecture naturally generate indexable content?
       - What is the programmatic SEO opportunity?
       - How does CAC compare: organic vs paid channels?
       - 0.8-1.0: High programmatic SEO potential (directories, aggregators generating 100+ unique pages)
       - 0.5-0.7: Moderate content opportunities (comparison tools, marketplaces with UGC)
       - 0.3-0.4: Limited to traditional content marketing (SaaS with blog/guides)
       - 0.0-0.2: Minimal SEO leverage (tool-only products requiring paid acquisition)

    2. Identify key risks and challenges for each solution
    3. Note any dependencies (technical, partnerships, data, etc.)
    4. Provide honest assessment of competitive positioning
    5. Rank solutions by overall opportunity potential


    **How to approach:**

    - Be critically honest—this is not advocacy, it's evaluation
    - Consider implementation realities, not just ideal scenarios
    - Think about what could go wrong—technical, market, competitive risks
    - Evaluate timing—is the market ready for this solution?
    - Consider defensibility—can this solution build moats over time?


    **Search Strategy for Evidence Validation:**

    Use knowledge sources to validate market fit scores against actual user evidence:

    - Query pain point titles to verify alignment with solution concepts
    - Search for severity indicators to validate problem intensity claims
    - Search for WTP signals: "would pay", "willing to spend", "cost", "worth"
    - Search for market readiness: "need", "urgent", "asap", "immediately"
    - Cross-reference solution features with actual user requests in quotes


    **Acceptance Criteria:**

    - All solutions scored on all four dimensions
    - Scores justified with reasoning
    - Key risks identified for each solution
    - Comparative analysis provided
    - Clear recommendation or ranking

  expected_output: >
    EvaluationResult Pydantic model with ALL required fields:


    **evaluations** (List[SolutionEvaluation]): For each solution, you MUST provide:

    - solution_name: Exact name from brainstorm
    - technical_feasibility_score: Float 0.0-1.0 (0.8-1.0=highly feasible, 0.5-0.7=moderate challenges, 0.0-0.4=significant barriers)
    - market_fit_score: Float 0.0-1.0 (0.8-1.0=perfect alignment, 0.5-0.7=good fit, 0.0-0.4=weak connection)
    - development_complexity: String - EXACTLY one of: "Low", "Medium", "High"
    - estimated_development_time: String in format "X-Y months" (e.g., "3-4 months", "6-8 months")
    - differentiation_potential: Float 0.0-1.0 (0.8-1.0=unique, 0.5-0.7=clear differentiation, 0.0-0.4=commoditized)
    - organic_acquisition_potential: Float 0.0-1.0 (0.8-1.0=high SEO/content potential, 0.5-0.7=moderate, 0.3-0.4=limited, 0.0-0.2=minimal)
    - strengths: List of 3-5 strings describing key advantages
    - weaknesses: List of 3-5 strings describing concerns/risks
    - key_risks: List of 2-4 strings describing critical failure factors


    **ranking** (List[str]): Solution names in ranked order by overall opportunity


    **comparative_analysis** (str): 2-3 paragraph comparison with clear recommendation of top 2-3 solutions


    IMPORTANT: This MUST be a valid EvaluationResult Pydantic model with ALL fields populated.
    DO NOT output markdown text - output structured data only.

refine_solutions:
  description: >
    Transform the evaluated solution concepts into comprehensive, actionable product
    proposals ready for validation and development planning.


    **FIELD HANDLING REQUIREMENTS** (from EvaluationResult context):

    | Field | Action | Rule |
    |-------|--------|------|
    | technical_feasibility_score | PRESERVE exactly | Copy from evaluation (0.0-1.0) |
    | market_fit_score | PRESERVE exactly | Copy from evaluation (0.0-1.0) |
    | estimated_development_time | PRESERVE exactly | Copy from evaluation ("X-Y months") |
    | technical_approach | REQUIRED | 2-3 sentence architecture (platform, integrations, storage, tech) |
    | data_sources | REQUIRED | List APIs if requires_data_aggregation=True, else [] |

    All fields mandatory (no null values). Extract from context, don't recalculate.


    **Search Strategy for Persona and Strategy Development:**

    Use knowledge sources to ground personas, pricing, and positioning in actual user data:

    - Search for user self-descriptions: "I'm a", "we're a", "our team", "my role"
    - Search for demographic signals: company size, industry, role titles, team structure
    - Search for budget/pricing discussions: "pay", "budget", "cost", "expensive", "worth", "pricing"
    - Search for feature requests and workflows: "would love", "wish", "if only", "need to"
    - Search for competitive comparisons: "vs", "compared to", "alternative", "switching from"
    - Query pain point titles directly to find ALL quotes with user context

    These searches will help you create:
    - Authentic, data-driven personas (not generic profiles)
    - Evidence-based pricing strategy (from actual WTP signals)
    - Defensible positioning (from real competitive mentions)


    **SOLUTION-TYPE REFINEMENT PATTERNS**:

    - **Catalog/Directory/Aggregator**: Curation criteria, content sourcing, taxonomy, freshness strategy, discovery UX
    - **Marketplace**: Two-sided bootstrapping, trust mechanisms, transaction flow, supply acquisition
    - **Comparison Engine**: Attribute normalization, scoring methodology, data prioritization, update frequency
    - **Workflow/SaaS**: User workflow mapping, integration points, customization balance

    Preserve detailed "How It Works" user journey from ideation phase.


    **What to do:**

    1. Take the top 2-3 solutions from the evaluation ranking
    2. Apply Field Handling Requirements table above (preserve scores, populate required fields)
    3. Develop comprehensive details for each solution:

       **Target Personas:**
       - Define 2-3 specific buyer/user personas with demographics, roles, goals,
         pain points, and buying behavior

       **Detailed Feature Specifications:**
       - Expand MVP features into user stories or feature descriptions
       - Prioritize features (Must-have / Should-have / Nice-to-have)
       - Consider user workflows and feature interconnections

       **Unique Value Proposition:**
       - Craft compelling UVP that differentiates from alternatives
       - Focus on outcomes and benefits, not just features
       - Make it clear, specific, and user-centered

       **Pricing Strategy:**
       - Recommend pricing model (subscription tiers, usage-based, freemium)
       - Suggest price points based on value delivered and market comps
       - Consider customer acquisition economics

       **Go-to-Market Positioning:**
       - How to position against competitors
       - Key messaging themes
       - Marketing channel recommendations

       **Data Requirements:**
       - Assess if this solution requires data aggregation from multiple sources
       - Identify specific data sources needed (APIs, web scraping, user input, etc.)
       - Note any data partnerships or integrations required

    3. Add any additional strategic details that strengthen the product vision


    **How to approach:**

    - Think like a product strategist preparing a funding pitch
    - Make personas specific and realistic—avoid generic descriptions
    - Ensure features map to persona needs and pain points
    - Price based on value delivered, not costs
    - Positioning should highlight what makes this solution special


    **Quality Standards:**

    - Every detail should be actionable and specific
    - Personas should guide targeting and messaging decisions
    - Features should be understandable to developers and designers
    - UVP should be testable with target users
    - Pricing should be defensible with market analysis


    **Acceptance Criteria:**

    - 2-3 solutions fully refined
    - Each has 2-3 detailed personas
    - Feature specifications prioritized and user-story formatted
    - Compelling UVP articulated
    - Pricing strategy with rationale
    - Go-to-market positioning clear

  expected_output: >
    Comprehensive product proposals as IdeaGenerationResult Pydantic model:


    **solution_ideas** (List[SolutionIdea]): Each containing:

    - solution_name: Clear, memorable name
    - value_proposition: One compelling sentence
    - pain_points_addressed: List of pain point titles from validation
    - description: DETAILED explanation of HOW the solution works from the user's perspective
      (4-6 sentences minimum). Must include complete user journey: what users see when they
      arrive, what actions they take, what inputs they provide, what results they get, and
      how value is delivered. Should be concrete enough to visualize using the service.
    - target_personas: List of 2-3 detailed persona descriptions (each 3-4 sentences
      with role, goals, pain points, buying behavior)
    - core_features: List of 8-12 prioritized features with brief descriptions
    - technical_approach: (REQUIRED - NOT NULL) Architecture overview and key technologies (2-3 sentences)
    - differentiation_factors: List of 3-5 unique differentiators
    - requires_data_aggregation: Boolean - does this solution need to aggregate data
      from multiple sources?
    - data_sources: (REQUIRED - NOT NULL) List of specific data sources if aggregation needed,
      empty list [] otherwise. DO NOT leave as null.
    - estimated_development_time: (REQUIRED - NOT NULL) "X-Y months" estimate extracted from evaluation
    - pricing_strategy: Detailed pricing model recommendation
    - market_fit_score: (REQUIRED - NOT NULL) Float 0.0-1.0 extracted EXACTLY from evaluation
    - technical_feasibility_score: (REQUIRED - NOT NULL) Float 0.0-1.0 extracted EXACTLY from evaluation
    - project_type: One of the allowed types (saas, directory, aggregator, comparison-tool, marketplace)


    **VALIDATION REQUIREMENT:** ALL solutions MUST have these fields populated:
    - technical_approach (not null, not empty)
    - data_sources (not null - can be empty list [])
    - estimated_development_time (not null)
    - market_fit_score (not null)
    - technical_feasibility_score (not null)


    **recommended_solution**: The top solution ID/name


    **market_insights**: 4-5 sentence summary of key strategic insights across all
    refined solutions


    The model should be properly structured for JSON serialization.

incorporate_competitive_insights:
  description: >
    Enhance the existing solution concepts with competitive intelligence discovered
    in the market analysis. For each solution, incorporate market gaps, positioning
    opportunities, and competitive insights to strengthen differentiation.

    **CRITICAL - Field Management Rules:**

    | Field | Action | Rule |
    |-------|--------|------|
    | technical_feasibility_score | PRESERVE exactly | DO NOT modify - technical difficulty independent of competition |
    | market_fit_score | EXTRACT + optionally ADJUST UP | May increase by max 0.1 if gaps reveal better fit. NEVER decrease. NEVER null. |
    | technical_approach | EXTRACT + optionally ENHANCE | May ADD 1-2 sentences on competitive differentiation. Preserve core. |
    | estimated_development_time | EXTRACT + optionally ADJUST | If adding 3+ features, adjust timeline (e.g., "3-4" → "4-5 months"). |

    All fields mandatory - extract from solutions below, DO NOT leave null.

    **CRITICAL - Solution Name Preservation:**
    When creating enhanced SolutionIdea objects, you MUST use the EXACT solution names
    from the "Original Solutions" input above. DO NOT rename, rephrase, or modify solution names.
    Example: If input shows "Unpakt", output MUST be "Unpakt" (not "MoveGuard" or any variation).

    **Original Solutions:**
    {solutions_summary}

    **Competitive Intelligence Per Solution:**
    {competitive_landscapes}

    **WORKFLOW:**

    1. Review competitive landscape per solution → gaps, differentiation opportunities, positioning, pricing
    2. Enhance solution targeting gaps:
       - Add features addressing market gaps
       - Update differentiation_factors with competitive insights
       - Refine value_proposition against competitor weaknesses
       - Adjust pricing_strategy based on competitive context
    3. Maintain integrity:
       ✓ Add, refine, sharpen (preserve core)
       ✓ Trace enhancements to specific competitive insights
       ✗ Create new solutions or remove core features

    **QUALITY TARGETS:**
    - 2-3 NEW differentiation factors per solution from competitive gaps
    - Features directly address identified market gaps
    - Value proposition sharpened (not replaced) for competitive advantage
    - Evidence-based enhancements tied to specific competitive findings

  expected_output: >
    IdeaGenerationResult Pydantic model with ENHANCED solutions:

    **solution_ideas** (List[SolutionIdea]): Each solution enhanced with:
    - solution_name: **MUST BE EXACT MATCH** to original input name (e.g., "Unpakt" → "Unpakt", NOT "MoveGuard")
    - description: PRESERVED (core description intact, may be slightly enhanced)
    - value_proposition: REFINED to sharpen competitive positioning
    - pain_points_addressed: UNCHANGED (original pain points preserved)
    - core_features: ENHANCED with 2-4 new features targeting market gaps
    - target_personas: UNCHANGED or slightly refined
    - technical_approach: ENHANCED - Extract original value and optionally add 1-2 sentences about competitive technical differentiation
    - differentiation_factors: SIGNIFICANTLY ENHANCED with 2-3 new factors from competitive analysis
    - requires_data_aggregation: UNCHANGED
    - data_sources: UNCHANGED or enhanced if new data needs identified
    - estimated_development_time: ADJUSTED IF NEEDED - Extract original value, adjust only if adding 3+ significant features
    - pricing_strategy: REFINED with competitive pricing insights and positioning
    - market_fit_score: EXTRACT and optionally ADJUST UP (by max 0.1) if competitive gaps reveal stronger market fit
    - technical_feasibility_score: PRESERVE EXACTLY from original solution input (DO NOT modify - DO NOT leave null)

    **recommended_solution**: Top solution name (can be adjusted if competitive insights change ranking)

    **market_insights**: UPDATED summary incorporating competitive learnings (4-6 sentences)

    Enhanced solutions ready for selection with competitive advantages baked in.

# CompetitiveCrew Tasks

research_competitors:
  description: >
    Research competitors for each of the {solution_count} solution concepts provided below.

    # Solution Concepts for Competitive Research

    **Number of Solutions:** {solution_count}

    **Market Insights:**
    {market_insights}

    **Recommended Focus:**
    {recommended_solution}

    ## Solution Details:
    {solutions_list}

    ═══════════════════════════════════════════════════════════════════════════

    **Objective:**
    For each solution above, identify 2-3 primary competitors and 1-2 alternative solutions.
    Use search tools to research products, pricing, features, and customer feedback.

    **Research Strategy:**

    1. **Primary Research (SerperDevTool):**
       - Search for direct competitors using web search
       - Find official product pages, pricing, and feature lists
       - Look for reviews, comparisons, and market analyses

    2. **User Intelligence (Optional Knowledge Sources):**
       - If available, you have access to user discussions mentioning existing tools
       - Query knowledge sources for: "What tools do users currently use?"
       - Search for user mentions of competitors, alternatives, and switching behavior
       - Find pricing complaints, feature gaps, and user sentiment
       - Use queries like: "alternative to", "switched from", "using", "compared to"

    3. **Synthesis:**
       - Combine official product data with real user intelligence
       - Identify gaps between marketing claims and user experiences
       - Note what users actually say about existing solutions

    **Key Deliverables per Competitor:**
    - Product name, website, and description
    - 3-5 core features and capabilities
    - Pricing model and price points
    - 2-3 strengths (what users like - cite sources if from user discussions)
    - 2-3 weaknesses (what users complain about - cite user quotes if available)
    - Market positioning (target audience, key messaging)


    **CRITICAL DATA ACCURACY RULES:**

    - ONLY report competitors you discover via SerperDevTool web searches OR knowledge source queries
    - If SerperDevTool search returns no relevant results for a solution, you MUST state "No direct competitors found via search"
    - DO NOT invent competitor names, products, or features based on assumptions about what might exist in the market
    - Every competitor name MUST be verified with a real website or source - if you cannot find a website, mark as [UNVERIFIED]
    - Pricing information MUST come from actual search results or official sources - if not found, state "Pricing not publicly available"
    - User feedback (strengths/weaknesses) MUST be cited with sources - either URLs from search or platform mentions from knowledge sources
    - If knowledge sources are empty or return no results about existing tools, state "No user discussions about existing tools available"
    - Acceptable output: "Competitive research inconclusive - insufficient search results" for solutions where you cannot find verified competitors
    - DO NOT fill gaps with generic competitors you think might compete in this space - ONLY verified findings


  expected_output: >
    Markdown report with competitor profiles for each solution:

    **For each solution:**

    1. **Solution Name**

    2. **Competitive Landscape Summary** (2-3 sentences)

    3. **Direct Competitors** (2-3 companies):
       - Name, website
       - Core features (3-5 bullets)
       - Pricing model
       - Strengths (2-3 points)
       - Weaknesses (2-3 points)
       - Target audience

    4. **Alternative Solutions** (1-2 options)

    5. **Customer Sentiment** (2-3 sentences on what users say about existing tools)

    6. **Market Gaps** (2-3 observations about unmet needs)

    Format: Well-organized markdown. Length: 1000-1500 words per solution.

analyze_competitive_landscape:
  description: >
    Analyze the competitive research from the previous task to identify market gaps,
    differentiation opportunities, and strategic positioning for each solution.

    **CRITICAL - Solution Name Preservation:**
    When creating CompetitiveLandscape objects, you MUST use the EXACT solution names
    from the research task above. DO NOT rename, rephrase, or modify solution names.
    For example, if the research task analyzed "HomeRelay", your output MUST use
    solution_name="HomeRelay", NOT "CareBridge Enterprise Mobility Management" or any other variation.

    **Objective:**
    For each solution researched, identify market gaps, differentiation strategies,
    competitive intensity, and positioning recommendations based on the competitor
    data from the previous task.

    **Analysis Approach:**

    1. **Synthesize Research Findings:**
       - Review competitor profiles from previous task
       - If knowledge sources were used, note user sentiment insights
       - Identify patterns in competitor strengths and weaknesses

    2. **Identify Market Gaps:**
       - Where do existing solutions fall short?
       - What do users complain about? (from user discussions if available)
       - What features/approaches are missing from the market?

    3. **Assess Competitive Intensity:**
       - How crowded is this market?
       - Are competitors well-funded and established?
       - How difficult is it to differentiate?

    **Key Analysis Areas:**
    - Market gaps (unmet needs, underserved segments, user complaints)
    - Differentiation opportunities (features, pricing, positioning, user experience)
    - Competitive intensity assessment (Low/Medium/High with justification)
    - Strategic positioning recommendations (based on gaps and user needs)

  expected_output: >
    CompetitiveAnalysisResult Pydantic model:

    **solution_landscapes** (List[CompetitiveLandscape]): For each solution:
    - **solution_name** - CRITICAL: MUST be EXACTLY the same name as provided in the research task input (e.g., if input was "HomeRelay", output MUST be "HomeRelay", NOT "CareBridge Enterprise Mobility Management" or any variation). DO NOT rename, rephrase, or modify the solution name.
    - competitors (List[Competitor])
    - market_gaps (3-5 unmet needs)
    - differentiation_opportunities (3-5 ways to differentiate)
    - competitive_intensity ("Low"/"Medium"/"High" with 1-2 sentence justification)
    - recommended_positioning (2-3 sentence strategy)
    - pricing_insights (market pricing analysis)

    **top_opportunities** (List[str]): 3-5 top differentiation opportunities across all solutions

    **strategic_recommendations**: 4-5 sentence executive summary covering competitive
    landscape assessment, which solutions have clearest advantage, and key strategic insights

# SEOStrategyCrew Tasks

expand_keywords_conceptually:
  description: >
    Phase 9.5a: Conceptual Keyword Expansion - Generate 100-200 strategic keywords
    organized by topic clusters WITHOUT using DataForSEO yet. This is pure strategic
    thinking to identify what keywords SHOULD exist before validating with real data.

    **Context:**
    - Niche: {niche}
    - Selected Solution: {selected_solution_name}
    - Value Proposition: {selected_solution_value_prop}
    - Pain Points: {selected_solution_pain_points}
    - Target Personas: {selected_solution_personas}
    - Core Features: {selected_solution_features}
    - Competitive Context: {competitive_context}

    **Your Task: Strategic Keyword Expansion**

    Think like a searcher experiencing the pain points in this niche. What would they type
    into Google at different stages of their journey? Generate keywords covering:

    **1. Identify 5-8 Topic Clusters**

    Group keywords by major themes (e.g., "Visa Application Process", "Cost Estimation",
    "Document Preparation", "Timeline Planning"). Each cluster should represent a distinct
    user need or journey stage.

    For each cluster, specify:
    - **name**: Topic cluster name
    - **description**: Brief description of this topic area
    - **strategic_importance**: 1-5 (1=critical for SEO, 5=nice-to-have)

    **2. Generate 100-200 Conceptual Keywords**

    For each keyword, provide:
    - **keyword**: The search phrase (1-6 words, concrete and searchable)
    - **cluster**: Which topic cluster it belongs to
    - **priority**: 1-5 (1=highest strategic priority, 5=lowest)
    - **rationale**: Why this keyword matters (1 sentence)

    **Keyword Categories & Distribution:**

    | Category | Target % | What to Include | Examples | Extract From |
    |----------|----------|-----------------|----------|--------------|
    | Problem Discovery | 30% | First encounter searches | "visa application complicated" | Pain points |
    | Solution Seeking | 25% | Looking for solutions | "visa application service" | Value prop |
    | Feature/Capability | 20% | Specific functionalities | "track visa status" | Core features |
    | Competitor/Alternative | 15% | Branded searches | Real competitor names ONLY | competitive_context |
    | Geographic/Demographic | 10% | Location/user-specific | "US visa application" | Personas |

    **Quality Rules:**
    ✓ Specific, not generic ("portugal tax residency" NOT "tax problems")
    ✓ Searchable phrases (what people TYPE, not TALK)
    ✓ Mix head (2-word) and long-tail (5-6 word)
    ✓ Cover funnel: Awareness → Consideration → Decision
    ✓ Programmatic SEO templates for directories/aggregators
    ✗ NO placeholders - concrete terms only

    **Cluster Distribution:**
    - All 5-8 clusters: ≥10 keywords each
    - High-importance (1-2): 25-40 keywords
    - Lower-importance (4-5): 8-15 keywords

    **Search Strategy:**
    Use knowledge sources to extract real user language patterns:
    - Query pain point quotes for actual search phrases users mentioned
    - Extract competitor names from competitive landscape for branded searches
    - Find feature-specific language in solution descriptions

  expected_output: >
    ExpandedKeywordList model with:

    **keywords**: List[ConceptualKeyword] (100-200 keywords)
    - keyword: str (the search phrase)
    - cluster: str (topic cluster name)
    - priority: int (1-5, strategic importance)
    - rationale: Optional[str] (why this keyword matters)

    **topic_clusters**: List[TopicCluster] (5-8 clusters)
    - name: str (cluster name)
    - description: str (what this cluster covers)
    - strategic_importance: int (1-5, SEO priority)

    **expansion_rationale**: str (2-3 sentences explaining overall expansion strategy)

    This structured output will be used for iterative DataForSEO enrichment to discover
    actual search volumes and related keywords.

create_strategy_from_enriched_keywords:
  description: >
    Phase 9.5c: Create comprehensive SEO strategy using PRE-ENRICHED keywords from
    Phase 9.5b iterative DataForSEO enrichment. You receive keywords that already
    have real search volumes and competition data.

    **Context:**
    - Niche: {niche}
    - Selected Solution: {selected_solution_name}
    - Enriched Keywords Count: {enriched_keywords_count}
    - Topic Clusters from Phase 9.5a: {topic_clusters_summary}

    **IMPORTANT: Keywords Are Already Enriched**

    You DO NOT need to:
    - Generate seed keywords (already done in Phase 9.5a)
    - Call DataForSEO tools (already done in Phase 9.5b)
    - Expand keywords (already done programmatically)

    You MUST:
    - Analyze the provided enriched keywords with REAL search volumes & competition
    - Create tiered opportunity structure based on actual data
    - Develop content strategy aligned with topic clusters
    - Create implementation roadmap with phased rollout

    **Enriched Keywords Available:**

    You have access to {enriched_keywords_count} keywords with the following data:
    - **keyword**: The search phrase (string)
    - **search_volume**: Average monthly searches (integer, real DataForSEO data)
    - **competition**: Competition level (string, format: "LOW (23)", "MEDIUM (54)", etc.)
    - **monthly_searches**: 12-month search volume trend (optional array)

    These keywords are organized across the following topic clusters from Phase 9.5a:
    {topic_clusters_summary}

    **Your Task: Data-Driven SEO Strategy**

    **STEP 1: Tier Assignment (Data-Driven)** - Apply your 3-Phase Compound SEO Roadmap:

    | Tier | Timeline | Selection Criteria | Count | Strategy |
    |------|----------|-------------------|-------|----------|
    | **Tier 1** | 0-3 months | HIGH vol (>2000) + LOW comp (<30)<br>OR MEDIUM vol (500-2000) + VERY LOW comp (<15) | 3-5 | Quick wins for fast traction |
    | **Tier 2** | 3-6 months | HIGH vol + MEDIUM comp (30-60)<br>OR strong strategic alignment | 3-5 | Balance volume & competition |
    | **Tier 3** | Geographic | Location-specific keywords by region | Groups | Regional expansion |
    | **Tier 4** | Category | Category/type/document clusters | Groups | Programmatic SEO templates |

    Calculate opportunity_score: search_volume / competition_index for ranking prioritization.

    **STEP 2: Topic Clustering & Content Strategy**

    Map keywords to content themes aligned with the topic clusters from Phase 9.5a.
    For each cluster:
    - Identify pillar content opportunity (high-volume core keyword)
    - List supporting cluster keywords (related long-tail terms)
    - Recommend content types (landing page, guide, comparison, FAQ)
    - Estimate traffic potential (sum of keyword volumes)

    **STEP 3: Content Calendar (First 90 Days)**

    Create prioritized content roadmap:
    - Week 1-4: Tier 1 quick wins (3-5 pieces)
    - Week 5-8: Tier 2 strategic content (3-5 pieces)
    - Week 9-12: Topic cluster expansion (5-8 pieces)

    For each content piece:
    - Primary keyword target
    - Content type and length
    - Estimated organic traffic (based on search volume)

    **STEP 4: Implementation Roadmap**

    | Phase | Timeline | Focus | Deliverables |
    |-------|----------|-------|--------------|
    | **Phase 1** | Month 1-3 | Foundation & Quick Wins | Tier 1 content, technical SEO basics, ranking tracking |
    | **Phase 2** | Month 4-6 | Strategic Expansion | Tier 2 content, topic cluster hubs, internal linking |
    | **Phase 3** | Month 7-12 | Scaling & Programmatic | Tiers 3-4 expansion, programmatic SEO, optimization |

    **STEP 5: Metrics & Success Criteria**

    Define success metrics based on actual keyword data:
    - Target organic traffic (sum of Tier 1 + Tier 2 volumes × estimated CTR)
    - Ranking goals (position 1-3 for Tier 1, position 1-10 for Tier 2)
    - Content production KPIs (pieces per month, word count targets)
    - Timeline to first traffic, first conversion

    **CRITICAL: Use Real Data Only**

    All recommendations must reference actual search volumes and competition indices
    from the enriched keywords. Do not estimate or hallucinate metrics - use the
    provided data or explicitly state "data not available" if missing.

  expected_output: >
    Complete SEOStrategyReport Pydantic model with:

    **tier_1_keywords**: List[TieredKeyword] (3-5 quick wins with real volumes)
    **tier_2_keywords**: List[TieredKeyword] (3-5 strategic keywords)
    **tier_3_geographic_groups**: List[GeographicKeywordGroup] (if applicable)
    **tier_4_category_groups**: List[CategoryKeywordGroup] (if applicable)
    **topic_clusters**: List[TopicClusterWithKeywords] (5-8 content themes)
    **content_recommendations**: List[ContentRecommendation] (15-25 content pieces)
    **implementation_phases**: List[ImplementationPhase] (3 phases with timelines)
    **competitive_positioning**: str (how to differentiate in search results)
    **success_metrics**: str (target traffic, rankings, timeline based on real data)
    **key_insights**: List[str] (3-5 insights from keyword analysis)
    **total_keywords_analyzed**: int (total enriched keywords received)
    **seed_keywords_generated**: List[str] (for backward compatibility, can be empty or subset)

    All keyword data in output MUST match the enriched keyword data provided - no hallucination.
