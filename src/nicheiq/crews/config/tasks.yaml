analyze_keyword_opportunities:
  description: >
    Perform complete keyword research workflow FOR THE SELECTED SOLUTION: generate seed keywords
    specifically for this solution, expand using DataForSEO, analyze results, and create tiered
    opportunity structure (Tier 1-4) prioritizing quick wins while building toward long-term authority.


    **Search Strategy for Intent-Based Keyword Mining:**

    Your knowledge sources contain ALL user quotes from pain point discussions. Query them to extract
    REAL SEARCH INTENT patterns that users would type into Google/search engines:

    **Problem Discovery Intent:**
    - Query: pain point titles + "how to", "why", "can't", "struggling", "difficult", "frustrated"
    - Look for: Question patterns, problem descriptions, emotional language
    - Extract: Actual phrases users would search when experiencing the problem

    **Solution-Seeking Intent:**
    - Query: "looking for", "need a", "any tool", "software that", "best way to", "how can I"
    - Look for: Users asking for recommendations, alternatives, or solutions
    - Extract: Capability searches (e.g., "tool to X", "software for Y")

    **Competitive Intelligence:**
    - Query: competitor names from competitive_context, "using", "tried", "switched from", "vs"
    - Look for: Users mentioning tools they currently use or tried
    - Extract: Actual competitor names for alternative keywords

    **Feature/Capability Focus:**
    - Query: feature names, "automate", "track", "manage", "monitor", "analyze"
    - Look for: Specific capabilities users want or lack in current tools
    - Extract: Feature-focused searches (e.g., "automated X", "bulk Y", "real-time Z")

    **Long-tail Problem Patterns:**
    - Query: pain point + persona/context from quotes (e.g., "for agencies", "with Gmail", "on Mac")
    - Look for: Very specific problem variations with context
    - Extract: Ultra-specific searches (e.g., "fix X for Y", "X when Z")

    **CRITICAL: Every seed keyword should be something a user would ACTUALLY TYPE into a search engine
    when they have the pain point but DON'T YET KNOW your solution exists.**


    **Niche:** {niche}

    **SELECTED SOLUTION TO FOCUS ON:**

    **Solution Name:** {selected_solution_name}
    **Value Proposition:** {selected_solution_value_prop}
    **Target Personas:** {selected_solution_personas}
    **Core Features:** {selected_solution_features}
    **Pain Points Addressed:** {selected_solution_pain_points}

    **Why This Solution Was Selected:**
    {selection_rationale}

    **Pain Points Context:**
    {pain_points_context}

    **Competitive Context for This Solution:**
    {competitive_context}

    **Your Complete Workflow:**

    **STEP 1: Generate SHORT Seed Keywords (Core Topics)**

    Generate 50-80 SHORT seed keywords (1-4 words) that represent CORE TOPICS related to the solution.
    More seeds = better expansion coverage. These seeds will be fed to DataForSEO to expand into 400-800 longer keyword variations.

    **CRITICAL CONCEPT: Seed keywords are SHORT root terms, NOT long search queries.**

    **What Seeds Are:**
    - Short core topics: 1-4 words typically
    - Root terms for expansion: "tax residency", "visa processing", "expat healthcare"
    - Input for keyword tools: DataForSEO expands these into long-tail variations

    **What Seeds Are NOT:**
    - NOT long phrases: ❌ "how to stop feeling homesick after moving abroad"
    - NOT full questions: ❌ "why am I so lonely after moving to another country"
    - NOT conversational: ❌ "struggling with loneliness after moving overseas"

    **TARGET: 50-80 short seed keywords (DataForSEO will expand to 400-800 keywords)**
    **If expansion yields < 300 keywords, generate additional seeds and expand again**

    **Seed Keyword Categories (50-80 total, OR 40-65 if no geographic):**

    1. **Core Problem Seeds (12-15):** Short problem topics
       - Pattern: [problem topic] OR [problem area]
       - Length: 1-3 words
       - Examples: "tax residency", "visa delays", "healthcare costs", "homesickness", "language barrier"
       - Extract from pain points: Look for the CORE TOPIC, not the full complaint
       - User says "struggling with prolonged family separation due to visa delays" → Seed: "visa delays"
       - User says "frustrated with double taxation" → Seed: "double taxation"
       - Generate ONE short seed per major pain point (12-15 pain points → 12-15 seeds)
       - Include synonyms/variations: "visa delays" + "visa processing" + "visa backlog"

    2. **Solution Category Seeds (12-15):** Short solution types
       - Pattern: [solution type] OR [capability type]
       - Length: 1-3 words
       - Examples: "tax calculator", "relocation planner", "expat community", "visa tracker", "tax software"
       - Focus on GENERAL solution types, not specific tools
       - Extract from solution features: "day counter" → Seed: "day counter"
       - Core capabilities: "residency tracking", "tax compliance", "document sharing"
       - Generate seeds for 12-15 core capabilities/solution types
       - Include variations: "tax calculator" + "tax software" + "tax tool"

    3. **Competitor Brand Seeds (8-12):** Actual competitor names ONLY
       - Pattern: [competitor name]
       - Length: 1-2 words (brand names)
       - Examples: "TurboTax", "Xero", "QuickBooks" (for tax software)
       - **ONLY use actual competitor names from competitive_context**
       - If no competitors in competitive_context, SKIP this category entirely
       - Do NOT invent competitors or use generic terms
       - Just the brand name as seed (DataForSEO will expand to "X alternative", "X vs Y", etc.)
       - Include all competitors from competitive_context (8-12 if available)

    4. **Feature/Capability Seeds (10-15):** Core feature keywords
       - Pattern: [feature name] OR [capability term]
       - Length: 1-3 words
       - Examples: "email tracking", "residency calculator", "tax estimation", "document upload", "adviser matching"
       - Extract from {selected_solution_features}
       - Just the feature name, not full descriptions
       - "Automated day counting for tax residency" → Seed: "day counting"
       - "Platform for vetted advisers" → Seed: "tax adviser"
       - Generate 10-15 feature seeds with variations

    5. **Target Persona Seeds (5-8):** User types or roles
       - Pattern: [persona/role]
       - Length: 1-2 words
       - Examples: "expats", "digital nomads", "relocating employees", "international movers", "assignees"
       - Extract from {selected_solution_personas}
       - Just the persona label
       - "Professionals relocating for work" → Seed: "relocating professionals"
       - Include persona variations and synonyms

    6. **Geographic Seeds (5-15):** Location-specific terms
       - **FIRST: Assess if niche has geographic relevance:**
         * Healthcare/medical → YES
         * Moving/relocation → YES
         * Legal/compliance → YES
         * Financial/tax → YES
         * Pure software/tech → NO (skip this category)

       - **IF RELEVANT:**
         * Pattern: [location name] OR [location + core topic]
         * Length: 1-3 words
         * Examples: "usa taxes", "canada healthcare", "portugal visa", "uk relocation", "germany tax"
         * Major markets: USA, UK, Canada, Australia, Germany, France, Spain, Netherlands, Singapore
         * Generate location + topic combinations: "usa tax residency", "canada relocation", "uk visa"
         * 5-15 seeds covering major markets with topic combinations

       - **IF NOT RELEVANT, SKIP and note:** "Geographic keywords not applicable - adjust total to 40-65 seeds"

    **CRITICAL RULES for Short Seed Generation:**

    - **KEEP IT SHORT:** 1-4 words maximum per seed
    - **NO QUESTIONS:** No "how to", "why", "what" prefixes
    - **NO MODIFIERS:** No "best", "top", "cheap" (DataForSEO adds these)
    - **CORE TOPICS ONLY:** Root terms that can be expanded
    - **USE CONCRETE TERMS:** No placeholders like [problem] or [tool]
    - **LEVERAGE KNOWLEDGE SOURCES:** Query pain point titles for core topics
    - Example GOOD seeds: "tax residency", "visa processing", "Mailchimp" (competitor)
    - Example BAD seeds: "how to track emails", "best email software", "alternative to [tool]"


    **CRITICAL DATA ACCURACY RULES FOR COMPETITOR SEEDS:**

    - ONLY use competitor names if competitive_context contains actual competitor names
    - If competitive_context is empty or shows "[NO COMPETITIVE DATA AVAILABLE]", SKIP competitor seeds entirely
    - DO NOT invent competitor names or use generic terms like "leading tool"
    - Only include specific brand names that appear in competitive_context
    - If only 1-2 competitors found, generate 1-2 competitor seeds (not 5-8)
    - Acceptable: Generating 30-40 total seeds if competitor category must be skipped


    **CRITICAL ACCURACY RULES - NO PLACEHOLDERS IN SEEDS:**

    - **NEVER use placeholder syntax**: [drug], [country], [tool], [problem]
    - **ALWAYS use concrete terms**: "insulin", "canada", "notion", "tax residency"
    - **NO template variables**: No curly braces, angle brackets, or double braces

    **Examples of INVALID seeds:**
    ❌ "[medication] costs" - placeholder syntax
    ❌ "best [tool] for [task]" - placeholders
    ❌ "how to fix [problem]" - too long AND placeholder
    ❌ "struggling with [issue]" - conversational AND placeholder

    **Examples of VALID seeds:**
    ✅ "insulin costs" - short, concrete, 2 words
    ✅ "tax residency" - short, concrete, 2 words
    ✅ "visa delays" - short, concrete, 2 words
    ✅ "TurboTax" - competitor brand name, 1 word
    ✅ "expat healthcare" - short, concrete, 2 words

    **If generating multiple seeds in same category:**
    - Use DIFFERENT concrete terms, not placeholders
    - Core problems: "visa delays", "tax residency", "healthcare costs", "homesickness"
    - Geographic: "usa taxes", "canada visa", "uk relocation", "germany healthcare"
    - Features: "tax calculator", "day counter", "document upload", "adviser matching"


    **STEP 2: Expand Seeds with DataForSEO Tool (MINIMUM 2 ROUNDS REQUIRED)**

    **CRITICAL REQUIREMENT: You MUST run AT LEAST 2 rounds of keyword expansion to achieve comprehensive coverage.**

    **How DataForSEO Expansion Works:**
    - You provide SHORT seed keywords (1-4 words): "project management", "team collaboration", "Asana"
    - DataForSEO returns EXPANDED variations including long-tail keywords
    - Example: "project management" → expands to "project management software", "best project management tools", "project management app", "free project management", etc.
    - Each short seed typically expands to 8-15 keyword variations

    **MANDATORY TWO-ROUND EXPANSION WORKFLOW:**

    **Round 1 (Core Expansion - REQUIRED):**
    - Generate 30-45 core seed keywords covering:
      * Core problems (12-15 seeds)
      * Solution categories (10-12 seeds)
      * Competitor brands (5-10 seeds, if available)
      * Top features (5-8 seeds)
    - Call "Expand Keywords with DataForSEO" tool with these 30-45 seeds
    - Format: Comma-separated list
    - Example: "[core problem 1], [core problem 2], [solution type 1], [solution type 2], [competitor 1], [competitor 2], [feature 1], [feature 2]"
    - Expected output: 200-400 expanded keywords
    - **Save the expanded_keywords_count from tool output**

    **Round 2 (Diversification - REQUIRED):**
    - Generate 25-40 DIFFERENT seed keywords using alternative angles:
      * Problem synonyms and variations
      * Feature-benefit combinations
      * Persona-specific terms
      * Geographic variations (if relevant to niche)
      * Long-tail problem seeds
    - Call "Expand Keywords with DataForSEO" tool AGAIN with these 25-40 new seeds
    - Tool automatically deduplicates with Round 1 results
    - Expected output: 150-350 additional keywords
    - **Total after Round 2: 350-750 keywords**

    **Round 3+ (Optional - If Needed for Coverage):**
    - If combined total < 300 keywords after Round 2:
      * Generate 20-30 additional seeds from unexplored angles
      * Call DataForSEO tool again
      * Continue until reaching 300+ total keywords
    - If combined total > 750 keywords after Round 2:
      * Stop expansion (excellent coverage achieved)

    **Quality Guidelines:**
    - Round 1: 30-45 seeds → 200-400 keywords
    - Round 2: 25-40 seeds → 150-350 keywords
    - **Total target: 350-750 expanded keywords (minimum 300)**
    - Each seed expands 8-15x on average
    - Multiple rounds discover diverse keyword variations
    - DataForSEO finds long-tail variations you wouldn't manually generate

    **Example Two-Round Workflow:**

    **Round 1 Input (40 seeds):**
    Core problems, main solution types, top competitors, primary features
    **Round 1 Output:** 320 expanded keywords ✓

    **Round 2 Input (35 seeds):**
    Problem variations, alternative phrasings, persona-specific terms, feature combinations, geographic terms (if relevant)
    **Round 2 Output:** 280 additional keywords (600 total) ✓ Excellent coverage

    **CRITICAL TRACKING:**
    - After Round 1: Note expanded_keywords_count (e.g., "Round 1: 320 keywords")
    - After Round 2: Note expanded_keywords_count (e.g., "Round 2: +280 keywords = 600 total")
    - Record cumulative total_monthly_search_volume across all rounds
    - **You MUST run at least 2 rounds - single round is insufficient for comprehensive keyword discovery**
    - The tool automatically deduplicates across rounds

    **STEP 3: Analyze Expanded Keywords**

    **CRITICAL: Check how many keywords DataForSEO returned with valid search_volume.**

    If DataForSEO returned **< 10 keywords with valid search_volume** (not null):
    - **STOP - Return empty tiers with explanation**
    - Set `total_keywords_analyzed` to actual count from DataForSEO (e.g., 0, 3, 7)
    - Set `total_monthly_volume` to actual sum from DataForSEO
    - Set all tier lists to EMPTY: `tier_1_keywords: []`, `tier_2_keywords: []`, etc.
    - Set `key_findings`: ["Insufficient keyword data - DataForSEO returned only X keywords with search volume", "Recommend generating different seed keywords", "Consider alternative solution angles or niche pivots"]
    - Set `tier_1_quick_win_strategy`: "Insufficient keyword data (only X keywords found). Generate 30-50 additional seeds and re-run expansion."
    - **DO NOT invent keywords to fill tiers**

    If DataForSEO returned **10+ keywords:**
    - Proceed to analyze: volume vs competition sweet spots, geographic variations, long-tail opportunities

    **ANTI-HALLUCINATION RULES:**

    **NEVER:**
    ❌ Invent keywords not in DataForSEO output
    ❌ Use keywords where DataForSEO returned search_volume: null
    ❌ Invent search_volume, competition, or cpc metrics
    ❌ Create keywords from feature names without DataForSEO validation

    **ALWAYS:**
    ✅ Use ONLY keywords from DataForSEO tool output with valid search_volume
    ✅ Use EXACT numbers from tool output (don't round or estimate)
    ✅ If DataForSEO returned 0 keywords, return empty tiers
    ✅ If DataForSEO returned 7 keywords, your tiers can only use those 7

    **CRITICAL: Field Mapping from DataForSEO Output**

    DataForSEO returns TWO volume-related fields:
    1. `search_volume`: Single integer (e.g., 210) - average monthly searches **← USE THIS**
    2. `monthly_searches`: Array of 12 monthly objects with historical data **← DO NOT USE THIS**

    **When populating TieredKeyword search_volume field:**
    ✅ Set `search_volume` = EXACT value from DataForSEO `search_volume` field (single integer)
    ✅ OPTIONALLY set `monthly_searches` = array from DataForSEO for historical reference only
    ❌ DO NOT sum values from `monthly_searches` array for search_volume
    ❌ DO NOT average values from `monthly_searches` array for search_volume
    ❌ DO NOT pick peak/max values from `monthly_searches` array for search_volume

    **Example:**
    If DataForSEO returns:
    ```json
    {
      "keyword": "international moving checklist",
      "search_volume": 210,
      "monthly_searches": [
        {"year": 2024, "month": 1, "search_volume": 600},
        {"year": 2024, "month": 2, "search_volume": 550},
        ...12 months total
      ]
    }
    ```
    Then in TieredKeyword:
    - `search_volume = 210` (NOT 7200, NOT 600, NOT any calculation)
    - `monthly_searches = [...]` (optional, for historical reference)

    **When populating TieredKeyword competition field:**

    DataForSEO returns TWO competition-related fields:
    1. `competition`: String (e.g., "LOW", "MEDIUM", "HIGH") **← USE THIS**
    2. `competition_index`: Integer 0-100 (e.g., 1, 23, 75) **← USE THIS**

    **Format as: "[competition] ([competition_index])"**

    ✅ CORRECT formatting examples:
    - DataForSEO: `competition: "LOW", competition_index: 1` → TieredKeyword: `competition: "LOW (1)"`
    - DataForSEO: `competition: "LOW", competition_index: 23` → TieredKeyword: `competition: "LOW (23)"`
    - DataForSEO: `competition: "MEDIUM", competition_index: 55` → TieredKeyword: `competition: "MEDIUM (55)"`
    - DataForSEO: `competition: "HIGH", competition_index: 87` → TieredKeyword: `competition: "HIGH (87)"`

    ❌ NEVER:
    - Invent competition levels (DataForSEO says "LOW (1)" but you write "MEDIUM (55)")
    - Mix up competition_index values between keywords
    - Use competition_index from a different keyword
    - Guess or estimate competition values

    **Example from actual API response:**
    ```json
    {
      "keyword": "homesickness",
      "search_volume": 90500,
      "competition": "LOW",
      "competition_index": 1
    }
    ```
    **MUST become in TieredKeyword:**
    - `keyword: "homesickness"`
    - `search_volume: 90500` (EXACT value, not 42000)
    - `competition: "LOW (1)"` (formatted from competition + competition_index, not "LOW (23)")

    **STEP 4: Create Tiered Structure (ONLY if DataForSEO returned 10+ keywords)**

    **Tier 1 - Immediate Implementation (0-3 months):**
    - 1-5 keywords with HIGH volume + LOW competition **FROM DATAFORSEO OUTPUT ONLY**
    - Use EXACT search_volume from DataForSEO (not invented)
    - Calculate opportunity scores using REAL metrics
    - Quick wins that can generate traffic fast
    - Include clear targeting strategy for each
    - **If DataForSEO returned 10-20 keywords total, you may only find 1-2 Tier 1 opportunities - that's acceptable**

    **Tier 2 - High Value Keywords (3-6 months):**
    - 3-5 keywords with MEDIUM competition but strong strategic value
    - May require more content depth or authority building
    - Balance volume with achievability

    **Tier 3 - Geographic/Niche Opportunities:**
    - Group keywords by geographic markets (if applicable)
    - Example: "Spanish-Speaking Markets", "UK Markets"
    - Include total volume, competition level, and strategy notes
    - Identify underserved regional opportunities

    **Tier 4 - Category/Specialized Keywords:**
    - Group keywords by document type, service category, or specialization
    - Example: "Education Documents", "Immigration Services"
    - Total volume per category
    - Strategy recommendations for each category

    **STEP 5: Generate Key Findings and Summary**

    - 3-5 bullet points summarizing the most important SEO insights
    - Example: "Local search dominates - 'near me' searches account for X monthly searches"
    - Example: "Low-competition niche identified in [specific area]"
    - CRITICAL: Include accurate count of total keywords analyzed from DataForSEO tool results
    - CRITICAL: Include accurate total monthly search volume from DataForSEO tool results

    **QUALITY CHECKPOINT - Keyword Coverage Assessment:**
    - **If total keyword count < 150:** Note in your summary: "Limited keyword data available (only X keywords analyzed) - recommend additional research in specific areas: [list 2-3 specific areas where more seeds could be generated]"
    - **If total keyword count 150-300:** This is acceptable coverage - no additional note needed
    - **If total keyword count > 300:** This is excellent comprehensive coverage - you may note: "Comprehensive keyword coverage achieved (X keywords analyzed across Y categories)"
    - **Document your expansion process:** Note how many DataForSEO tool calls you made (e.g., "Generated through 2 expansion rounds with 85 total seed keywords")

    **What to Analyze:**
    - Search volume patterns (where is the demand?)
    - Competition gaps (where can we win?)
    - Geographic opportunities (underserved markets?)
    - Category patterns (document types, service areas?)
    - Quick wins vs long-term plays

    **Output Requirements:**
    - **seed_keywords_generated**: The COMPLETE list of 50-80 short seed keywords you generated in STEP 1 (before expansion). Format as a simple list of strings: ["tax residency", "visa delays", "TurboTax", ...]. Include ALL seeds you generated - this will be passed to the final SEO report.
    - **total_keywords_analyzed**: EXACT count from DataForSEO tool results (NOT estimated)
    - **total_monthly_volume**: SUM of all search volumes from DataForSEO tool results
    - Tier 1: 3-5 keywords with opportunity scores, competition assessment, and strategy
    - Tier 2: 3-5 keywords (if data supports it)
    - Tier 3: Geographic keyword groups (if applicable)
    - Tier 4: Category keyword groups (if applicable)
    - Key findings: 3-5 bullet points
    - Quick win strategy narrative (1-2 paragraphs)

  expected_output: >
    Structured keyword analysis with:

    **Tier 1 Keywords** (3-5 keywords):
    - keyword, search_volume, monthly_searches (optional), competition (e.g., "LOW (30)"), opportunity_score, strategy, intent

    **Tier 2 Keywords** (3-5 keywords, if applicable):
    - Same structure as Tier 1

    **Tier 3 Geographic Groups** (if applicable):
    - region_name, total_volume, competition_level, keywords list (with search_volume), strategy_notes

    **Tier 4 Category Groups** (if applicable):
    - category_name, total_volume, keywords list (with search_volume), strategy_recommendation

    **Key Findings**: 3-5 bullet points

    **Tier 1 Quick Win Strategy**: 1-2 paragraph narrative explaining the quick win approach

    Format: Well-structured markdown with clear sections and tables where appropriate.

develop_content_strategy:
  description: >
    Transform keyword opportunities into a comprehensive content strategy with topic
    clusters, content recommendations, and competitive positioning.


    **Search Strategy for Content Strategy Development:**

    Use knowledge sources to align content recommendations with actual user needs and questions:

    - Search for user questions: "how to", "what is", "how do I", "why", "when should"
    - Search for content format preferences: "guide", "tutorial", "example", "template", "checklist"
    - Search for comparison intent: "vs", "versus", "compared to", "better than", "difference between"
    - Search for decision-stage signals: "best", "top", "review", "recommendation", "which"
    - Search for specific problems to address: "issue", "problem", "trouble", "error", "mistake"
    - Query pain point titles to understand topic priorities and urgency

    This grounds your content clusters and recommendations in actual user search behavior and needs.


    **Context from Previous Task:**
    You have access to the tiered keyword analysis including Tier 1-4 keywords,
    geographic groups, category groups, and key findings.

    **Additional Context:**
    - Competitive Summary: {competitive_summary}
    - Solutions Summary: {solutions_summary}
    - Recommended Solution: {recommended_solution}

    **Your Task:**

    1. **Create Topic Clusters** (3-5 clusters):
       - Identify content pillars that group related keywords
       - Each cluster should have:
         * Cluster name (e.g., "Email Deliverability Optimization")
         * Primary keyword
         * 5-15 supporting keywords
         * Total monthly volume for cluster
         * Content recommendation (2-4 sentences on what to create)
         * Estimated traffic potential (e.g., "800-1200 monthly visits")
         * Priority (1=highest, 5=lowest)

    2. **Develop Comprehensive Content Strategy:**

       **Include these numbered sections:**

       1. **Information-Intent Content** (educational/awareness):
          - "How to..." guides
          - "What is..." educational content
          - Problem-solving resources
          - Target: Top of funnel, awareness stage

       2. **Service/Product Pages** (conversion-focused):
          - Document type pages
          - Service category pages
          - Geographic landing pages
          - Target: Bottom of funnel, ready to buy

       3. **Comparison & Decision Content**:
          - Price comparison pages
          - "Best [solution] for [use case]"
          - Alternative comparisons
          - Target: Middle of funnel, evaluation stage

       Write 4-6 paragraphs with specific content recommendations and rationale.

    3. **Identify Competitive Positioning Opportunities:**
       - What keyword gaps can we exploit?
       - Where are competitors weak?
       - What unique angles can we own?
       - Which low-competition/high-value niches should we dominate?

       Write 2-4 sections with specific examples. Format as markdown with headers.

    **Output Requirements:**
    - Topic clusters: 3-5 clusters with all required fields
    - Content strategy: 4-6 paragraph markdown with numbered sections
    - Competitive positioning: 2-4 sections with specific keyword gap examples

  expected_output: >
    Comprehensive content strategy including:

    **Topic Clusters** (3-5 clusters):
    - cluster_name
    - primary_keyword
    - supporting_keywords (5-15)
    - total_monthly_volume
    - content_recommendation (2-4 sentences)
    - estimated_traffic_potential
    - priority (1-5)

    **Content Strategy** (markdown, 4-6 paragraphs with numbered sections):
    1. Information-Intent Content
    2. Service/Product Pages
    3. Comparison & Decision Content

    **Competitive Positioning** (markdown, 2-4 sections):
    - Keyword gaps to exploit
    - Low-competition/high-value niches
    - Unique positioning angles

    Format: Professional markdown with clear sections, bullet points, and specific recommendations.

create_implementation_roadmap:
  description: >
    Create the final comprehensive SEO strategy report with technical recommendations,
    implementation roadmap, metrics, and actionable next steps.

    **Context from Previous Tasks:**
    You have access to:
    - Tiered keyword analysis (Tier 1-4)
    - Topic clusters
    - Content strategy
    - Competitive positioning

    **Your Task:**

    1. **Technical SEO Recommendations** (markdown, 5-7 sections):

       **a) Keyword-Driven Site Architecture:**

       Create a complete site structure based on your keyword tiers and clusters:

       - **URL Hierarchy Diagram**: ASCII/markdown diagram showing how keyword clusters map to sections
         Example structure:
         ```
         Homepage
         ├── /tools/ (Tier 1 problem-solving keywords: 45k volume)
         │   ├── /tools/substantial-presence-calculator/ → "substantial presence test" (3.2k/mo)
         │   ├── /tools/tax-residency-checker/ → "tax residency calculator" (1.8k/mo)
         │   └── /tools/capital-gains-estimator/ → "capital gains tax calculator" (2.1k/mo)
         ├── /services/ (Commercial intent keywords: 28k volume)
         │   ├── /services/one-off-review/ → "tax compliance review service" (1.2k/mo)
         │   └── /services/per-relocation/ → "relocation tax planning" (890/mo)
         ├── /country/ (Geographic keywords from Tier 3: 67k volume)
         │   ├── /country/uk/ → "uk tax obligations" (8.5k/mo)
         │   │   ├── /country/uk/capital-gains/ → "uk capital gains tax non-resident" (2.1k/mo)
         │   │   └── /country/uk/residency/ → "uk tax residency rules" (1.7k/mo)
         │   └── /country/spain/ → similar structure for Spanish keywords
         └── /vs/ (Competitor keywords: 15k volume)
             ├── /vs/turbotax-alternative/ → "turbotax alternative" (4.2k/mo)
             └── /vs/taxact-vs-hrblock/ → comparison keywords
         ```

       - **Section-to-Keyword Mapping**: Explain how each top-level section addresses specific keyword clusters
         * /tools/ → Tier 1 quick wins (problem-solving intent)
         * /services/ → Commercial keywords (transactional intent)
         * /country/ → Geographic keywords from Tier 3 (informational + local intent)
         * /vs/ → Competitor alternative keywords (comparison intent)

       - **Total Page Count**: Calculate pages needed from keyword opportunities
         Example: "12 country pages × 3-5 subtopics each = 36-60 country pages + 8 tool pages + 4 service pages = 48-72 total pages for MVP"

       **b) Keyword-Based Page Type Inventory:**

       Create a structured table of page types derived from keyword analysis:

       | Page Type | Target Keywords | URL Pattern | Intent | Page Count | Priority | Schema |
       |-----------|----------------|-------------|--------|-----------|----------|--------|
       | Calculator Tools | Tier 1: "substantial presence test" (3.2k), "tax calculator" (2.1k) | /tools/<tool-name>/ | Problem-solving | 6-8 pages | P0 | HowTo, WebApplication |
       | Geographic Guides | Tier 3: "uk tax obligations" (8.5k), "spain tax" (6.2k) | /country/<country>/ | Informational + Local | 12-15 pages | P0 | Article, FAQPage |
       | Service Pages | Commercial: "tax review service" (1.2k), "compliance help" (890) | /services/<service>/ | Transactional | 3-5 pages | P0 | Service, Offer |
       | Comparison Pages | Competitor: "turbotax alternative" (4.2k), "<comp1> vs <comp2>" | /vs/<comparison>/ | Comparison | 8-10 pages | P1 | Review, Product |

       For each page type, specify:
       - Target keyword cluster and example keywords with volumes
       - URL pattern optimized for keywords
       - Primary search intent (problem-solving, informational, transactional, comparison)
       - Estimated page count based on keyword opportunities
       - Launch priority (P0=Tier 1, P1=Tier 2, P2=Tier 3-4)
       - Required schema markup types
       - SEO optimization notes (title templates, H1 patterns, internal linking)

       **c) URL Structure Patterns:**

       Detailed URL patterns with SEO best practices:
       - **Descriptive slugs**: Use target keywords in URLs (e.g., /tools/substantial-presence-test/ not /tools/spt/)
       - **Shallow hierarchy**: Max 3 levels deep (/category/subcategory/page/)
       - **Consistent patterns**: Same structure for similar content (all tools follow /tools/<keyword>/)
       - **Hyphens not underscores**: tax-calculator not tax_calculator

       Provide code examples where helpful.

       **d) Schema Markup:**

       Which schema types to implement based on keyword intent and page types:
       - Problem-solving pages (calculator tools): HowTo, WebApplication, FAQPage
       - Geographic pages: Article, FAQPage, LocalBusiness (if applicable)
       - Service pages: Service, Offer, AggregateRating
       - Comparison pages: Review, Product, Organization

       Provide JSON-LD examples for key page types.

       **e) Local SEO** (if geographic keywords present):

       - Google Business Profile optimization for each target location
       - Local schema markup (LocalBusiness, PostalAddress)
       - Location-specific landing pages based on Tier 3 geographic keywords

       **f) Mobile Optimization:**

       - Core Web Vitals targets (LCP <2.5s, FID <100ms, CLS <0.1)
       - Mobile-first indexing considerations
       - Responsive design requirements

       **g) Internal Linking Strategy:**

       - Hub-and-spoke model linking keyword clusters
       - Topic cluster connections (pillar pages → cluster pages)
       - Strategic linking from high-authority pages to conversion pages

    2. **Implementation Roadmap** (markdown, 3-4 phases):

       **Phase 1: Quick Wins (Weeks 1-4)**
       - Target: X monthly search volume
       - Specific deliverables (e.g., "Create 5 core service pages for Tier 1 keywords")
       - Technical setup tasks
       - Success metrics

       **Phase 2: [Phase Name] (Weeks 5-12)**
       - Target: Additional X monthly search volume
       - Specific deliverables
       - Success metrics

       **Phase 3: [Phase Name] (Weeks 13-20)**
       - Continue with additional phases as needed

       **Phase 4: Scale & Optimize (Weeks 21+)**
       - Ongoing optimization and scaling

    3. **Key Metrics to Track** (4-6 KPIs):

       **SEO Performance:**
       - Organic traffic to money pages
       - Ranking positions for Tier 1-4 keywords
       - Click-through rates from SERPs

