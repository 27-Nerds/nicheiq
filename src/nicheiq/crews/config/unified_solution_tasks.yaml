# UnifiedSolutionCrew Tasks
# 6-task pipeline: 3 new divergent-convergent ideation tasks + 3 existing tasks
# Architecture: divergent_exploration → diversity_filtering → solution_refinement → competitive_analysis → competitive_refinement → solution_selection

# =============================================================================
# NEW: Divergent-Convergent Ideation Architecture (3 Tasks)
# =============================================================================

divergent_exploration:
  description: >
    **TASK 1: DIVERGENT EXPLORATION (Generate 8-12 Raw Concepts)**

    Generate diverse solution concepts for micro/mini SaaS with SEO traffic focus.
    This is the DIVERGENT phase - prioritize quantity and variety over polish.

    ## Input Context

    **Pain Points:**
    {analysis_summary}

    High-priority ({high_priority_count}): {high_priority_list}
    Medium-priority ({medium_priority_count}): {medium_priority_list}

    **Niche:** {niche_description}
    **Allowed Types:** {allowed_project_types}

    ## Target Audience Intelligence (from Stage 6.5)

    **Primary Target Segment:** {primary_target_segment}

    **Audience Segments:**
    {audience_segments_summary}

    **Common Vocabulary** (use these terms in solution naming/features):
    {common_vocabulary}

    **Frustrations with Existing Tools** (gaps to exploit):
    {frustrations_with_existing}

    **Tools Currently Used** (competitive context):
    {tools_currently_used}

    <long_context_handling>
    Before generating concepts:
    1. List 3-5 key pain point themes from the analysis above
    2. Re-state niche constraints: "{niche_description}" with allowed types "{allowed_project_types}"
    3. Anchor each concept to specific pain points from the input
    4. If pain point data is sparse: Note this and proceed with available evidence
    </long_context_handling>

    ═══════════════════════════════════════════════════════════════════════════

    ## Creative Ideation Approaches

    Generate diverse concepts using creative approaches. Consider:
    - **Niche drilling** - Find specific sub-niches where big players don't compete
    - **Data source inversion** - What unique data exists that no one is productizing?
    - **Cross-industry templates** - What patterns work elsewhere that could apply here?
    - **Atomic features** - What single feature delivers 80% of a complex product's value?
    - **Community flip** - How can users create value for each other?

    Choose techniques that fit THIS problem space. Not all techniques apply to every niche.

    ## MANDATORY TECHNIQUE QUOTA

    You MUST generate concepts using AT LEAST 4 different techniques:
    - Minimum 2 concepts from: niche_drilling OR data_source_inversion
    - Minimum 2 concepts from: cross_industry_template OR atomic_feature
    - Minimum 1 concept from: community_flip
    - Remaining concepts: any technique

    If you generate 8 concepts using only 2 techniques → INVALID OUTPUT.
    Diversity in ideation technique leads to diversity in solutions.

    ═══════════════════════════════════════════════════════════════════════════

    **OUTPUT REQUIREMENTS (RawConceptList):**

    Generate 8-12 concepts. For EACH concept:

    - **concept_name**: Catchy, specific name (e.g., "PlumbingCostCalc", "RemoteTaxAdvisors")
    - **one_liner**: 1-2 sentence description focusing on unique angle
    - **ideation_technique**: Which technique generated it (niche_drilling, data_source_inversion, cross_industry_template, atomic_feature, community_flip)
    - **project_type**: directory, aggregator, comparison-tool, marketplace, saas, or other
    - **target_keywords**: 2-5 specific SEO queries this would rank for
    - **data_source_hint**: Primary data source or mechanism

    **EXAMPLES (showing SEO-friendly architectural diversity):**

    Each example shows a DIFFERENT SEO acquisition pattern, not just different verticals.
    These are architectural pattern illustrations only — do NOT reuse these names, verticals, or keywords in your output.
    Generate concepts relevant to the actual niche: {niche}.

    1. concept_name: "PlumbingCostCalc"
       one_liner: "Aggregates plumber pricing data from 50 cities to generate '[City] plumbing cost 2025' pages."
       ideation_technique: "data_source_inversion"
       project_type: "aggregator"
       target_keywords: ["plumber cost [city]", "how much plumber charges", "plumbing prices near me"]
       data_source_hint: "Scrape Angi, Thumbtack, Yelp pricing mentions"
       **SEO pattern: [City] + [Service] + [Year] programmatic pages**

    2. concept_name: "APILatencyBench"
       one_liner: "Automated latency testing for popular APIs, generates '[API name] response time benchmark' and '[API A] vs [API B] latency' pages."
       ideation_technique: "atomic_feature"
       project_type: "comparison-tool"
       target_keywords: ["stripe api latency", "twilio vs plivo speed", "fastest payment api"]
       data_source_hint: "Automated testing infrastructure pinging APIs every hour"
       **SEO pattern: [Product A] vs [Product B] comparison pages**

    3. concept_name: "StartupCostTemplate"
       one_liner: "Pre-built financial templates for specific startup types, generates '[Industry] startup budget template' and 'How much to start a [business type]' pages."
       ideation_technique: "cross_industry_template"
       project_type: "saas"
       target_keywords: ["saas startup costs spreadsheet", "restaurant budget template", "how much to start ecommerce"]
       data_source_hint: "Curated templates + user-submitted cost breakdowns"
       **SEO pattern: [Use case] + template/guide content pages**

    4. concept_name: "RemoteTaxAdvisors"
       one_liner: "Directory of tax advisors specializing in digital nomads, generates '[Country] remote worker tax advisor' pages."
       ideation_technique: "niche_drilling"
       project_type: "directory"
       target_keywords: ["digital nomad tax advisor", "portugal remote worker taxes", "expat tax help"]
       data_source_hint: "User submissions + LinkedIn outreach to tax professionals"
       **SEO pattern: [Location] + [Niche service] directory pages**

    5. concept_name: "SaaSPricingDB"
       one_liner: "Tracks pricing changes for 500+ SaaS tools, generates '[Tool name] pricing 2025' and '[Category] software pricing comparison' pages."
       ideation_technique: "data_source_inversion"
       project_type: "aggregator"
       target_keywords: ["notion pricing", "slack vs teams cost", "project management software prices"]
       data_source_hint: "Automated scraping of pricing pages + historical wayback data"
       **SEO pattern: [Product] pricing + [Category] comparison data pages**

    ═══════════════════════════════════════════════════════════════════════════

    **CRITICAL RULES:**

    ✗ NO evaluation at this stage - defer feasibility judgment
    ✗ NO "AI-powered [X]" unless you explain the specific data/model advantage
    ✗ NO "all-in-one platform" - too complex for solo dev
    ✗ NO multi-sided marketplaces without explaining bootstrapping strategy

    ✓ Wild ideas welcome - we'll filter later
    ✓ Specific niches over generic categories
    ✓ Clear SEO keywords for each concept
    ✓ Each concept should be buildable by 1 developer in 2-3 months

  expected_output: >
    RawConceptList with:
    - concepts: List of 8-12 RawConcept objects with all fields populated
    - techniques_used: List of ideation techniques applied
    - pain_points_referenced: Pain point titles that informed concepts

diversity_filtering:
  description: >
    **TASK 2: DIVERSITY FILTERING (Filter to 5-7 Unique Concepts)**

    Filter raw concepts from Task 1 to ensure diversity and remove duplicates.
    This is the CONVERGENT phase - apply strict diversity criteria.

    ## Context from Task 1

    You have access to RawConceptList with 8-12 concepts.

    <output_verbosity_spec>
    - concepts: Pass through 5-7 RawConcept objects unchanged
    - removed_concepts: List of names only
    - removal_reasons: 1 sentence per removal (format: "[Name]: [reason]")
    - diversity_summary: 2-3 sentences max
    </output_verbosity_spec>

    ═══════════════════════════════════════════════════════════════════════════

    **FILTERING WORKFLOW:**

    1. **CLUSTER SIMILAR CONCEPTS**
       Group concepts that share >50% of these characteristics:
       - Same primary data source
       - Same target audience segment
       - Same core mechanism (how value is delivered)
       - Same monetization model

       If 2 concepts differ ONLY in:
       - Target industry (same product, different vertical)
       - UI/branding differences
       - "AI-powered" vs "smart" vs "intelligent" labeling
       → They are DUPLICATES. Keep only the most novel.

    2. **ADAPTIVE DIVERSITY ENFORCEMENT**

       **If multiple project types allowed:**
       - REQUIRE at least 2 different project_types in final list
       - Prefer variety: 2 directories + 2 aggregators + 1 comparison = GOOD
       - Avoid: 5 directories = BAD (lacks architectural diversity)

       **If single project type allowed (e.g., only "directory"):**
       - REQUIRE diversity WITHIN that type:
         - Different data sources (Reddit scraper vs API vs user submissions)
         - Different target sub-niches (budget travelers vs luxury vs digital nomads)
         - Different content models (reviews vs comparisons vs curated lists)

    3. **SPECIFICITY CHECK**
       - At least 1 concept must target a specific sub-niche (not generic category)
       - Reject: "Travel directory" (too broad, already exists)
       - Accept: "Budget digital nomad visa directory for Eastern Europe" (specific)

    4. **SEO PATTERN DIVERSITY CHECK**

       Two concepts are SEO-similar if they target the SAME programmatic page pattern:
       - Both generate "[City] + [Service]" pages → DUPLICATES
       - Both generate "[Product A] vs [Product B]" pages → DUPLICATES
       - Both generate "[Tool] pricing" pages → DUPLICATES

       EVEN IF they target different industries, they compete for similar user intent.

       Example DUPLICATES (same SEO pattern, different vertical):
       - "Plumber Directory" ([City] plumber) + "Electrician Directory" ([City] electrician) → Keep only 1
       - "VPN Speed Test" (VPN A vs B) + "Hosting Speed Test" (Host A vs B) → Keep only 1

       Example DIVERSE (different SEO patterns, same industry):
       - "Plumber Directory" ([City] plumber) → location + service pattern
       - "Plumber Cost Calculator" (plumbing cost calculator) → calculator/tool pattern
       - "Plumber Review Aggregator" (best plumbers 2025) → comparison/review pattern
       → ALL 3 are valid because they target DIFFERENT search intents

    ═══════════════════════════════════════════════════════════════════════════

    **OUTPUT REQUIREMENTS (FilteredConceptList):**

    - **concepts**: 5-7 unique RawConcept objects (passed from Task 1)
    - **removed_concepts**: List of concept names that were filtered out
    - **removal_reasons**: Explanation for each removal (format: "[Name]: [reason]")
    - **diversity_summary**: Summary of diversity achieved

    **EXAMPLE OUTPUT:**

    removed_concepts: ["VendorCompare", "SmartVendorMatch"]
    removal_reasons:
      - "VendorCompare: Too similar to VendorMatch (same data source + mechanism)"
      - "SmartVendorMatch: 'Smart' prefix doesn't add differentiation, duplicate of VendorMatch"
    diversity_summary: "3 directories, 2 aggregators, 1 comparison tool across 4 unique data sources. Niches: tax advisors (specific), pricing data (broad), VPN testing (specific)."

    ═══════════════════════════════════════════════════════════════════════════

    **ANTI-PATTERN CHECKLIST:**

    Before finalizing, verify NONE of these anti-patterns remain:

    ✗ "[Category] directory" without specific data source or curation angle
    ✗ "All-in-one platform" (too complex for solo dev)
    ✗ Generic "[Industry] comparison site" without unique scoring methodology
    ✗ "AI-powered [X]" without explaining the data/model advantage
    ✗ Solutions requiring enterprise sales cycles
    ✗ Multi-sided marketplaces without bootstrapping strategy

    If anti-pattern detected → REMOVE from list with explanation

  expected_output: >
    FilteredConceptList with:
    - concepts: 5-7 unique RawConcept objects
    - removed_concepts: Names of filtered concepts
    - removal_reasons: Explanations for removals
    - diversity_summary: Summary of diversity achieved

solution_refinement:
  description: >
    **TASK 3: SOLUTION REFINEMENT (Expand to Full Specifications)**

    Expand filtered concepts from Task 2 into complete solution specifications.
    Score each on market fit, novelty, solo-dev feasibility, and SEO potential.
    Select top 3-5 for detailed specification.

    ## Context from Task 2

    You have access to FilteredConceptList with 5-7 unique concepts.

    ## Pain Points Context

    {analysis_summary}

    High-priority ({high_priority_count}): {high_priority_list}
    User segments: {user_segments}

    <long_context_handling>
    Before scoring and expanding:
    1. List pain point themes from above context
    2. Re-state selection criteria: Top 3-5 by composite score
    3. Anchor each solution's market_fit_score to specific pain points
    </long_context_handling>

    <output_verbosity_spec>
    For each of the 25+ fields:
    - description: 4-6 sentences (HOW IT WORKS focus)
    - value_proposition: 1-2 sentences
    - core_features: 5-7 items, 1 sentence each
    - target_personas: 2-4 personas, 1 sentence each
    - pricing_strategy: 2-3 sentences
    - differentiation_factors: 3-5 items, 1 sentence each
    - conventional_approach: 1-2 sentences (what most would try)
    - innovation_angle: 1-2 sentences (how this diverges)
    - why_it_works: 1-2 sentences (evidence-based reason)
    - novelty_score: decimal derived from the three fields above
    - organic_discovery_queries: 5-10 queries
    - All other numeric scores: decimal only (e.g., 0.75)
    </output_verbosity_spec>

    ═══════════════════════════════════════════════════════════════════════════

    ## Evaluation Criteria (score 0-1)

    Evaluate each concept on:
    - **market_fit_score** - How well does this address validated pain points?
    - **novelty_score** - How differentiated is this from existing solutions?
    - **solo_dev_feasibility** - Can one developer build this in 2-3 months?
    - **seo_scalability_score** - What's the organic traffic potential?

    Weight factors based on what matters most for THIS specific niche.
    Market fit and feasibility typically matter most, but use your judgment.
    Select top 3-5 concepts by overall merit.

    ═══════════════════════════════════════════════════════════════════════════

    **SELECTION GUIDANCE:**

    - Prioritize concepts with strong market fit and realistic execution paths
    - Consider novelty as a tiebreaker when market fit is similar

    ## DIVERSITY REQUIREMENT: Different SEO Acquisition Patterns

    Your final 3-5 solutions MUST include AT LEAST 2 DIFFERENT SEO patterns from:

    1. **Location + Service pages**: "[City] [service]", "[Country] [provider]"
    2. **Comparison pages**: "[Product A] vs [Product B]", "best [category] 2025"
    3. **Calculator/Tool pages**: "[Thing] calculator", "[Metric] estimator"
    4. **Template/Resource pages**: "[Use case] template", "[Topic] checklist"
    5. **Data/Benchmark pages**: "[Industry] benchmarks", "[Product] pricing"

    If top 5 by merit all use the SAME SEO pattern (e.g., all "[City] + [Service]"):
    → KEEP top 2, ADD next-best solutions with DIFFERENT SEO patterns

    INVALID: 5 solutions all targeting "[Location] + [Service]" pattern
    VALID: 2 location directories + 1 comparison tool + 1 calculator + 1 data aggregator

    This ensures the final selection offers architectural diversity, not just vertical diversity.

    ═══════════════════════════════════════════════════════════════════════════

    **FULL SPECIFICATION (For each selected solution):**

    Expand concept into complete BaseSolutionIdea with ALL 25+ fields:

    **Basic Info:**
    - solution_name, description (4-6 sentence HOW IT WORKS), value_proposition
    - pain_points_addressed (MUST include the #1 highest-severity pain point from {high_priority_list}; use exact titles from data)
    - core_features (5-7 MVP features)
    - target_personas (2-4 aligned with user segments)

    **Scores (from above criteria):**
    - market_fit_score, technical_feasibility_score
    - conventional_approach, innovation_angle, why_it_works (fill FIRST)
    - novelty_score (derive from above), solo_dev_feasibility

    **Strategy:**
    - pricing_strategy (see PRICING STRATEGY guidance below), differentiation_factors, project_type
    - technical_approach, estimated_development_time
    - requires_data_aggregation, data_sources

    **PRICING STRATEGY (adapt to project type and WTP scores):**

    DO NOT default to "Freemium with 3 tiers" for every solution type.

    **For SaaS/subscription products (high WTP > 0.5):**
    - Consider: Freemium, Freemium-Lite, Pure Subscription, Usage-Based, One-Time
    - Match to WTP scores and competitive landscape
    - Example: "Freemium model with Free/Pro tiers at $29/mo targeting professional users"

    **For directories/aggregators/comparison-tools (especially with low WTP < 0.3):**
    - Consider: Ad-Supported-Free, Affiliate-Only, Hybrid-Traffic, Lead-Gen
    - These can be 100% FREE to users with SEO-driven traffic monetization
    - Example: "Free tool monetized by display ads (target: $5-15 CPM) and affiliate links"
    - Example: "Free comparison site earning affiliate commissions on purchase referrals"

    **Pricing Strategy Field Format:**
    - For subscription: "Freemium model with Starter ($X/mo) and Pro ($Y/mo) tiers. [rationale]"
    - For ad-supported: "Free tool monetized via display ads ($X-Y CPM) and affiliate commissions. [traffic rationale]"
    - For affiliate: "Free comparison tool earning Z% commission on referred purchases. [conversion rationale]"

    **SEO Fields:**
    - programmatic_seo_opportunity, content_generation_model
    - organic_discovery_queries (5-10 queries)
    - estimated_cac_organic, estimated_cac_paid
    - seo_scalability_score

    ═══════════════════════════════════════════════════════════════════════════

    **NOVELTY ASSESSMENT REQUIREMENT:**

    For EVERY solution, fill THREE fields:

    **conventional_approach** — What most builders would try:
    - Be specific about the obvious strategy (not vague)
    - Example: "Most would build a full comparison platform with user reviews and editorial content."
    - Example: "The standard approach is a generic job board aggregating listings from multiple sources."
    - Low-novelty example: "Conventional approach: standard directory. Innovation angle: minor UX improvement."

    **innovation_angle** — How this solution diverges:
    - Describe the structural twist or constraint that differentiates
    - Example: "This focuses exclusively on automated speed tests from 50+ global locations, publishing objective latency data."
    - Example: "Instead of aggregating listings, this reverse-engineers salary data from public filings to generate pay transparency pages."

    **why_it_works** — Evidence-based reason grounded in research data:
    - Reference specific pain points, community signals, or user behavior
    - Example: "Community threads show users distrust subjective reviews and specifically ask for real-world speed data."
    - Example: "Pain point analysis shows 'salary opacity' is the #2 frustration with 0.87 severity — users want data, not listings."

    **SCORING ORDER:** Fill the three text fields FIRST. Then assign novelty_score
    based on the strength of your own analysis — not the other way around.
    See the novelty_score field description for the rubric linking score bands
    to the quality of conventional_approach, innovation_angle, and why_it_works.

    ❌ Bad: Leaving all three fields with the same sentence structure
    ❌ Bad: Generic claims without referencing pain point data
    ❌ Bad: Picking novelty_score first, then writing fields to justify it
    ✓ Good: Each field answers a distinct question with specific evidence
    ✓ Good: Score derived from the strength of the three text fields

  expected_output: >
    IdeaGenerationResult with:
    - solution_ideas: 3-5 complete BaseSolutionIdea objects with all 25+ fields
    - recommended_solution: null (will be set in Task 6)

    Each solution must include:
    - All basic fields (name, description, value_prop, pain_points, features, personas)
    - All score fields (market_fit, technical_feasibility, novelty, solo_dev_feasibility)
    - conventional_approach, innovation_angle, why_it_works for ALL solutions
    - All SEO fields (seo_scalability, cac estimates, discovery queries)

# =============================================================================
# COMPETITIVE ANALYSIS AND SELECTION TASKS
# =============================================================================

competitive_analysis:
  description: >
    **TASK 2: Competitive Analysis (Research + Gap Analysis)**

    Analyze competitive landscape for ALL solutions from Task 1.

    **HOW TO ACCESS CONTEXT:**

    Task 1 output (IdeaGenerationResult) is available in your context via CrewAI context chaining.

    **CRITICAL**: Extract the following fields from EACH solution in Task 1 output:
    - solution_name (use for competitor searches)
    - description (understand what problem it solves)
    - core_features (identify feature gaps vs competitors)
    - target_personas (identify underserved segments)
    - project_type (directory/saas/aggregator - affects competitor search strategy)
    - value_proposition (positioning reference)

    **VERIFICATION**: Count solutions from Task 1. Your output MUST contain exactly that many CompetitiveLandscape objects (one per solution).
    If Task 1 generated 4 solutions → you analyze 4 competitive landscapes.
    If Task 1 generated 5 solutions → you analyze 5 competitive landscapes.

    **CONTEXT: Niche Research Background**
    - Niche Description: {niche_description}
    - Target Market Segments:
      {market_segments}
    - Industry Boundaries: {industry_boundaries}

    **WORKFLOW (FOLLOW IN ORDER):**

    1. **FOR EACH SOLUTION** (iterate over all solutions from Task 1):
       a. **Generate Context-Aware Queries** (USE generate_competitor_queries TOOL):

          **REQUIRED**: Use the generate_competitor_queries tool to create validated search queries.

          Input format: "solution_name|project_type|pain_point1, pain_point2, pain_point3"

          Example: "ExpatEase|directory|visa complexity, language barriers, housing search"

          The tool applies 6 semantic validation rules automatically:
          1. Physical Products → directory/comparison terms
          2. B2C Consumer → consumer/home/personal terms
          3. Local/Regional → geographic context
          4. Solution Type Match → appropriate terminology
          5. Market Segments → segment-specific modifiers
          6. Industry Boundaries → scope validation

          **Execute generated queries with SerperDevTool to discover competitors.**

       b. **Verify with Knowledge Sources**:
          - Search for: "using", "tried", "alternative", "competitor", tool names
          - Extract user-mentioned competitors from social discussions

       c. **Competitor Profiling** (for top 5-8 competitors):
          - Website/product URL (verifiable)
          - Key features: Extract ALL significant features the competitor promotes on their product/features/pricing pages (typically 4-8 per competitor). Include core functionality, integrations, unique selling points, and any features relevant for comparison.
          - Pricing (from website/public info)
          - Positioning (from tagline/messaging)
          - Customer feedback (from reviews/social mentions)
          - Strengths & weaknesses (evidence-based)

       d. **Gap Analysis**:
          - Market gaps: What are users complaining about? What's missing?
          - Differentiation opportunities: Where can new solution win?
          - Competitive intensity: LOW/MEDIUM/HIGH based on competitor count/strength
          - Recommended positioning: Strategic angle for differentiation

    2. **Compile CompetitiveAnalysisResult** with per-solution landscapes

    **VERIFICATION STANDARD:**

    - Every competitor MUST have verifiable source (URL or user mention)
    - Features MUST be from website/documentation (not assumed)
    - Pricing MUST be from official source or marked "Pricing not publicly available"
    - If searches return no results: Report "No competitors found via search"
    - Better to report 2 verified competitors than 10 fabricated ones

    **MARKET GAP IDENTIFICATION:**

    Look for ALL gaps by examining:
    - User complaints about existing tools (Knowledge Sources)
    - Features mentioned in pain points but missing in competitors
    - Pricing dissatisfaction (too expensive/inflexible)
    - Underserved segments (personas not targeted by competitors)
    - Integration gaps, workflow friction, poor UX
    - Missing geographic coverage or language support
    - Lack of mobile/offline capabilities
    - Data freshness or accuracy issues
    - Customer support or documentation gaps

    **CRITICAL**: Include EVERY gap you identify. Do not limit yourself to a fixed number. The goal is comprehensive coverage - if you find 10 gaps, list all 10.

    **PRE-SUBMISSION VALIDATION CHECKLIST:**

    Before finalizing output, verify:
    - [ ] Generated ONE CompetitiveLandscape per solution from Task 1
    - [ ] Applied semantic validation rules before searching (no nonsensical queries)
    - [ ] Every competitor has verifiable source (URL or user mention from Knowledge Sources)
    - [ ] Features are comprehensive (all significant features from product pages) and verified from websites
    - [ ] If no competitors found via search, I reported "No competitors found via search" honestly
    - [ ] Market gaps reference specific user complaints or missing features
    - [ ] competitive_intensity justified by competitor count/strength

    ═══ CRITICAL RULES (Read Last - Recency Reminder) ═══

    **STOP CONDITIONS:**
    ✗ No competitors found via search → Report "No competitors found via search" (honest reporting)
      ❌ Example: Fabricating "CompetitorX Pro" when searches return zero results
      ✅ Example: "No competitors found via search for [solution type]" (transparent admission)

    **VERIFICATION REQUIREMENTS:**
    ✗ Competitor without verifiable source → Invalid entry (must have URL or user mention)
      ❌ Example: Listing "ToolX - $99/mo" without website URL or Knowledge Source user mention
      ✅ Example: "ToolY ($149/mo) - https://tooly.com/pricing - mentioned by 3 Reddit users"
    ✗ Features without website verification → Fabrication risk
      ❌ Example: Assuming competitor has "AI matching" without checking their product page
      ✅ Example: Features from product page: "AI-powered matching", "Real-time notifications", "Multi-language support", "API access", "Mobile app" (verified at https://example.com/features)
    ✗ Pricing without official source → Must mark "Pricing not publicly available"
      ❌ Example: Guessing "$50/month" when pricing page doesn't exist
      ✅ Example: "Pricing not publicly available (checked website 2025-01-19)"

    **DATA ACCURACY:**
    ✗ Nonsensical search queries → Semantic validation failure
      ❌ Example: "home appliance software" for physical product directory (wrong category)
      ✅ Example: "home appliance comparison sites" (aligned with directory solution type)
    ✗ Wrong audience terms → Context mismatch
      ❌ Example: "enterprise relocation platforms" for consumer expat solution
      ✅ Example: "personal relocation services" (matches B2C target market from context)
    ✗ Generic market gaps without evidence → Hallucination
      ❌ Example: "Better UX needed" (vague, unsubstantiated)
      ✅ Example: "Real-time pricing transparency - cited by 12 users in pain point analysis" (specific, verified)

  expected_output: >
    CompetitiveAnalysisResult Pydantic model with:

    **solution_landscapes** (List[CompetitiveLandscape]): One per solution from Task 1, each containing:
    - solution_name: Matching solution from Task 1
    - competitors: List[Competitor] (5-8 verified competitors with comprehensive feature profiles - typically 4-8 features each)
    - market_gaps: List[str] (ALL unmet needs or weaknesses identified - be comprehensive, include every gap found from user complaints, missing features, and underserved segments)
    - differentiation_opportunities: List[str] (ALL ways new solution can differentiate - comprehensive list)
    - competitive_intensity: LOW/MEDIUM/HIGH
    - recommended_positioning: Strategic positioning angle (2-3 sentences)
    - pricing_insights: Optional pricing strategy recommendations

    Complete competitive context ready for solution refinement.

competitive_refinement:
  description: >
    **TASK 3: Competitive Refinement (Generate Enhancements)**

    Generate competitive enhancements for solutions from Task 1 based on insights from Task 2.

    **HOW TO ACCESS CONTEXT:**

    Tasks 1 and 2 are available in your context for reference:
    - Task 1: IdeaGenerationResult (base solutions - reference for solution names)
    - Task 2: CompetitiveAnalysisResult (competitive insights to apply)

    <uncertainty_and_ambiguity>
    - If Task 2 competitive insights are sparse: Proceed with available data
    - Note gaps in overall_competitive_insights: "Limited competitive data available for [solution]"
    - Never fabricate competitor details or market gaps
    - Make reasonable positioning recommendations based on available evidence
    - If no competitive data exists for a solution: Generate enhancements based on general market knowledge, noting this limitation
    </uncertainty_and_ambiguity>

    **YOUR TASK: Generate Competitive Enhancements**

    For EACH solution from Task 1, analyze Task 2 competitive insights and generate ONLY:

    **1. new_core_features** (List[str]): 2-4 NEW features inspired by competitive gaps
       - NOT all features - ONLY new additions from competitive analysis
       - Example: "Real-time pricing dashboard", "AI-powered provider matching"

    **2. new_differentiation_factors** (List[str]): 2-3 NEW factors based on market gaps
       - What makes this solution stand out vs competitors?
       - Example: "Real-time pricing transparency dashboard", "No competitor offers live pricing"

    **3. value_proposition_update** (Optional[str]): Refined value prop (ONLY if competitive analysis suggests changes)
       - Leave empty if no refinement needed
       - If provided: Enhanced version focusing on competitive positioning

    **4. pricing_strategy_update** (Optional[str]): Refined pricing (ONLY if competitive analysis suggests changes)
       - Leave empty if no refinement needed
       - If provided: Updated strategy with competitive pricing context

    **5. market_fit_score_adjustment** (Optional[float]): ±0.1 score adjustment (ONLY if competitive insights justify)
       - Range: -0.1 to +0.1
       - Leave empty if no adjustment warranted
       - Positive if gaps reveal better fit, negative if competition is stronger than expected

    **6. overall_competitive_insights** (str): Cross-solution competitive positioning (2-3 paragraphs)
       - Summarize key competitive themes across ALL solutions
       - Highlight market opportunities and positioning strategies
       - CRITICAL: Do NOT state which solution is "strongest" or "best" - that decision is made in Task 4
       - Present competitive analysis neutrally, discussing each solution's unique positioning

    **WORKFLOW:**

    1. For each solution in Task 1:
       a. Find matching CompetitiveLandscape from Task 2
       b. Review: market_gaps, differentiation_opportunities, recommended_positioning
       c. Generate enhancements based on competitive insights

    2. Create one SolutionEnhancement object per solution with:
       - solution_name (must match Task 1 exactly)
       - new_core_features (2-4 new features)
       - new_differentiation_factors (2-3 new factors)
       - Optional updates (only if warranted)

    3. Write overall_competitive_insights covering all solutions NEUTRALLY (no "strongest" or "best" recommendations)

    **PRE-SUBMISSION VALIDATION CHECKLIST:**

    Before finalizing output, verify:
    - [ ] Generated ONE SolutionEnhancement per Task 1 solution (1:1 mapping)
    - [ ] solution_name is EXACT character-by-character match to Task 1
    - [ ] new_core_features are ADDITIONS (not all features - Python merges)
    - [ ] new_differentiation_factors reference competitive gaps from Task 2
    - [ ] Optional updates (value_proposition, pricing) only provided if competitive analysis justifies changes
    - [ ] market_fit_score_adjustment is ±0.1 max, only if warranted
    - [ ] overall_competitive_insights synthesizes themes across ALL solutions

    ═══ CRITICAL RULES (Read Last - Recency Reminder) ═══

    **FIELD REQUIREMENTS:**
    ✗ Copying all features from Task 1 → Python merges automatically (only add NEW)
      ❌ Example: new_core_features = [all 7 original features from Task 1]
      ✅ Example: new_core_features = [2-3 NEW features from competitive gaps identified in Task 2]
    ✗ Inexact solution_name match → Python merge will fail
      ❌ Example: Task 1 = "RelocatePro", Task 3 = "RelocatePro Platform" (mismatch)
      ✅ Example: Task 1 = "RelocatePro", Task 3 = "RelocatePro" (exact character-by-character match)

    **DATA ACCURACY:**
    ✗ Enhancements unrelated to competitive analysis → Invalid
      ❌ Example: Adding "Mobile app" when Task 2 showed no mobile-related competitive gap
      ✅ Example: Adding "Real-time pricing dashboard" when Task 2 identified pricing transparency as market gap
    ✗ Large score adjustments without justification → Arbitrary
      ❌ Example: market_fit_score_adjustment: -0.3 (exceeds ±0.1 limit, unjustified)
      ✅ Example: market_fit_score_adjustment: 0.05 (competitive gap increases fit, within ±0.1 range)
    ✗ Generic value proposition updates → Vague
      ❌ Example: "A better platform for users" (meaningless fluff)
      ✅ Example: "Enhanced with real-time pricing transparency and AI-powered matching" (specific competitive advantages)

    **SCOPE VIOLATIONS:**
    ✗ overall_competitive_insights not covering all solutions → Incomplete synthesis
      ❌ Example: Insights discuss only 1 of 3 solutions (ignores 2 solutions)
      ✅ Example: Insights synthesize competitive themes across all 3 solutions with cross-cutting patterns
    ✗ overall_competitive_insights recommending one solution as "strongest" or "best" → Premature selection
      ❌ Example: "Competitive evidence is strongest for Solution A" (biased before Task 4 selection)
      ✅ Example: "Solution A has pricing transparency advantages; Solution B excels at community features; Solution C offers unique privacy positioning" (neutral comparison)

    **FORMAT EXAMPLE (DO NOT COPY — names and content are placeholders only):**

    **ANTI-COPYING RULE:** The example below uses "RelocatePro Directory" as a placeholder.
    Your output MUST use the actual solution names from Task 1. Do NOT reference "RelocatePro" or any relocation-related content.

    {
      "solution_enhancements": [
        {
          "solution_name": "RelocatePro Directory",
          "new_core_features": [
            "Real-time pricing dashboard for service transparency",
            "AI-powered provider matching based on user preferences"
          ],
          "new_differentiation_factors": [
            "Real-time pricing transparency - no competitor offers live pricing",
            "AI matching technology reduces search time by 60%"
          ],
          "value_proposition_update": "A comprehensive directory enhanced with real-time pricing transparency and AI-powered matching",
          "pricing_strategy_update": null,
          "market_fit_score_adjustment": 0.05
        }
      ],
      "overall_competitive_insights": "The relocation market shows strong opportunity for price transparency... [2-3 paragraphs]"
    }

  expected_output: >
    CompetitiveEnhancements Pydantic model with enhancements ONLY:

    **solution_enhancements** (List[SolutionEnhancement]): One enhancement per solution
    - solution_name: Must match Task 1 solution name exactly
    - new_core_features: 2-4 NEW features from competitive gaps (not all features)
    - new_differentiation_factors: 2-3 NEW competitive advantages (not all factors)
    - value_proposition_update: Optional refined value prop
    - pricing_strategy_update: Optional refined pricing
    - market_fit_score_adjustment: Optional ±0.1 adjustment

    **overall_competitive_insights** (str): Cross-solution competitive positioning (2-3 paragraphs) - MUST be neutral, no "strongest/best" recommendations

    NOTE: Task 1 base solution fields will be merged automatically by Python. Focus on generating excellent enhancements.

solution_selection:
  description: >
    **TASK 4: Solution Selection (Strategic Decision)**

    Select ONE solution from Task 3 based on comprehensive scoring.

    **CONTEXT from Task 3** (Automatic via CrewAI Context Chaining):

    You have access to IdeaGenerationResult with enhanced solutions containing:
    - Complete solution details (all 25 fields)
    - Competitive positioning (differentiation_factors)
    - Market fit and technical feasibility scores
    - SEO scalability and CAC estimates

    **WORKFLOW:**

    ## Selection Criteria

    Consider all factors and select the solution most likely to succeed:
    - **Market fit** (pain point alignment, evidence strength)
    - **Technical feasibility** (can be built solo in reasonable time)
    - **Competitive advantage** (gaps to exploit, differentiation)
    - **SEO growth potential** (organic acquisition economics)

    Weight factors based on this specific context. A low-competition niche might
    weight competitive advantage less. A technical product might weight feasibility more.
    Your judgment matters - use the scores as inputs, not rigid formulas.

    **Selection Process:**
    1. Score each solution across the 4 criteria (0-1 scale)
    2. Consider overall merit - not just weighted averages
    3. Select the solution that best balances all factors for THIS context
    4. Verify selection makes strategic sense

    **Build Selection Rationale:**
    - Reference specific data from the analysis
    - Quantify claims with evidence (pain point severity, competitive gaps, CAC estimates)
    - Explain why THIS solution beats alternatives

    **Identify Runner-Ups:**
    - List 2nd and 3rd best solutions
    - Explain why each could be a viable pivot

    **Recommended Focus:**
    - Actionable next steps based on the selected solution

    **SCORING TRANSPARENCY:**

    For EVERY solution evaluated, populate the all_solution_scores field with:
    - Solution name (exact match from Task 3 output)
    - Selection criteria scores: [market_fit, technical_feasibility, competitive_advantage, seo_growth_potential]
    - Composite score (your overall assessment of merit)
    - Rank (1=best, 2=runner-up #1, 3=runner-up #2, etc.)
    - Key evidence supporting each score

    This enables transparent comparison of ALL alternatives in the final report.

    **QUALITY CHECK:**

    Your selection must:
    - Reference specific data (pain point severity, competitive intensity, CAC estimates)
    - Include scores for all solutions evaluated (transparency)
    - Explain why this solution beats alternatives
    - Provide actionable next steps (not generic "validate market")

    ═══ CRITICAL RULES ═══

    **FIELD REQUIREMENTS:**
    ✗ Including keyword_demand_score in all_solution_scores → Premature (Stage 8.8 calculates)
    ✗ Missing all_solution_scores → Must include scores for ALL solutions evaluated

    **DATA ACCURACY:**
    ✗ Generic selection rationale without data → Hallucination risk
      ❌ Example: "Strong market fit and low competition" (vague, no numbers)
      ✅ Example: "Addresses 3 pain points (avg severity 0.82), LOW competitive intensity with 5 gaps"
    ✗ Scores without evidence → Arbitrary scoring
      ❌ Example: competitive_advantage_score: 0.9 (no justification)
      ✅ Example: competitive_advantage_score: 0.85 (LOW intensity + 5 market gaps from Task 2)
    ✗ Vague recommended focus → Generic fluff
      ❌ Example: "Build MVP and validate market"
      ✅ Example: "Validate directory curation model with 50 early adopters"

  expected_output: >
    SolutionSelection Pydantic model with:

    **selected_solution_name** (str): Name of selected solution (EXACT match to solution_name from Task 3)

    **selection_rationale** (str): Comprehensive justification (6-8 sentences) with:
    - Specific pain point data (severity scores, mention counts)
    - Competitive context (intensity level, gap count, positioning)
    - CAC economics (organic vs paid estimates, CAC advantage)
    - SEO scalability (score, page potential, content model)
    - Technical feasibility (development time, complexity)
    - Overall strategic fit (why this solution now)

    **selection_criteria_scores** (List[SelectionCriteriaScore]): 4 scores for selected solution only:
    - criterion="market_fit", score=0.X, justification="[specific data]"
    - criterion="technical_feasibility", score=0.X, justification="[specific data]"
    - criterion="competitive_advantage", score=0.X, justification="[specific data]"
    - criterion="seo_growth_potential", score=0.X, justification="[specific data]"

    **all_solution_scores** (List[SolutionScores]): Scores for ALL solutions evaluated:
    For EACH solution (selected + runner-ups), include these fields:
    - solution_name: [exact name from Task 3]
    - market_fit_score: 0.X
    - technical_feasibility_score: 0.X
    - competitive_advantage_score: 0.X
    - seo_growth_potential_score: 0.X
    - composite_score: 0.X (your overall assessment of merit)
    - rank: N (1=best, 2=second, etc.)

    NOTE: DO NOT include keyword_demand_score or adjusted_composite_score fields.
    These will be calculated later by Stage 8.8 using real DataForSEO API validation.

    **runner_up_solutions** (List[str]): 2-3 alternative solution names ranked by merit

    **recommended_focus** (str): Next steps recommendation (3-4 sentences) - actionable and specific

    Strategic selection ready for SEO strategy development (Stage 9).
