# UnifiedSolutionCrew Tasks
# 4-task pipeline consolidating Stages 7, 8, 8.5, 8.75 with CrewAI context chaining

solution_ideation:
  description: >
    ═══ CRITICAL RULES (Read First) ═══
    ✓ Generate 3-5 solution concepts from validated pain points ONLY
    ✓ Use Knowledge Sources to query additional user quotes and evidence
    ✓ Every solution MUST reference specific pain points by title
    ✓ Required: detailed HOW IT WORKS description (4-6 sentences)
    ✓ Required: project_type field (saas/directory/aggregator/comparison-tool/marketplace)
    ✓ Required: 6 SEO fields for every solution
    ✗ NEVER generate solutions without validated pain points
    ✗ If high_priority_count = 0 AND medium_priority_count = 0 → STOP

    **TASK 1: Solution Ideation (Brainstorm + Evaluate + Refine)**

    Generate 3-5 comprehensive solution proposals addressing validated pain points.

    ## Validated Pain Points

    **Analysis Summary:**
    {analysis_summary}

    **High-Opportunity Pain Points ({high_priority_count} identified):**
    {high_priority_list}

    **Medium-Opportunity Pain Points ({medium_priority_count} identified):**
    {medium_priority_list}

    **Top Categories:** {top_categories}

    **Total validated pain points:** {total_pain_points}
    **Total mentions:** {total_mentions}

    **Project Type Constraints:** {allowed_project_types}

    ## Validated User Segments

    {user_segments}

    ═══════════════════════════════════════════════════════════════════════════

    **WORKFLOW (FOLLOW IN ORDER):**

    1. **Validate Data** → If high_priority_count = 0 AND medium_priority_count = 0, STOP and return error
    2. **Review User Segments** → Use validated segments above to inform target_personas (align personas with actual user groups)
    3. **Query Knowledge Sources** → Search for additional quotes and context beyond summaries above
    4. **Brainstorm** → Generate 3-5 diverse solution concepts (consider ALL types: directories, aggregators, SaaS, marketplaces, comparison tools)
    5. **Evaluate** → Score each solution for technical_feasibility_score (0-1) and market_fit_score (0-1)
    6. **Refine** → Add target_personas, detailed core_features, pricing_strategy, differentiation_factors

    **CRITICAL: Indexable Pages First Framework**

    Prioritize solution types with organic content generation (lower CAC):

    | Type | SEO Score | Content Model | Organic CAC | Paid CAC |
    |------|-----------|---------------|-------------|----------|
    | **directory** | 0.8-1.0 | User submissions = pages | $15-30 | $200-350 |
    | **aggregator** | 0.8-1.0 | Data combos = comparisons | $20-40 | $180-300 |
    | **comparison-tool** | 0.5-0.7 | "[A] vs [B]" pages | $50-100 | $200-350 |
    | **marketplace** | 0.5-0.7 | Profiles + reviews | $80-150 | $200-400 |
    | **saas** | 0.2-0.4 | Manual blog content | $200-400 | $300-600 |

    **SEARCH STRATEGY** (Knowledge Source Queries):

    | Query Type | Purpose | Keywords |
    |------------|---------|----------|
    | Feature requests | Discover desired capabilities | "wish", "need", "should have", "would love", "missing feature" |
    | Workaround detection | Find improvised solutions | "workaround", "hack", "currently using", "cobbled together", "manual process" |
    | Payment signals | Assess willingness to pay | "worth paying", "would pay", "subscription", "expensive but", "budget for" |
    | Competitor mentions | Identify solution patterns | "using [tool]", "switched to", "alternative to", "better than", "compared to" |
    | Unmet needs | Surface solution opportunities | "doesn't exist", "can't find", "why isn't there", "someone should build" |
    | Integration desires | Find feature combinations | "integrate with", "works with", "connect to", "sync between", "all-in-one" |

    **REQUIRED FIELDS FOR EVERY SOLUTION:**

    1. **Basic Info:**
       - solution_name (catchy, descriptive)
       - description (HOW IT WORKS - 4-6 sentences step-by-step user journey)
       - value_proposition (one clear sentence)
       - pain_points_addressed (list specific titles from data)
       - core_features (5-7 MVP features)
       - target_personas (2-4 persona descriptions aligned with validated user segments above)

    2. **Scores & Strategy:**
       - market_fit_score (0-1, based on pain point severity/mentions)
       - technical_feasibility_score (0-1, based on tech complexity)
       - technical_approach (architecture summary + 1-2 sentences)
       - estimated_development_time (e.g., "3-4 months")
       - pricing_strategy (detailed monetization model)
       - differentiation_factors (2-4 unique advantages)
       - project_type (saas/directory/aggregator/comparison-tool/marketplace)

    3. **Data Aggregation (if applicable):**
       - requires_data_aggregation (True for aggregators/directories)
       - data_sources (list specific APIs/databases/scraping targets)

    4. **SEO Fields (MANDATORY):**
       - programmatic_seo_opportunity: Assessment + page count estimate (e.g., "High - 100+ pages Year 1")
       - content_generation_model: How content is created (user-generated/data-driven/manual)
       - organic_discovery_queries: 5-10 actual search queries users would type
       - estimated_cac_organic: Use project type CAC benchmarks from table
       - estimated_cac_paid: Based on niche keyword competitiveness
       - seo_scalability_score: Use score from table based on project type

    **DATA ACCURACY VALIDATION:**

    Before generating solutions, check:
    - high_priority_count > 0 OR medium_priority_count > 0 (else STOP)
    - analysis_summary does NOT indicate "insufficient data" (else STOP)
    - total_pain_points >= 3 (else STOP)

    Every solution MUST explicitly reference pain point titles, severity scores, or mention counts.

    **PRE-SUBMISSION VALIDATION CHECKLIST:**

    Before finalizing output, verify:
    - [ ] I validated data sufficiency (high OR medium priority count > 0)
    - [ ] Generated 3-5 solution concepts (diverse project types)
    - [ ] Each solution has ALL 25 fields populated (no null/missing fields)
    - [ ] pain_points_addressed lists specific titles from pain point data
    - [ ] description includes 4-6 sentence step-by-step HOW IT WORKS user journey
    - [ ] SEO fields completed: seo_scalability_score, estimated_cac_organic/paid, organic_discovery_queries
    - [ ] project_type selected from allowed types (saas/directory/aggregator/comparison-tool/marketplace)
    - [ ] target_personas aligned with validated user segments from input

    ═══ CRITICAL RULES (Read Last - Recency Reminder) ═══

    **STOP CONDITIONS:**
    ✗ High OR medium priority count = 0 → STOP immediately (insufficient data)
      ❌ Example: Generating solutions when pain point data shows "insufficient" or count = 0

    **FIELD REQUIREMENTS:**
    ✗ Vague descriptions or missing fields → Solution will be rejected by Python validation
      ❌ Example: "A platform that helps users" (vs detailed step-by-step user journey)
    ✗ Missing SEO fields → Incomplete solution (Python will reject)
      ❌ Example: Leaving seo_scalability_score, estimated_cac_organic/paid blank
    ✗ null values in any field → Python validation error
      ❌ Example: core_features: null (vs populated list)

    **DATA ACCURACY:**
    ✗ Invented personas not matching validated segments → Invalid output
      ❌ Example: "Tech-savvy millennials" when user segments show "45-65 year old retirees"
    ✗ Generic pain_points_addressed → Must use exact titles from data
      ❌ Example: "user frustration" (vs "High International Transaction Fees" from pain point list)
    ✗ Scores without evidence → Hallucination (must reference pain point data)
      ❌ Example: market_fit_score: 0.9 without citing severity scores or mention counts from input

  expected_output: >
    IdeaGenerationResult Pydantic model with:

    **solution_ideas** (List[SolutionIdea]): 3-5 comprehensive solutions with ALL 25 fields populated:
    - Basic: solution_name, description, value_proposition, pain_points_addressed, core_features, target_personas
    - Evaluation: market_fit_score, technical_feasibility_score, technical_approach, estimated_development_time
    - Strategy: pricing_strategy, differentiation_factors, project_type
    - Data: requires_data_aggregation, data_sources (if applicable)
    - SEO (6 fields): programmatic_seo_opportunity, content_generation_model, organic_discovery_queries, estimated_cac_organic, estimated_cac_paid, seo_scalability_score

    **recommended_solution** (Optional[str]): Initially null (will be set in Task 4)

    **market_insights** (str): 4-6 sentences summarizing opportunity landscape

    Each solution ready for competitive analysis with complete data.

competitive_analysis:
  description: >
    ═══ CRITICAL RULES (Read First) ═══
    ✓ Use search tools to discover competitors - verify everything
    ✓ Query Knowledge Sources for user-mentioned competitors
    ✓ ONLY report verifiable competitors (no invented names/features/pricing)
    ✓ If no competitors found → "No competitors found via search" (honest reporting)
    ✗ NEVER fabricate competitor names, features, or pricing
    ✗ Every competitor requires verifiable source (search result/user mention)

    **TASK 2: Competitive Analysis (Research + Gap Analysis)**

    Analyze competitive landscape for ALL solutions from Task 1.

    **HOW TO ACCESS CONTEXT:**

    Task 1 output (IdeaGenerationResult) is available in your context via CrewAI context chaining.

    **CRITICAL**: Extract the following fields from EACH solution in Task 1 output:
    - solution_name (use for competitor searches)
    - description (understand what problem it solves)
    - core_features (identify feature gaps vs competitors)
    - target_personas (identify underserved segments)
    - project_type (directory/saas/aggregator - affects competitor search strategy)
    - value_proposition (positioning reference)

    **VERIFICATION**: Count solutions from Task 1. Your output MUST contain exactly that many CompetitiveLandscape objects (one per solution).
    If Task 1 generated 4 solutions → you analyze 4 competitive landscapes.
    If Task 1 generated 5 solutions → you analyze 5 competitive landscapes.

    **CONTEXT: Niche Research Background**
    - Niche Description: {niche_description}
    - Target Market Segments:
      {market_segments}
    - Industry Boundaries: {industry_boundaries}

    **WORKFLOW (FOLLOW IN ORDER):**

    1. **FOR EACH SOLUTION** (iterate over all solutions from Task 1):
       a. **Generate Context-Aware Queries** (USE generate_competitor_queries TOOL):

          **REQUIRED**: Use the generate_competitor_queries tool to create validated search queries.

          Input format: "solution_name|project_type|pain_point1, pain_point2, pain_point3"

          Example: "ExpatEase|directory|visa complexity, language barriers, housing search"

          The tool applies 6 semantic validation rules automatically:
          1. Physical Products → directory/comparison terms
          2. B2C Consumer → consumer/home/personal terms
          3. Local/Regional → geographic context
          4. Solution Type Match → appropriate terminology
          5. Market Segments → segment-specific modifiers
          6. Industry Boundaries → scope validation

          **Execute generated queries with SerperDevTool to discover competitors.**

       b. **Verify with Knowledge Sources**:
          - Search for: "using", "tried", "alternative", "competitor", tool names
          - Extract user-mentioned competitors from social discussions

       c. **Competitor Profiling** (for top 5-8 competitors):
          - Website/product URL (verifiable)
          - Key features (from website/reviews)
          - Pricing (from website/public info)
          - Positioning (from tagline/messaging)
          - Customer feedback (from reviews/social mentions)
          - Strengths & weaknesses (evidence-based)

       d. **Gap Analysis**:
          - Market gaps: What are users complaining about? What's missing?
          - Differentiation opportunities: Where can new solution win?
          - Competitive intensity: LOW/MEDIUM/HIGH based on competitor count/strength
          - Recommended positioning: Strategic angle for differentiation

    2. **Compile CompetitiveAnalysisResult** with per-solution landscapes

    **VERIFICATION STANDARD:**

    - Every competitor MUST have verifiable source (URL or user mention)
    - Features MUST be from website/documentation (not assumed)
    - Pricing MUST be from official source or marked "Pricing not publicly available"
    - If searches return no results: Report "No competitors found via search"
    - Better to report 2 verified competitors than 10 fabricated ones

    **MARKET GAP IDENTIFICATION:**

    Look for gaps by:
    - User complaints about existing tools (Knowledge Sources)
    - Features mentioned in pain points but missing in competitors
    - Pricing dissatisfaction (too expensive/inflexible)
    - Underserved segments (personas not targeted by competitors)
    - Integration gaps, workflow friction, poor UX

    **PRE-SUBMISSION VALIDATION CHECKLIST:**

    Before finalizing output, verify:
    - [ ] Generated ONE CompetitiveLandscape per solution from Task 1
    - [ ] Applied semantic validation rules before searching (no nonsensical queries)
    - [ ] Every competitor has verifiable source (URL or user mention from Knowledge Sources)
    - [ ] Features/pricing are from websites (not assumed)
    - [ ] If no competitors found via search, I reported "No competitors found via search" honestly
    - [ ] Market gaps reference specific user complaints or missing features
    - [ ] competitive_intensity justified by competitor count/strength

    ═══ CRITICAL RULES (Read Last - Recency Reminder) ═══

    **STOP CONDITIONS:**
    ✗ No competitors found via search → Report "No competitors found via search" (honest reporting)
      ❌ Example: Fabricating "CompetitorX Pro" when searches return zero results
      ✅ Example: "No competitors found via search for [solution type]" (transparent admission)

    **VERIFICATION REQUIREMENTS:**
    ✗ Competitor without verifiable source → Invalid entry (must have URL or user mention)
      ❌ Example: Listing "ToolX - $99/mo" without website URL or Knowledge Source user mention
      ✅ Example: "ToolY ($149/mo) - https://tooly.com/pricing - mentioned by 3 Reddit users"
    ✗ Features without website verification → Fabrication risk
      ❌ Example: Assuming competitor has "AI matching" without checking their product page
      ✅ Example: "AI-powered matching (confirmed on product page: https://...)"
    ✗ Pricing without official source → Must mark "Pricing not publicly available"
      ❌ Example: Guessing "$50/month" when pricing page doesn't exist
      ✅ Example: "Pricing not publicly available (checked website 2025-01-19)"

    **DATA ACCURACY:**
    ✗ Nonsensical search queries → Semantic validation failure
      ❌ Example: "home appliance software" for physical product directory (wrong category)
      ✅ Example: "home appliance comparison sites" (aligned with directory solution type)
    ✗ Wrong audience terms → Context mismatch
      ❌ Example: "enterprise relocation platforms" for consumer expat solution
      ✅ Example: "personal relocation services" (matches B2C target market from context)
    ✗ Generic market gaps without evidence → Hallucination
      ❌ Example: "Better UX needed" (vague, unsubstantiated)
      ✅ Example: "Real-time pricing transparency - cited by 12 users in pain point analysis" (specific, verified)

  expected_output: >
    CompetitiveAnalysisResult Pydantic model with:

    **solution_landscapes** (List[CompetitiveLandscape]): One per solution from Task 1, each containing:
    - solution_name: Matching solution from Task 1
    - competitors: List[Competitor] (5-8 verified competitors with profiles)
    - market_gaps: List[str] (3-5 unmet needs or weaknesses in current market)
    - differentiation_opportunities: List[str] (3-5 ways new solution can differentiate)
    - competitive_intensity: LOW/MEDIUM/HIGH
    - recommended_positioning: Strategic positioning angle (2-3 sentences)
    - pricing_insights: Optional pricing strategy recommendations

    **market_insights** (str): Cross-cutting competitive themes (3-4 sentences)

    Complete competitive context ready for solution refinement.

competitive_refinement:
  description: >
    ═══ CRITICAL RULES (Read First) ═══
    ✓ Generate ONLY enhancements based on competitive analysis
    ✓ Focus on NEW features, differentiation factors, and refinements
    ✓ Python will merge with Task 1 base solutions automatically
    ✗ DO NOT copy or preserve fields from Task 1 - that's handled by Python
    ✗ DO NOT output complete SolutionIdea objects - ONLY enhancements

    **TASK 3: Competitive Refinement (Generate Enhancements)**

    Generate competitive enhancements for solutions from Task 1 based on insights from Task 2.

    **HOW TO ACCESS CONTEXT:**

    Tasks 1 and 2 are available in your context for reference:
    - Task 1: IdeaGenerationResult (base solutions - reference for solution names)
    - Task 2: CompetitiveAnalysisResult (competitive insights to apply)

    **YOUR TASK: Generate Competitive Enhancements**

    For EACH solution from Task 1, analyze Task 2 competitive insights and generate ONLY:

    **1. new_core_features** (List[str]): 2-4 NEW features inspired by competitive gaps
       - NOT all features - ONLY new additions from competitive analysis
       - Example: "Real-time pricing dashboard", "AI-powered provider matching"

    **2. new_differentiation_factors** (List[str]): 2-3 NEW factors based on market gaps
       - What makes this solution stand out vs competitors?
       - Example: "Real-time pricing transparency dashboard", "No competitor offers live pricing"

    **3. value_proposition_update** (Optional[str]): Refined value prop (ONLY if competitive analysis suggests changes)
       - Leave empty if no refinement needed
       - If provided: Enhanced version focusing on competitive positioning

    **4. pricing_strategy_update** (Optional[str]): Refined pricing (ONLY if competitive analysis suggests changes)
       - Leave empty if no refinement needed
       - If provided: Updated strategy with competitive pricing context

    **5. market_fit_score_adjustment** (Optional[float]): ±0.1 score adjustment (ONLY if competitive insights justify)
       - Range: -0.1 to +0.1
       - Leave empty if no adjustment warranted
       - Positive if gaps reveal better fit, negative if competition is stronger than expected

    **6. overall_competitive_insights** (str): Cross-solution competitive positioning (2-3 paragraphs)
       - Summarize key competitive themes across ALL solutions
       - Highlight market opportunities and positioning strategies

    **WORKFLOW:**

    1. For each solution in Task 1:
       a. Find matching CompetitiveLandscape from Task 2
       b. Review: market_gaps, differentiation_opportunities, recommended_positioning
       c. Generate enhancements based on competitive insights

    2. Create one SolutionEnhancement object per solution with:
       - solution_name (must match Task 1 exactly)
       - new_core_features (2-4 new features)
       - new_differentiation_factors (2-3 new factors)
       - Optional updates (only if warranted)

    3. Write overall_competitive_insights covering all solutions

    **PRE-SUBMISSION VALIDATION CHECKLIST:**

    Before finalizing output, verify:
    - [ ] Generated ONE SolutionEnhancement per Task 1 solution (1:1 mapping)
    - [ ] solution_name is EXACT character-by-character match to Task 1
    - [ ] new_core_features are ADDITIONS (not all features - Python merges)
    - [ ] new_differentiation_factors reference competitive gaps from Task 2
    - [ ] Optional updates (value_proposition, pricing) only provided if competitive analysis justifies changes
    - [ ] market_fit_score_adjustment is ±0.1 max, only if warranted
    - [ ] overall_competitive_insights synthesizes themes across ALL solutions

    ═══ CRITICAL RULES (Read Last - Recency Reminder) ═══

    **FIELD REQUIREMENTS:**
    ✗ Copying all features from Task 1 → Python merges automatically (only add NEW)
      ❌ Example: new_core_features = [all 7 original features from Task 1]
      ✅ Example: new_core_features = [2-3 NEW features from competitive gaps identified in Task 2]
    ✗ Inexact solution_name match → Python merge will fail
      ❌ Example: Task 1 = "RelocatePro", Task 3 = "RelocatePro Platform" (mismatch)
      ✅ Example: Task 1 = "RelocatePro", Task 3 = "RelocatePro" (exact character-by-character match)

    **DATA ACCURACY:**
    ✗ Enhancements unrelated to competitive analysis → Invalid
      ❌ Example: Adding "Mobile app" when Task 2 showed no mobile-related competitive gap
      ✅ Example: Adding "Real-time pricing dashboard" when Task 2 identified pricing transparency as market gap
    ✗ Large score adjustments without justification → Arbitrary
      ❌ Example: market_fit_score_adjustment: -0.3 (exceeds ±0.1 limit, unjustified)
      ✅ Example: market_fit_score_adjustment: 0.05 (competitive gap increases fit, within ±0.1 range)
    ✗ Generic value proposition updates → Vague
      ❌ Example: "A better platform for users" (meaningless fluff)
      ✅ Example: "Enhanced with real-time pricing transparency and AI-powered matching" (specific competitive advantages)

    **SCOPE VIOLATIONS:**
    ✗ overall_competitive_insights not covering all solutions → Incomplete synthesis
      ❌ Example: Insights discuss only 1 of 3 solutions (ignores 2 solutions)
      ✅ Example: Insights synthesize competitive themes across all 3 solutions with cross-cutting patterns

    **EXAMPLE OUTPUT:**

    {
      "solution_enhancements": [
        {
          "solution_name": "RelocatePro Directory",
          "new_core_features": [
            "Real-time pricing dashboard for service transparency",
            "AI-powered provider matching based on user preferences"
          ],
          "new_differentiation_factors": [
            "Real-time pricing transparency - no competitor offers live pricing",
            "AI matching technology reduces search time by 60%"
          ],
          "value_proposition_update": "A comprehensive directory enhanced with real-time pricing transparency and AI-powered matching",
          "pricing_strategy_update": null,
          "market_fit_score_adjustment": 0.05
        }
      ],
      "overall_competitive_insights": "The relocation market shows strong opportunity for price transparency... [2-3 paragraphs]"
    }

  expected_output: >
    CompetitiveEnhancements Pydantic model with enhancements ONLY:

    **solution_enhancements** (List[SolutionEnhancement]): One enhancement per solution
    - solution_name: Must match Task 1 solution name exactly
    - new_core_features: 2-4 NEW features from competitive gaps (not all features)
    - new_differentiation_factors: 2-3 NEW competitive advantages (not all factors)
    - value_proposition_update: Optional refined value prop
    - pricing_strategy_update: Optional refined pricing
    - market_fit_score_adjustment: Optional ±0.1 adjustment

    **overall_competitive_insights** (str): Cross-solution competitive positioning (2-3 paragraphs)

    NOTE: Task 1 base solution fields will be merged automatically by Python. Focus on generating excellent enhancements.

solution_selection:
  description: >
    ═══ CRITICAL RULES (Read First) ═══
    ✓ Select ONE solution from Task 3 output
    ✓ Score each solution across 4 criteria (0-1 scale)
    ✓ Selection rationale MUST reference specific data (scores, gaps, CAC, mentions)
    ✓ Provide runner-up solutions as alternative pivots
    ✗ NEVER use generic justifications ("strong market fit") - quantify with evidence
    ✗ If insufficient data for confident selection → report "Insufficient evidence"

    **TASK 4: Solution Selection (Strategic Decision)**

    Select ONE solution from Task 3 based on comprehensive scoring.

    **CONTEXT from Task 3** (Automatic via CrewAI Context Chaining):

    You have access to IdeaGenerationResult with enhanced solutions containing:
    - Complete solution details (all 25 fields)
    - Competitive positioning (differentiation_factors)
    - Market fit and technical feasibility scores
    - SEO scalability and CAC estimates

    **WORKFLOW (FOLLOW IN ORDER):**

    1. **Score Each Solution** across 4 criteria (0-1 scale):

       **A. Market Fit (0-1)**:
       - Weight: pain point severity scores, mention counts, willingness to pay
       - Data source: pain_points_addressed field + original pain point analysis
       - Formula: Average of (severity_score + wtp_score) for addressed pain points
       - market_fit_score from solution provides baseline

       **B. Technical Feasibility (0-1)**:
       - Weight: technical_feasibility_score from solution
       - Consider: estimated_development_time, technical_approach complexity
       - Lower is riskier (longer time, more dependencies)

       **C. Competitive Advantage (0-1)**:
       - Weight: differentiation_factors count and strength
       - Data source: market_gaps addressed, competitive_intensity
       - Lower competitive_intensity + more market_gaps = higher score

       **D. SEO Growth Potential (0-1)**:
       - Weight: seo_scalability_score (architectural SEO potential)
       - Consider: programmatic_seo_opportunity, estimated_cac_organic
       - Lower CAC + higher scalability = higher score

    2. **Calculate Composite Score**:
       - Weighted average: (0.35 × market_fit) + (0.25 × technical_feasibility) + (0.20 × competitive_advantage) + (0.20 × seo_growth)
       - Rank solutions by composite score

    3. **Strategic Selection**:
       - Select highest-scoring solution
       - Verify selection makes strategic sense (not just highest score)
       - Consider: speed to market, resource requirements, market timing

    4. **Build Selection Rationale**:
       - Reference specific data: pain point severity (e.g., "addresses 3 pain points with avg severity 0.82")
       - Quote competitive intensity (e.g., "LOW competitive intensity with 5 identified gaps")
       - Cite CAC estimates (e.g., "$20-40 organic CAC vs $180-300 paid")
       - Mention SEO scalability (e.g., "0.85 SEO scalability score - directory model generates 100+ pages Year 1")
       - Quantify every claim with evidence from analysis

    5. **Identify Runner-Ups**:
       - List 2nd and 3rd highest-scoring solutions
       - Explain why each could be viable alternative pivot

    6. **Recommended Focus**:
       - Strategic recommendation for next steps (e.g., "Validate directory curation model with early adopters")
       - Based on selected solution's characteristics and market position

    **SCORING TRANSPARENCY:**

    For EVERY solution evaluated, you MUST populate the all_solution_scores field with:
    - Solution name (exact match from Task 3 output)
    - Selection criteria scores: [market_fit, technical_feasibility, competitive_advantage, seo_growth_potential]
    - Composite score calculation: (0.35×market_fit + 0.25×technical + 0.20×competitive + 0.20×seo)
    - Rank (1=best, 2=runner-up #1, 3=runner-up #2, etc.)
    - Key evidence supporting each score (quote specific numbers)

    This enables transparent comparison of ALL alternatives in the final report.

    **PRE-SUBMISSION VALIDATION CHECKLIST:**

    Before finalizing selection, verify:
    - [ ] Selected ONE solution (highest composite score)
    - [ ] Selection rationale references ≥5 specific data points (pain point severity, CAC estimates, gap count, competitive intensity)
    - [ ] selection_criteria_scores has 4 scores for selected solution (market_fit, technical_feasibility, competitive_advantage, seo_growth_potential)
    - [ ] all_solution_scores populated for ALL solutions (selected + runner-ups) with 7 fields each
    - [ ] all_solution_scores DOES NOT include keyword_demand_score or adjusted_composite_score (calculated later in Stage 8.8)
    - [ ] Composite score calculated correctly: (0.35×market_fit + 0.25×technical + 0.20×competitive + 0.20×seo)
    - [ ] Runner-up solutions listed (2nd and 3rd place by composite score)
    - [ ] Recommended focus is actionable (not generic "validate market")
    - [ ] No generic language - all claims quantified with evidence

    ═══ CRITICAL RULES (Read Last - Recency Reminder) ═══

    **FIELD REQUIREMENTS:**
    ✗ Including keyword_demand_score in all_solution_scores → Premature (Stage 8.8 calculates)
      ❌ Example: {keyword_demand_score: 0.8, adjusted_composite_score: 0.75} in all_solution_scores
      ✅ Example: {composite_score: 0.68, rank: 1} (only 7 required fields, no keyword_demand_score)
    ✗ Incorrect composite score formula → Calculation error
      ❌ Example: Equal weights (0.25 each) instead of specified weighted formula
      ✅ Example: (0.35×market_fit + 0.25×technical + 0.20×competitive + 0.20×seo)

    **DATA ACCURACY:**
    ✗ Generic selection rationale without data → Hallucination risk
      ❌ Example: "Strong market fit and low competition" (vague, no numbers)
      ✅ Example: "Addresses 3 pain points (avg severity 0.82), LOW competitive intensity with 5 gaps, $20-40 organic CAC"
    ✗ Scores without evidence → Arbitrary scoring
      ❌ Example: competitive_advantage_score: 0.9 (no justification from Task 2 data)
      ✅ Example: competitive_advantage_score: 0.85 (LOW intensity + 5 market gaps from Task 2)
    ✗ Vague recommended focus → Generic fluff
      ❌ Example: "Build MVP and validate market" (meaningless template)
      ✅ Example: "Validate directory curation model with 50 early adopters in expat communities, focus on pricing transparency feature"

    **TRANSPARENCY VIOLATIONS:**
    ✗ Missing all_solution_scores → Incomplete comparison visibility
      ❌ Example: Only providing scores for selected solution (hides alternatives)
      ✅ Example: all_solution_scores populated for ALL solutions with 7 fields each (enables transparent comparison)
    ✗ Incomplete all_solution_scores entries → Missing data
      ❌ Example: Only 3 of 7 fields populated per solution
      ✅ Example: All 7 fields (solution_name, 4 criterion scores, composite_score, rank) populated for every solution

  expected_output: >
    SolutionSelection Pydantic model with:

    **selected_solution_name** (str): Name of selected solution (EXACT match to solution_name from Task 3)

    **selection_rationale** (str): Comprehensive justification (6-8 sentences) with:
    - Specific pain point data (severity scores, mention counts)
    - Competitive context (intensity level, gap count, positioning)
    - CAC economics (organic vs paid estimates, CAC advantage)
    - SEO scalability (score, page potential, content model)
    - Technical feasibility (development time, complexity)
    - Overall strategic fit (why this solution now)

    **selection_criteria_scores** (List[SelectionCriteriaScore]): 4 scores for selected solution only:
    - criterion="market_fit", score=0.X, justification="[specific data]"
    - criterion="technical_feasibility", score=0.X, justification="[specific data]"
    - criterion="competitive_advantage", score=0.X, justification="[specific data]"
    - criterion="seo_growth_potential", score=0.X, justification="[specific data]"

    **all_solution_scores** (List[SolutionScores]): CRITICAL - Scores for ALL solutions evaluated:
    For EACH solution (selected + runner-ups), include ONLY these 7 fields:
    - solution_name: [exact name from Task 3]
    - market_fit_score: 0.X (from solution's market_fit_score field)
    - technical_feasibility_score: 0.X (from solution's technical_feasibility_score field)
    - competitive_advantage_score: 0.X (calculated from competitive analysis: lower intensity + more gaps = higher score)
    - seo_growth_potential_score: 0.X (from solution's seo_scalability_score field)
    - composite_score: 0.X (weighted average: 0.35×market_fit + 0.25×technical + 0.20×competitive + 0.20×seo)
    - rank: N (1=best, 2=second, etc.)

    CRITICAL: DO NOT include keyword_demand_score or adjusted_composite_score fields.
    These will be calculated later by Stage 8.8 using real DataForSEO API validation.

    **runner_up_solutions** (List[str]): 2-3 alternative solution names ranked by composite score

    **recommended_focus** (str): Next steps recommendation (3-4 sentences) - actionable and specific

    Strategic selection ready for SEO strategy development (Stage 9).
