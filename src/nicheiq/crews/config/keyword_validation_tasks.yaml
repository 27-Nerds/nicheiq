hybrid_strategy:
  description: >
    ═══ CRITICAL RULES (Read First) ═══
    ✓ ONLY use keywords from DataForSEO tools - NO fabricated data
    ✓ Copy keyword strings EXACTLY (no modifications, capitalization changes)
    ✓ Need ≥20 keywords with relevance ≥0.6 → else report "INSUFFICIENT"
    ✗ DO NOT invent keywords if tools return empty results

    **CONTEXT:**
    - Solution: {solution_name} ({project_type})
    - Description: {solution_description}
    - Value Proposition: {value_proposition}
    - Core Features: {core_features}
    - Target Personas: {target_personas}
    - Niche: {niche_description}
    - Market Segments: {market_segments}

    **Pain Points Addressed:**
    {pain_points_formatted}

    ═══════════════════════════════════════════════════════════════════

    **YOUR TASK:**
    Discover 20+ semantically relevant keywords using your 4-Strategy Framework's
    Hybrid Approach (programmatic + LLM seeds).

    **WORKFLOW:**
    1. **Seed Generation** → Create 8-12 seeds combining:
       - Solution name variations: "[solution_name] alternative", "[solution_name] tool"
       - Pain point queries: Extract 3-4 problem phrases from pain points above
       - Market segment modifiers: Use segments like {market_segments}

    2. **Expansion** → Use DataForSEOExpandTool with each seed
       - Target: 50-100 total keywords from expansion
       - Filter: Remove keywords with search_volume < 10/month

    3. **Semantic Validation** → Verify keyword relevance for each keyword:
       - Relates to solution value proposition (not just broad category)
       - Matches pain points addressed
       - Relevant to target market segments ({market_segments})
       - Assign relevance score 0.0-1.0 (use semantic similarity)

    4. **Enrichment** → Use DataForSEOSearchVolumeTool to add metrics
       - Get search volume, competition, CPC for validated keywords
       - Calculate average relevance score across all keywords
       - Calculate total search volume

    5. **Quality Check** → Set quality_flag based on results

    | Quality Flag | Criteria | Action |
    |--------------|----------|--------|
    | SUCCESS | avg_relevance ≥0.6 AND total ≥20 | Proceed to next stage |
    | INSUFFICIENT | Below thresholds | Try next strategy or report "Insufficient demand" |

    **Seed Quality Table:**
    | Quality | Examples | Rationale |
    |---------|----------|-----------|
    | ✓ Good | "project management for remote teams", "freelancer marketplace" | Specific intent + segment |
    | ✗ Bad | "{solution_name}", "discover", "tools" | Generic or brand-only terms |

    ═══ CRITICAL RULES (Read Last - Recency Reminder) ═══
    ✗ If tools return empty results → Report that fact (no invention)
    ✗ If API errors occur → Set error_log field, return partial results
    ✗ Never modify DataForSEO keyword strings - copy EXACTLY as provided

  expected_output: >
    Complete KeywordAttemptResult Pydantic model with ALL fields populated:

    REQUIRED FIELDS:

    | Field | Type | Rule | Source |
    |-------|------|------|--------|
    | strategy_name | str | "hybrid" (fixed) | Hardcoded |
    | keywords | List[EnrichedKeyword] | ALL from tool | DataForSEOSearchVolumeTool exact copy |
    | total_keywords | int | len(keywords) | Calculated |
    | avg_relevance_score | float | 0.0-1.0 | Semantic validation average |
    | quality_flag | str | SUCCESS/INSUFFICIENT | avg_relevance ≥0.6 AND total ≥20 |
    | error_log | str/null | Error or null | API response or null |

    **ZERO-TOLERANCE Data Accuracy Examples:**

    | Field | ✅ CORRECT | ❌ WRONG | Reason |
    |-------|-----------|----------|--------|
    | keyword | "tax residency portugal" | "Tax Residency Portugal" | Capitalization changed |
    | search_volume | 387 | 400 | Rounded (suspiciously round) |
    | competition | 0.42 | 0.4 | Changed precision |
    | cpc | 2.50 | null | Dropped available data |

    STRUCTURE EXAMPLE (populate with actual DataForSEO data):
    {
      "strategy_name": "hybrid",
      "keywords": [
        {
          "keyword": "expat health insurance",        # Exact string from DataForSEO
          "search_volume": 320,                        # From tool output
          "competition": 0.42,                         # 0.0-1.0 from tool
          "cpc": 2.50,                                 # Cost per click (nullable)
          "tier": null,                                # Leave null (not used here)
          "geography": null                            # Leave null (not used here)
        },
        {
          "keyword": "tax residency portugal",
          "search_volume": 210,
          "competition": 0.38,
          "cpc": 1.80,
          "tier": null,
          "geography": null
        }
      ],
      "total_keywords": 35,                            # Count of keywords list
      "avg_relevance_score": 0.72,                     # Calculate semantic relevance
      "quality_flag": "SUCCESS",                       # SUCCESS or INSUFFICIENT
      "error_log": null                                # null or error message
    }

    CRITICAL: Return ACTUAL DATA from DataForSEO tools, not schema definitions.

competitor_strategy:
  description: >
    ═══ CRITICAL RULES (Read First) ═══
    ✓ ONLY use keywords from DataForSEO tools - NO fabricated data
    ✓ Copy keyword strings EXACTLY (no modifications)
    ✓ Need ≥20 keywords with relevance ≥0.6 → else "INSUFFICIENT"
    ✗ DO NOT invent keywords if tools return empty results

    **CONTEXT:**
    - Solution: {solution_name} ({project_type})
    - Description: {solution_description}
    - Core Features: {core_features}
    - Target Personas: {target_personas}
    - Niche: {niche_description}

    **Known Competitors:**
    {competitor_names}

    ═══════════════════════════════════════════════════════════════════

    **YOUR TASK:**
    Discover keywords using your 4-Strategy Framework's Competitor Alternative
    approach (leverage established competitor names).

    **WORKFLOW:**
    1. **Seed Generation** → Create 8-12 competitor-focused seeds:
       - "{competitor_name} alternative"
       - "{competitor_name} vs {solution_name}"
       - "alternative to {competitor_name}"
       - "better than {competitor_name}"

       **Fallback** (if no competitors):
       - "[{project_type}] tools" (e.g., "marketplace tools", "directory tools")
       - "[{niche_description}] solutions" (e.g., "expat relocation solutions")
       - "how to [pain_point]" (extract from pain points above)

    2. **Expansion** → Use DataForSEOExpandTool (target: 50-100 keywords)

    3. **Semantic Validation** → Verify keyword relevance for each keyword:
       - Relates to solution value proposition (not just competitor mentions)
       - Matches pain points addressed
       - Relevant to target market segments
       - Assign relevance score 0.0-1.0 (use semantic similarity)

    4. **Enrichment** → Use DataForSEOSearchVolumeTool to add metrics
       - Get search volume, competition, CPC for validated keywords
       - Calculate average relevance score across all keywords

    5. **Quality Check** → Set quality_flag based on results

    | Quality Flag | Criteria | Action |
    |--------------|----------|--------|
    | SUCCESS | avg_relevance ≥0.6 AND total ≥20 | Proceed to next stage |
    | INSUFFICIENT | Below thresholds | Try next strategy or report "Insufficient demand" |

    **Competitor Seed Quality:**
    | Quality | Examples | Rationale |
    |---------|----------|-----------|
    | ✓ Good | "Upwork alternative", "Fiverr vs Toptal" | Specific competitor names |
    | ✗ Bad | "competitor", "alternatives", "vs" | Too generic |

    ═══ CRITICAL RULES (Read Last - Recency Reminder) ═══
    ✗ If no competitors available → Use fallback strategy (do not invent names)
    ✗ If tools return empty → Report that fact (no invention)
    ✗ Copy all data EXACTLY from tool outputs

    **ZERO-TOLERANCE Data Accuracy Examples:**

    | Field | ✅ CORRECT | ❌ WRONG | Reason |
    |-------|-----------|----------|--------|
    | keyword | "Upwork alternative" | "upwork alternative" | Capitalization changed |
    | search_volume | 1850 | 1900 | Rounded (suspiciously round) |
    | competition | 0.52 | 0.5 | Changed precision |
    | cpc | 3.20 | null | Dropped available data |

  expected_output: >
    Complete KeywordAttemptResult Pydantic model with ALL fields populated.

    Same structure as hybrid_strategy expected_output (lines 67-107), except:
    - strategy_name: "competitor" (not "hybrid")
    - keywords: Use competitor-alternative seeds (e.g., "Upwork alternative", "Fiverr vs Toptal")

    See hybrid_strategy for complete REQUIRED FIELDS table and STRUCTURE EXAMPLE.

    CRITICAL: Return ACTUAL DATA from DataForSEO tools, not schema definitions.
