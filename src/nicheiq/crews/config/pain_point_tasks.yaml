# PainPointCrew Tasks
# Following best practices: 80% effort on task design, specific expected outputs, clear success criteria

categorize_content:
  description: >
    **NICHE CONTEXT:**
    - Niche Description: {niche_description}
    - Market Segments:
      {market_segments}
    - Industry Boundaries: {industry_boundaries}

    You are provided with ALL social media discussions below. Review this complete content to create
    a systematic categorization of themes, problems, and user segments RELEVANT TO THE NICHE CONTEXT ABOVE.
    Use market segments to guide categorization - discussions should align with identified segments.

    **Content Summary:**
    - Reddit posts: {reddit_posts_count} posts with {total_reddit_comments} comments
    - Twitter threads: {twitter_threads_count} threads with {total_twitter_replies} replies
    - Total content pieces: {total_content}

    ═══════════════════════════════════════════════════════════════════════════

    ## COMPLETE REDDIT DISCUSSIONS:

    {full_reddit_content}

    ═══════════════════════════════════════════════════════════════════════════

    ## COMPLETE TWITTER DISCUSSIONS:

    {full_twitter_content}

    ═══════════════════════════════════════════════════════════════════════════


    # Reasoning Strategy
    Follow this step-by-step analysis approach:

    1. **Content Scan**: Skim all Reddit + Twitter content above to assess volume and density of discussions
    2. **Theme Extraction**: Identify 5-10 recurring theme categories from patterns (let data guide you, not assumptions)
    3. **Segment Mapping**: For each category, identify user segments from explicit self-descriptions in discussions
    4. **Frequency Assignment**: Assign High/Medium/Low based on actual mention counts (count occurrences)
    5. **Quote Collection**: Gather 5-10 representative quotes per theme (minimum 2), preserving [source: ID] suffixes exactly as written
    6. **Quality Verification**: Verify each quote exists verbatim in content above before including - NEVER fabricate quotes to reach quota

    **Pattern Keywords:**
    - Problems: "frustration", "difficult", "can't", "impossible", "broken", "struggle"
    - Impact: "time", "money", "expensive", "hours", "cost", "afford"
    - Emotional: "hate", "annoying", "painful", "frustrated", "stressed"
    - Workarounds: "using", "tried", "workaround", "alternative"


    **Acceptance Criteria:**

    - Minimum 5 distinct theme categories identified
    - Each category has clear definition and 5-10 representative quotes (minimum 2) from the content above - all verified to exist verbatim
    - User segments are specific enough to inform product targeting
    - Frequency indicators (high/medium/low) assigned to each theme based on mention count

    ═══ CRITICAL RULES (Read Last - Recency Reminder) ═══

    **STOP CONDITIONS:**
    ✗ <5 substantive discussions found → STOP immediately
      ❌ Example: Inventing discussion themes when content is sparse

    If STOP condition is met, return ContentCategorizationReport with:
      - executive_summary: "Insufficient discussion data (fewer than 5 substantive discussions found)"
      - theme_categories: [] (empty list)
      - user_segments: [] (empty list)

    **DATA ACCURACY:**
    ✗ Every quote MUST be directly copied from content - NO paraphrasing
      ❌ Example: "Users experience difficulty" (paraphrased)
      ✅ Example: "I spent 3 hours trying to figure this out" (direct quote)
    ✗ User segments must match self-descriptions from discussions
      ❌ Example: "consumers", "users", "small businesses" (generic)
      ✅ Example: "Budget-conscious first-time buyers seeking affordable luxury dupes" (from discussions)
    ✗ DO NOT use training data or niche assumptions - ONLY analyze provided content
      ❌ Example: Creating categories based on assumptions about the niche vs actual patterns

    # Final Reasoning Instruction
    First, think step by step about the major discussion themes you observed across the Reddit and Twitter content.
    Then, identify the user segments that appear most frequently in each theme based on self-descriptions.
    Finally, structure your categorization following the expected output format exactly, ensuring all quotes include [source: ID] suffixes.

  expected_output: >
    A ContentCategorizationReport object with the following structure:

    **executive_summary**: 2-3 sentence overview of the discussion landscape, primary themes discovered,
    and key user segments identified. This should be a cohesive narrative, not bullet points.

    **theme_categories**: List of ThemeCategory objects (aim for 5-10 categories based on distinct patterns in discussions).
    Each ThemeCategory object must contain:
       - **category_name**: Clear, descriptive category name (e.g., "Skepticism and Value Perception of Luxury vs Affordable Skincare")
       - **definition**: What this category represents based on actual discussion patterns (2-3 sentences)
       - **frequency**: Either "High", "Medium", or "Low" based on mention count
       - **mention_count**: Number of distinct discussions mentioning this theme (integer)
       - **primary_user_segments**: List of specific user types discussing this theme (e.g., ["Budget-conscious consumers", "Luxury skincare aspirants"])
       - **representative_quotes**: 5-10 direct user quotes that exemplify this theme (minimum 2 - if fewer exist, exclude the category rather than fabricating). CRITICAL: Copy quotes EXACTLY as they appear in content, INCLUDING the [source: POST_ID] suffix at the end of each quote (e.g., "I spent 3 hours on setup [source: abc123]"). DO NOT strip the [source: ...] tags - they are required for Task 2 traceability. VERIFY each quote exists verbatim before including.

    **user_segments**: List of UserSegment objects (aim for 4-8 segments based on distinct user types in discussions).
    Each UserSegment object must contain:
       - **segment_name**: User segment name from self-descriptions in discussions (e.g., "Sensitive Skin Sufferers", "Skincare Minimalists")
       - **primary_concerns**: List of main pain points/topics for this segment (3-6 concerns)
       - **mention_frequency**: Either "High", "Medium", or "Low"

    **overall_quality**: One of "High", "Medium", or "Low" with 1-sentence justification

    CRITICAL: Return a valid ContentCategorizationReport Pydantic object with ALL fields populated.
    DO NOT return markdown text or a description of what the report should contain.
    Every quote in representative_quotes MUST be directly copied from knowledge sources WITH its [source: ID] suffix - NO paraphrasing, NO stripping source tags.
    Every user segment name MUST match self-descriptions from discussions - NO generic assumptions.

extract_pain_points:
  description: >
    **NICHE CONTEXT:** {niche_description}

    Transform the categorized content into specific, actionable pain points relevant
    to the niche being analyzed.

    **WORKFLOW** (Apply Thorough Evidence Gathering Protocol):

    1. Review categorization report → identify high/medium-frequency categories
    2. For each category → extract ALL specific pain points with sufficient supporting evidence (minimum 2 verified quotes each)
    3. **EXHAUSTIVE SEARCH** → For each potential pain point, run MULTIPLE knowledge source queries using different phrasings:
       - Query 1: Main problem keywords (e.g., "slow loading", "performance issues")
       - Query 2: Synonyms and variants (e.g., "laggy", "takes forever", "waiting")
       - Query 3: Emotional language (e.g., "frustrated", "annoying", "hate")
       - Query 4: Impact language (e.g., "wasting time", "lost customers", "can't work")
    4. **COUNT ALL UNIQUE DISCUSSIONS** → From ALL queries, count every unique [source: ID]. This count becomes mention_count.
    5. **SELECT BEST QUOTES CAREFULLY** → From those mentions, select 5-10 quotes that:
       - Clearly articulate the pain (specific, detailed complaints)
       - Include impact statements (time lost, money spent, frustration level)
       - Have [source: ID] suffix intact (REQUIRED - never fabricate)
       - Represent diverse voices (different users, different platforms if possible)
    6. **VERIFY EACH QUOTE EXISTS** → Before including a quote, confirm you can find it in knowledge sources
    7. Identify severity indicators → "frustrating", "critical", "showstopper"
    8. Note current solutions/workarounds users mention
    9. Track source post IDs → extract from [POST_ID: ...] or [THREAD_ID: ...] headers
    10. **QUALITY GATE**: If <2 VERIFIED quotes with [source: ID] → EXCLUDE pain point entirely

    **CRITICAL**: mention_count and quote count are DIFFERENT:
    - mention_count = ALL unique posts discussing this problem (typically 10-50+)
    - representative_quotes = 5-10 SELECTED examples from those mentions
    - If mention_count equals quote count, you searched insufficiently

    **CATEGORY COVERAGE REQUIREMENT** (Prevents Missing High-WTP Pain Points):

    ✓ MUST extract at least ONE pain point from EVERY high-frequency category (≥10 mentions) in Task 1
    ✓ If Task 1 found "Financial/Cost" or "Money/Budget" category → this MUST become a pain point
    ✓ DO NOT skip categories just because they seem "obvious" or "non-emotional"
    ✓ Financial pain points often have the HIGHEST WTP potential - prioritize them

    **Why This Matters:**
    - Emotional pain (fear, frustration) drives severity scores
    - Financial pain (cost complaints) drives WTP scores
    - BOTH are needed for high-opportunity pain points
    - Missing financial categories = artificially low WTP scores downstream

    **SEARCH STRATEGY** (Knowledge Source Queries):

    | Query Type | Purpose | Keywords |
    |------------|---------|----------|
    | Problem keywords | Find quote evidence | Specific problem terms from categories |
    | Emotional language | Severity assessment | "frustrating", "critical", "annoying", "showstopper" |
    | Financial pain | WTP signals (HIGH PRIORITY) | "cost", "expensive", "afford", "budget", "price", "pay", "$", "£", "€" |
    | Impact mentions | Business impact | "time", "productivity", "revenue" |
    | Workarounds | Current solutions | "using", "tried", "alternative to" |

    **Acceptance Criteria:**

    - Extract ALL distinct pain points supported by discussion evidence (do NOT target a specific number — let the data determine quantity)
    - Each pain point has clear problem articulation
    - Supporting evidence includes direct user quotes from knowledge sources (as many as available, minimum 2)
    - Mention frequency quantified for each
    - Source platforms identified (Reddit/Twitter)
    - Source post IDs tracked for traceability

    ═══ CRITICAL RULES (Read Last - Recency Reminder) ═══

    **STOP CONDITIONS:**
    ✗ <2 quotes found for a pain point → EXCLUDE that pain point
      ❌ Example: Creating pain point with only 1 quote to reach quota
    ✗ Knowledge source query returns no results → pain point does NOT exist in data
      ✅ Example: Return "Insufficient evidence in knowledge sources" if very few validated pain points found

    **DATA ACCURACY:**
    ✗ Every quote MUST be direct copy from knowledge sources - NO paraphrasing
      ❌ Example: "Users experience difficulty" (paraphrased)
      ✅ Example: "I spent 3 hours trying to figure this out" (direct quote)
    ✗ DO NOT invent "example" quotes or use general niche knowledge
      ❌ Example: Creating plausible-sounding quotes not from knowledge sources
    ✗ Mention counts must be actual unique post occurrences - NOT quote count
      ❌ Example: mention_count = 3 (just because you collected 3 quotes)
      ❌ Example: "~15 mentions" (estimated)
      ✅ Example: "12 mentions" (counted 12 distinct posts with [source: ID] discussing this pain point)

    **OUTPUT REQUIREMENTS:**
    ✗ Pain point descriptions must use exact user language - NO corporate paraphrasing
      ❌ Example: "Users require enhanced onboarding experiences" (corporate-speak)
      ✅ Example: "Setup took me 3 hours and support never responded" (user language)
    ✗ Source post IDs must be extracted from [source: ID] suffixes in quotes - NO placeholders
      ❌ Example: ["post001", "post002"] (fabricated placeholder IDs)
      ✅ Example: ["1a2b3c", "4d5e6f"] (extracted from [source: ...] suffixes in quote text)
    ✗ DO NOT merge unrelated problems to inflate pain point count
      ✅ Example: If only 7 validated pain points exist with ≥2 quotes → return all 7

    **ANTI-HALLUCINATION GUARDRAILS:**
    ✗ NEVER fabricate post IDs - if you cannot find [source: ID], use empty list []
      ❌ Example: Creating sequential IDs like ["post_001", "post_002", "post_003"]
      ❌ Example: Generating realistic-looking IDs like ["abc123xyz"] that don't exist
      ✅ Example: Only use IDs you literally see in [source: ID] suffixes
    ✗ NEVER paraphrase or summarize quotes - copy character-by-character
      ❌ Example: "Many users struggle with setup" (paraphrased from multiple quotes)
      ✅ Example: "I spent 3 hours on setup and still couldn't get it working" (exact copy)
    ✗ If a quote does NOT have [source: ID] suffix → DO NOT include it
      ❌ Example: Including quotes without source attribution
      ✅ Example: Skip quotes lacking [source: ID] and find other quotes with proper attribution
    ✗ NEVER invent quotes to reach a quota - quality over quantity
      ❌ Example: Creating plausible-sounding quotes when knowledge sources are sparse
      ✅ Example: Return ALL well-evidenced pain points (even if only 5) rather than padding with fabricated quotes to reach a target

    **WHEN DATA IS SPARSE** (Critical Decision Point):
    If you cannot find sufficient quotes for a pain point despite thorough searching:
    1. DO NOT fabricate quotes to fill the gap
    2. DO NOT include the pain point if <2 verified quotes exist
    3. Return fewer pain points rather than lower-quality pain points
    4. Document in extraction_summary: "Limited to X pain points due to sparse evidence for [category Y]"
    5. Include ALL well-evidenced pain points — never sacrifice evidence quality to inflate count, and never cap count artificially

    **EXTRACTION CHAIN-OF-THOUGHT PROCEDURE:**
    For EACH pain point you identify, follow this mandatory procedure:

    Step 1: **Identify Pattern** - Note recurring problem from categorization
    Step 2: **Multi-Query Search** - Run 3-4 different queries with synonyms and variants
    Step 3: **Collect Candidates** - Gather ALL quotes with [source: ID] from all queries
    Step 4: **Verify Each Quote** - Confirm each quote exists verbatim in knowledge sources
    Step 5: **Count Verified** - If <2 verified quotes with [source: ID] → EXCLUDE this pain point
    Step 6: **Select Best 5-10** - From verified quotes, pick most detailed and impactful ones
    Step 7: **Preserve Exactly** - Include full quote WITH [source: ID] suffix intact
    Step 8: **Final Check** - Verify all included quotes are verbatim copies with visible [source: ID] tags

    CRITICAL: DO NOT remove [source: ID] suffixes yourself - Python will extract them post-processing.

    CRITICAL: DO NOT include any text, explanation, or bullets before or after your JSON output. Return ONLY a raw JSON object.

  expected_output: >
    Return a single JSON object (no markdown, no explanation text before or after) with this exact structure:

    {
      "niche": "the niche being analyzed",
      "extracted_pain_points": [
        {
          "title": "Short descriptive name",
          "description": "2-3 sentence problem articulation in user language",
          "mention_count": 18,
          "representative_quotes": [
            "Quote text here [source: abc123]",
            "Another quote [source: def456]"
          ],
          "source_platforms": ["Reddit"],
          "categories": ["Category Name"],
          "source_post_ids": []
        }
      ],
      "extraction_summary": "3-4 sentences overview of pain point landscape and key patterns"
    }

    Rules:
    - Return ONLY raw JSON starting with { and ending with } — no markdown, no **bold**, no explanation text
    - Minimum 2 verified quotes per pain point (all with [source: ID] suffix)
    - source_post_ids ALWAYS [] (Python extracts automatically)
    - mention_count must be LARGER than quote count (count ALL unique [source: ID] discussions, not just selected quotes)
    - Extract ALL qualifying pain points — do not cap at a fixed number
    - Quality over quantity — exclude pain points with insufficient evidence rather than fabricating quotes
    - Every quote MUST end with [source: POST_ID] — copy exactly from content; if quote has no [source: ID] suffix, exclude it

validate_pain_points:
  description: >
    ═══ TASK 3: VALIDATION & SCORING ═══
    ✓ Generate ONLY validation scores for extracted pain points (Python will merge with Task 2)
    ✓ Focus on evidence-based scoring using knowledge sources
    ✓ DO NOT copy pain point fields—only generate scores

    **NICHE CONTEXT:** {niche_description}

    **RESEARCH METADATA:**
    - Data Sources: {reddit_posts_count} Reddit posts from r/{subreddits}, {twitter_threads_count} Twitter threads
    - Total Engagement: {total_reddit_comments} Reddit comments, {total_twitter_replies} Twitter replies
    - Collection Date: {collection_timestamp}

    Use this metadata for context when scoring pain points. More diverse subreddit sources and higher engagement counts indicate stronger validation signals.

    **HOW TO ACCESS CONTEXT:**

    Task 2 output (PainPointExtraction) is available in your context. Extract:
    - From Task 2: extracted_pain_points list (titles, descriptions, quotes, mention counts)
    - DO NOT copy these fields—reference pain_point_title only for matching

    **YOUR TASK: Generate Validation Scores**

    For EACH pain point in Task 2 extraction, generate scoring data:
    - pain_point_title: The exact title from Task 2 (for Python matching)
    - severity_score: Float 0.0-1.0 based on evidence
    - willingness_to_pay: Float 0.0-1.0 based on financial signals
    - opportunity_level: OpportunityLevel enum (high/medium/low)
    - scoring_rationale: Brief explanation (2-3 sentences)

    **SCORING RUBRIC** (Apply your Evidence-Based Scoring Framework):

    | Score Range | Severity Indicators | Willingness-to-Pay Indicators |
    |-------------|---------------------|-------------------------------|
    | **0.8-1.0** (High) | Critical business impact, workflow blocker, strong emotional language ("nightmare", "critical", "can't work without") | Explicit payment mentions, budget availability, current spend on inadequate solutions |
    | **0.5-0.7** (Medium) | Significant inconvenience, wastes time/money, clear frustration | Frustration with existing paid tools, value/ROI mentions |
    | **0.4-0.55** (Med) | Notable pain affecting productivity | INFERRED: severity ≥0.7 AND workflow-blocking = WTP 0.45-0.55 |
    | **0.25-0.4** (Low-Med) | Notable annoyance, mentioned but not critical | INFERRED: productivity/time loss mentioned = WTP 0.3-0.4 |
    | **0.15-0.25** (Low) | Minor inconvenience with some frustration | INFERRED: strong emotional language = WTP 0.15-0.25 |
    | **0.0-0.1** (None) | Minor inconvenience, weak signals | No financial OR productivity impact signals |

    **WORKFLOW:**
    1. Review extracted pain points from Task 2 context
    2. Query knowledge sources for severity/WTP indicators (use keywords: "critical", "pay", "cost", "budget", "time", "revenue")
    3. Apply scoring rubric with quote-based justification
    4. Calculate opportunity level (High: both scores ≥0.6, Medium: one score ≥0.6, Low: both <0.6)

    **QUALITY STANDARDS:**
    - Scores must be defensible with quotes from knowledge sources
    - Discriminate—not everything is 0.9
    - Score conservatively when uncertain
    - Cross-reference Reddit + Twitter evidence

    **WTP INFERENCE RULES** (When No Explicit Payment Signals):
    When knowledge sources lack explicit money/budget mentions, INFER WTP based on:
    - severity ≥0.7 AND workflow-blocking problem → assign WTP 0.45-0.55 (high inference)
    - productivity/time loss explicitly mentioned → assign WTP 0.3-0.4 (medium inference)
    - Strong emotional language (frustration, anger) → assign WTP 0.15-0.25 (low inference)
    - Only assign WTP 0.0-0.1 when problem is minor inconvenience with NO productivity impact
    - CRITICAL: NEVER assign identical WTP scores to all pain points - use the full range to differentiate

    **CRITICAL DATA ACCURACY RULES:**
    - Scores MUST be based on evidence you can find in knowledge sources through queries
    - If knowledge source queries return insufficient evidence for severity, assign 0.0 with note
    - DO NOT assign scores based on assumptions about what severity "should" be for this type of problem
    - Every severity score ≥0.5 MUST have at least one direct quote showing strong emotional language or business impact
    - WTP scores ≥0.6 require explicit payment mentions; WTP scores 0.1-0.55 can be INFERRED from severity/impact

    **CRITICAL CONSTRAINT: 1:1 Mapping Required**
    - You MUST score EXACTLY the pain points from Task 2—no more, no fewer
    - DO NOT add new pain points, merge, split, or remove pain points
    - Use exact pain_point_title from Task 2 for matching

    ═══ CRITICAL RULES (Read Last - Recency Reminder) ═══

    **DATA ACCURACY:**
    ✗ Scores MUST be based on evidence from knowledge sources - NO assumptions
      ❌ Example: Scoring without querying knowledge sources (using assumptions about severity)
    ✗ Every severity score ≥0.5 requires ≥1 quote showing strong emotional language/business impact
      ❌ Example: Assigning 0.9 severity without quotes showing "critical", "nightmare", "can't work"
    ✗ WTP scores ≥0.6 require explicit payment mentions; WTP 0.1-0.55 can be INFERRED from severity/impact
      ✅ Example: High severity (0.8) + workflow blocker → infer WTP 0.45-0.55
      ✅ Example: Time/productivity loss mentioned → infer WTP 0.3-0.4
    ✗ NEVER assign identical WTP scores to ALL pain points - discriminate using the full 0.0-0.55 range
      ❌ Example: All 10 pain points with WTP = 0.0 (no discrimination)
      ✅ Example: WTP scores ranging from 0.15 to 0.55 based on inferred impact

    **OUTPUT REQUIREMENTS:**
    ✗ pain_point_scores count MUST EXACTLY match Task 2 extraction count (1:1 mapping)
      ❌ Example: Adding/removing/merging pain points (violates 1:1 constraint)
    ✗ pain_point_title must be EXACT character-by-character match to Task 2
      ❌ Example: Slightly modifying title (must be exact match for Python merging)
    ✗ Discriminate scores - NOT all 0.8-0.9
      ❌ Example: Rounding all scores to 0.8-0.9 without differentiation
      ✅ Example: Range from 0.2 to 0.95 based on actual evidence strength
    ✗ Scoring rationale must reference specific quotes
      ❌ Example: "This seems important" (generic)
      ✅ Example: "3 users mentioned $X budget allocation for solutions"

    # Brief Explanation (GPT-5 Pattern)
    Give a brief explanation (2-3 bullets) summarizing your scoring approach at the start of your answer, then output the structured validation results.

  expected_output: >
    ValidationResult Pydantic model with scoring data ONLY:

    **niche**: The niche being analyzed

    **pain_point_scores**: List[PainPointScoring] with EXACTLY one score per Task 2 pain point:
    - pain_point_title: Exact title from Task 2 (for Python matching)
    - severity_score: Float 0.0-1.0 based on evidence analysis
    - willingness_to_pay: Float 0.0-1.0 based on financial signals
    - opportunity_level: OpportunityLevel enum (high/medium/low) based on scores
    - scoring_rationale: Brief explanation (2-3 sentences)

    **validation_summary**: 4-6 sentence executive summary covering:
    - Total pain points scored (MUST match Task 2 count)
    - Distribution across opportunity levels (High/Medium/Low)
    - Key scoring patterns and insights
    - Top 3 recommended pain points for solution development
    - Overall market signal strength

    NOTE: Python will merge these scores with Task 2 pain points. Focus on generating accurate, evidence-based scores.
