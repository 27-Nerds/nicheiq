# SolutionRefinementCrew Task Configurations

refine_solution_strategy:
  description: >
    Analyze SEO strategy data for **{solution_name}** and provide strategic refinement recommendations
    to maximize market opportunity and organic acquisition potential.

    **SOLUTION CONTEXT:**
    - Name: {solution_name}
    - Description: {solution_description}
    - Core Features: {core_features}
    - Target Personas: {target_personas}
    - Original Composite Score: {composite_score}
    - Project Type Constraints: {allowed_project_types}

    **SEO DEMAND DATA:**
    - Analyzed Keywords: {validated_keyword_count} (keywords with measurable search data)
    - Total Monthly Volume: {total_monthly_volume} searches/month
    - Keyword Demand Score: {keyword_demand_score} (0-1 scale: 0.80+ = exceptional, 0.65-0.79 = strong, 0.50-0.64 = moderate)
    - Top Keywords: {top_keywords}
    - Top Geographic Keywords: {top_geographic_keywords}
    - Demand Signal: {demand_signal} (strong >5k/mo, moderate 2k-5k, weak <2k)
    - Average Competition: {avg_competition} (0-100 scale, lower = easier to rank)
    - Demand Signals: {validation_signals}

    **YOUR TASK:**
    Provide strategic recommendations across 4 dimensions based on keyword insights:

    **1. GEOGRAPHIC PRIORITIZATION**

    Analyze top_geographic_keywords to identify which markets show strongest demand. Consider:
    - Which countries/regions appear in validated keywords?
    - What's the search volume distribution by geography?
    - Which markets have lower competition (easier entry)?
    - Which markets have higher GDP/market maturity (better monetization)?

    Return the markets that {top_geographic_keywords} actually evidences, ranked by opportunity
    (at most 5). Format: a list of country/region names.

    NO-GEO BRANCH: if {top_geographic_keywords} is empty, or none of the validated keywords contain
    a location term, this niche has NO geographic signal. Do NOT rank countries from general
    knowledge, from the niche's stereotype, or from where the product "feels" like it would sell.
    Return an EMPTY list and state the reason in one strategic insight. Do not return a
    placeholder sentence — an empty list is the correct, accepted answer, and the report simply
    omits the market section.

    Prioritization logic (applies only when location terms ARE present):
    - PRIMARY: Markets with highest keyword volume AND lower competition
    - SECONDARY: Tier-1 markets (US, UK, Canada, Australia, Germany, France) even if moderate competition
    - AVOID: Emerging markets unless they dominate keyword volume (>50%)

    **2. CATEGORY/POSITIONING PIVOT RECOMMENDATION**

    Analyze top_keywords and validated_keyword_count patterns to detect if market searches differently than solution positions.

    Examples of pivot signals:
    - Solution targets "digital nomads" but keywords show "remote workers", "expats", "location-independent professionals"
    - Solution is "B2C SaaS" but keywords show "team", "business", "enterprise" → B2B pivot
    - Solution focuses on Feature X but keywords emphasize Feature Y

    Only recommend pivot if:
    - >40% of validated keywords point to different category/positioning
    - AND alternative category has lower avg_competition
    - AND alternative category aligns with solution's core capabilities

    If no clear pivot signal, return null.

    **3. FEATURE PRIORITIZATION**

    Map validated keywords to solution's core_features to determine which features users actively search for.

    For each feature in core_features:
    - Count how many validated keywords mention or imply this feature
    - Calculate avg_search_volume for keywords supporting this feature
    - Assess if feature addresses high-competition keywords (users care enough to research)

    Return top 5-10 features ranked by: (keyword_support_count × avg_volume) ÷ competition

    For each feature, provide:
    - feature_name: Name from core_features (or inferred from keywords if not in list)
    - priority: 1-10 rank (1 = highest)
    - keyword_support: Count of keywords validating this feature
    - rationale: Why this priority based on keyword data (1-2 sentences)

    Edge case: If core_features is sparse/generic, infer features from top_keywords.

    **4. CONTENT STRATEGY PREVIEW**

    Based on keyword structure and clusters, recommend early content strategy (2-3 paragraphs).

    Consider:
    - **Pillar Pages**: Which broad keywords (1-2 words, high volume) need comprehensive pillar content?
    - **Comparison Content**: Are there "[solution] vs [competitor]" or "[solution] alternative" keywords?
    - **Geographic Landing Pages**: Do location-specific keywords justify geo-targeted pages?
    - **How-to Guides**: Are there "how to [solve problem]" informational keywords?
    - **Topic Clusters**: Do keywords group into 3-5 thematic clusters (each deserving content hub)?

    Format as narrative paragraphs, not bullet points. Be specific about content types tied to actual keywords.

    **5. STRATEGIC INSIGHTS**

    Identify 3-8 non-obvious opportunities, risks, or advantages revealed by keyword analysis.

    Shapes of valuable insights (every figure must be read off the input data, never supplied here):
    - a concentration of volume in a place/segment that competitors ignore
    - a seasonal pattern in the keyword trend data that bounds the launch window
    - a query-length or intent skew that points at an unfilled content gap
    - the actual avg_competition value read against the actual total volume
    - an intent class that is ABSENT from the validated set, and what that says about buying stage

    Avoid generic insights like "focus on SEO" or "create quality content".

    **OUTPUT REQUIREMENTS:**

    Return SolutionRefinement Pydantic model with:
    - geographic_priorities: List[str] with the markets the geographic keywords support (at most 5),
      ranked by opportunity — or an empty list when there is no location signal
    - category_pivot_recommendation: Optional[str] - only if >40% keyword evidence supports pivot
    - feature_priorities: List[FeaturePriority] with top 5-10 features (each has feature_name, priority, keyword_support, rationale)
    - strategic_insights: List[str] - 3-8 actionable, non-obvious insights

  expected_output: >
    SolutionRefinement model containing:

    **geographic_priorities** (List[str]):
    Markets to prioritize (at most 5), based on the location terms actually present in the validated
    keywords plus their volume, competition, and market maturity. Every entry must trace to a
    location term in the input — never to general knowledge about the niche.
    Order reflects strategic priority (start with #1, expand outward).
    When no location terms exist, this is an empty list (see the NO-GEO BRANCH above).

    **category_pivot_recommendation** (Optional[str]):
    Suggested category/vertical positioning shift if keyword data reveals better opportunity.
    Only populated if >40% of keywords point to different category AND lower competition.
    Example: "Pivot from 'digital nomad tools' to 'remote work platforms' - 65% of keywords use 'remote work' terminology with 20% lower avg competition"
    Set to null if no clear pivot signal detected.

    **feature_priorities** (List[FeaturePriority]):
    Top 5-10 features ranked by keyword support and search demand.
    Each FeaturePriority contains:
    - feature_name: str (from core_features or inferred from keywords)
    - priority: int (1 = highest priority, 10 = lowest)
    - keyword_support: int (number of keywords validating this feature)
    - rationale: str (1-2 sentences explaining why this priority based on keyword insights)

    Example entry:
    {
      "feature_name": "Tax Filing Integration",
      "priority": 1,
      "keyword_support": 8,
      "rationale": "8 validated keywords (avg 1,200 volume) mention tax filing, compliance, or accounting - highest search intent of all features with moderate competition (45)"
    }

    **strategic_insights** (List[str]):
    3-8 specific, actionable insights based on keyword patterns.
    Each insight should:
    - Highlight non-obvious opportunity or risk
    - Reference actual keyword data (volume, competition, patterns)
    - Suggest clear action or implication

    Insight shapes (fill every bracket from the input data — an insight whose numbers do not
    appear in the input is a fabrication, not an insight):
    [
      "<geographic or segment concentration read off the keyword set> - <what that enables or forecloses>",
      "<seasonality or timing pattern visible in the keyword trend data> - <launch-timing implication>",
      "<query-length or intent distribution across the validated keywords> - <content-gap implication>",
      "<the actual avg_competition value read against the actual total volume> - <ranking-difficulty implication>",
      "<an intent class that is absent from the validated set> - <what its absence says about buying stage>"
    ]

    ═══ CRITICAL RULES (Read Last - Recency Reminder) ═══

    **FIELD REQUIREMENTS:**
    ✓ Empty geographic_priorities is VALID and expected when no validated keyword carries a
      location term — do NOT invent markets, and do NOT emit a placeholder sentence, to fill it
    ✗ Empty feature_priorities → Guardrail will reject (must have 1-10 features)
    ✗ strategic_insights with <3 items → Guardrail will reject (minimum 3 insights)

    **DATA ACCURACY:**
    ✗ Inventing keywords not in input → Hallucination (only cite provided data)
      ❌ Example: "Keywords show strong demand for mobile apps" (when no mobile keywords in input)
      ✅ Example: "Keywords show strong demand for 'expat tax services' (1,200 volume)" (cites actual input)
    ✗ Generic insights without data → Vague and unhelpful
      ❌ Example: "Focus on SEO and quality content" (generic advice)
      ✅ Example: "Long-tail keywords (15 of 18 are 3+ words) indicate educational content gap" (data-backed)

    **CATEGORY PIVOT:**
    ✗ Recommending pivot without >40% keyword evidence → Unjustified
      ❌ Example: "Consider pivoting to B2B" when 2 of 20 keywords mention business
      ✅ Example: category_pivot_recommendation = null (no clear signal)
