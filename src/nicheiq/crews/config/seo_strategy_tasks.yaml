analyze_keywords_and_tier:
  description: >
    **Task 1: Keyword Analysis & Tiering**

    Apply your Intent-First Tiering Methodology to {enriched_keywords_count} pre-enriched keywords.

    **ENRICHED KEYWORDS DATA (CSV Format - Direct Input):**

    You have access to {enriched_keywords_count} keywords provided as CSV data below.

    **CSV STRUCTURE:**

    ```csv
    {enriched_keywords_csv}
    ```

    **CSV COLUMNS:**
    - **keyword**: The keyword phrase (string)
    - **search_volume**: Monthly search volume (integer)
    - **competition_index**: Competition score 0-100 (integer, lower is better)
    - **competition_level**: Human-readable competition (VERY_LOW/LOW/MEDIUM/HIGH/VERY_HIGH)
    - **cpc**: Cost per click in USD (float)
    - **opportunity_score**: Calculated as search_volume / competition_index (float, higher is better)
    - **tier**: Pre-calculated tier assignment (TIER_0_PREMIUM/TIER_1_QUICK_WIN/TIER_2_STRATEGIC/TIER_3_MEDIUM/TIER_4_LONG_TAIL)
    - **trend_direction**: Search volume trend (rising/stable/declining/unknown) - based on 12-month historical data
    - **trend_score**: Trend strength from -1.0 (declining) to 1.0 (rising)
    - **seasonality**: Seasonality index 0.0-1.0 (0=stable year-round, 1=highly seasonal)
    - **is_evergreen**: True if low seasonality AND not declining - indicates sustainable traffic opportunity

    **TREND-AWARE PRIORITIZATION:**
    - Prioritize **rising** keywords for growth opportunities
    - Prefer **is_evergreen=True** keywords for sustainable traffic foundation
    - Avoid investing heavily in **declining** keywords unless strategically necessary
    - Note **seasonal** keywords (seasonality > 0.3) for content timing recommendations

    **TIER DEFINITIONS (from CSV data - Priority Order: 0 → 1 → 2 → 3 → 4):**
    - **TIER_0_PREMIUM**: opportunity_score > 200 (EXCEPTIONAL - Very high volume, very low competition. Rare "unicorn" keywords.)
    - **TIER_1_QUICK_WIN**: opportunity_score > 100 (High volume, low competition)
    - **TIER_2_STRATEGIC**: opportunity_score 50-100 (Medium volume, moderate competition)
    - **TIER_3_MEDIUM**: opportunity_score 20-50 (Moderate volume)
    - **TIER_4_LONG_TAIL**: opportunity_score < 20 (Lower volume but viable)

    **INSTRUCTIONS FOR PARSING CSV:**
    - Parse the CSV data above (header + data rows)
    - Each row represents one keyword with all metrics calculated
    - Filter keywords by tier column to identify tier assignments
    - DO NOT use SerperDevTool or web search - ALL data is in the CSV above
    - The tier column provides initial guidance, but you should apply strategic refinement based on solution context

    **CSV PARSING ERROR HANDLING:**
    If CSV parsing fails or produces unexpected data:
    1. STOP immediately - DO NOT proceed with fabricated or assumed data
    2. Report the specific issue: "CSV parsing error: [describe the problem - malformed row, missing column, etc.]"
    3. Do NOT attempt to fix or work around malformed data
    4. If CSV is empty ({enriched_keywords_count} = 0), report: "No keywords provided - cannot perform analysis"

    **CONTEXT:**
    - Niche: {niche}
    - Solution: {selected_solution_name}
    - Description: {selected_solution_description}
    - Core Features (MVP):
      {core_features}
    - Technical Approach: {technical_approach}
    - Known Competitors:
      {competitor_names}
    - Top Pain Points (with metrics):
      {top_pain_points}
    - Topic Clusters: {topic_clusters_summary}
    - Total Keywords Available: {enriched_keywords_count}

    **WORKFLOW (FOLLOW IN ORDER):**

    **STEP 0: RELEVANCE FILTERING (MANDATORY - Execute First):**

    Apply 3-rule filtering to EACH keyword in CSV before tiering:

    **Rule 1 - Context Match:** Does keyword relate to {niche} + {selected_solution_description}?
    - If keyword is about DIFFERENT domain → EXCLUDE

    **Rule 2 - Ambiguity Filter:** Generic terms ("comparison", "review", "filter", "tool", "platform", "user") are ONLY relevant with niche context
    - ✓ KEEP: "skincare comparison" (niche + generic)
    - ✗ EXCLUDE: "comparison tool" (generic only)

    **Rule 3 - Cross-Domain Exclusion:** Exclude unrelated domains unless {niche} matches:
    - Software/Programming: "excel", "typescript", "react", "css"
    - Electronics: "cpu", "ssd", "monitor", "benchmark"
    - Finance: "mortgage", "credit card", "loan" (keep if finance niche)
    - Vehicles: "car", "tire", "bike" (keep if automotive niche)
    - Telecom: "verizon", "t-mobile" (keep if telecom niche)

    **FILTERING GUIDANCE (CRITICAL - READ CAREFULLY):**
    - Target: Filter ONLY 10-20% as truly irrelevant (NOT 30-50%!)
    - ⚠️ WHEN IN DOUBT → INCLUDE THE KEYWORD IN TIER 4 (this is mandatory)
    - Over-filtering is a CRITICAL FAILURE (keywords can always be refined later)
    - Report filtering stats in key_findings with explicit count
    - If you filter >25% of keywords, you are being TOO AGGRESSIVE - reconsider

    ═══ KEYWORD UTILIZATION MANDATE ═══
    You are analyzing {enriched_keywords_count} keywords. Your output MUST tier a MINIMUM of 80% of relevant keywords (after filtering).
    Tier 3-4 groups should contain the majority of keywords.

    1. **Select Premium Tier** → IF TIER_0_PREMIUM keywords exist: Select ALL (exceptional opportunities, opp_score >200)

    2. **Select ALL Qualifying Tier 1/2 Keywords** (NO arbitrary limits):
       - **Tier 1**: SELECT ALL keywords with opp_score >100 (expect 10-30 keywords, NOT just 3-5)
       - **Tier 2**: SELECT ALL keywords with opp_score 50-100 (expect 15-40 keywords, NOT just 3-5)
       - ⚠️  DO NOT stop at 5 keywords per tier - include EVERY keyword meeting the threshold

    3. **Group Tier 3/4** (CRITICAL - Tier EVERY REMAINING keyword):

       **DISTRIBUTION RULE:** EVERY keyword from CSV MUST be assigned to ONE destination:
       - FILTERED OUT (failed STEP 0 relevance check) → Count and document in key_findings
       - TIER 0-2 (individual keywords meeting score thresholds)
       - TIER 3 GROUPS (keywords with explicit locations)
       - TIER 4 GROUPS (ALL remaining keywords - should be 60-80% of relevant keywords)

       a. **Tier 3 (Geographic):** Keywords with EXPLICIT location mentions (city/country names IN keyword text)
          - Group by region (e.g., "European Markets"), sum volumes, note competition
          - ⚠️ NO hallucinated city names - only group if location is IN keyword text

       b. **Tier 4 (Category) - CRITICAL - Most Keywords Go Here:**
          - Create {min_category_groups} to {max_category_groups} category groups
          - Each category MUST have at least 1 keyword (no empty categories)
          - Category themes: product type, user concern, price tier, comparison, misc

          ❌ CRITICAL FAILURE: Creating empty categories (keywords: [])
          ❌ CRITICAL FAILURE: Fabricating keywords not in the input
          ✅ SUCCESS: Every category has real keywords from the input

       c. **Self-Check BEFORE submitting:**
          ```
          Relevant keywords after filtering: [A] keywords
          Tier 0-1-2 total count: [B]
          Tier 3 count: [C]
          Tier 4 count: [D]
          Total tiered: B+C+D = [E]
          Utilization rate: E/A = [F]%

          If F < 80% → INCOMPLETE. Expand Tier 4 categories or reduce filtering strictness.
          ```

    **PRE-SUBMISSION VALIDATION CHECKLIST:**

    Before finalizing output, verify:
    - [ ] Completed STEP 0 relevance filtering (applied Context Match Test, Ambiguity Filter, Cross-Domain Exclusion)
    - [ ] IF TIER_0_PREMIUM exists in CSV: Selected ALL (exceptional opportunities, opp_score >200)
    - [ ] Selected ALL Tier 1 keywords meeting threshold (opp_score >100) - NOT limited to 3-5
    - [ ] Selected ALL Tier 2 keywords meeting threshold (opp_score 50-100) - NOT limited to 3-5
    - [ ] Tier 3 geographic groups ONLY contain keywords with explicit location mentions
    - [ ] Tier 4 has between {min_category_groups} and {max_category_groups} category groups
    - [ ] Every Tier 4 category has at least 1 keyword (NO empty categories)
    - [ ] NO fabricated keywords - only use keywords from the CSV
    - [ ] Calculated EXACT keyword utilization: tiered_keywords / relevant_keywords ≥ 80%
    - [ ] key_findings includes keyword relevance insight (qualitative)
    - [ ] key_findings includes tier distribution insight (qualitative)
    - [ ] Avoided fabricating search volumes (used EXACT values from CSV)
    - [ ] Geographic keywords have city/country names in keyword text itself

    4. **Position Analysis** → Competitor gaps and differentiation angles
    5. **Key Findings** → 3-5 strategic insights (keyword alignment, opportunity themes, competitive gaps) - qualitative, not raw stats

    **TIER ASSIGNMENT CRITERIA:**

    | Tier | Selection Criteria | Count | Timeline | Purpose |
    |------|-------------------|-------|----------|---------|
    | **Tier 0** | Opp_score >200 (EXCEPTIONAL) | 2-3 (if exist) | 0-1 mo | Unicorn keywords - immediate priority |
    | **Tier 1** | Opp_score >100<br>Vol >2000 + Comp <30<br>OR Vol 500-2000 + Comp <15 | 3-5 (from pool) | 0-3 mo | Quick wins |
    | **Tier 2** | Opp_score 50-100<br>Vol >2000 + Comp 30-60<br>OR strategic fit | 3-5 (from pool) | 3-6 mo | Strategic growth |
    | **Tier 3** | Opp_score 20-50<br>Keywords with EXPLICIT locations | ALL remaining (grouped) | 6-12 mo | Geographic expansion |
    | **Tier 4** | Opp_score <20<br>Category clusters + non-location keywords | ALL remaining (grouped) | 6-12 mo | Programmatic SEO |

    **ANTI-PATTERNS (DON'T DO THIS):**

    ❌ Tiering only 43/336 keywords (12.8% utilization) - **CRITICAL FAILURE** - This means 87% of keywords are wasted
    ❌ Limiting Tier 1 to exactly 5 keywords when 18 qualify (opp_score >100) - Should be ALL 18
    ❌ Creating Tier 4 groups with only 5-10 keywords each (need 20-100+ keywords per group)
    ❌ Stopping at "created 10 category groups" without verifying they contain 80%+ of keywords
    ❌ Filtering 87% of keywords as "irrelevant" (over-aggressive filtering - max should be 30-40%)
    ❌ Ignoring TIER_0_PREMIUM keywords (these are exceptional opportunities - ALWAYS prioritize)
    ❌ Filtering AFTER tiering (must filter FIRST in STEP 0)
    ❌ Assigning generic keywords to Tier 3 without explicit location (e.g., "international moving" vs "moving to spain")
    ❌ Rounding search volumes (387 → 400) - use EXACT values from CSV
    ❌ Treating tier count ranges (3-5) as MAXIMUMS instead of MINIMUMS/THRESHOLDS
    ❌ Creating only 3-5 Tier 4 categories when 8-15 are needed for comprehensive coverage
    ❌ Hallucinating city names for keywords (only use explicit mentions)
    ❌ Missing utilization calculation in key_findings
    ❌ Including filtered keywords in tier counts (filtered = excluded)

    ═══ CRITICAL RULES (Read Last) ═══
    ✓ RELEVANT keywords MUST be distributed across tiers - filtered keywords should NOT be tiered
    ✓ Report keyword relevance qualitatively in key_findings (e.g., "High niche alignment - keywords map directly to solution use cases" NOT raw numbers like "Filtered 0/318")
    ✓ AIM for 80-90% coverage of RELEVANT keywords after filtering - create enough Tier 4 categories
    ✓ Tier 3/4 grouping is WHERE MOST KEYWORDS GO - these tiers should contain hundreds of keywords, not dozens
    ✓ Create 8-15 diverse Tier 4 categories to maximize programmatic SEO coverage
    ✓ "Miscellaneous" category is acceptable for keywords that don't fit clear patterns
    ✗ NO estimates or hallucinations - use exact data only
    ✗ Do NOT assign city names to keywords without explicit locations
    ✗ Do NOT tier filtered keywords - they should be excluded from all tier assignments
    ✗ If you're only tiering <50% of keywords, either filtering was too strict OR grouping was incomplete

  expected_output: >
    **OUTPUT FORMAT: Return JSON data with actual values (NOT a schema definition)**

    Your response must be a JSON object containing ACTUAL KEYWORD DATA from the CSV analysis.

    **IMPORTANT DISTINCTION:**

    ✅ **CORRECT** - Return populated JSON with real data (FORMAT EXAMPLE - DO NOT COPY these keywords):
    ```json
    {
      "tier_0_keywords": [
        {
          "keyword": "beginner underwater basket weaving kits",
