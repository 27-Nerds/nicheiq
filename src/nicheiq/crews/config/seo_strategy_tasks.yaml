# SEO Strategy Crew Tasks
# 5-task sequential workflow for keyword research and SEO strategy development

expand_keywords_conceptually:
  description: >
    Phase 9.5a: Hybrid Seed Keyword Generation - Generate a strategic mix of BROAD SEEDS
    (1-2 words) for DataForSEO expansion + TARGETED KEYWORDS (3-5 words) for direct validation.

    **CRITICAL UNDERSTANDING:**
    - DataForSEO's expansion API works by detecting categories and finding variations
    - BROAD seeds (1-2 words) expand into thousands of long-tail keywords automatically
    - SPECIFIC seeds (4+ words) have nowhere to expand and limit discovery
    - Your job: Generate the RIGHT seeds, let DataForSEO create the variations

    **Context:**
    - Niche: {niche}
    - Selected Solution: {selected_solution_name}
    - Value Proposition: {value_proposition}
    - Pain Points: {top_pain_points}
    - Target Personas: {target_personas}
    - Core Features: {core_features}
    - Competitive Context: {competitor_names}
    - Project Type Constraints: {allowed_project_types}

    **RELEVANCE REMINDER:**
    All keywords generated here will be expanded by DataForSEO (Phase 9.5b) which may produce
    thousands of variations. Ensure your seed keywords are TIGHTLY ALIGNED with the niche and
    solution context above. Avoid generic terms from unrelated domains. Keywords should be
    extractable from the provided context fields, not invented from outside knowledge.

    **CRITICAL KEYWORD GENERATION PRINCIPLES:**

    For pre-launch products, NEVER generate keywords using the solution name (no one searches
    for products that don't exist). Focus on INTENT-BASED keywords capturing what users search
    when they HAVE THE PROBLEM:
    - Problem discovery: "how to fix X", "struggling with Y"
    - Solution seeking: "tool for Z", "best way to handle W"
    - Competitive comparison: "[competitor] alternative", "[competitor] vs"

    **Validation Rule:** Ask "Would someone type this into Google when experiencing this pain point?"
    If no → discard keyword.

    **Task: Generate 40-50 Keywords Using 70-30 Hybrid Strategy**

    Apply your 5-Type System (from backstory) to extract keywords:

    **PART 1: Broad Seeds (70% = 28-35 keywords, 1-2 words):**
    - Type 1: Core product/service nouns from {niche}, {selected_solution_name}
    - Type 2: Problem nouns from {top_pain_points}
    - Type 3: Feature nouns from {core_features}
    - Type 4: Solution types from {value_proposition}
    - Type 5: Broad modifiers from {target_personas}

    **PART 2: Targeted Keywords (30% = 12-15 keywords, 3-5 words):**
    - Combine 2-3 broad seeds strategically
    - Focus on high-severity pain points + competitor comparisons (from {competitor_names} only)
    - **CRITICAL:** ONLY include competitor keywords if {competitor_names} contains actual
      competitor names. If missing or states "No competitive analysis available" → SKIP
      competitor keywords entirely. Better to deliver 40 solid keywords than 50 with fabricated
      competitor references.
    - Cover awareness → consideration → decision funnel

    **PART 3: Topic Clusters (5-8 clusters):**
    - Group keywords by major themes, strategic_importance (1-5)


  expected_output: >
    ExpandedKeywordList model with:

    **keywords**: List[ConceptualKeyword] (40-50 total keywords)
    - **70% broad seeds (1-2 words)**: For DataForSEO expansion into thousands of variations
    - **30% targeted keywords (3-5 words)**: Strategic high-value queries for direct validation
    - keyword: str (the search phrase - ENFORCE LENGTH RULES)
    - cluster: str (which topic cluster it belongs to)
    - priority: int (1-5, strategic importance)
    - rationale: str (why this keyword/seed matters - 1 sentence)

    **topic_clusters**: List[TopicCluster] (5-8 clusters)
    - name: str (cluster name)
    - description: str (what this cluster covers)
    - strategic_importance: int (1-5, SEO priority)

    **expansion_rationale**: str (2-3 sentences explaining the hybrid strategy and expected expansion potential)

    **EXPANSION GUIDANCE:**
    Generate 40-50 seeds recognizing this is INPUT for DataForSEO's expansion (Phase 9.5b),
    which will multiply these into 300-1000+ keywords. Track total keyword counts and document
    expansion strategy in expansion_rationale field. Different seed categories enable thorough
    market coverage across problem discovery, solution-seeking, competitor alternatives, and
    long-tail variations.

    **Output Structure Example:**
    - 28-35 broad seeds (1-2 words) will expand to 10,000-30,000 keywords via DataForSEO
    - 12-15 targeted keywords (3-5 words) validated directly for high-intent commercial terms
    - Total discovery: ~15,000-40,000 keyword opportunities from 40-50 strategic inputs

analyze_keywords_and_tier:
  description: >
    **Task 1: Keyword Analysis & Tiering**

    Apply your Intent-First Tiering Methodology to {enriched_keywords_count} pre-enriched keywords.

    **ENRICHED KEYWORDS DATA (CSV Format - Direct Input):**

    You have access to {enriched_keywords_count} keywords provided as CSV data below.

    **CSV STRUCTURE:**

    ```csv
    {enriched_keywords_csv}
    ```

    **CSV COLUMNS:**
    - **keyword**: The keyword phrase (string)
    - **search_volume**: Monthly search volume (integer)
    - **competition_index**: Competition score 0-100 (integer, lower is better)
    - **competition_level**: Human-readable competition (VERY_LOW/LOW/MEDIUM/HIGH/VERY_HIGH)
    - **cpc**: Cost per click in USD (float)
    - **opportunity_score**: Calculated as search_volume / competition_index (float, higher is better)
    - **tier**: Pre-calculated tier assignment (TIER_0_PREMIUM/TIER_1_QUICK_WIN/TIER_2_STRATEGIC/TIER_3_MEDIUM/TIER_4_LONG_TAIL)
    - **trend_direction**: Search volume trend (rising/stable/declining/unknown) - based on 12-month historical data
    - **trend_score**: Trend strength from -1.0 (declining) to 1.0 (rising)
    - **seasonality**: Seasonality index 0.0-1.0 (0=stable year-round, 1=highly seasonal)
    - **is_evergreen**: True if low seasonality AND not declining - indicates sustainable traffic opportunity

    **TREND-AWARE PRIORITIZATION:**
    - Prioritize **rising** keywords for growth opportunities
    - Prefer **is_evergreen=True** keywords for sustainable traffic foundation
    - Avoid investing heavily in **declining** keywords unless strategically necessary
    - Note **seasonal** keywords (seasonality > 0.3) for content timing recommendations

    **TIER DEFINITIONS (from CSV data - Priority Order: 0 → 1 → 2 → 3 → 4):**
    - **TIER_0_PREMIUM**: opportunity_score > 200 (EXCEPTIONAL - Very high volume, very low competition. Rare "unicorn" keywords.)
    - **TIER_1_QUICK_WIN**: opportunity_score > 100 (High volume, low competition)
    - **TIER_2_STRATEGIC**: opportunity_score 50-100 (Medium volume, moderate competition)
    - **TIER_3_MEDIUM**: opportunity_score 20-50 (Moderate volume)
    - **TIER_4_LONG_TAIL**: opportunity_score < 20 (Lower volume but viable)

    **INSTRUCTIONS FOR PARSING CSV:**
    - Parse the CSV data above (header + data rows)
    - Each row represents one keyword with all metrics calculated
    - Filter keywords by tier column to identify tier assignments
    - DO NOT use SerperDevTool or web search - ALL data is in the CSV above
    - The tier column provides initial guidance, but you should apply strategic refinement based on solution context

    **CSV PARSING ERROR HANDLING:**
    If CSV parsing fails or produces unexpected data:
    1. STOP immediately - DO NOT proceed with fabricated or assumed data
    2. Report the specific issue: "CSV parsing error: [describe the problem - malformed row, missing column, etc.]"
    3. Do NOT attempt to fix or work around malformed data
    4. If CSV is empty ({enriched_keywords_count} = 0), report: "No keywords provided - cannot perform analysis"

    **CONTEXT:**
    - Niche: {niche}
    - Solution: {selected_solution_name}
    - Description: {selected_solution_description}
    - Core Features (MVP):
      {core_features}
    - Technical Approach: {technical_approach}
    - Known Competitors:
      {competitor_names}
    - Top Pain Points (with metrics):
      {top_pain_points}
    - Topic Clusters: {topic_clusters_summary}
    - Total Keywords Available: {enriched_keywords_count}

    **WORKFLOW (FOLLOW IN ORDER):**

    **STEP 0: RELEVANCE FILTERING (MANDATORY - Execute First):**

    Apply 3-rule filtering to EACH keyword in CSV before tiering:

    **Rule 1 - Context Match:** Does keyword relate to {niche} + {selected_solution_description}?
    - If keyword is about DIFFERENT domain → EXCLUDE

    **Rule 2 - Ambiguity Filter:** Generic terms ("comparison", "review", "filter", "tool", "platform", "user") are ONLY relevant with niche context
    - ✓ KEEP: "skincare comparison" (niche + generic)
    - ✗ EXCLUDE: "comparison tool" (generic only)

    **Rule 3 - Cross-Domain Exclusion:** Exclude unrelated domains unless {niche} matches:
    - Software/Programming: "excel", "typescript", "react", "css"
    - Electronics: "cpu", "ssd", "monitor", "benchmark"
    - Finance: "mortgage", "credit card", "loan" (keep if finance niche)
    - Vehicles: "car", "tire", "bike" (keep if automotive niche)
    - Telecom: "verizon", "t-mobile" (keep if telecom niche)

    **FILTERING GUIDANCE (CRITICAL - READ CAREFULLY):**
    - Target: Filter ONLY 10-20% as truly irrelevant (NOT 30-50%!)
    - ⚠️ WHEN IN DOUBT → INCLUDE THE KEYWORD IN TIER 4 (this is mandatory)
    - Over-filtering is a CRITICAL FAILURE (keywords can always be refined later)
    - Report filtering stats in key_findings with explicit count
    - If you filter >25% of keywords, you are being TOO AGGRESSIVE - reconsider

    ═══ KEYWORD UTILIZATION MANDATE ═══
    You are analyzing {enriched_keywords_count} keywords. Your output MUST tier a MINIMUM of 80% of relevant keywords (after filtering).

    **Math Example**: If you analyze 336 keywords and filter 100 as irrelevant → you have 236 relevant keywords remaining.
    You MUST tier at least 189 keywords (80% of 236) across Tier 0-4.

    ⚠️  If your output contains <150 tiered keywords from 336 input keywords → INCOMPLETE OUTPUT.
    ⚠️  Tier 3-4 groups should contain HUNDREDS of keywords, not dozens.

    1. **Select Premium Tier** → IF TIER_0_PREMIUM keywords exist: Select ALL (exceptional opportunities, opp_score >200)

    2. **Select ALL Qualifying Tier 1/2 Keywords** (NO arbitrary limits):
       - **Tier 1**: SELECT ALL keywords with opp_score >100 (expect 10-30 keywords, NOT just 3-5)
       - **Tier 2**: SELECT ALL keywords with opp_score 50-100 (expect 15-40 keywords, NOT just 3-5)
       - ⚠️  DO NOT stop at 5 keywords per tier - include EVERY keyword meeting the threshold

    3. **Group Tier 3/4** (CRITICAL - Tier EVERY REMAINING keyword):

       **DISTRIBUTION RULE:** EVERY keyword from CSV MUST be assigned to ONE destination:
       - FILTERED OUT (failed STEP 0 relevance check) → Count and document in key_findings
       - TIER 0-2 (individual keywords meeting score thresholds)
       - TIER 3 GROUPS (keywords with explicit locations)
       - TIER 4 GROUPS (ALL remaining keywords - should be 60-80% of relevant keywords)

       a. **Tier 3 (Geographic):** Keywords with EXPLICIT location mentions (city/country names IN keyword text)
          - Group by region (e.g., "European Markets"), sum volumes, note competition
          - ⚠️ NO hallucinated city names - only group if location is IN keyword text

       b. **Tier 4 (Category) - CRITICAL - Most Keywords Go Here:**
          - MINIMUM: 8 category groups (aim for 10-15)
          - MINIMUM: 15 keywords per category group (aim for 20-100+)
          - If you have 150+ remaining keywords → create 12+ categories
          - Category themes: ingredient, product type, user concern, price tier, comparison, review, misc, brand, format, audience
          - ⚠️ WHEN IN DOUBT about a keyword's relevance → PUT IT IN TIER 4

          ❌ CRITICAL FAILURE: Tier 4 has <8 categories
          ❌ CRITICAL FAILURE: Tier 4 categories average <15 keywords each
          ❌ CRITICAL FAILURE: Total utilization <70% of input keywords
          ✅ SUCCESS: Tier 4 has 10-15 categories with 20-100 keywords each
          ⚠️ Your Tier 4 groups should contain HUNDREDS of keywords total

       c. **Self-Check BEFORE submitting:**
          ```
          Relevant keywords after filtering: [A] keywords
          Tier 0-1-2 total count: [B]
          Tier 3 count: [C]
          Tier 4 count: [D]
          Total tiered: B+C+D = [E]
          Utilization rate: E/A = [F]%

          If F < 80% → INCOMPLETE. Expand Tier 4 categories or reduce filtering strictness.
          ```

    **PRE-SUBMISSION VALIDATION CHECKLIST:**

    Before finalizing output, verify:
    - [ ] Completed STEP 0 relevance filtering (applied Context Match Test, Ambiguity Filter, Cross-Domain Exclusion)
    - [ ] IF TIER_0_PREMIUM exists in CSV: Selected ALL (exceptional opportunities, opp_score >200)
    - [ ] Selected ALL Tier 1 keywords meeting threshold (opp_score >100) - NOT limited to 3-5
    - [ ] Selected ALL Tier 2 keywords meeting threshold (opp_score 50-100) - NOT limited to 3-5
    - [ ] Tier 3 geographic groups ONLY contain keywords with explicit location mentions
    - [ ] Tier 4 has MINIMUM 8 category groups (aim for 10-15)
    - [ ] Tier 4 category groups cover 80-90% of remaining RELEVANT keywords (should be 150-250+ keywords)
    - [ ] Tier 4 category groups average 15+ keywords per group (aim for 20-100+)
    - [ ] Calculated EXACT keyword utilization: tiered_keywords / relevant_keywords ≥ 80%
    - [ ] key_findings includes keyword relevance insight (qualitative - e.g., "High relevance - minimal cross-domain noise" or "Moderate filtering required for domain focus")
    - [ ] key_findings includes tier distribution insight (qualitative - e.g., "Strong premium opportunities in [themes]" not raw counts)
    - [ ] Avoided fabricating search volumes (used EXACT values from CSV)
    - [ ] Geographic keywords have city/country names in keyword text itself

          **Example of GOOD Distribution:**
          Input: 1,603 keywords → Filtered 620 (39%, strict filtering) → Tiered 890 relevant keywords (90%)
          - 5 Tier 1 + 5 Tier 2 + 320 Tier 3 + 560 Tier 4 = 890 total ✓
          - 12 diverse Tier 4 category groups with 20-80 keywords each ✓
          - Filtering rate: 39% (adaptive, quality-focused) ✓

    4. **Position Analysis** → Competitor gaps and differentiation angles
    5. **Key Findings** → 3-5 strategic insights (keyword alignment, opportunity themes, competitive gaps) - qualitative, not raw stats

    **TIER ASSIGNMENT CRITERIA:**

    | Tier | Selection Criteria | Count | Timeline | Purpose |
    |------|-------------------|-------|----------|---------|
    | **Tier 0** | Opp_score >200 (EXCEPTIONAL) | 2-3 (if exist) | 0-1 mo | Unicorn keywords - immediate priority |
    | **Tier 1** | Opp_score >100<br>Vol >2000 + Comp <30<br>OR Vol 500-2000 + Comp <15 | 3-5 (from pool) | 0-3 mo | Quick wins |
    | **Tier 2** | Opp_score 50-100<br>Vol >2000 + Comp 30-60<br>OR strategic fit | 3-5 (from pool) | 3-6 mo | Strategic growth |
    | **Tier 3** | Opp_score 20-50<br>Keywords with EXPLICIT locations | ALL remaining (grouped) | 6-12 mo | Geographic expansion |
    | **Tier 4** | Opp_score <20<br>Category clusters + non-location keywords | ALL remaining (grouped) | 6-12 mo | Programmatic SEO |

    **ANTI-PATTERNS (DON'T DO THIS):**

    ❌ Tiering only 43/336 keywords (12.8% utilization) - **CRITICAL FAILURE** - This means 87% of keywords are wasted
    ❌ Limiting Tier 1 to exactly 5 keywords when 18 qualify (opp_score >100) - Should be ALL 18
    ❌ Creating Tier 4 groups with only 5-10 keywords each (need 20-100+ keywords per group)
    ❌ Stopping at "created 10 category groups" without verifying they contain 80%+ of keywords
    ❌ Filtering 87% of keywords as "irrelevant" (over-aggressive filtering - max should be 30-40%)
    ❌ Ignoring TIER_0_PREMIUM keywords (these are exceptional opportunities - ALWAYS prioritize)
    ❌ Filtering AFTER tiering (must filter FIRST in STEP 0)
    ❌ Assigning generic keywords to Tier 3 without explicit location (e.g., "international moving" vs "moving to spain")
    ❌ Rounding search volumes (387 → 400) - use EXACT values from CSV
    ❌ Treating tier count ranges (3-5) as MAXIMUMS instead of MINIMUMS/THRESHOLDS
    ❌ Creating only 3-5 Tier 4 categories when 8-15 are needed for comprehensive coverage
    ❌ Hallucinating city names for keywords (only use explicit mentions)
    ❌ Missing utilization calculation in key_findings
    ❌ Including filtered keywords in tier counts (filtered = excluded)

    ═══ CRITICAL RULES (Read Last) ═══
    ✓ RELEVANT keywords MUST be distributed across tiers - filtered keywords should NOT be tiered
    ✓ Report keyword relevance qualitatively in key_findings (e.g., "High niche alignment - keywords map directly to solution use cases" NOT raw numbers like "Filtered 0/318")
    ✓ AIM for 80-90% coverage of RELEVANT keywords after filtering - create enough Tier 4 categories
    ✓ Tier 3/4 grouping is WHERE MOST KEYWORDS GO - these tiers should contain hundreds of keywords, not dozens
    ✓ Create 8-15 diverse Tier 4 categories to maximize programmatic SEO coverage
    ✓ "Miscellaneous" category is acceptable for keywords that don't fit clear patterns
    ✗ NO estimates or hallucinations - use exact data only
    ✗ Do NOT assign city names to keywords without explicit locations
    ✗ Do NOT tier filtered keywords - they should be excluded from all tier assignments
    ✗ If you're only tiering <50% of keywords, either filtering was too strict OR grouping was incomplete

  expected_output: >
    **OUTPUT FORMAT: Return JSON data with actual values (NOT a schema definition)**

    Your response must be a JSON object containing ACTUAL KEYWORD DATA from the CSV analysis.

    **IMPORTANT DISTINCTION:**

    ✅ **CORRECT** - Return populated JSON with real data:
    ```json
    {
      "tier_0_keywords": [
        {
          "keyword": "budget expat health insurance",
          "search_volume": 2400,
          "competition": "LOW (18)",
          "opportunity_score": 133,
          "strategy": "Target with landing page + comparison tool",
          "intent": "High commercial intent - price-conscious buyers"
        }
      ],
      "tier_0_strategy": "These exceptional keywords combine high volume...",
      "tier_1_keywords": [...],
      "tier_1_quick_win_strategy": "Focus on low-competition opportunities...",
      "total_keywords_analyzed": 336,
      "total_monthly_volume": 145000,
      "key_findings": [
        "Filtered 100/336 (30%) as irrelevant domain keywords",
        "Tiered 236 keywords (70% coverage): T0=2, T1=15, T2=18, T3=45, T4=156"
      ],
      "competitive_positioning": "## Keyword Gaps\n\nCompetitors focus on..."
    }
    ```

    ❌ **WRONG** - Do NOT return a schema definition with metadata:
    ```json
    {
      "type": "object",
      "properties": {
        "tier_1_keywords": {"type": "array", "items": {...}},
        "tier_1_quick_win_strategy": {"type": "string"}
      },
      "required": ["tier_1_keywords", "tier_1_quick_win_strategy"],
      "additionalProperties": false
    }
    ```

    **Pre-Submission Check:** Before returning your response, verify:
    - Does "tier_1_keywords" contain actual keyword strings (not {"type": "array"})?
    - Does "search_volume" contain numbers like 2400 (not {"type": "integer"})?
    - Are "properties", "required", "additionalProperties" keys ABSENT from your JSON?

    If you see any schema metadata keys → you're returning the wrong format. Return DATA, not a schema.

    ---

    **REQUIRED FIELDS AND STRUCTURE:**

    **Tier Structure** (Priority: 0 → 1 → 2 → 3 → 4):
    - tier_0_keywords: ALL keywords with opp_score >200 (OPTIONAL - only if TIER_0_PREMIUM exists)
    - tier_0_strategy: Strategy for tier 0 (if tier_0_keywords exist)
    - tier_1_keywords: 3-5 keywords (REQUIRED)
    - tier_1_quick_win_strategy: Strategy narrative (REQUIRED)
    - tier_2_keywords: 3-5 keywords (optional)
    - tier_2_strategy: Strategy narrative (optional)
    - tier_3_geographic_groups: Group remaining location-based keywords (if geographic patterns exist)
    - tier_4_category_groups: Group remaining thematic keywords (if category patterns exist)

    **IMPORTANT FIELD NAMES:**
    - In tier_0/1/2: Each keyword object uses "keyword" (not "keyword_name")
    - In tier_4_category_groups.keywords: Each entry uses "keyword_name" (not "keyword")

    **CRITICAL:** After STEP 0 filtering, distribute RELEVANT keywords across tiers.
    Target: 80-90% of relevant keywords tiered.

    **Metadata**:
    - total_keywords_analyzed, total_monthly_volume
    - key_findings (3-5 bullets with QUALITATIVE insights, NOT raw numbers:
      * Keyword relevance: Describe alignment quality (e.g., "High niche alignment with minimal cross-domain noise" or "Required filtering for domain focus")
      * Tier distribution: Describe opportunity quality (e.g., "Strong premium tier with quick-win opportunities in [themes]")
      * Coverage assessment: Describe scope (e.g., "Comprehensive coverage across major use cases")
      * Category insights: "Key opportunity clusters: [top 3-4 themes]"
      AVOID: Raw counts like "Filtered 0/318", "Tier 0=10, Tier 1=5", percentages)
    - competitive_positioning (markdown, 2-4 sections)

    MUST use exact enriched keyword data - no fabrication.

    ---

    **FINAL VALIDATION BEFORE SUBMISSION:**

    Run this mental checklist on your JSON response:
    1. ✓ Does tier_1_keywords[0].keyword = "actual keyword string" (NOT a type definition)?
    2. ✓ Does tier_1_keywords[0].search_volume = 2400 (a NUMBER, NOT {"type": "integer"})?
    3. ✓ Is the root level {"tier_0_keywords": [...], "tier_1_keywords": [...]...}?
    4. ✗ Are keys like "properties", "required", "type", "additionalProperties" ABSENT?

    If ANY check fails → Your response is in SCHEMA FORMAT (wrong). Convert to DATA FORMAT (correct) before submitting.

develop_content_technical_strategy:
  description: >
    **Task 2: Content & Technical Strategy**

    **HOW TO ACCESS CONTEXT (IMPORTANT):**

    Task 1 output (KeywordAnalysisResult) is available in your context via CrewAI context chaining.
    Extract and use the following fields from Task 1:
    - tier_1_keywords, tier_2_keywords (for content prioritization)
    - tier_3_geographic_groups, tier_4_category_groups (for programmatic templates)
    - total_monthly_volume, total_keywords_analyzed (for scale assessment)
    - competitive_positioning (for differentiation angles)
    - key_findings (for insights to build upon)

    **DO NOT fabricate keyword data** - use ONLY what Task 1 provided.

    **CONTENT STRATEGY** (4-6 numbered sections, markdown):

    1. **Content Prioritization** → Map Tier 1/2 keywords to content types
    2. **Topic Cluster Architecture** → 3-5 pillar hubs with supporting articles
    3. **Content Calendar** → First 90 days (Tier 1 weeks 1-4, Tier 2 weeks 5-8)
    4. **Content Formats** → Match to search intent (guides, comparisons, FAQs)
    5. **Conversion Integration** → CTAs and conversion paths per content type

    **TOPIC CLUSTERS** (3-5 clusters):

    | Element | Specification |
    |---------|--------------|
    | cluster_name | Content pillar theme from Tier 1/2 |
    | primary_keyword | High-volume core keyword |
    | supporting_keywords | Related long-tail terms |
    | total_monthly_volume | Sum of cluster keyword volumes |
    | priority | 1 (critical), 2 (important), 3 (nice-to-have) |

    **TECHNICAL SEO** (markdown, 3-5 sections with code):

    - **URL Structure** → Keyword-optimized patterns with examples
    - **Schema Markup** → Structured data code examples for rich snippets
    - **Internal Linking** → Hub-and-spoke architecture
    - **Page Speed** → Core Web Vitals optimization
    - **Mobile Optimization** → Mobile-first considerations

    **PRE-SUBMISSION VALIDATION CHECKLIST:**

    Before finalizing output, verify:
    - [ ] Content strategy has 4-6 numbered sections (prioritization, clusters, calendar, formats, conversion)
    - [ ] topic_clusters has 3-5 pillar hubs with primary_keyword from Task 1 tiers
    - [ ] Content calendar covers first 90 days (Tier 1 weeks 1-4, Tier 2 weeks 5-8)
    - [ ] technical_seo_recommendations has 3-5 sections with code examples
    - [ ] All recommendations align with Task 1 keyword tiers
    - [ ] keyword_based_page_types has 4-8 scalable templates

    **ANTI-PATTERNS (DON'T DO THIS):**

    ❌ Generic content strategy without referencing Task 1 keyword data
    ❌ Topic clusters without primary keywords from Tier 1/2
    ❌ Vague content calendar like "Week 1-4: Write content" (vs specific Tier 1 keyword mapping)
    ❌ Technical SEO sections without code examples (must include URL patterns, schema JSON-LD)
    ❌ Recommending page types that don't align with solution's project_type

    ═══ CRITICAL RULES (Read Last) ═══
    ✗ All recommendations MUST align with Task 1 keyword tiers

  expected_output: >
    ContentStrategyResult Pydantic model:

    - content_strategy: str (4-6 numbered paragraphs, markdown)
    - topic_clusters: Optional[List[TopicCluster]] (3-5 pillars)
    - technical_seo_recommendations: str (markdown, 3-5 sections, code examples)
    - keyword_driven_site_architecture: Optional (site structure by clusters)
    - keyword_based_page_types: Optional[List] (4-8 scalable templates)

create_implementation_plan:
  description: >
    **Task 3: Implementation Planning**

    Apply your 3-Phase Compound SEO Roadmap using context from Tasks 1-2.

    **SOLUTION CONTEXT:**
    - Solution: {selected_solution_name}
    - Value Proposition: {value_proposition}
    - Target Personas:
      {target_personas}
    - Core Features:
      {core_features}

    **HOW TO ACCESS CONTEXT (IMPORTANT):**

    Tasks 1-2 outputs are available in your context via CrewAI context chaining.

    **From Task 1 (KeywordAnalysisResult):**
    - tier_1_keywords, tier_2_keywords (for Phase 1-2 content targets)
    - tier_3_geographic_groups, tier_4_category_groups (for Phase 3 scaling)
    - total_monthly_volume (for traffic projection baseline)
    - key_findings (for risk assessment)

    **From Task 2 (ContentStrategyResult):**
    - content_strategy (for deliverable planning)
    - topic_clusters (for content architecture phases)
    - technical_seo_recommendations (for technical milestones)
    - keyword_based_page_types (for programmatic SEO phases)

    **DO NOT fabricate metrics** - base all projections on Task 1-2 data.

    **PHASED ROADMAP** (markdown table):

    | Phase | Timeline | Focus | Deliverables | Success Metrics |
    |-------|----------|-------|--------------|-----------------|
    | **Phase 1** | Mo 1-3 | Foundation + Quick Wins | Tier 1 content (3-5), tech SEO basics | First rankings, 500-2K visits/mo |
    | **Phase 2** | Mo 4-6 | Strategic Expansion | Tier 2 content (3-5), clusters, linking | Pos 1-10 for 5-10 KWs, 2-5K visits/mo |
    | **Phase 3** | Mo 7-12 | Scaling | Tiers 3-4, programmatic templates | 20+ ranking KWs, 5-10K visits/mo |

    For each phase: deliverables, resources, budget, dependencies.

    **KEY METRICS** (4-6 KPIs):

    **SEO Performance:**
    - Organic traffic (visits/month with growth targets)
    - Keyword rankings (position targets per tier)
    - Indexed pages (page count per phase)

    **Business Metrics:**
    - Conversions from organic (signups/trials/purchases)
    - Organic CAC
    - Customer LTV from SEO channel

