# SEO Strategy Crew Tasks
# 5-task sequential workflow for keyword research and SEO strategy development

expand_keywords_conceptually:
  description: >
    Phase 6a: Hybrid Seed Keyword Generation - Generate a strategic mix of BROAD SEEDS
    (1-2 words) for DataForSEO expansion + TARGETED KEYWORDS (3-5 words) for direct validation.

    **CRITICAL UNDERSTANDING:**
    - DataForSEO's expansion API works by detecting categories and finding variations
    - BROAD seeds (1-2 words) expand into thousands of long-tail keywords automatically
    - SPECIFIC seeds (4+ words) have nowhere to expand and limit discovery
    - Your job: Generate the RIGHT seeds, let DataForSEO create the variations

    **Context:**
    - Niche: {niche}
    - Selected Solution: {selected_solution_name}
    - Value Proposition: {value_proposition}
    - Pain Points: {top_pain_points}
    - Target Personas: {target_personas}
    - Core Features: {core_features}
    - Competitive Context: {competitor_names}
    - Project Type Constraints: {allowed_project_types}

    **RELEVANCE REMINDER:**
    All keywords generated here will be expanded by DataForSEO (Phase 6b) which may produce
    thousands of variations. Ensure your seed keywords are TIGHTLY ALIGNED with the niche and
    solution context above. Avoid generic terms from unrelated domains. Keywords should be
    extractable from the provided context fields, not invented from outside knowledge.

    **CRITICAL KEYWORD GENERATION PRINCIPLES:**

    For pre-launch products, NEVER generate keywords using the solution name (no one searches
    for products that don't exist). Focus on INTENT-BASED keywords capturing what users search
    when they HAVE THE PROBLEM:
    - Problem discovery: "how to fix X", "struggling with Y"
    - Solution seeking: "tool for Z", "best way to handle W"
    - Competitive comparison: "[competitor] alternative", "[competitor] vs"

    **Validation Rule:** Ask "Would someone type this into Google when experiencing this pain point?"
    If no → discard keyword.

    **Task: Generate 40-50 Keywords Using 70-30 Hybrid Strategy**

    Apply your 5-Type System (from backstory) to extract keywords:

    **PART 1: Broad Seeds (70% = 28-35 keywords, 1-2 words):**
    - Type 1: Core product/service nouns from {niche}, {selected_solution_name}
    - Type 2: Problem nouns from {top_pain_points}
    - Type 3: Feature nouns from {core_features}
    - Type 4: Solution types from {value_proposition}
    - Type 5: Broad modifiers from {target_personas}

    **PART 2: Targeted Keywords (30% = 12-15 keywords, 3-5 words):**
    - Combine 2-3 broad seeds strategically
    - Focus on high-severity pain points + competitor comparisons (from {competitor_names} only)
    - **CRITICAL:** ONLY include competitor keywords if {competitor_names} contains actual
      competitor names. If missing or states "No competitive analysis available" → SKIP
      competitor keywords entirely. Better to deliver 40 solid keywords than 50 with fabricated
      competitor references.
    - Cover awareness → consideration → decision funnel

    **PART 3: Topic Clusters (5-8 clusters):**
    - Group keywords by major themes, strategic_importance (1-5)


  expected_output: >
    ExpandedKeywordList model with:

    **keywords**: List[ConceptualKeyword] (40-50 total keywords)
    - **70% broad seeds (1-2 words)**: For DataForSEO expansion into thousands of variations
    - **30% targeted keywords (3-5 words)**: Strategic high-value queries for direct validation
    - keyword: str (the search phrase - ENFORCE LENGTH RULES)
    - cluster: str (which topic cluster it belongs to)
    - priority: int (1-5, strategic importance)
    - rationale: str (why this keyword/seed matters - 1 sentence)

    **topic_clusters**: List[TopicCluster] (5-8 clusters)
    - name: str (cluster name)
    - description: str (what this cluster covers)
    - strategic_importance: int (1-5, SEO priority)

    **expansion_rationale**: str (2-3 sentences explaining the hybrid strategy and expected expansion potential)

    **EXPANSION GUIDANCE:**
    Generate 40-50 seeds recognizing this is INPUT for DataForSEO's expansion (Phase 6b),
    which will multiply these into 300-1000+ keywords. Track total keyword counts and document
    expansion strategy in expansion_rationale field. Different seed categories enable thorough
    market coverage across problem discovery, solution-seeking, competitor alternatives, and
    long-tail variations.

    **Output Structure Example:**
    - 28-35 broad seeds (1-2 words) will expand to 10,000-30,000 keywords via DataForSEO
    - 12-15 targeted keywords (3-5 words) validated directly for high-intent commercial terms
    - Total discovery: ~15,000-40,000 keyword opportunities from 40-50 strategic inputs

# ========================================
# SPLIT KEYWORD ANALYSIS TASKS (Tasks 1a-1d)
# ========================================
# These 4 tasks replace the single analyze_keywords_and_tier task
# Each produces smaller, more manageable JSON output

analyze_premium_tiers:
  description: >
    **Task 1a: Premium Tier Analysis (Tiers 0, 1, 2)**

    Analyze {enriched_keywords_count} pre-enriched keywords and select ALL keywords
    with opportunity score >= 50 into Tiers 0, 1, and 2.

    **ENRICHED KEYWORDS DATA (CSV Format):**

    ```csv
    {enriched_keywords_csv}
    ```

    **CSV COLUMNS:**
    - keyword, search_volume, competition_index, competition_level
    - cpc, opportunity_score, tier
    - trend_direction, trend_score, seasonality, is_evergreen

    **TIER DEFINITIONS (Priority Order: 0 → 1 → 2):**
    - **TIER_0_PREMIUM**: opportunity_score > 200 (EXCEPTIONAL - unicorn keywords)
    - **TIER_1_QUICK_WIN**: opportunity_score 100-200 (High volume, low competition)
    - **TIER_2_STRATEGIC**: opportunity_score 50-100 (Medium volume, moderate competition)

    **CONTEXT:**
    - Niche: {niche}
    - Solution: {selected_solution_name}
    - Description: {selected_solution_description}
    - Core Features: {core_features}
    - Known Competitors: {competitor_names}
    - Top Pain Points: {top_pain_points}

    **WORKFLOW:**

    1. **STEP 0: Relevance Filtering (MANDATORY)**
       Apply 3-rule filtering BEFORE tier assignment:
       - Rule 1: Context Match (relates to {niche} + {selected_solution_description})
       - Rule 2: Ambiguity Filter (generic terms need niche context)
       - Rule 3: Cross-Domain Exclusion (exclude unrelated domains)
       - Target: Filter only 10-20% as truly irrelevant

    2. **Select Premium Keywords:**
       - Tier 0: ALL keywords with opp_score > 200
       - Tier 1: ALL keywords with opp_score 100-200
       - Tier 2: ALL keywords with opp_score 50-100
       - ⚠️ DO NOT limit to 3-5 per tier — include ALL qualifying keywords

    3. **Create Strategy Narratives:**
       - tier_0_strategy (if Tier 0 exists): 1-2 paragraphs on premium opportunity approach
       - tier_1_quick_win_strategy: 1-2 paragraphs on quick-win implementation
       - tier_2_strategy (if Tier 2 exists): 1-2 paragraphs on strategic growth approach

    4. **Track Counts:**
       - premium_keywords_count: Total T0 + T1 + T2 keywords
       - filtered_keywords_count: Keywords excluded in STEP 0

    **TREND-AWARE PRIORITIZATION:**
    - Prioritize **rising** keywords (trend_direction = "rising")
    - Prefer **is_evergreen = True** for sustainable traffic
    - Note **seasonal** keywords (seasonality > 0.3) for timing recommendations

    **ANTI-PATTERNS:**
    ❌ Limiting Tier 1 to exactly 5 keywords when 18 qualify
    ❌ Filtering >30% of keywords as irrelevant (too aggressive)
    ❌ Returning JSON Schema instead of actual data
    ❌ Rounding search volumes (use EXACT values from CSV)

  expected_output: >
    PremiumTierResult Pydantic model with:

    - tier_0_keywords: Optional[List[TieredKeyword]] (ALL with opp_score >200)
    - tier_0_strategy: Optional[str] (1-2 paragraphs if Tier 0 exists)
    - tier_1_keywords: List[TieredKeyword] (ALL with opp_score 100-200, REQUIRED)
    - tier_1_quick_win_strategy: str (1-2 paragraphs, REQUIRED)
    - tier_2_keywords: Optional[List[TieredKeyword]] (ALL with opp_score 50-100)
    - tier_2_strategy: Optional[str] (1-2 paragraphs if Tier 2 exists)
    - premium_keywords_count: int (Total T0 + T1 + T2)
    - filtered_keywords_count: int (Count excluded in STEP 0)

    Each TieredKeyword includes: keyword, search_volume, competition, opportunity_score,
    strategy, intent, tier (0/1/2), tier_rationale

analyze_geographic_tier:
  description: >
    **Task 1b: Geographic Tier Analysis (Tier 3)**

    From the remaining keywords NOT selected in Task 1a (Tiers 0-2), identify and group
    keywords containing EXPLICIT location mentions (city/country names IN keyword text).

    **ENRICHED KEYWORDS DATA (CSV Format - Same as Task 1a):**

    ```csv
    {enriched_keywords_csv}
    ```

    **CONTEXT FROM TASK 1a (Premium Tiers):**
    Task 1a selected premium keywords (opp_score >= 50). Your job is to find GEOGRAPHIC
    keywords from the REMAINING keywords (opp_score < 50 OR not selected as premium).

    **GEOGRAPHIC KEYWORD CRITERIA:**
    - Keyword text must contain EXPLICIT location name (city, country, region)
    - ✓ VALID: "pet grooming tokyo", "moving to bangkok", "london relocation services"
    - ✗ INVALID: "international moving", "global health insurance" (no specific location)

    **CONTEXT:**
    - Niche: {niche}
    - Solution: {selected_solution_name}
    - Top Pain Points: {top_pain_points}

    **WORKFLOW:**

    1. **Identify Geographic Keywords:**
       - Scan remaining keywords (opp_score < 50 or not in premium tiers)
       - Select ONLY keywords with explicit location mentions in text
       - ⚠️ NEVER hallucinate city names — only use locations that appear in keyword

    2. **Group by Region:**
       Create GeographicKeywordGroup for each region:
       - region_name: "Spanish-Speaking Markets", "UK Markets", "Southeast Asia", etc.
       - total_volume: Sum of all keyword volumes in group
       - competition_level: Overall assessment ("LOW", "MEDIUM", "HIGH")
       - keywords: List of GeographicKeywordEntry (city, keyword, search_volume, notes)
       - strategy_notes: 1-3 sentences on market strategy

    3. **Track Count:**
       - geographic_keywords_count: Total keywords across all geographic groups

    **ANTI-PATTERNS:**
    ❌ Assigning "international moving" to geographic tier (no specific location)
    ❌ Hallucinating city names not present in keyword text
    ❌ Including premium keywords (opp_score >= 50) — those belong in Task 1a

  expected_output: >
    GeographicTierResult Pydantic model with:

    - tier_3_geographic_groups: Optional[List[GeographicKeywordGroup]]
      Each group has: region_name, total_volume, competition_level, keywords[], strategy_notes
    - geographic_strategy_notes: Optional[str] (1-2 paragraphs overall geographic strategy)
    - geographic_keywords_count: int (Total keywords in geographic groups)

    NOTE: If no geographic keywords found (no explicit location mentions), return:
    - tier_3_geographic_groups: null
    - geographic_keywords_count: 0

analyze_category_tier:
  description: >
    **Task 1c: Category Tier Analysis (Tier 4)**

    From the remaining keywords NOT selected in Tasks 1a (Premium) or 1b (Geographic),
    organize ALL remaining keywords into thematic category groups for programmatic SEO.

    **ENRICHED KEYWORDS DATA (CSV Format - Same as Tasks 1a/1b):**

    ```csv
    {enriched_keywords_csv}
    ```

    **CONTEXT FROM TASKS 1a + 1b:**
    - Task 1a selected premium keywords (opp_score >= 50)
    - Task 1b selected geographic keywords (explicit location mentions)
    - Your job: Categorize ALL REMAINING keywords into Tier 4 groups

    **CRITICAL: ONLY USE KEYWORDS FROM CSV**
    - Most keywords should end up in Tier 4 — this is NOT a "reject pile"
    - Tier 4 is the foundation of programmatic SEO
    - Target: 80%+ utilization of remaining keywords
    - Do NOT create empty categories (keywords: [] is forbidden)
    - Do NOT fabricate keywords that aren't in the input

    **CONTEXT:**
    - Niche: {niche}
    - Solution: {selected_solution_name}
    - Description: {selected_solution_description}
    - Core Features: {core_features}
    - Topic Clusters: {topic_clusters_summary}

    **WORKFLOW:**

    1. **Identify Remaining Keywords:**
       - Exclude keywords selected in Task 1a (opp_score >= 50)
       - Exclude keywords selected in Task 1b (geographic with explicit locations)
       - ALL remaining keywords belong in Tier 4

    2. **Create Category Groups:**
       Create {min_category_groups} to {max_category_groups} thematic category groups.

       For each category:
       - category_name: Theme (e.g., "Product Comparisons", "How-To Guides", "Pricing Options")
       - total_volume: Sum of keyword volumes
       - keywords: List of CategoryKeywordEntry (MUST have at least 1 keyword from CSV)
       - strategy_recommendation: 2-4 sentences on targeting this category

    3. **Rules:**
       - Every category MUST have at least 1 keyword from the CSV
       - Do NOT create empty categories (keywords: [] is forbidden)
       - Do NOT fabricate keywords that aren't in the input

    4. **Category Themes to Consider:**
       - Product/service types
       - User concerns/pain points
       - Price/budget tiers
       - Comparison keywords
       - How-to/guide keywords
       - Miscellaneous (catch-all for outliers)

    5. **Track Count:**
       - category_keywords_count: Total keywords across all category groups

  expected_output: >
    CategoryTierResult Pydantic model with:

    - tier_4_category_groups: Optional[List[CategoryKeywordGroup]]
      Each group has: category_name, total_volume, keywords[], strategy_recommendation
      CRITICAL: Every group MUST have at least 1 keyword - no empty groups allowed
    - category_strategy_notes: Optional[str] (1-2 paragraphs overall category strategy)
    - category_keywords_count: int (Total keywords in category groups)

    **VALIDATION BEFORE SUBMISSION:**
    - ☐ Between {min_category_groups} and {max_category_groups} category groups
    - ☐ Every category has at least 1 keyword from CSV
    - ☐ NO empty categories (keywords: [] is NOT allowed)

synthesize_keyword_summary:
  description: >
    **Task 1d: Summary & Synthesis**

    Synthesize findings from Tasks 1a (Premium), 1b (Geographic), and 1c (Category)
    into aggregate metrics, key findings, competitive positioning insights, AND
    extract sample keywords for downstream tasks (Task 2 needs actual keywords).

    **CONTEXT FROM TASKS 1a, 1b, 1c:**
    Access the outputs from previous tasks via CrewAI context chaining:
    - Task 1a: PremiumTierResult (tier 0-2 keywords, premium_keywords_count)
    - Task 1b: GeographicTierResult (tier 3 groups, geographic_keywords_count)
    - Task 1c: CategoryTierResult (tier 4 groups, category_keywords_count)

    **ENRICHED KEYWORDS DATA (for volume calculation):**

    ```csv
    {enriched_keywords_csv}
    ```

    **CONTEXT:**
    - Niche: {niche}
    - Solution: {selected_solution_name}
    - Known Competitors: {competitor_names}
    - Top Pain Points: {top_pain_points}

    **WORKFLOW:**

    1. **Synthesize Key Findings (3-5 QUALITATIVE bullets):**
       Focus on strategic themes, NOT raw statistics:
       - ✓ "Strong quick-win opportunities in [theme] with low competition"
       - ✓ "Geographic expansion potential in [regions] with combined 50K monthly volume"
       - ✓ "Comprehensive category coverage enables programmatic SEO across [X] themes"
       - ✗ "Filtered 0/318 keywords" (avoid raw counts)
       - ✗ "Tier 0=10, Tier 1=5, Tier 2=8" (avoid raw stats)

    2. **Competitive Positioning (2-4 sections, markdown):**
       - What keyword gaps exist vs. competitors?
       - What unique positioning angles does this keyword landscape enable?
       - What moats can be built through comprehensive keyword coverage?

    3. **EXTRACT SAMPLE KEYWORDS FOR DOWNSTREAM TASKS (CRITICAL):**

       From your context (Tasks 1a-1c outputs), extract ACTUAL keyword strings:

       - **top_tier_0_keywords**: List top 3-5 Tier 0 keyword strings
         (from Task 1a PremiumTierResult.tier_0_keywords[].keyword)
         FORMAT EXAMPLE (DO NOT COPY): ["beginner underwater basket weaving kits", "waterproof reed suppliers online"]

       - **top_tier_1_keywords**: List top 5-10 Tier 1 keyword strings
         (from Task 1a PremiumTierResult.tier_1_keywords[].keyword)
         FORMAT EXAMPLE (DO NOT COPY): ["underwater weaving certification course", "submersible craft tools review"]

       - **top_tier_2_keywords**: List top 5-10 Tier 2 keyword strings
         (from Task 1a PremiumTierResult.tier_2_keywords[].keyword)
         FORMAT EXAMPLE (DO NOT COPY): ["advanced aquatic basket techniques guide", "underwater weaving competition rules"]

       - **sample_geographic_regions**: List 3-5 region names from Tier 3 groups
         (from Task 1b GeographicTierResult.tier_3_geographic_groups[].region_name)
         FORMAT EXAMPLE (DO NOT COPY): ["Spanish-Speaking Markets", "Southeast Asia", "UK Markets"]

       - **sample_category_themes**: List 5-8 category names from Tier 4 groups
         (from Task 1c CategoryTierResult.tier_4_category_groups[].category_name)
         FORMAT EXAMPLE (DO NOT COPY): ["Weaving Materials", "Certification Programs", "Competition Events"]

       **WHY THIS MATTERS:**
       Task 2 (Content Strategy) needs REAL keywords to create topic clusters.
       Without these sample keywords, Task 2 will output placeholders like
       <TIER_1_KEYWORD_1> instead of actual niche-specific keywords from your context.

       **ANTI-COPYING RULE:** The examples above use "underwater basket weaving" as a
       deliberately absurd placeholder. Your output MUST contain keywords from YOUR
       context about {niche}. If your output contains "underwater", "basket", "weaving",
       or "reed", you copied the examples instead of using real data.

       **RULES:**
       - Extract ONLY actual keyword strings that appear in your context
       - Do NOT invent or fabricate keywords
       - If a tier has no keywords in context, set that field to null
       - Prioritize highest-volume keywords when selecting samples

    **KEY FINDINGS GUIDELINES:**
    - Focus on OPPORTUNITY THEMES, not counts
    - Describe STRATEGIC IMPLICATIONS, not just data
    - Connect keywords to BUSINESS OUTCOMES
    - Highlight COMPETITIVE ADVANTAGES revealed by keyword analysis

  expected_output: >
    KeywordSummaryResult Pydantic model with:

    - key_findings: List[str] (3-5 QUALITATIVE strategic insights)
    - competitive_positioning: str (markdown, 2-4 sections on positioning strategy)
    - top_tier_0_keywords: Optional[List[str]] (3-5 Tier 0 keyword strings from context, or null)
    - top_tier_1_keywords: Optional[List[str]] (5-10 Tier 1 keyword strings from context, or null)
    - top_tier_2_keywords: Optional[List[str]] (5-10 Tier 2 keyword strings from context, or null)
    - sample_geographic_regions: Optional[List[str]] (3-5 region names from Tier 3 groups, or null)
    - sample_category_themes: Optional[List[str]] (5-8 category names from Tier 4 groups, or null)

    **CRITICAL:** The sample keyword fields enable Task 2 to create content strategy
    with REAL keywords instead of placeholders. Extract actual keyword strings from context.

    NOTE: This task completes the 4-task keyword analysis split. Python will merge
    outputs from Tasks 1a-1d into the combined KeywordAnalysisResult.

# ========================================
# PARALLEL KEYWORD ANALYSIS TASKS (Tasks 1a-1e)
# ========================================
# These tasks use async_execution=True for ~4x faster keyword analysis
# Keywords are PRE-FILTERED by Python before being passed to each task

analyze_high_priority_tiers:
  description: >
    **Task 1a (Parallel): High Priority Keywords (Tier 0 + Tier 1)**

    Analyze {high_priority_keywords_count} PRE-FILTERED high-priority keywords.
    These keywords have opp_score > 100 (Tier 0 + Tier 1).

    **HIGH PRIORITY KEYWORDS CSV:**

    ```csv
    {high_priority_keywords_csv}
    ```

    **CRITICAL: NO FILTERING NEEDED**
    These keywords are PRE-FILTERED by Python. Your job is to:
    1. Analyze 100% of provided keywords
    2. Assign each to Tier 0 (opp_score >200) or Tier 1 (opp_score 100-200)
    3. Create strategies for each tier

    **CONTEXT:**
    - Niche: {niche}
    - Solution: {selected_solution_name}
    - Description: {selected_solution_description}
    - Core Features: {core_features}

    **TIER DEFINITIONS:**
    - **TIER_0_PREMIUM**: opportunity_score > 200 (EXCEPTIONAL - unicorn keywords)
    - **TIER_1_QUICK_WIN**: opportunity_score 100-200 (High volume, low competition)

    **WORKFLOW:**

    1. **Analyze ALL Keywords:**
       - Every keyword in the CSV belongs to Tier 0 or Tier 1
       - Assign based on opportunity_score threshold (200 for T0, 100-200 for T1)

    2. **Create Strategy Narratives:**
       - tier_0_strategy (if T0 exists): 1-2 paragraphs on premium opportunity approach
       - tier_1_quick_win_strategy: 1-2 paragraphs on quick-win implementation

    3. **Track Count:**
       - high_priority_count: Total T0 + T1 keywords (should equal {high_priority_keywords_count})

    **TREND-AWARE PRIORITIZATION:**
    - Prioritize **rising** keywords (trend_direction = "rising")
    - Prefer **is_evergreen = True** for sustainable traffic

  expected_output: >
    HighPriorityTierResult Pydantic model with:

    - tier_0_keywords: Optional[List[TieredKeyword]] (ALL with opp_score >200)
    - tier_0_strategy: Optional[str] (1-2 paragraphs if Tier 0 exists)
    - tier_1_keywords: List[TieredKeyword] (ALL with opp_score 100-200, REQUIRED)
    - tier_1_quick_win_strategy: str (1-2 paragraphs, REQUIRED)
    - high_priority_count: int (Total T0 + T1)

    Each TieredKeyword includes: keyword, search_volume, competition, opportunity_score,
    strategy, intent, tier (0/1), tier_rationale

