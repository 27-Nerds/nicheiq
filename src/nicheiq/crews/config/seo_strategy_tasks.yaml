create_implementation_guide:
  description: >
    ═══ TASK 5: IMPLEMENTATION GUIDE ═══
    ✓ Generate ONLY 3 new implementation fields (Python will merge with Task 4)
    ✓ Focus on high-quality, actionable implementation guidance
    ✓ Use moderate code examples (JSON-LD snippets, NOT full HTML pages)

    **Task 5: Create SEO Implementation Guide**

    **HOW TO ACCESS CONTEXT:**

    Tasks 1-4 are available in your context for reference:
    - Task 1: KeywordAnalysisResult (keyword tiers, volumes)
    - Task 2: ContentStrategyResult (content plan, site architecture)
    - Task 3: ImplementationPlanResult (roadmap, metrics)
    - Task 4: SEOStrategyReport (complete SEO strategy - for reference only)

    **YOUR TASK: Generate Implementation Details**

    Generate 3 comprehensive implementation sections:

    **1. Universal SEO Elements** (UniversalSEOElements model):
    - title_tag_formula: Pattern like "[Primary KW] | [Secondary] | [Brand]"
    - title_tag_guidelines: Length (50-60 chars), keyword placement, CTR optimization (2-3 paragraphs)
    - meta_description_guidelines: Length (150-160 chars), CTA, keyword usage (2-3 paragraphs)
    - canonical_url_strategy: Self-referencing, filter handling, duplicate prevention (2 paragraphs)
    - open_graph_tags: Required tags with format examples (og:title, og:description, og:image, og:url)
    - robots_meta_guidelines: When to use index/noindex, examples by page type (2 paragraphs)

    **2. Page-Specific Implementations** (List[PageTypeImplementation] - 4-6 page types):

    For EACH page type (Homepage, Location Pages, Profile Pages, Content/Guide Pages):
    - page_type: Descriptive name
    - url_pattern: URL structure (e.g., "/service/[location]")
    - target_keywords: 3-5 keyword patterns from Task 1 tiers
    - title_tag_example: Real example applying formula to {selected_solution_name}
    - meta_description_example: Real example
    - h1_structure: H1 format pattern
    - h2_structure: List of 3-6 recommended H2 section headings (must be array of strings)
    - schema_types: Required schema types (e.g., ["Service", "Breadcrumb", "FAQ"])
    - internal_linking_strategy: How to link to/from this page type
    - content_guidelines: Min/optimal word count, required sections

    **3. Schema Markup Strategy** (SchemaMarkupStrategy model):
    - why_schema_matters: Benefits (rich results, voice search, AI search, CTR) - 2-3 paragraphs
    - priority_schema_types: Ordered list of 6-8 essential types
    - implementation_method: JSON-LD format, <head> placement, why JSON-LD - 2 paragraphs
    - schema_examples: List of SchemaExample objects, each containing:
      * schema_type: The Schema.org type (e.g., "Organization", "Service", "FAQ")
      * json_ld_code: FULLY POPULATED JSON-LD with actual values from context (NOT template variables)

      **CRITICAL SCHEMA SYNTAX CLARIFICATION:**

      Your json_ld_code field MUST contain fully populated JSON with actual values from context.
      Do NOT use placeholders like [solution_name], [url], or template variables like [variable].

      **Example for Organization schema** (CORRECT - fully populated):
      ```json
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ExpatEase - International Relocation Directory",
        "description": "Curated directory connecting expats with vetted relocation service providers across 50+ countries",
        "url": "https://expatease.com",
        "logo": "https://expatease.com/logo.png",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "DE"
        },
        "sameAs": [
          "https://twitter.com/expatease",
          "https://linkedin.com/company/expatease"
        ]
      }
      ```

      ❌ **WRONG** (has placeholders):
      ```json
      {
        "@type": "Organization",
        "name": "[solution_name]",
        "url": "[solution_url]"
      }
      ```

      ❌ **WRONG** (has template variables):
      ```json
      {
        "@type": "Organization",
        "name": "[selected_solution_name]",
        "url": "[solution_url]"
      }
      ```

      ✅ **CORRECT** (fully populated with actual values from {selected_solution_name}, {value_proposition}, {niche}):
      - Uses actual solution name: "ExpatEase - International Relocation Directory"
      - Uses inferred URL based on solution name: "https://expatease.com"
      - Uses specific description from {value_proposition}
      - Includes 5-10 properties (not just @type + name)

      Provide 6-8 schema examples (Organization, Service/Product, Review, AggregateRating, FAQ, Article, BreadcrumbList, etc.)
      ALL examples must be fully populated with actual values from context.

    - testing_validation: Tools and process (Google Rich Results Test, Schema Validator) - 2 paragraphs

    **KEYWORD TIER INTEGRATION (Prioritize Page Types):**

    Use keyword tiers from Task 1 to prioritize page types by ranking potential:

    **High Priority Page Types** (Tier 1 - Quick Win keywords):
    - These page types should target low-competition, high-intent Tier 1 keywords
    - Focus: Fast ranking potential, conversion-optimized pages
    - Schema: Add trust signals (AggregateRating, Review, Offer) for competitive edge
    - Example: If Task 1 has Tier 1 keyword "budget expat insurance" (2400 vol, low comp):
      → Create high-priority "Budget Insurance Guides" page type targeting this keyword

    **Medium Priority Page Types** (Tier 2 - Strategic Growth keywords):
    - These page types target competitive but valuable Tier 2 keywords
    - Focus: Comprehensive content, authority-building, long-term investment
    - Schema: Add depth signals (FAQPage, HowTo, Article) for rich results
    - Example: If Task 1 has Tier 2 keyword "expat health insurance comparison" (1800 vol, medium comp):
      → Create medium-priority "Insurance Comparison Pages" page type

    **Lower Priority Page Types** (Tier 3-4 keywords):
