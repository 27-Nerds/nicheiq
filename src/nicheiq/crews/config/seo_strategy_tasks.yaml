    **Task 3: Implementation Planning**

    Apply your 3-Phase Compound SEO Roadmap using context from Tasks 1-2.

    **SOLUTION CONTEXT:**
    - Solution: {selected_solution_name}
    - Value Proposition: {value_proposition}
    - Target Personas:
      {target_personas}
    - Core Features:
      {core_features}

    **HOW TO ACCESS CONTEXT (IMPORTANT):**

    Tasks 1-2 outputs are available in your context via CrewAI context chaining.

    **From Task 1 (KeywordAnalysisResult):**
    - tier_1_keywords, tier_2_keywords (for Phase 1-2 content targets)
    - tier_3_geographic_groups, tier_4_category_groups (for Phase 3 scaling)
    - total_monthly_volume (for traffic projection baseline)
    - key_findings (for risk assessment)

    **From Task 2 (ContentStrategyResult):**
    - content_strategy (for deliverable planning)
    - topic_clusters (for content architecture phases)
    - technical_seo_recommendations (for technical milestones)
    - keyword_based_page_types (for programmatic SEO phases)

    **DO NOT fabricate metrics** - base all projections on Task 1-2 data.

    **KEYWORD DIFFICULTY METRICS (Data-Driven Timeline Estimates):**

    These metrics are calculated from actual SEO difficulty scores (0-100 scale, lower=easier to rank):
    - Tier 0 avg difficulty: {avg_difficulty_tier0} (premium keywords)
    - Tier 1 avg difficulty: {avg_difficulty_tier1} → expected ranking time: {tier1_ranking_time}
    - Tier 2 avg difficulty: {avg_difficulty_tier2} → expected ranking time: {tier2_ranking_time}
    - Weighted difficulty score: {difficulty_score}
    - Timeline multiplier: {timeline_multiplier}

    **TIMELINE ADJUSTMENT GUIDANCE:**
    - timeline_multiplier < 0.75: Accelerated timeline (low difficulty niche - compress phases)
    - timeline_multiplier 0.75-1.25: Standard timeline (use default phase durations)
    - timeline_multiplier > 1.25: Extended timeline (high difficulty niche - expand phases)

    Use the tier-specific ranking times ({tier1_ranking_time}, {tier2_ranking_time}) to set realistic
    expectations for each phase. Do NOT use generic "3-6 months" estimates - use the data-driven times.

    **PHASED ROADMAP** (use bullet points, NOT tables - tables break JSON):

    Phase 1 - Foundation + Quick Wins:
    - Duration: Adjust based on timeline_multiplier (standard: Mo 1-3)
    - Focus: Technical SEO basics, Tier 1 content
    - Deliverables: 3-5 Tier 1 pages, tech audit fixes
    - Targets: First rankings within {tier1_ranking_time}

    Phase 2 - Strategic Expansion:
    - Duration: Adjust based on timeline_multiplier (standard: Mo 4-6)
    - Focus: Tier 2 content, topic clusters, internal linking
    - Deliverables: 3-5 Tier 2 pages, cluster architecture
    - Targets: Rankings within {tier2_ranking_time}

    Phase 3 - Scaling:
    - Duration: Remaining months to reach 12-month total
    - Focus: Tiers 3-4, programmatic templates
    - Deliverables: Geographic/category pages at scale
    - Targets: 20+ ranking KWs, scaled traffic

    **BUDGET ALLOCATION (Niche-Specific):**

    The budget_allocation field MUST be tailored to this specific solution context.
    DO NOT output generic 3-tier bootstrap/moderate/aggressive templates.

    Consider the solution's actual cost drivers:
    - For directories/aggregators: data sourcing costs (API access, scraping, partnerships)
    - For SaaS products: development, hosting, API costs
    - For content platforms: content creation, editorial costs
    - Use actual keyword volume from Task 1 to estimate content investment needs
    - Reference the competitive landscape intensity to justify budget level

    Example (GOOD): "Bootstrap ($200-500/mo): Focus 70% on content creation for {selected_solution_name}'s
    top 5 Tier 1 keywords, 20% on data sourcing APIs, 10% on technical SEO tools."
    Example (BAD): "Bootstrap: $500/mo, Moderate: $2000/mo, Aggressive: $5000/mo" (generic tiers)

