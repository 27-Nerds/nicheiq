name: Frontend

# Neutral executor for the frontend suite. Runs direct binaries on a clean checkout.
# Unfiltered triggers, matching python.yml: the cost is a couple of minutes and it
# leaves no commit unverified.
on:
  push:
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json requires >=20.19.0; 22 matches backend.yml.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # svelte-check reads generated route/type files under .svelte-kit, which are not
      # committed. Without sync it reports hundreds of phantom errors on a clean
      # checkout. This is the first half of the `npm run check` script, split out so
      # the check binary below is invoked directly.
      - name: Sync SvelteKit types
        run: ./node_modules/.bin/svelte-kit sync

      # Direct binaries below. No npm-script indirection, no pipes — the exit code of
      # each binary is the step result. Baseline on a clean tree: svelte-check reports
      # 0 errors and 0 warnings; vitest runs 174 files.
      - name: Type check
        run: ./node_modules/.bin/svelte-check --tsconfig ./tsconfig.json

      - name: Unit tests
        run: ./node_modules/.bin/vitest run
