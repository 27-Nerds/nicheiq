# NicheIQ Production Docker Compose
# For deployment to DigitalOcean with Caddy reverse proxy
#
# Usage:
#   docker compose -f docker/docker-compose.prod.yml up -d

services:
  # =============================================================================
  # REVERSE PROXY - Caddy with automatic HTTPS
  # =============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: nicheiq-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - nicheiq-network
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # DATABASE - PostgreSQL 16
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: nicheiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nicheiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nicheiq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nicheiq-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nicheiq}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================================================
  # CACHE/QUEUE - Redis 7
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: nicheiq-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - nicheiq-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================================================
  # BACKEND API - Node.js
  # =============================================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: nicheiq-api
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-nicheiq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nicheiq}
      # Redis
      REDIS_URL: redis://redis:6379
      # Node.js
      NODE_ENV: production
      PORT: 3001
      # Auth
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-prod-internal-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      # CORS & URLs
      CORS_ORIGINS: ${CORS_ORIGINS:-https://nicheiq.dev}
      BASE_URL: ${BASE_URL:-https://nicheiq.dev}
      # Email (optional) - set EMAIL_PROVIDER to 'sendgrid' or 'smtp'
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Output directory (for checkpoint/log downloads)
      OUTPUT_DIR: /app/output
      # Job settings
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-604800}
      # Niche suggestion settings
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      SUGGEST_LLM_MODEL: ${SUGGEST_LLM_MODEL:-gpt-4.1-nano}
      SUGGEST_RATE_HOURLY: ${SUGGEST_RATE_HOURLY:-40}
      SUGGEST_RATE_DAILY: ${SUGGEST_RATE_DAILY:-50}
      # Other backend LLM features (niche categorization, FAQ generation)
      CATEGORIZE_LLM_MODEL: ${CATEGORIZE_LLM_MODEL:-gpt-5-nano}
      OPENAI_FAQ_MODEL: ${OPENAI_FAQ_MODEL:-gpt-4.1-mini}
      # OpenRouter (optional — lets SUGGEST/CATEGORIZE/FAQ models use openrouter/* ids)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-}
    volumes:
      - job_output:/app/output
    networks:
      - nicheiq-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # PYTHON WORKER - Research Pipeline
  # =============================================================================
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g          # block spillover to host swap
    environment:
      # Telemetry kill switches — verified against installed package source:
      #   crewai/telemetry/telemetry.py:144-151 → OTEL_SDK_DISABLED, CREWAI_DISABLE_TELEMETRY
      #   chromadb/config.py:221-229            → anonymized_telemetry via pydantic-settings
      OTEL_SDK_DISABLED: "true"
      CREWAI_DISABLE_TELEMETRY: "true"
      ANONYMIZED_TELEMETRY: "False"
      # Glibc thread-arena cap — return freed memory to OS instead of caching per-thread
      MALLOC_ARENA_MAX: "2"
      # Recycle worker process after N jobs; restart: unless-stopped brings it back fresh
      MAX_JOBS_PER_WORKER: "50"
      # Database & Redis (internal network)
      DATABASE_URL: postgresql://${POSTGRES_USER:-nicheiq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nicheiq}
      REDIS_URL: redis://redis:6379
      # Backend API URL for status updates
      BACKEND_URL: http://api:3001
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-prod-internal-secret-change-me}
      # Output directory
      NICHEIQ_OUTPUT_DIR: /app/output/jobs
      OUTPUT_DIR: /app/output
      REPORTS_DIR: /app/output/reports
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-gpt-4o}
      FUNCTION_CALLING_LLM: ${FUNCTION_CALLING_LLM:-gpt-4o-mini}
      CONTENT_ANALYSIS_LLM: ${CONTENT_ANALYSIS_LLM:-gpt-4o}
      THREAD_VALIDATION_LLM: ${THREAD_VALIDATION_LLM:-gpt-4o-mini}
      STANCE_VALIDATION_LLM: ${STANCE_VALIDATION_LLM:-gpt-4o-mini}
      COMPETITOR_EXTRACTION_LLM: ${COMPETITOR_EXTRACTION_LLM:-gpt-4o-mini}
      BRAINSTORM_LLM: ${BRAINSTORM_LLM:-gpt-4o}
      KEYWORD_VALIDATION_LLM: ${KEYWORD_VALIDATION_LLM:-gpt-4o-mini}
      PAIN_POINT_VALIDATION_LLM: ${PAIN_POINT_VALIDATION_LLM:-gpt-4o-mini}
      PAIN_SOLUTION_MAPPING_LLM: ${PAIN_SOLUTION_MAPPING_LLM:-gpt-4o-mini}
      LANDING_PAGE_LLM: ${LANDING_PAGE_LLM:-gpt-4o}
      # Stage-1 niche+audience-scope classifier (structured tier)
      NICHE_CONTEXT_LLM: ${NICHE_CONTEXT_LLM:-openrouter/qwen/qwen3-235b-a22b-2507}
      BRAINSTORM_REASONING_EFFORT: ${BRAINSTORM_REASONING_EFFORT:-high}
      # Divergent-ideation diversity (multi-model pool + embedding semantic dedup)
      BRAINSTORM_LLMS: ${BRAINSTORM_LLMS:-}
      NUM_DIVERGENT_SAMPLES: ${NUM_DIVERGENT_SAMPLES:-2}
      DIVERGENT_SAMPLE_DEADLINE_SECONDS: ${DIVERGENT_SAMPLE_DEADLINE_SECONDS:-360}
      DIVERGENT_POOL_CAP: ${DIVERGENT_POOL_CAP:-15}
      DIVERGENT_TARGET_GENERATORS: ${DIVERGENT_TARGET_GENERATORS:-6}
      DIVERGENT_TARGET_POOL: ${DIVERGENT_TARGET_POOL:-15}
      DIVERGENT_KEEP_FRACTION: ${DIVERGENT_KEEP_FRACTION:-0.5}
      DIVERGENT_DEDUP_SIMILARITY_THRESHOLD: ${DIVERGENT_DEDUP_SIMILARITY_THRESHOLD:-0.85}
      # Pain-partitioned divergent ideation (one narrow generator per selected pain)
      ENABLE_PAIN_PARTITIONED_DIVERGENT: ${ENABLE_PAIN_PARTITIONED_DIVERGENT:-false}
      DIVERGENT_MAX_GENERATORS: ${DIVERGENT_MAX_GENERATORS:-8}
      DIVERGENT_MAX_WORKERS: ${DIVERGENT_MAX_WORKERS:-8}
      DIVERGENT_PARTITIONED_KEEP_FRACTION: ${DIVERGENT_PARTITIONED_KEEP_FRACTION:-0.67}
      # Feasibility grounding (default OFF — enable after a calibration / rank-stability run)
      ENABLE_FEASIBILITY_CRITIC: ${ENABLE_FEASIBILITY_CRITIC:-false}
      ENABLE_VERDICT_DATA_CAPS: ${ENABLE_VERDICT_DATA_CAPS:-false}
      # Ideation convergent tiers: judge = novelty critic + evaluator; refine = idea refiner
      IDEATION_JUDGE_LLM: ${IDEATION_JUDGE_LLM:-gpt-5.4-mini}
      IDEATION_JUDGE_REASONING_EFFORT: ${IDEATION_JUDGE_REASONING_EFFORT:-low}
      IDEATION_REFINE_LLM: ${IDEATION_REFINE_LLM:-gpt-5.2}
      IDEATION_REFINE_REASONING_EFFORT: ${IDEATION_REFINE_REASONING_EFFORT:-medium}
      IDEATION_REFINE_MAX_TOKENS: ${IDEATION_REFINE_MAX_TOKENS:-32768}
      # Creative MENTOR in the idea-improvement loop (post-calibration); guides weak ideas to sharper/buildable/on-pain revisions. Different family than the ideator so it doesn't self-judge.
      IDEATION_MENTOR_LLM: ${IDEATION_MENTOR_LLM:-gpt-5.4-mini}
      IDEATION_MENTOR_REASONING_EFFORT: ${IDEATION_MENTOR_REASONING_EFFORT:-medium}
      # Realism calibration critic: independent post-refinement re-score of the 5 idea criteria, replaces optimistic self-scores (A/B-validated vs a gpt-5.2 reference)
      ENABLE_SCORE_CALIBRATION: ${ENABLE_SCORE_CALIBRATION:-true}
      SCORE_CALIBRATION_LLM: ${SCORE_CALIBRATION_LLM:-openrouter/qwen/qwen3.7-max}
      SCORE_CALIBRATION_REASONING_EFFORT: ${SCORE_CALIBRATION_REASONING_EFFORT:-medium}
      LANDING_PAGE_EXECUTION_LLM: ${LANDING_PAGE_EXECUTION_LLM:-gpt-4o}
      LANDING_PAGE_CREATIVE_REASONING_EFFORT: ${LANDING_PAGE_CREATIVE_REASONING_EFFORT:-high}
      LANDING_PAGE_EXECUTION_REASONING_EFFORT: ${LANDING_PAGE_EXECUTION_REASONING_EFFORT:-medium}
      LANDING_PAGE_VALIDATION_REASONING_EFFORT: ${LANDING_PAGE_VALIDATION_REASONING_EFFORT:-low}
      # Final solution refinement pass (turns surviving concepts into full scored ideas)
      SOLUTION_REFINEMENT_ENABLED: ${SOLUTION_REFINEMENT_ENABLED:-true}
      # SEO realism caps (downgrade-only, always on) + page-count/handseed ceilings
      ENABLE_SEO_HANDSEED_CAP: ${ENABLE_SEO_HANDSEED_CAP:-false}
      SEO_CAP_GATED_SAAS_CEILING: ${SEO_CAP_GATED_SAAS_CEILING:-0.5}
      SEO_CAP_HANDSEED_CEILING: ${SEO_CAP_HANDSEED_CEILING:-0.6}
      SEO_CAP_HIGH_SCORE_MIN_PAGES: ${SEO_CAP_HIGH_SCORE_MIN_PAGES:-300}
      SEO_CAP_MODERATE_PAGES_CEILING: ${SEO_CAP_MODERATE_PAGES_CEILING:-0.7}
      SEO_CAP_REQUIRE_SAAS_FOR_GATING: ${SEO_CAP_REQUIRE_SAAS_FOR_GATING:-true}
      SEO_CAP_THIN_PAGES_CEILING: ${SEO_CAP_THIN_PAGES_CEILING:-0.4}
      SEO_CAP_THIN_PAGES_THRESHOLD: ${SEO_CAP_THIN_PAGES_THRESHOLD:-50}
      # SEO keyword-grounded refinement (Phase-2 recount for the chosen idea)
      SEO_REFINEMENT_ENABLED: ${SEO_REFINEMENT_ENABLED:-true}
      SEO_REFINEMENT_KEYWORD_EVIDENCE_ENABLED: ${SEO_REFINEMENT_KEYWORD_EVIDENCE_ENABLED:-true}
      SEO_REFINEMENT_MAX_KEYWORD_EVIDENCE: ${SEO_REFINEMENT_MAX_KEYWORD_EVIDENCE:-0.35}
      SEO_REFINEMENT_MAX_TIER1_BOOST: ${SEO_REFINEMENT_MAX_TIER1_BOOST:-0.2}
      SEO_REFINEMENT_MAX_VOLUME_BOOST: ${SEO_REFINEMENT_MAX_VOLUME_BOOST:-1.2}
      SEO_REFINEMENT_MIN_COMPETITION_MODIFIER: ${SEO_REFINEMENT_MIN_COMPETITION_MODIFIER:-0.2}
      SEO_REFINEMENT_VOLUME_DISCOUNT_FLOOR: ${SEO_REFINEMENT_VOLUME_DISCOUNT_FLOOR:-0.7}
      # SEO_REFINEMENT_VOLUME_BASELINES: complex JSON dict — left on code default; override in code if needed
      CHROMA_OPENAI_API_KEY: ${OPENAI_API_KEY}
      # OpenRouter (optional alternative provider — required if any *_LLM tier uses an openrouter/* id)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-}
      # Structured-output route for openrouter/* tiers (json_schema needs a guided-decoding provider, e.g. deepinfra)
      OPENROUTER_STRUCTURED_MODE: ${OPENROUTER_STRUCTURED_MODE:-tool_choice}
      OPENROUTER_STRUCTURED_PROVIDERS: ${OPENROUTER_STRUCTURED_PROVIDERS:-}
      # Moonshot AI (Kimi) — required if any tier uses a kimi-* model id
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      KIMI_THINKING: ${KIMI_THINKING:-false}
      # Serper (Google Search)
      SERPER_API_KEY: ${SERPER_API_KEY:?SERPER_API_KEY is required}
      # Reddit
      ENABLE_REDDIT: ${ENABLE_REDDIT:-true}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-NicheIQ/1.0}
      # Twitter (optional)
      ENABLE_TWITTER: ${ENABLE_TWITTER:-false}
      TWITTER_USERNAME: ${TWITTER_USERNAME:-}
      TWITTER_PASSWORD: ${TWITTER_PASSWORD:-}
      TWITTER_EMAIL: ${TWITTER_EMAIL:-}
      # Hacker News (free Algolia API, no auth)
      ENABLE_HACKERNEWS: ${ENABLE_HACKERNEWS:-true}
      MIN_HN_POINTS: ${MIN_HN_POINTS:-5}
      MIN_HN_COMMENTS: ${MIN_HN_COMMENTS:-3}
      # YouTube (transcripts free; comments require API key)
      ENABLE_YOUTUBE: ${ENABLE_YOUTUBE:-false}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      MIN_YOUTUBE_VIEWS: ${MIN_YOUTUBE_VIEWS:-0}
      MAX_YOUTUBE_VIDEOS: ${MAX_YOUTUBE_VIDEOS:-25}
      # DataForSEO
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      # Logging & Monitoring
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TOKEN_MONITORING_ENABLED: ${TOKEN_MONITORING_ENABLED:-true}
      COST_LOGGING_ENABLED: ${COST_LOGGING_ENABLED:-true}
      # Search Config
      NUM_SEARCH_QUERIES: ${NUM_SEARCH_QUERIES:-40}
      # Part C: soft, additive audience bias on queries + pain mining (broad set preserved). Default off.
      ENABLE_AUDIENCE_AWARE_RESEARCH: ${ENABLE_AUDIENCE_AWARE_RESEARCH:-false}
      AUDIENCE_QUERY_ALLOTMENT: ${AUDIENCE_QUERY_ALLOTMENT:-6}
      MAX_REDDIT_CONTENT_TOKENS: ${MAX_REDDIT_CONTENT_TOKENS:-150000}
      # Reddit Quality Filters
      MIN_REDDIT_UPVOTES: ${MIN_REDDIT_UPVOTES:-10}
      MIN_REDDIT_COMMENTS: ${MIN_REDDIT_COMMENTS:-5}
      MIN_COMMENT_LENGTH: ${MIN_COMMENT_LENGTH:-50}
      MIN_COMMENT_SCORE: ${MIN_COMMENT_SCORE:-2}
      # REDDIT_COMMENT_LIMIT: omitted = None (all comments). Set to 32 for most, 0 for top-level only.
      # Reddit Freshness Search
      REDDIT_FRESHNESS_SEARCH_ENABLED: ${REDDIT_FRESHNESS_SEARCH_ENABLED:-true}
      REDDIT_FRESHNESS_TBS: ${REDDIT_FRESHNESS_TBS:-qdr:y}
      REDDIT_FRESHNESS_QUERY_FRACTION: ${REDDIT_FRESHNESS_QUERY_FRACTION:-0.3}
      # PRAW Native Reddit Search
      REDDIT_NATIVE_SEARCH_ENABLED: ${REDDIT_NATIVE_SEARCH_ENABLED:-true}
      REDDIT_NATIVE_SEARCH_TIME_FILTER: ${REDDIT_NATIVE_SEARCH_TIME_FILTER:-month}
      REDDIT_NATIVE_SEARCH_QUERY_FRACTION: ${REDDIT_NATIVE_SEARCH_QUERY_FRACTION:-0.25}
      REDDIT_NATIVE_SEARCH_MAX_RESULTS: ${REDDIT_NATIVE_SEARCH_MAX_RESULTS:-10}
      # Token Budget Freshness Reserve
      TOKEN_BUDGET_FRESHNESS_RESERVE: ${TOKEN_BUDGET_FRESHNESS_RESERVE:-0.25}
      TOKEN_BUDGET_FRESHNESS_DAYS: ${TOKEN_BUDGET_FRESHNESS_DAYS:-180}
      # Twitter Quality Filters
      MIN_TWITTER_LIKES: ${MIN_TWITTER_LIKES:-10}
      MIN_TWITTER_REPLIES: ${MIN_TWITTER_REPLIES:-5}
      # Geo/Language Targeting
      # TARGET_LOCATION: omitted = None (global data). Set to location code e.g. 2840 for US.
      TARGET_LANGUAGE: ${TARGET_LANGUAGE:-}
      # API Reliability
      MAX_RETRIES: ${MAX_RETRIES:-3}
      TIMEOUT_SECONDS: ${TIMEOUT_SECONDS:-60}
      # Validation Config
      TOP_SOLUTIONS_FOR_VALIDATION: ${TOP_SOLUTIONS_FOR_VALIDATION:-3}
      KEYWORD_PIVOT_MAX_ATTEMPTS: ${KEYWORD_PIVOT_MAX_ATTEMPTS:-4}
      # Parallel Processing
      KEYWORD_VALIDATION_MAX_WORKERS: ${KEYWORD_VALIDATION_MAX_WORKERS:-3}
      THREAD_VALIDATION_MAX_WORKERS: ${THREAD_VALIDATION_MAX_WORKERS:-4}
      # Python
      PYTHONPATH: /app
      PYTHONUNBUFFERED: 1
    volumes:
      - job_output:/app/output
    networks:
      - nicheiq-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  # =============================================================================
  # FRONTEND - SvelteKit
  # =============================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-https://nicheiq.dev}
        PUBLIC_GA_MEASUREMENT_ID: ${PUBLIC_GA_MEASUREMENT_ID:-}
    container_name: nicheiq-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Internal API URL for server-side requests
      PUBLIC_API_URL: http://api:3001
      BACKEND_URL: http://api:3001
      # External API URL for client-side requests (passed at build time)
      ORIGIN: ${ORIGIN:-https://nicheiq.dev}
      # Database for Auth.js
      DATABASE_URL: postgresql://${POSTGRES_USER:-nicheiq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nicheiq}
      # Auth.js configuration
      # AUTH_URL intentionally unset: AUTH_TRUST_HOST=true lets Auth.js infer
      # the URL from request headers, avoiding the env-url-basepath-redundant warning.
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_TRUST_HOST: "true"
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-prod-internal-secret-change-me}
      # OAuth providers
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      PUBLIC_GA_MEASUREMENT_ID: ${PUBLIC_GA_MEASUREMENT_ID:-}
      # SEO launch gate (runtime). 'true' (default) keeps the idea catalog noindex + out of the
      # sitemap; set SEO_LAUNCH_GATE=false in the prod .env to open it to search indexing, then
      # `docker compose up -d frontend` (no rebuild needed).
      SEO_LAUNCH_GATE: ${SEO_LAUNCH_GATE:-true}
    networks:
      - nicheiq-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  nicheiq-network:
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  job_output:
    driver: local
