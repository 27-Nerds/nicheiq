<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

		<!-- Fonts: Syne (Display) + Outfit (Body) + JetBrains Mono (Code) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>

		<!-- SEO Meta -->
		<meta name="description" content="NicheIQ - Stop guessing, start validating. Get AI-powered market research with verified data from Reddit, Twitter & more. Validate your SaaS idea in 12 minutes." />
		<meta name="keywords" content="market research, SaaS validation, AI research, competitor analysis, pain point analysis, keyword research" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="NicheIQ - Validated Market Research in 12 Minutes" />
		<meta property="og:description" content="They estimate. We verify with real data. Get verified market insights with Reddit API access and DataForSEO keyword validation." />
		<meta property="og:image" content="/og-image.png" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="NicheIQ - Validated Market Research in 12 Minutes" />
		<meta name="twitter:description" content="They estimate. We verify with real data. Get verified market insights with Reddit API access and DataForSEO keyword validation." />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-bg-base text-text-secondary antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
