<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Plus Jakarta Sans',system-ui,sans-serif">
  <rect width="1200" height="540" fill="#FAFAFA"/>
  <text x="600" y="42" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="2" fill="#71717A">FIG 3 - COTTAGE-FOOD RUN: FIVE IDEAS, BEST 0.46, NO-GO</text>

  <g transform="translate(60 82)">
    <text x="260" y="0" text-anchor="middle" font-size="15" font-weight="600" fill="#18181B">Home bakers under cottage food laws</text>
    <rect x="20" y="20" width="500" height="380" rx="12" fill="#FFFFFF" stroke="#E4E4E7"/>
    <text x="270" y="52" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#71717A">FIVE IDEAS - BEST SCORE 0.46</text>

    <line x1="72" y1="264" x2="482" y2="264" stroke="#D4D4D8"/>
    <line x1="72" y1="78" x2="72" y2="264" stroke="#D4D4D8"/>
    <g stroke="#E4E4E7" stroke-dasharray="3 3">
      <line x1="72" y1="102" x2="482" y2="102"/>
      <line x1="72" y1="150" x2="482" y2="150"/>
      <line x1="72" y1="206" x2="482" y2="206"/>
    </g>
    <text x="64" y="106" text-anchor="end" font-size="10" fill="#A1A1AA">1.0</text>
    <text x="64" y="154" text-anchor="end" font-size="10" fill="#A1A1AA">0.66</text>
    <text x="64" y="210" text-anchor="end" font-size="10" fill="#A1A1AA">0.33</text>
    <text x="64" y="268" text-anchor="end" font-size="10" fill="#A1A1AA">0</text>

    <line x1="72" y1="150" x2="482" y2="150" stroke="#22C55E" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="478" y="142" text-anchor="end" font-size="11" font-weight="600" fill="#16A34A">Go threshold ~0.60</text>

    <g>
      <rect x="104" y="178" width="54" height="86" rx="4" fill="#F59E0B"/>
      <text x="131" y="286" text-anchor="middle" font-size="11" font-weight="600" fill="#52525B">0.46</text>
      <text x="131" y="302" text-anchor="middle" font-size="9" fill="#A1A1AA">smart oven</text>
      <text x="131" y="314" text-anchor="middle" font-size="9" fill="#A1A1AA">telemetry</text>

      <rect x="184" y="190" width="54" height="74" rx="4" fill="#EF4444"/>
      <text x="211" y="286" text-anchor="middle" font-size="11" font-weight="600" fill="#52525B">0.42</text>
      <text x="211" y="302" text-anchor="middle" font-size="9" fill="#A1A1AA">scraped</text>
      <text x="211" y="314" text-anchor="middle" font-size="9" fill="#A1A1AA">suppliers</text>

      <rect x="264" y="204" width="54" height="60" rx="4" fill="#EF4444"/>
      <text x="291" y="286" text-anchor="middle" font-size="11" font-weight="600" fill="#52525B">0.38</text>
      <text x="291" y="302" text-anchor="middle" font-size="9" fill="#A1A1AA">cold-start</text>
      <text x="291" y="314" text-anchor="middle" font-size="9" fill="#A1A1AA">database</text>

      <rect x="344" y="216" width="54" height="48" rx="4" fill="#EF4444"/>
      <text x="371" y="286" text-anchor="middle" font-size="11" font-weight="600" fill="#52525B">0.35</text>
      <text x="371" y="302" text-anchor="middle" font-size="9" fill="#A1A1AA">unknown</text>
      <text x="371" y="314" text-anchor="middle" font-size="9" fill="#A1A1AA">route</text>

      <rect x="424" y="228" width="54" height="36" rx="4" fill="#EF4444"/>
      <text x="451" y="286" text-anchor="middle" font-size="11" font-weight="600" fill="#52525B">0.31</text>
      <text x="451" y="302" text-anchor="middle" font-size="9" fill="#A1A1AA">invented</text>
      <text x="451" y="314" text-anchor="middle" font-size="9" fill="#A1A1AA">API</text>
    </g>

    <text x="270" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#991B1B">4 of 5 ideas were built on data that could not be verified</text>
  </g>

  <g transform="translate(630 82)">
    <text x="255" y="0" text-anchor="middle" font-size="15" font-weight="600" fill="#18181B">The autopsy</text>
    <rect x="20" y="20" width="490" height="380" rx="12" fill="#FFFFFF" stroke="#E4E4E7"/>

    <rect x="44" y="44" width="442" height="62" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
    <text x="62" y="68" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#991B1B">MECHANISMS INVENTED FIRST</text>
    <text x="62" y="88" font-size="12" fill="#52525B">The critic capped unverifiable routes at 0.45.</text>

    <rect x="44" y="120" width="442" height="62" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
    <text x="62" y="144" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#B45309">THE REAL PAID PAIN GOT NO IDEA</text>
    <text x="62" y="164" font-size="12" fill="#52525B">Recipe costing &amp; pricing lost the allocation lottery.</text>

    <rect x="44" y="196" width="442" height="74" rx="8" fill="#F5F3FF" stroke="#C4B5FD"/>
    <text x="62" y="220" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#6D28D9">A DISCARDED CONCEPT SCORED HIGHER</text>
    <text x="62" y="240" font-size="12" fill="#52525B">Allergen-verified bakery directory</text>
    <text x="62" y="258" font-size="12" fill="#52525B">beat four winners once the critic saw it.</text>

    <rect x="44" y="284" width="442" height="54" rx="8" fill="#F5F5F5" stroke="#D4D4D8"/>
    <text x="62" y="307" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#71717A">INCUMBENTS PEOPLE ALREADY PAY</text>
    <text x="62" y="326" font-size="12" fill="#52525B">CakeBoss + Bakesy ($7-49/mo)</text>

    <rect x="44" y="352" width="442" height="32" rx="8" fill="#18181B"/>
    <text x="64" y="374" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2" fill="#FCA5A5">VERDICT</text>
    <text x="466" y="374" text-anchor="end" font-size="14" font-weight="700" fill="#FCA5A5">NO-GO</text>
  </g>
</svg>
