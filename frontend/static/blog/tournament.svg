<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Plus Jakarta Sans',system-ui,sans-serif">
  <rect width="1200" height="520" fill="#FAFAFA"/>
  <text x="600" y="42" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="2" fill="#71717A">FIG 1 · ONE BIG PROMPT  →  PER-CELL TOURNAMENTS</text>

  <!-- LEFT: single prompt -->
  <g transform="translate(60 80)">
    <text x="180" y="0" text-anchor="middle" font-size="15" font-weight="600" fill="#18181B">Before</text>
    <rect x="20" y="20" width="320" height="360" rx="12" fill="#FFFFFF" stroke="#E4E4E7"/>
    <rect x="60" y="44" width="240" height="46" rx="8" fill="#F5F5F5" stroke="#D4D4D8"/>
    <text x="180" y="72" text-anchor="middle" font-size="13" fill="#52525B">one big prompt</text>
    <!-- outputs gravitate to one pain -->
    <g fill="#FB923C">
      <rect x="60" y="120" width="200" height="22" rx="5"/>
      <rect x="60" y="150" width="180" height="22" rx="5" opacity="0.7"/>
      <rect x="60" y="180" width="210" height="22" rx="5" opacity="0.85"/>
      <rect x="60" y="210" width="170" height="22" rx="5" opacity="0.55"/>
      <rect x="60" y="240" width="195" height="22" rx="5" opacity="0.75"/>
    </g>
    <text x="180" y="300" text-anchor="middle" font-size="12" fill="#71717A">10 ideas, all drifting toward</text>
    <text x="180" y="320" text-anchor="middle" font-size="12" fill="#71717A">whichever pain the prompt fixated on</text>
    <text x="180" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#9A3412">~⅔ of pains: no idea at all</text>
  </g>

  <!-- arrow -->
  <g transform="translate(420 250)">
    <path d="M0 0h44" stroke="#A1A1AA" stroke-width="2" fill="none" marker-end="url(#aa)"/>
  </g>

  <!-- RIGHT: partitioned -->
  <g transform="translate(500 80)">
    <text x="320" y="0" text-anchor="middle" font-size="15" font-weight="600" fill="#18181B">After</text>
    <rect x="20" y="20" width="600" height="360" rx="12" fill="#FFFFFF" stroke="#E4E4E7"/>
    <!-- 6 cells -->
    <g>
      <rect x="44" y="44" width="170" height="100" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
      <text x="58" y="68" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#9A3412">PAIN A × AUDIENCE</text>
      <rect x="58" y="82" width="142" height="14" rx="4" fill="#EA580C" opacity="0.5"/>
      <rect x="58" y="102" width="142" height="14" rx="4" fill="#EA580C"/>
      <text x="196" y="113" text-anchor="end" font-size="10" fill="#FFFFFF" font-weight="600">WIN</text>

      <rect x="226" y="44" width="170" height="100" rx="8" fill="#EEF2FF" stroke="#A5B4FC"/>
      <text x="240" y="68" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#4338CA">PAIN B × AUDIENCE</text>
      <rect x="240" y="82" width="142" height="14" rx="4" fill="#6366F1" opacity="0.5"/>
      <rect x="240" y="102" width="142" height="14" rx="4" fill="#6366F1"/>
      <text x="378" y="113" text-anchor="end" font-size="10" fill="#FFFFFF" font-weight="600">WIN</text>

      <rect x="408" y="44" width="170" height="100" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
      <text x="422" y="68" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#9A3412">PAIN C × AUDIENCE</text>
      <rect x="422" y="82" width="142" height="14" rx="4" fill="#EA580C" opacity="0.5"/>
      <rect x="422" y="102" width="142" height="14" rx="4" fill="#EA580C"/>
      <text x="560" y="113" text-anchor="end" font-size="10" fill="#FFFFFF" font-weight="600">WIN</text>

      <rect x="44" y="160" width="170" height="100" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
      <text x="58" y="184" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#B45309">PAIN D × AUDIENCE</text>
      <rect x="58" y="198" width="142" height="14" rx="4" fill="#F59E0B" opacity="0.5"/>
      <rect x="58" y="218" width="142" height="14" rx="4" fill="#F59E0B"/>
      <text x="196" y="229" text-anchor="end" font-size="10" fill="#FFFFFF" font-weight="600">WIN</text>

      <rect x="226" y="160" width="170" height="100" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
      <text x="240" y="184" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#9A3412">PAIN E × AUDIENCE</text>
      <rect x="240" y="198" width="142" height="14" rx="4" fill="#EA580C" opacity="0.5"/>
      <rect x="240" y="218" width="142" height="14" rx="4" fill="#EA580C"/>
      <text x="378" y="229" text-anchor="end" font-size="10" fill="#FFFFFF" font-weight="600">WIN</text>

      <rect x="408" y="160" width="170" height="100" rx="8" fill="#EEF2FF" stroke="#A5B4FC"/>
      <text x="422" y="184" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#4338CA">PAIN F × AUDIENCE</text>
      <rect x="422" y="198" width="142" height="14" rx="4" fill="#6366F1" opacity="0.5"/>
      <rect x="422" y="218" width="142" height="14" rx="4" fill="#6366F1"/>
      <text x="560" y="229" text-anchor="end" font-size="10" fill="#FFFFFF" font-weight="600">WIN</text>
    </g>
    <text x="320" y="300" text-anchor="middle" font-size="12" fill="#71717A">every validated pain gets its own small competition;</text>
    <text x="320" y="320" text-anchor="middle" font-size="12" fill="#71717A">one winner per cell, generated from that cell's viewpoint</text>
    <text x="320" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">coverage fixed — but the cell judge discards losers early</text>
  </g>
  <defs>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0l7 4-7 4z" fill="#A1A1AA"/>
    </marker>
  </defs>
</svg>
