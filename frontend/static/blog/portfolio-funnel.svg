<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Plus Jakarta Sans',system-ui,sans-serif">
  <rect width="1200" height="560" fill="#FAFAFA"/>
  <text x="600" y="42" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="2" fill="#71717A">FIG 4 - PORTFOLIO FUNNEL: FROM THIN IDEAS TO A TIERED REPORT</text>

  <g transform="translate(60 82)">
    <text x="230" y="0" text-anchor="middle" font-size="15" font-weight="600" fill="#18181B">What ships after the autopsy</text>
    <rect x="20" y="20" width="430" height="420" rx="12" fill="#FFFFFF" stroke="#E4E4E7"/>

    <rect x="60" y="48" width="350" height="58" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="78" y="72" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#9A3412">1 - DATA-ROUTE MENU</text>
    <text x="78" y="92" font-size="11" fill="#71717A">registries, APIs, user arithmetic</text>
    <path d="M225 106h20l-10 16z" fill="#FDBA74"/>

    <rect x="80" y="124" width="310" height="58" rx="8" fill="#F5F5F5" stroke="#D4D4D8"/>
    <text x="98" y="148" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#52525B">2 - ANCHORED GENERATION</text>
    <text x="98" y="168" font-size="11" font-weight="600" fill="#16A34A">best idea lifted from 0.46 to 0.72</text>
    <path d="M225 182h20l-10 16z" fill="#D4D4D8"/>

    <rect x="100" y="200" width="270" height="58" rx="8" fill="#F5F5F5" stroke="#D4D4D8"/>
    <text x="118" y="224" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#52525B">3 - RESCUE STRONG LOSERS</text>
    <text x="118" y="244" font-size="11" fill="#71717A">one real idea recovered per niche</text>
    <path d="M225 258h20l-10 16z" fill="#D4D4D8"/>

    <rect x="120" y="276" width="230" height="58" rx="8" fill="#F5F5F5" stroke="#D4D4D8"/>
    <text x="138" y="300" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#52525B">4 - BUNDLE 3-5 PAINS</text>
    <text x="138" y="320" font-size="11" fill="#71717A">single-pain tools become products</text>
    <path d="M225 334h20l-10 16z" fill="#D4D4D8"/>

    <rect x="140" y="352" width="190" height="50" rx="8" fill="#EA580C"/>
    <text x="235" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Tiered portfolio</text>
    <text x="235" y="426" text-anchor="middle" font-size="12" font-weight="600" fill="#9A3412">each step follows from the failed run</text>
  </g>

  <g transform="translate(560 82)">
    <text x="290" y="0" text-anchor="middle" font-size="15" font-weight="600" fill="#18181B">The resulting report</text>
    <rect x="20" y="20" width="560" height="196" rx="12" fill="#FFFFFF" stroke="#E4E4E7"/>

    <rect x="44" y="44" width="512" height="58" rx="8" fill="#EA580C"/>
    <text x="62" y="68" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#FED7AA">FLAGSHIP PRODUCT</text>
    <text x="62" y="88" font-size="12" fill="#FFFFFF">usually a bundle of complementary pains</text>
    <text x="538" y="79" text-anchor="end" font-size="16" font-weight="700" fill="#FFFFFF">0.74</text>

    <rect x="44" y="116" width="248" height="44" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="62" y="142" font-size="12" fill="#9A3412">Focused single-problem tools</text>
    <rect x="308" y="116" width="248" height="44" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-dasharray="4 3"/>
    <text x="326" y="142" font-size="12" fill="#6D28D9">Rescued concepts, labeled</text>

    <text x="300" y="186" text-anchor="middle" font-size="11" fill="#71717A">typically 8 ideas instead of 5</text>
    <text x="300" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">top ideas begin where serious evaluation starts</text>

    <text x="300" y="254" text-anchor="middle" font-size="14" font-weight="600" fill="#18181B">Data-anchoring lift</text>
    <text x="300" y="274" text-anchor="middle" font-size="11" fill="#71717A">same pains, same critic; only the data menu changed</text>
    <rect x="20" y="288" width="560" height="150" rx="12" fill="#FFFFFF" stroke="#E4E4E7"/>

    <g transform="translate(62 310)">
      <line x1="0" y1="100" x2="476" y2="100" stroke="#D4D4D8"/>
      <line x1="0" y1="20" x2="0" y2="100" stroke="#D4D4D8"/>
      <text x="-8" y="24" text-anchor="end" font-size="10" fill="#A1A1AA">1.0</text>
      <text x="-8" y="64" text-anchor="end" font-size="10" fill="#A1A1AA">0.5</text>
      <text x="-8" y="104" text-anchor="end" font-size="10" fill="#A1A1AA">0</text>
      <line x1="0" y1="60" x2="476" y2="60" stroke="#E4E4E7" stroke-dasharray="3 3"/>
      <rect x="82" y="67" width="80" height="33" fill="#EF4444" rx="4"/>
      <text x="122" y="120" text-anchor="middle" font-size="11" fill="#52525B">before 0.46</text>
      <rect x="314" y="45" width="80" height="55" fill="#22C55E" rx="4"/>
      <text x="354" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">after 0.72</text>
      <path d="M172 84h132" stroke="#18181B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
      <text x="238" y="78" text-anchor="middle" font-size="10" fill="#52525B">anchor on real data</text>
    </g>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0l7 4-7 4z" fill="#18181B"/>
    </marker>
  </defs>
</svg>
