<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to NicheIQ</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #18181B; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="background: #E55A28; padding: 30px; border-radius: 10px 10px 0 0; text-align: center;">
    <h1 style="color: white; margin: 0; font-size: 28px;">Sign in to NicheIQ</h1>
  </div>

  <div style="background: #FAFAFA; padding: 30px; border-radius: 0 0 10px 10px; border: 1px solid rgba(0,0,0,0.07); border-top: none;">
    <p style="font-size: 16px; margin-bottom: 20px;">
      We received a request to reset the password for your NicheIQ account.
    </p>

    <div style="background: white; border-radius: 8px; padding: 20px; margin-bottom: 25px; border: 1px solid rgba(0,0,0,0.07);">
      <p style="margin: 0; color: #52525B;">
        Your account doesn't have a password — you sign in with <strong>{{PROVIDER}}</strong>.
        Use the button below to sign in.
      </p>
      <p style="margin: 15px 0 0 0; color: #71717A; font-size: 14px;">
        If you didn't request this, you can safely ignore this email.
      </p>
    </div>

    <div style="text-align: center; margin-bottom: 25px;">
      <a href="{{LOGIN_URL}}" style="display: inline-block; background: #E55A28; color: white; text-decoration: none; padding: 14px 32px; border-radius: 6px; font-weight: 600; font-size: 16px;">
        Sign In
      </a>
    </div>
  </div>

  <div style="text-align: center; padding: 20px; color: #71717A; font-size: 12px;">
    <p>This email was sent by NicheIQ</p>
  </div>
</body>
</html>
