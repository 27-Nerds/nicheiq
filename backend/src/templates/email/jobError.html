<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NicheIQ Research Update</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #18181B; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="background: #F59E0B; padding: 30px; border-radius: 10px 10px 0 0; text-align: center;">
    <h1 style="color: white; margin: 0; font-size: 28px;">Research Update</h1>
  </div>

  <div style="background: #FAFAFA; padding: 30px; border-radius: 0 0 10px 10px; border: 1px solid rgba(0,0,0,0.07); border-top: none;">
    <p style="font-size: 16px; margin-bottom: 20px;">
      There was an issue with your research for <strong>"{{NICHE}}"</strong>.
    </p>

    <div style="background: #FFFBEB; border-radius: 8px; padding: 15px; margin-bottom: 20px; border: 1px solid #FDE68A;">
      <p style="margin: 0 0 8px 0; color: #B45309; font-size: 15px; font-weight: 600;">
        {{ERROR_MESSAGE}}
      </p>
    </div>

    <div style="background: #F0FDF4; border-radius: 8px; padding: 15px; margin-bottom: 25px; border: 1px solid #BBF7D0;">
      <p style="margin: 0; color: #166534; font-size: 14px;">
        <strong>What to do:</strong> {{GUIDANCE}}
      </p>
    </div>

    <div style="text-align: center; margin-top: 25px;">
      <a href="{{STATUS_URL}}" style="display: inline-block; background: #2563EB; color: white; text-decoration: none; padding: 12px 28px; border-radius: 6px; font-weight: 600;">
        View Job &amp; Resume
      </a>
    </div>
  </div>

  <div style="text-align: center; padding: 20px; color: #71717A; font-size: 12px;">
    <p>This email was sent by NicheIQ</p>
    <p>Job ID: {{JOB_ID}}</p>
  </div>
</body>
</html>
